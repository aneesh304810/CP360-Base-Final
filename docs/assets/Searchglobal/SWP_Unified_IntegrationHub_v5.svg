<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="880" viewBox="0 0 1560 880" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3B4A5A"/>
    </marker>
    <marker id="ahRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C8102E"/>
    </marker>
    <marker id="ahGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="1560" height="880" fill="#FFFFFF"/>

  <!-- TITLE -->
  <text x="780" y="46" text-anchor="middle" font-size="27" font-weight="700" fill="#1B2838">SWP &#8594; PBDW / Pivotal / IMDS &#8212; Single Integration HUB (v5)</text>
  <text x="780" y="74" text-anchor="middle" font-size="14" fill="#6B7280">Batch and intraday share one platform and one code path: RAW &#8594; Stage 2 &#8594; PBDW, with Pivotal as a fan-out target off Stage 2</text>

  <!-- LEGEND -->
  <circle cx="1070" cy="100" r="8" fill="#4A3B2E"/>
  <text x="1084" y="105" font-size="12.5" fill="#374151">Existing component</text>
  <circle cx="1230" cy="100" r="8" fill="#2E4A7D"/>
  <text x="1244" y="105" font-size="12.5" fill="#374151">New process</text>
  <line x1="1350" y1="100" x2="1380" y2="100" stroke="#C8102E" stroke-width="3"/>
  <text x="1388" y="105" font-size="12.5" fill="#374151">New intraday element</text>

  <!-- LANES -->
  <rect x="40" y="125" width="1480" height="475" rx="10" fill="none" stroke="#C7CDD4" stroke-width="1.5"/>
  <rect x="48" y="133" width="322" height="459" rx="6" fill="#EEEBE5"/>
  <rect x="380" y="133" width="560" height="459" rx="6" fill="#E2ECF6"/>
  <rect x="950" y="133" width="562" height="459" rx="6" fill="#EFF2F6"/>

  <text x="209" y="158" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3B4A5A">SEI &#8212; SWP Platform</text>
  <text x="660" y="158" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3B4A5A">BBH &#8212; PS Integration HUB</text>
  <text x="1231" y="158" text-anchor="middle" font-size="14.5" font-weight="700" fill="#3B4A5A">BBH &#8212; Existing Systems &amp; Consumers</text>

  <!-- ===== 1 SWP PLATFORM ===== -->
  <rect x="62" y="290" width="125" height="100" rx="6" fill="#2E4A7D"/>
  <text x="124" y="332" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">SWP</text>
  <text x="124" y="354" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">Platform</text>

  <!-- ===== 2 BATCH EXTRACT FILES ===== -->
  <rect x="235" y="235" width="85" height="75" rx="4" fill="#4A6FA5"/>
  <rect x="230" y="230" width="85" height="75" rx="4" fill="#3A5C99"/>
  <rect x="225" y="225" width="85" height="75" rx="4" fill="#2E4A7D"/>
  <text x="267" y="253" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Batch Extract</text>
  <text x="267" y="269" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">Files</text>
  <text x="267" y="287" text-anchor="middle" font-size="9.5" fill="#C9D8EC">EOD</text>

  <!-- ===== 3 INTRADAY FEED ===== -->
  <rect x="225" y="400" width="95" height="90" rx="6" fill="#2E4A7D" stroke="#C8102E" stroke-width="2"/>
  <text x="272" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Intraday</text>
  <text x="272" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#FFFFFF">Feed</text>
  <text x="272" y="468" text-anchor="middle" font-size="9" fill="#C9D8EC">near real-time</text>

  <path d="M 187 310 L 206 310 L 206 267 L 220 267" fill="none" stroke="#3B4A5A" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 187 370 L 206 370 L 206 445 L 220 445" fill="none" stroke="#C8102E" stroke-width="2.5" marker-end="url(#ahRed)"/>

  <!-- ===== 4 LANDING ZONE ===== -->
  <rect x="400" y="293" width="110" height="100" rx="6" fill="#2E4A7D"/>
  <text x="455" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Landing</text>
  <text x="455" y="348" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Zone</text>
  <text x="455" y="366" text-anchor="middle" font-size="9.5" fill="#C9D8EC">sFTP + API</text>
  <text x="455" y="380" text-anchor="middle" font-size="9.5" fill="#C9D8EC">batch &amp; intraday</text>

  <path d="M 310 267 L 358 267 L 358 322 L 396 322" fill="none" stroke="#3B4A5A" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M 320 445 L 358 445 L 358 362 L 396 362" fill="none" stroke="#C8102E" stroke-width="2.5" marker-end="url(#ahRed)"/>

  <!-- ===== 5 STAGE 1 RAW ===== -->
  <path d="M 550 305 L 550 381 A 62.5 12 0 0 0 675 381 L 675 305 Z" fill="#2E4A7D"/>
  <ellipse cx="612.5" cy="305" rx="62.5" ry="12" fill="#3A5C99"/>
  <text x="612.5" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Stage 1</text>
  <text x="612.5" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">RAW</text>

  <!-- ===== 6 STAGE 2 ENRICHED ===== -->
  <path d="M 720 296 L 720 385 A 82.5 13 0 0 0 885 385 L 885 296 Z" fill="#2E4A7D"/>
  <ellipse cx="802.5" cy="296" rx="82.5" ry="13" fill="#3A5C99"/>
  <text x="802.5" y="328" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">Stage 2 &#8212; Enriched</text>
  <text x="802.5" y="348" text-anchor="middle" font-size="11" fill="#C9D8EC">SWP-aligned schema</text>
  <text x="802.5" y="365" text-anchor="middle" font-size="10.5" font-style="italic" fill="#F0B7BF">canonical deferred</text>

  <line x1="510" y1="341" x2="546" y2="341" stroke="#3B4A5A" stroke-width="2" marker-end="url(#ah)"/>
  <text x="528" y="332" text-anchor="middle" font-size="9.5" fill="#4B5563">ingest</text>
  <line x1="675" y1="341" x2="716" y2="341" stroke="#3B4A5A" stroke-width="2" marker-end="url(#ah)"/>
  <text x="695" y="332" text-anchor="middle" font-size="9.5" fill="#4B5563">dbt</text>

  <!-- SHARED CODE PATH CALLOUT -->
  <path d="M 550 412 L 550 424 L 885 424 L 885 412" fill="none" stroke="#7A93B5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="717" y1="424" x2="717" y2="440" stroke="#7A93B5" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="400" y="440" width="485" height="70" rx="6" fill="#FFFFFF" stroke="#7A93B5" stroke-width="1.2"/>
  <text x="414" y="463" font-size="12" font-weight="700" fill="#1B2838">One platform, one code path</text>
  <text x="414" y="481" font-size="11" fill="#4B5563">Batch and intraday run the same dbt models in the same HUB &#8212;</text>
  <text x="414" y="498" font-size="11" fill="#4B5563">they differ only by schedule, volume and incremental strategy.</text>

  <!-- ===== 7 PBDW ===== -->
  <rect x="990" y="172" width="130" height="18" rx="9" fill="#DCE5EF"/>
  <text x="1055" y="185" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2E4A7D">EOD + INTRADAY</text>
  <path d="M 990 208 L 990 279 A 65 12 0 0 0 1120 279 L 1120 208 Z" fill="#4A3B2E"/>
  <ellipse cx="1055" cy="208" rx="65" ry="12" fill="#5C4A3A"/>
  <text x="1055" y="248" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">PBDW</text>
  <text x="1055" y="266" text-anchor="middle" font-size="9.5" fill="#D9C9B8">system of record</text>
  <line x1="1120" y1="243" x2="1148" y2="243" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ahGrey)"/>
  <text x="1156" y="240" font-size="10.5" fill="#4B5563">~1,000 downstream</text>
  <text x="1156" y="254" font-size="10.5" fill="#4B5563">consumers</text>

  <!-- ===== 8 PIVOTAL ===== -->
  <rect x="990" y="316" width="132" height="18" rx="9" fill="#FBE9EC"/>
  <text x="1056" y="329" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C8102E">INTRADAY + EOD</text>
  <path d="M 990 353 L 990 432 A 65 13 0 0 0 1120 432 L 1120 353 Z" fill="#4A3B2E" stroke="#C8102E" stroke-width="2"/>
  <ellipse cx="1055" cy="353" rx="65" ry="13" fill="#5C4A3A" stroke="#C8102E" stroke-width="2"/>
  <text x="1055" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">PIVOTAL</text>
  <text x="1055" y="410" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Database</text>

  <!-- ===== 9 IMDS STAGE / 10 IMDS ===== -->
  <rect x="990" y="446" width="72" height="18" rx="9" fill="#EFEBE4"/>
  <text x="1026" y="459" text-anchor="middle" font-size="9.5" font-weight="700" fill="#6B5A48">EOD</text>
  <path d="M 990 482 L 990 548 A 62.5 12 0 0 0 1115 548 L 1115 482 Z" fill="#4A3B2E"/>
  <ellipse cx="1052.5" cy="482" rx="62.5" ry="12" fill="#5C4A3A"/>
  <text x="1052.5" y="513" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">IMDS</text>
  <text x="1052.5" y="532" text-anchor="middle" font-size="13.5" font-weight="700" fill="#FFFFFF">Stage</text>

  <path d="M 1235 482 L 1235 548 A 62.5 12 0 0 0 1360 548 L 1360 482 Z" fill="#4A3B2E"/>
  <ellipse cx="1297.5" cy="482" rx="62.5" ry="12" fill="#5C4A3A"/>
  <text x="1297.5" y="522" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">IMDS</text>

  <line x1="1115" y1="518" x2="1231" y2="518" stroke="#3B4A5A" stroke-width="2" marker-end="url(#ah)"/>
  <text x="1173" y="509" text-anchor="middle" font-size="9.5" fill="#4B5563">existing copy</text>

  <!-- FAN-OUT FROM STAGE 2 -->
  <path d="M 885 318 C 925 300 945 252 986 245" fill="none" stroke="#3B4A5A" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="912" y="291" text-anchor="middle" font-size="9.5" fill="#4B5563">dbt</text>
  <path d="M 885 345 C 925 356 945 390 986 392" fill="none" stroke="#C8102E" stroke-width="2.5" marker-end="url(#ahRed)"/>
  <text x="908" y="374" text-anchor="middle" font-size="9.5" fill="#C8102E">dbt</text>
  <path d="M 885 370 C 925 420 938 500 986 518" fill="none" stroke="#3B4A5A" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="900" y="446" text-anchor="middle" font-size="9.5" fill="#4B5563">dbt</text>

  <!-- BADGES -->
  <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="70" cy="286" r="13" fill="#1B2838"/><text x="70" y="291">1</text>
    <circle cx="233" cy="221" r="13" fill="#1B2838"/><text x="233" y="226">2</text>
    <circle cx="233" cy="396" r="13" fill="#C8102E"/><text x="233" y="401">3</text>
    <circle cx="408" cy="289" r="13" fill="#1B2838"/><text x="408" y="294">4</text>
    <circle cx="558" cy="289" r="13" fill="#1B2838"/><text x="558" y="294">5</text>
    <circle cx="728" cy="280" r="13" fill="#1B2838"/><text x="728" y="285">6</text>
    <circle cx="998" cy="196" r="13" fill="#1B2838"/><text x="998" y="201">7</text>
    <circle cx="998" cy="341" r="13" fill="#C8102E"/><text x="998" y="346">8</text>
    <circle cx="998" cy="470" r="13" fill="#1B2838"/><text x="998" y="475">9</text>
    <circle cx="1243" cy="470" r="13" fill="#1B2838"/><text x="1243" y="475">10</text>
  </g>

  <!-- NOTES -->
  <rect x="40" y="628" width="1480" height="200" rx="8" fill="#FAFAF8" stroke="#C7CDD4" stroke-width="1"/>
  <line x1="533" y1="648" x2="533" y2="808" stroke="#DDE1E6" stroke-width="1"/>
  <line x1="1033" y1="648" x2="1033" y2="808" stroke="#DDE1E6" stroke-width="1"/>

  <text x="65" y="661" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#1B2838">WHAT CHANGED</text>
  <text x="65" y="688" font-size="11.5" fill="#374151">&#8226; Intraday enters the same Integration HUB. No bypass</text>
  <text x="76" y="705" font-size="11.5" fill="#374151">pipeline and no second ingestion platform.</text>
  <text x="65" y="730" font-size="11.5" fill="#374151">&#8226; RAW &#8594; Stage 2 &#8594; PBDW stays as-is; Pivotal becomes a</text>
  <text x="76" y="747" font-size="11.5" fill="#374151">third fan-out target off Stage 2.</text>
  <text x="65" y="772" font-size="11.5" fill="#374151">&#8226; Stage 2 remains SWP-aligned enrichment, not a</text>
  <text x="76" y="789" font-size="11.5" fill="#374151">platform-agnostic canonical model.</text>

  <text x="565" y="661" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#1B2838">WHY THIS IS BETTER</text>
  <text x="565" y="688" font-size="11.5" fill="#374151">&#8226; One set of dbt models, one lineage graph, one DQ</text>
  <text x="576" y="705" font-size="11.5" fill="#374151">surface. No second source of truth to reconcile.</text>
  <text x="565" y="730" font-size="11.5" fill="#374151">&#8226; Pivotal and PBDW read the same enriched output, so</text>
  <text x="576" y="747" font-size="11.5" fill="#374151">they cannot drift apart mid-day.</text>
  <text x="565" y="772" font-size="11.5" fill="#374151">&#8226; Reuses existing HUB infrastructure &#8212; nothing new to</text>
  <text x="576" y="789" font-size="11.5" fill="#374151">build, secure, certify or operate.</text>

  <text x="1065" y="661" font-size="12.5" font-weight="700" letter-spacing="1.1" fill="#C8102E">OPEN FOR ARB</text>
  <text x="1065" y="688" font-size="11.5" fill="#374151">&#8226; Can Stage 1 + Stage 2 runtime meet Pivotal&#8217;s latency</text>
  <text x="1076" y="705" font-size="11.5" fill="#374151">SLA? Sets the intraday run frequency.</text>
  <text x="1065" y="730" font-size="11.5" fill="#374151">&#8226; Incremental / merge strategy for micro-batch loads,</text>
  <text x="1076" y="747" font-size="11.5" fill="#374151">including cancel-rebook and late corrections.</text>
  <text x="1065" y="772" font-size="11.5" fill="#374151">&#8226; Contention between intraday runs and the EOD window.</text>
  <text x="1065" y="795" font-size="11.5" fill="#374151">&#8226; Publish Pivotal off Stage 2 or off PBDW?</text>

  <text x="40" y="855" font-size="10.5" fill="#9CA3AF">BBH Capital Partners &#183; SWP Migration Program &#183; draft for ARB review</text>
</svg>
