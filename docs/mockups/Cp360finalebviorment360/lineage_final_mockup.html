<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>CP 360 · Lineage — FINAL implementation mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
 :root{--bg:#fafbfc;--line:#c9d4dc;--ink:#233240;--sub:#7b8894;--accent:#0f4775;--pop:#31bced;
  --ok:#159943;--okbg:#e7f6ec;--warn:#e67e22;--warnbg:#fdf1e3;--gap:#c1113a;--gapbg:#fbe9ed;
  --ud:#7c3aed;--udbg:#f1eafd;--mono:'Roboto Mono',Consolas,monospace}
 *{box-sizing:border-box;margin:0}
 body{background:var(--bg);color:var(--ink);font-family:Roboto,Arial,sans-serif;font-size:14px;min-width:1100px}
 .hdr{height:52px;background:#10193b;color:#fff;display:flex;align-items:center;gap:14px;padding:0 22px;
  position:sticky;top:0;z-index:50}
 .hdr small{color:#8fb4dd;font-size:11px}
 .hdr .esc{margin-left:auto;font-size:10.5px;color:#8fb4dd}
 .wrap{max-width:1040px;margin:0 auto;padding:22px 24px 60px}
 #crumb{font-size:12.5px;color:var(--sub);margin-bottom:20px;min-height:18px}
 #crumb a{color:var(--pop);cursor:pointer;text-decoration:none}
 #crumb a:hover{text-decoration:underline}
 #crumb .sep{margin:0 7px;color:#c2ccd4}
 #crumb b{color:var(--ink);font-weight:500}
 h1{font-size:19px;font-weight:400;text-align:center;margin-bottom:4px}
 .subt{font-size:12.5px;color:var(--sub);text-align:center;margin-bottom:24px}
 #stage{animation:fade .18s ease}
 @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
 /* spine */
 .spine{display:flex;align-items:flex-start;justify-content:center;margin:6px 0 30px}
 .node{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:150px;max-width:210px}
 .circ{width:54px;height:54px;border-radius:50%;background:#fff;border:2.5px solid var(--accent);
  display:grid;place-items:center;font-size:22px;box-shadow:0 2px 6px rgba(20,40,60,.08)}
 .node b{font-size:13px;font-weight:500;text-align:center}
 .node small{font-size:10.5px;color:var(--sub);text-align:center}
 .link2{flex:1;max-width:160px;height:2.5px;background:var(--line);position:relative;margin-top:26px}
 .link2 .lbl{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:10px;
  background:var(--warnbg);color:var(--warn);font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
 .link2::after{content:"";position:absolute;right:-1px;top:-4.5px;border-left:9px solid var(--line);
  border-top:6px solid transparent;border-bottom:6px solid transparent}
 .value{margin-top:8px;font-family:var(--mono);font-size:10.5px;background:#f4f7f9;border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;max-width:200px;text-align:center;word-break:break-all}
 .value.ok{border-color:#bfe3cb;background:var(--okbg)}
 .value .sp{background:var(--gapbg);color:var(--gap);border-radius:3px;padding:0 2px}
 /* cards */
 .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
 .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:17px;cursor:pointer;
  transition:box-shadow .15s,transform .15s;display:flex;gap:15px;align-items:center}
 .card:hover{box-shadow:0 8px 20px rgba(20,40,60,.12);transform:translateY(-2px)}
 .ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
 .ring span{background:#fff;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
  font-size:12.5px;font-weight:700}
 .card h3{font-size:13.5px;font-weight:500;margin-bottom:2px}
 .card small{font-size:11px;color:var(--sub)}
 /* table rows */
 .trow{display:flex;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:13px 18px;margin-bottom:11px;cursor:pointer;transition:box-shadow .15s}
 .trow:hover{box-shadow:0 6px 16px rgba(20,40,60,.12)}
 .mini{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;
  font-size:13px;background:#fff;flex-shrink:0}
 .mini.q{border-style:dashed;border-color:var(--gap);color:var(--gap);font-weight:700}
 .mline{width:46px;height:2px;background:var(--line)}
 .trow .nm{margin-left:16px;flex:1}
 .trow .nm b{font-size:14px;font-weight:500;font-family:var(--mono)}
 .trow .nm small{display:block;font-size:11px;color:var(--sub);margin-top:1px}
 .bar{width:140px;height:7px;border-radius:5px;background:#edf1f4;overflow:hidden}
 .bar i{display:block;height:7px;background:var(--ok)}
 .pct{width:64px;text-align:right;font-size:13px;font-weight:500}
 /* column rows */
 .tools{display:flex;gap:10px;align-items:center;margin-bottom:14px}
 .tools input{flex:1;max-width:340px;height:32px;border:1px solid var(--line);border-radius:7px;
  padding:0 12px;font-size:12.5px;background:#fff}
 .fpill{font-size:10.5px;font-weight:700;border-radius:999px;padding:4px 12px;cursor:pointer;border:1.5px solid transparent;user-select:none}
 .fpill.on{border-color:var(--ink)}
 .legend{display:flex;gap:18px;justify-content:center;font-size:11px;color:var(--sub);margin-bottom:16px;align-items:center}
 .crow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:10px 16px;margin-bottom:8px;cursor:pointer}
 .crow:hover{box-shadow:0 5px 14px rgba(20,40,60,.10)}
 .crow .cn{font-family:var(--mono);font-size:12.5px;flex:1}
 .dots{display:flex;align-items:center}
 .d{width:12px;height:12px;border-radius:50%;background:var(--accent)}
 .d.t{background:var(--warn)}
 .d.u{background:var(--ud)}
 .d.e{width:9px;height:9px;background:#fff;border:2px dashed var(--gap)}
 .seg{width:24px;height:2px;background:var(--line)}
 .seg.e{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 8px)}
 .tag2{font-size:10px;font-weight:700;border-radius:999px;padding:2px 10px;min-width:96px;text-align:center}
 .more{text-align:center;font-size:11px;color:var(--sub);margin-top:12px}
 /* level 4 */
 .defbox{max-width:660px;margin:6px auto 0;background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:16px 22px;text-align:center}
 .defbox p{font-size:13.5px;line-height:1.6;color:#3c4a57}
 .defbox .src2{font-size:10.5px;color:var(--sub);margin-top:7px}
 .verify{display:inline-flex;gap:8px;align-items:center;margin-top:14px;background:var(--okbg);
  color:#0d6b31;font-size:12px;font-weight:500;border-radius:999px;padding:6px 16px}
 .verify.warn{background:var(--warnbg);color:#8a5a1e}
 .devlink{display:block;text-align:center;margin-top:14px;font-size:11.5px;color:var(--pop);cursor:pointer}
 .navrow{display:flex;justify-content:center;gap:14px;margin-top:16px;font-size:11.5px}
 .navrow span{color:var(--pop);cursor:pointer;user-select:none}
 /* landing */
 .dscards{display:grid;grid-template-columns:1fr 1fr;gap:22px;max-width:760px;margin:26px auto 0}
 .dscard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:26px 24px;cursor:pointer;
  text-align:center;transition:box-shadow .15s,transform .15s,border-color .15s}
 .dscard:hover{box-shadow:0 12px 28px rgba(20,40,60,.14);transform:translateY(-3px);border-color:var(--pop)}
 .dscard .big{font-size:40px;margin-bottom:8px}
 .dscard h2{font-size:17px;font-weight:500;margin-bottom:3px}
 .dscard small{font-size:11.5px;color:var(--sub);display:block;line-height:1.6}
 .dsstat{display:flex;justify-content:center;gap:18px;margin-top:14px;font-size:11px;color:var(--sub)}
 .dsstat b{display:block;font-size:16px;color:var(--ink);font-weight:500;text-align:center}
 .viewsw{display:inline-flex;background:#1c2a52;border-radius:999px;padding:2px;margin-left:14px}
 .viewsw span{padding:4px 14px;font-size:11px;border-radius:999px;cursor:pointer;color:#8fb4dd;user-select:none}
 .viewsw span.on{background:var(--pop);color:#10193b;font-weight:700}
 .dschip{font-size:10px;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);
  border-radius:999px;padding:3px 11px;cursor:pointer;user-select:none}
 /* full dictionary + transformation (level 4 business) */
 .fullbox{max-width:760px;margin:14px auto 0;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
 .fullbox .fh{background:#f4f7f9;border-bottom:1px solid var(--line);padding:8px 18px;font-size:11px;
  font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);display:flex;gap:10px;align-items:center}
 .fullbox .fb{padding:14px 20px;font-size:13px;line-height:1.7;color:#3c4a57;text-align:left}
 .fullbox .fb .kvline{display:grid;grid-template-columns:170px 1fr;gap:3px 14px;font-size:12.5px;margin-top:10px}
 .fullbox .fb .kvline b{color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
 .hop{display:flex;gap:14px;padding:11px 20px;border-bottom:1px solid #eef1f4;align-items:flex-start}
 .hop:last-child{border-bottom:none}
 .hop .hstage{min-width:150px;font-size:11px;font-weight:700}
 .hop .hex{font-family:var(--mono);font-size:11px;background:#f4f7f9;border:1px solid var(--line);
  border-radius:5px;padding:5px 9px;color:#233240}
 .hop .hwhy{font-size:11.5px;color:var(--sub);flex:1;line-height:1.5}
 /* technical view frame */
 .techframe{border:1.5px dashed var(--line);border-radius:12px;background:#fff;padding:34px;text-align:center;max-width:860px;margin:10px auto}
 .techframe h2{font-size:16px;font-weight:500;margin:8px 0 6px}
 .techframe p{font-size:12.5px;color:var(--sub);line-height:1.7;max-width:640px;margin:0 auto}
 /* ==== technical view · faithful LegacyLineage recreation ==== */
 .tv{max-width:1180px;margin:0 auto;font-size:13px}
 .tvtabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:10px}
 .tvtab{padding:7px 2px;font-size:13px;color:var(--sub);cursor:default}
 .tvtab.on{color:#111;font-weight:500;border-bottom:2.5px solid #1668b0}
 .tvmodes{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
 .tvm{padding:5px 16px;font-size:11.5px;color:var(--sub);background:#fff;cursor:default}
 .tvm.on{background:#0f4775;color:#fff}
 .fgshell{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
 .fghead{display:flex;align-items:center;gap:11px;padding:12px 17px;
  background:linear-gradient(to right,#eef3f8,#f7fafc);font-size:14.5px;font-weight:700;color:#10193b}
 .fghead .meta{margin-left:auto;font-size:10.5px;color:#999;font-weight:400}
 .fgbar{height:5px;width:100px;background:#e8edf2;border-radius:3px;overflow:hidden}
 .fgbar i{display:block;height:100%;background:#159943}
 .tblhead{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fbfcfe;
  border:1px solid var(--line);border-radius:6px;margin:14px 17px 0;font-size:13px}
 .tblhead .mono2{font-family:var(--mono);font-weight:700;color:#10193b}
 .pill{font-size:9px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
 .gridhdr,.gridrow{display:grid;grid-template-columns:16px 1fr 100px 56px 56px 46px 108px;gap:10px;
  padding:7px 14px;align-items:center}
 .gridhdr{background:#f7f9fa;font-size:8.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.4px;color:#999;margin:0 17px;border:1px solid var(--line);border-bottom:0}
 .gridwrap{margin:0 17px 14px;border:1px solid var(--line);border-radius:0 0 6px 6px;overflow:hidden;background:#fff}
 .gridrow{font-size:12px;border-top:1px solid #eef1f4}
 .gridrow .fld{font-family:var(--mono);font-weight:600;color:#0f4775;text-decoration:underline dotted;text-underline-offset:3px;cursor:default}
 .gridrow .dim{font-family:var(--mono);color:#666;font-size:11px}
 .chainzone{padding:8px 14px 14px 40px;background:#fbfdfe;border-top:1px dashed var(--line)}
 .chainlbl{font-size:9px;font-weight:700;text-transform:uppercase;color:#666;margin:6px 0}
 .chainrow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
 .cnode{border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;min-width:140px;background:#fff;position:relative}
 .cnode.def{border-color:#6d3ac0}
 .cnode .stg3{font-size:8px;font-weight:800;text-transform:uppercase;padding:2px 6px;border-radius:3px;color:#fff;display:inline-block}
 .cnode .cc{font-family:var(--mono);font-size:11.5px;color:#10193b;font-weight:600;margin-top:3px}
 .cnode .ct{font-size:9px;color:#666;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .cnode .defbdg{position:absolute;top:5px;right:7px;font-size:7.5px;font-weight:800;color:#6d3ac0;background:#efe6fb;border-radius:999px;padding:1px 5px}
 .xfa{font-size:9px;color:#e67e22;font-family:var(--mono);text-align:center;max-width:84px;align-self:center}
 /* InlineDef */
 .idf{border:1.5px solid var(--line);border-left:5px solid #b5651d;border-radius:9px;background:#fbfcfe;margin:10px 14px 4px 40px;overflow:hidden}
 .idfgrid{display:grid;grid-template-columns:1fr 1.25fr}
 .idfdict{border-right:1px solid var(--line)}
 .idfhead{font-size:11px;font-weight:800;color:#fff;padding:7px 14px;background:#b5651d}
 .idfhead .rt{float:right;font-weight:400;opacity:.85}
 .idfterm{font-size:14px;font-weight:700;color:#10193b;padding:10px 14px 4px}
 .idfkv{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:6px 14px;font-size:11px;border-top:1px solid #f0f3f6}
 .idfkv .k{font-size:8.5px;font-weight:700;text-transform:uppercase;color:#999;padding-top:2px}
 .jrow{display:flex;align-items:stretch;flex-wrap:wrap;row-gap:16px;padding:18px 2px 2px}
 .jcard{flex:1 1 118px;min-width:108px;max-width:220px;position:relative;padding:0 5px}
 .jbdg{position:absolute;top:0;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:7.5px;
  font-weight:800;padding:2px 8px;border-radius:999px;z-index:1}
 .jbox{border:1.5px solid var(--line);border-radius:9px;background:#fff;padding:8px 11px;height:100%}
 .jarrow{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:30px;color:#999;font-size:13px}
 .jxf{font-size:8.5px;color:#e67e22;font-family:var(--mono);max-width:92px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .prooft{border-collapse:collapse;font-size:11px}
 .prooft th{text-align:left;padding:2px 16px 2px 0;font-size:8px;text-transform:uppercase}
 .prooft td{padding:2px 16px 2px 0;font-family:var(--mono);color:#10193b}
 .landchip{font-family:var(--mono);font-size:9.5px;margin:2px 4px 0 0;display:inline-block;padding:2px 8px;
  border-radius:3px;background:#eef6fb;color:#0b5e83;border:1px solid #cfe6f2}
 .whchip{font-size:10px;font-weight:700;padding:3px 11px;border-radius:12px;border:1.5px solid #0b7d9e;color:#0b7d9e;background:#fff}
 .modalback{background:rgba(16,25,59,.45);border-radius:12px;padding:26px;margin:12px 17px}
 .modalcard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.38);max-width:1000px;margin:0 auto}
 .modalhead{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line);background:#fafcfc;font-size:12.5px}
 .modalhead .x{margin-left:auto;font-size:14px;color:#666;cursor:pointer}
 /* roomy text inside the popup only */
 .modalcard .idfhead{font-size:12.5px;padding:10px 20px}
 .modalcard .idfterm{font-size:18px;padding:16px 20px 6px}
 .modalcard .idfkv{grid-template-columns:160px 1fr;gap:12px;padding:10px 20px;font-size:12.5px;line-height:1.7}
 .modalcard .idfkv .k{font-size:9.5px}
 .modalcard .prooft{font-size:12.5px}
 .modalcard .prooft td{padding:4px 20px 4px 0}
 .modalcard .chainlbl{font-size:10px}
 .modalcard .jbox .cc{font-size:12.5px}
 .modalcard .jbox .ct{font-size:10px}
 .modalcard .landchip{font-size:10.5px;padding:3px 10px}
 /* smart widths: identifiers are 10-20ch mono — names one line, cards hug content */
 .jcard{flex:0 1 auto;min-width:15ch;max-width:26ch}
 .jbox .cc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .cnode{min-width:16ch;max-width:28ch}
 .cnode .cc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 /* popup reads top-to-bottom: lineage first, description below */
 .modalcard .idfgrid{display:flex;flex-direction:column}
 .modalcard .idfdict{order:2;border-right:none;border-top:1px solid var(--line)}
 .storyband{border-top:1px solid var(--line);padding:12px 20px 14px}
 .storyband h5{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:#666;margin:0 0 9px}
 .stflex{display:flex;align-items:stretch}
 .starr{align-self:center;padding:0 10px;color:#999;font-size:15px;font-weight:700}
 .stseg{flex:1;border-radius:9px;padding:10px 13px;text-align:center;background:#f4f7f9;border:1.5px solid var(--line)}
 .stseg.hot{background:#fae5d3;border-color:#f0cba8}
 .stseg .ic{font-size:19px}
 .stseg .hd{font-size:12.5px;font-weight:700;margin-top:3px;color:#10193b}
 .stseg.hot .hd{color:#8a5a1e}
 .stseg .ex{font-family:var(--mono);font-size:10px;margin-top:4px;color:#666;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .stseg .nt{font-size:10.5px;color:#666;margin-top:3px}
</style></head><body>
<div class="hdr"><b>Lineage</b><small>final implementation mockup — matches LineageHome + BizLineage as shipped</small>

<div class="wrap"><div id="crumb"></div><div id="stage"></div></div>

 IMDS:{am:[{id:'DIM_PORTFOLIO',desc:'portfolio master',fields:142,pct:52,src:true},

 {c:'ACCOUNT_LONG_NAME_3',kind:'gap',tag:'no source'},
 {c:'ACCOUNT_LONG_NAME_4',kind:'gap',tag:'no source'},
 {c:'ACCOUNT_NUMBER',kind:'xf',xfAt:2,tag:'standardized',v:'clean'},
 {c:'ACCOUNT_SHORT_NAME',kind:'pass',tag:'as-is',v:'clean'},
 {c:'ACCOUNT_MAIL_ADDRESS_1',kind:'pass',tag:'as-is',v:'clean'},
 {c:'ACCOUNT_MAIL_ADDRESS_2',kind:'pass',tag:'as-is',v:'clean'},
 {c:'ACCOUNT_STATUS_CD',kind:'pass',tag:'as-is',v:'clean'},
 {c:'TRANS_TO_PRIN_DATE',kind:'xf',xfAt:2,tag:'text → date',v:'changed'},

 {c:'↳ UD_7 · GST EXEMPT FLAG',kind:'ud',tag:'key UD_7',v:'clean'},
 {c:'ACCOUNT_OPEN_DATE',kind:'pass',tag:'as-is',v:'clean'},
 {c:'OFFICE_CODE',kind:'pass',tag:'as-is',v:'clean'}]};
const DETAIL={
 'ACCOUNT_LONG_NAME_1':{title:'Account Long Name — line 1',
  vals:['GST EXEMPT TCB FBO BFP U/A DTD<span class=sp>···</span>','GST EXEMPT TCB FBO BFP U/A DTD<span class=sp>···</span>','GST EXEMPT TCB FBO BFP U/A DTD','GST EXEMPT TCB FBO BFP U/A DTD'],

  map · biz modes, alt source chains, and the Dependency View swimlanes all live here too — with the Linkage Map spacing fix applied (cards size to content, panels float above the wires)</div>
 </div>`;}
function renderEstate(el){
 el.innerHTML=`<h1>Where our data comes from</h1>
 <div class="subt">one journey, every field — click an area to zoom in</div>${spine()}
 <div class="cards">`+GROUPS.map(g=>
  `<div class="card" onclick="go(1,'${g.id}')">${ring(g.pct)}<div><h3>${esc(g.name)}</h3>
   <small>${g.tablesMapped!=null?g.tablesMapped+' of ':''}${g.tables} tables mapped · ${g.fields} fields${g.pct===0?' · not started':''}</small></div></div>`).join('')+`</div>`;}

function renderGroup(el){
 const tabs=TABLES[st.group]||[];
 el.innerHTML=`<h1>${esc(gName())}</h1>
 <div class="subt">${tabs.filter(t=>t.src).length} of ${tabs.length} tables mapped · one row per table — click a table</div>`+
 (tabs.length?tabs.map(t=>
  `<div class="trow" onclick="${t.src?`go(2,undefined,'${t.id}')`:''}" ${t.src?'':'style="opacity:.75;cursor:default"'}>
   <div class="mini ${t.src?'':'q'}">${t.src?'🏦':'?'}</div><div class="mline"></div>
   <div class="mini">⚙</div><div class="mline"></div>
   <div class="mini" style="background:#eef5fb">🏪</div>
   <div class="nm"><b>${t.id}</b><small>${esc(t.desc)} · ${t.fields} fields</small></div>
   <div class="bar"><i style="width:${t.pct}%"></i></div>
   <div class="pct" ${t.pct===0?'style="color:var(--gap)"':''}>${t.pct}%</div></div>`).join('')
 :`<div class="more">mapping for this group hasn\u2019t started — tables appear here when the first workbook lands</div>`);}

function dotRow(f){
 const D=(cls)=>`<span class="d ${cls}"></span>`,S=(e)=>`<span class="seg ${e?'e':''}"></span>`;
 if(f.kind==='gap')return D('e')+S(1)+D('e')+S(1)+D('e')+S(1)+D('');
 if(f.kind==='ud')return D('u')+S()+D('u')+S()+D('u')+S()+D('u');
 const dots=[0,1,2,3].map(i=>D(f.kind==='xf'&&i===f.xfAt?'t':''));
 return dots[0]+S()+dots[1]+S()+dots[2]+S()+dots[3];}
function tagStyle(f){return f.kind==='pass'?'background:var(--okbg);color:#0d6b31'
 :f.kind==='xf'?'background:var(--warnbg);color:var(--warn)'
 :f.kind==='ud'?'background:var(--udbg);color:var(--ud)':'background:var(--gapbg);color:var(--gap)';}
function setPill(k){st.pills[k]=!st.pills[k];render();}
function setFilter(v){st.filter=v;renderTable($('stage'),true);crumb();}

function renderTable(el,keepFocus){
 const all=FIELDS[st.table]||[];
 const rows=all.filter(f=>st.pills[f.kind]&&f.c.toLowerCase().includes(st.filter.toLowerCase()));
 const counts={pass:0,xf:0,gap:0,ud:0};all.forEach(f=>counts[f.kind]++);
 const vc={clean:0,changed:0,none:0};all.forEach(f=>vc[(f.v==='clean'||f.v==='changed')?f.v:'none']++);
 el.innerHTML=`<h1>${esc(st.table)}</h1>
 <div class="subt">every field\u2019s journey in four dots — the whole story at a glance</div>
 <div class="tools">
  <input id="flt" placeholder="type to filter ${all.length} fields…" value="${esc(st.filter)}" oninput="setFilter(this.value)">
  <span class="fpill ${st.pills.pass?'on':''}" style="background:var(--okbg);color:#0d6b31" onclick="setPill('pass')">as-is · ${counts.pass}</span>
  <span class="fpill ${st.pills.xf?'on':''}" style="background:var(--warnbg);color:var(--warn)" onclick="setPill('xf')">changed · ${counts.xf}</span>
  <span class="fpill ${st.pills.ud?'on':''}" style="background:var(--udbg);color:var(--ud)" onclick="setPill('ud')">UD · ${counts.ud}</span>
  <span class="fpill ${st.pills.gap?'on':''}" style="background:var(--gapbg);color:var(--gap)" onclick="setPill('gap')">no source · ${counts.gap}</span></div>
 <div class="tools" style="margin-top:-4px;margin-bottom:12px">
  <b style="font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub)">Proof variance · Variance 360</b>
  <span class="fpill" style="background:var(--okbg);color:#0d6b31">✓ ${vc.clean} verified clean</span>
  <span class="fpill" style="background:var(--warnbg);color:#a8560f">⚠ ${vc.changed} value changes flagged</span>
  <span class="fpill" style="background:#edf1f4;color:#666">◌ ${vc.none} no sample yet</span></div>
 <div class="legend">
  <span style="display:flex;gap:6px;align-items:center"><span class="d"></span> flows as-is</span>
  <span style="display:flex;gap:6px;align-items:center"><span class="d t"></span> changed on that hop</span>
  <span style="display:flex;gap:6px;align-items:center"><span class="d u"></span> user-defined envelope</span>
  <span style="display:flex;gap:6px;align-items:center"><span class="d e"></span> missing — no source</span></div>`+
 rows.map(f=>`<div class="crow" onclick="go(3,undefined,undefined,'${f.c}')">
   <span class="cn">${esc(f.c)}</span><div class="dots">${dotRow(f)}</div>
   <span title="${f.v==='clean'?'proof verified clean':f.v==='changed'?'value changes flagged':'no sample captured'}"
    style="width:9px;height:9px;border-radius:50%;flex-shrink:0;background:${f.v==='clean'?'#159943':f.v==='changed'?'#e67e22':'#c2ccd4'}"></span>
   <span class="tag2" style="${tagStyle(f)}">${esc(f.tag)}</span></div>`).join('')+
 `<div class="more">${rows.length} of ${all.length} shown · in the real screen the rest of the 251 stream in on scroll</div>`;
 if(keepFocus){const i=$('flt');i.focus();i.setSelectionRange(i.value.length,i.value.length);}}

function renderColumn(el){
 const d=DETAIL[st.col];
 const flist=FIELDS[st.table]||[];const idx=flist.findIndex(f=>f.c===st.col);
 const nav=`<div class="navrow">
  ${idx>0?`<span onclick="go(3,undefined,undefined,'${flist[idx-1].c}')">← ${esc(flist[idx-1].c)}</span>`:''}
  ${idx<flist.length-1?`<span onclick="go(3,undefined,undefined,'${flist[idx+1].c}')">${esc(flist[idx+1].c)} →</span>`:''}</div>`;
 if(!d){el.innerHTML=`<h1>${esc(st.col)}</h1><div class="subt">journey detail</div>${spine()}
  <div class="defbox"><p>This field flows unchanged from AddVantage to the warehouse.</p>
  <div class="verify" style="background:#edf1f4;color:#666">◌ no sample captured for this field yet</div></div>${nav}`;return;}
 if(d.gap){el.innerHTML=`<h1>${esc(d.title)}</h1><div class="subt">the honest picture — a gap is still a picture</div>
  <div class="spine">
   <div class="node"><div class="circ" style="border:2.5px dashed var(--gap);color:var(--gap)">?</div><b>No source</b><small>nothing feeds this</small></div>
   <div class="link2" style="background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px)"></div>
   <div class="node"><div class="circ" style="border-color:var(--accent);background:#eef5fb">🏪</div><b>Warehouse</b><small>DIM_ACCOUNT</small>
    <div class="value">exists · always empty</div></div></div>
  <div class="defbox"><p>${esc(d.what)}</p><div class="src2">${esc(d.src)}</div>
  <div class="verify warn">${esc(d.verify.txt)}</div></div>${nav}`;return;}
 const fd=FULLDICT[st.col];
 const dictHtml=fd?`<div class="fullbox"><div class="fh">📖 Full dictionary entry
   <span style="margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0">AddVantage dictionary · complete text</span></div>
  <div class="fb">${esc(fd.longDesc)}
   <div class="kvline">${fd.attrs.map(a=>`<b>${esc(a[0])}</b><span>${esc(a[1])}</span>`).join('')}</div></div></div>`:'';
 const hopsHtml=fd?`<div class="fullbox"><div class="fh">⚙ The whole transformation — every hop, nothing hidden</div>
  ${fd.hops.map(h=>`<div class="hop"><div class="hstage">${esc(h.st)}</div>
   <div class="hex">${esc(h.ex)}</div><div class="hwhy">${esc(h.why)}</div></div>`).join('')}</div>`:'';
 el.innerHTML=`<h1>${esc(d.title)}</h1>
 <div class="subt">the full journey of one field, with a real value riding along</div>
 ${spine({vals:d.vals,okFrom:d.okFrom,xfAt:3,lbl:d.xfLabel})}
 <div class="defbox"><p><b>What it is:</b> ${esc(d.what)}</p>
  <div class="src2">${esc(d.src)}</div>
  <div class="verify ${d.verify.ok?'':'warn'}">${esc(d.verify.txt)}</div></div>
 ${dictHtml}${hopsHtml}
 <span class="devlink" onclick="setView('technical')">open Technical view — full chain, alt sources, all proof stages →</span>${nav}`;}

render();
</script>
</body></html>
