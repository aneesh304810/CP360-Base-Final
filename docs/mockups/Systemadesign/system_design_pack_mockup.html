 Python — no external processes, no DB-visible mount required.", "Slowest per row by a wide margin. On Taxlot and EOD Position — the largest feeds — row shipping into the pod becomes the EOD bottleneck. Consumes pool connections for long periods, squeezing the ceiling set by 55.", "Weak at the top of the volume range. Would likely miss the EOD window on the snapshot feeds."], ["**B · External Tables only**", "Every feed exposed as an external table; load is `INSERT /*+ APPEND */ SELECT`", "Fastest for large files. No row shipping. G1 aggregate checks run as SQL, exploiting the database rather than the pod. Direct-path by default.", "Requires every file on a DB-visible mount — a hard infrastructure dependency on the landing zone (8) and **AD-10**. Brittle on malformed rows: a ragged line can fail the whole select. Row-level quarantine routing is awkward. Poor fit for tiny correction feeds where setup cost dominates.", "Strong for snapshots, poor for corrections. Also couples the framework to a storage topology not yet decided."], ["**C · Loader abstraction, mechanism per feed** *(recommended)*", "All three mechanisms behind one `Loader` ABC, selected from `CFG_FEED_REGISTRY`", "Each feed uses the mechanism suited to its size and shape. Large snapshots get External Tables; corrections get `cx_Oracle` with clean quarantine routing. Changing a feed's mechanism is a config commit, not a code change — so the choice can be revised after measurement.", "Three implementations to build, test and maintain rather than one. The abstraction must be genuinely uniform or it degrades into three special cases with a shared name.", "Strong. Matches the actual feed distribution — ~30 feeds spanning several orders of magnitude — and keeps the tier boundary clean: all mechanisms write only to Stage 1 Oracle."]]}, {"t": "h", "x": "6.3 Recommendation"}, {"t": "p", "x": "> **Recommended: Option C — a loader abstraction with the mechanism selected per feed from configuration.**"}, {"t": "p", "x": "Option C wins because the feed inventory is not homogeneous. Nine domains and roughly thirty feeds span from single-row Fund Cutoff Times to multi-million-row Taxlot snapshots, and no single mechanism serves both ends well: option A would put the slowest available loader on the largest feeds, and option B would put a heavyweight external-table setup on feeds of a few hundred rows while forcing a DB-visible mount that **AD-10** has not yet settled. Selecting per feed also means the choice is revisable after measurement rather than baked into code."}, {"t": "p", "x": "**What it costs:** three implementations instead of one, and a real discipline risk — if the `Loader` contract is not held strictly uniform, \"one framework\" becomes three special cases sharing a package name. The mitigation is that `prepare` / `load` / `rollback` are the only sanctioned surface and no caller may branch on mechanism."}, {"t": "p", "x": "**Tier placement:** entirely within Stage 1 Oracle. That boundary is correct because ingestion's job ends at the RAW insert — no conforming, no typing, no business logic. Everything downstream of RAW belongs to Stage 2 and Pre-Gold on Exadata, and the framework must not reach across that line."}, {"t": "p", "x": "**Must be confirmed for this to hold:**"}, {"t": "p", "x": "1. **Oracle connection-pool ceiling and DBA max-session grant (component 55)** — this bounds concurrent ingest and therefore the fan-out width in component 18. Pods are cheap; sessions are not."}, {"t": "p", "x": "2. **AD-10 transport protocol and landing-zone topology** — External Tables require the file on a DB-visible mount. If that is unavailable, the large-snapshot feeds fall back to SQL\\*Loader and the window budget changes."}, {"t": "p", "x": "3. **EOD window budget against measured per-feed volumes** across all 9 domains — needed before the mechanism assignment in config is finalised."}, {"t": "h", "x": "6.4 Rules respected"}, {"t": "ul", "items": ["✅ Tier boundary crisp — writes Stage 1 Oracle only; no Exadata access, no consumer-tier involvement", "✅ No transformation in flight — validation and profiling only; typing and conforming belong to Stage 2", "✅ **AD-7** — ingestion is Python, not dbt; the slide label is wrong and is not honoured", "✅ **AD-8** — RAW immutable and append-only; redelivery supersedes, never deletes; `rollback` applies only to an uncommitted failed attempt", "✅ **AD-9** — G1 is blocking and runs before the insert; failure means zero rows in RAW", "⚠️ **AD-10 contingent** — the External Table path depends on the transport and mount decision"]}]}, {"h": "7. Failure, Replay & Idempotency", "blocks": [{"t": "tbl", "rows": [["Failure", "Behaviour"], ["File missing or late (E1)", "Sensor-level; framework not invoked. Blocks that domain's branch."], ["G1 structural failure (E2)", "File quarantined, zero rows loaded, **no retry**. Domain branch fails; partial-batch policy (22) decides whether other domains proceed."], ["Load fails partway", "`rollback(load_id)` removes the uncommitted rows for that `LOAD_ID`. This is the only sanctioned delete against RAW, and only for a failed attempt."], ["Oracle unavailable (E6)", "**Only** class that retries. Bounded exponential backoff."], ["Redelivery of a loaded file", "New `LOAD_ID`, prior marked `SUPERSEDED`, rows retained."], ["Config store unreachable", "Fail fast. No default spec — a wrong layout would corrupt RAW."]]}, {"t": "p", "x": "**Retry policy:** `retries=0` on the ingest task by default; only E6 raises a retryable exception type. Airflow's default of retrying everything three times would otherwise turn every G1 block into a four-times-slower G1 block and make data problems look like flakiness."}, {"t": "p", "x": "**Replay (21):** replay scope is a `LOAD_ID` set. Replaying re-reads the original file from the landing zone or quarantine under a **new** `LOAD_ID`, supersedes the prior, and reloads. Because RAW is append-only and Pre-Gold uses bitemporal append (**AD-2**), replay is a forward operation throughout — nothing is undone at any tier."}, {"t": "p", "x": "**Idempotency:** a re-run against the same file produces a new `LOAD_ID` and supersedes the prior. Row counts and checksums must match; a mismatch on replay of an unchanged file is itself an error condition worth alerting on."}]}, {"h": "8. Security & Access", "blocks": [{"t": "ul", "items": ["**AuthN/AuthZ:** the framework runs under a dedicated OpenShift service account with `INSERT` on RAW tables and `SELECT` on config only. No `UPDATE` or `DELETE` on RAW except the narrow `rollback` grant, scoped by `LOAD_ID`.", "**Credentials:** Oracle credentials and any sFTP keys from the OpenShift secret store (48), injected at pod start, never in images or config.", "**Data classification:** TBD — BBH security. The Account & Client domain is the likely PII carrier. If masking is required it must be applied from Stage 2 onward, since RAW immutability precludes retrofitting.", "**File handling:** quarantined files inherit the same classification as the source feed and the same access controls as the landing zone.", "**Audit:** every load writes `CHANGED_BY`-equivalent context — service account, pod, config version, `GIT_COMMIT` of the spec in force — to the lineage store (31)."]}]}, {"h": "9. Open Questions & Risks", "blocks": [{"t": "tbl", "rows": [["#", "Question / risk", "Owner", "Blocks"], ["1", "Oracle max sessions and pool ceiling", "DBA (55)", "Fan-out width in 18; EOD window feasibility"], ["2", "**AD-10** transport protocol and DB-visible mount availability", "ARB + BBH infra", "Loader mechanism assignment; External Table path"], ["3", "Per-feed volume profile across all ~30 feeds", "SEI", "Mechanism assignment; window budget"], ["4", "Manifest format and completeness semantics", "SEI", "G1 end-of-stream checks; sensor design (9)"], ["5", "Does SEI emit a change indicator or row hash on snapshots?", "SEI", "Not used here, but the single largest downstream performance lever"], ["6", "Encoding guarantees per feed", "SEI", "Streaming reader; E2 check design"], ["7", "PII classification of Account & Client attributes", "BBH security", "Masking approach; cannot be retrofitted into RAW"], ["8", "Quarantine retention — inherits RAW retention, still unset", "Business + ops", "Storage sizing; replay depth"]]}]}, {"h": "10. Acceptance Criteria", "blocks": [{"t": "p", "x": "**Design complete when:**"}, {"t": "ul", "items": ["[ ] `Loader` ABC agreed, with all three implementations specified against it", "[ ] Mechanism assigned per feed in config for all ~30 feeds, justified by volume", "[ ] Audit-column stamping specified uniformly, with no per-feed exemptions", "[ ] `LOAD_ID` allocation and `BATCH_ID` binding designed against the lineage store (31)", "[ ] Profile capture defined, including the `row_count` contract consumed by G4", "[ ] Quarantine layout and resubmission path agreed with component 29", "[ ] Streaming and single-pass validation confirmed feasible against the largest feed"]}, {"t": "p", "x": "**Build complete when:**"}, {"t": "ul", "items": ["[ ] All ~30 feeds load through one framework with **zero per-feed code paths** — verified by inspection", "[ ] Adding a new feed requires only a config commit; demonstrated end to end", "[ ] G1 demonstrably blocks: an injected column-count mismatch leaves **zero rows** in RAW and does not retry", "[ ] Redelivery supersedes correctly — prior rows retained, Stage 2 reads only `LOADED`", "[ ] A RAW row traces to a physical line in a named file via `LOAD_ID` + `ROW_NUM`", "[ ] Captured `row_count` matches an independent `COUNT(*)` for every feed — the basis of G4's shortcut", "[ ] Concurrent ingest at the configured ceiling does not exceed the DBA session grant, measured", "[ ] Largest feed loads within its share of the EOD window, measured on production-shaped volume"]}]}]}, {"id": "c14", "title": "Stage 1 RAW", "level": "L3", "icon": "🧪", "color": "#0e8f7e", "bg": "#dff2ef", "order": 114, "sub": "#14 · 2. Hub · Processing · Oracle DDL · P1 · custom None · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["14"], "chip": "#14 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "None", "depends_on": ["13", "33"], "decisions": ["AD-8", "AD-7", "AD-10"], "tiers": ["Stage1-Oracle"], "updated": "2026-08-10"}, "src": "14_Stage1_RAW_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "Stage 1 RAW is the evidence record: a byte-faithful, immutable, append-only copy of every file SEI delivers, stamped with when it arrived and in what file. One table per inbound feed — approximately 30 tables across 9 domains, including satellites. Its single deliverable is the **generated DDL set plus the partitioning and retention design**, produced from the feed registry rather than hand-written."}, {"t": "p", "x": "RAW has exactly one obligation: a replay from RAW must produce the same result as the original run. Every decision below follows from that."}, {"t": "p", "x": "**Tiers touched:** Stage 1 Oracle only. Read by Stage 2; never read by Exadata Pre-Gold directly except by G4's count comparison, and never by the consumer tier."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "tbl", "rows": [["ID", "Component", "Why required"], ["13", "Python ingestion framework", "The only writer. RAW has no other write path."], ["33", "Metadata & config store", "Column layouts generate the DDL; retention and partitioning policy held here"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["**15 Stage 2** — the only routine reader", "**24 G2 profiling gate** — aggregate SQL over RAW partitions", "**26 G4 tie-out** — reads captured `LOAD_ID` counts, not the tables themselves", "**21 Replay engine** — replays from RAW partitions"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  Landing (8) ──▶ 13 Ingestion ──▶ ┌── 14 STAGE 1 RAW (Oracle) ──┐\n                                   │  ~30 tables · 9 domains      │\n                                   │  immutable · append-only     │\n                                   │  partitioned by BUSINESS_DATE│\n                                   └──────────┬───────────────────┘\n                                              ▼\n                        15 Stage 2 ──▶ 66 Pre-Gold [Exadata] ──▶ 67 ──▶ Gold ──▶ consumers"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Column typing.**"}, {"t": "p", "x": "**Decision:** Every business column is `VARCHAR2`. No dates, no numbers, no constraints."}, {"t": "p", "x": "**Rationale:** Typing at the RAW boundary means a malformed date rejects the row and destroys the evidence of what SEI actually sent. G1 reports type violations without blocking their storage."}, {"t": "p", "x": "**Consequence:** Stage 2 owns safe-cast and flagging. RAW is genuinely reconstructable back to the original file."}, {"t": "p", "x": "**D2 · Constraints and keys.**"}, {"t": "p", "x": "**Decision:** No primary key, no unique constraint, no `NOT NULL` on business columns. Audit columns are `NOT NULL`."}, {"t": "p", "x": "**Rationale:** Duplicates are data to be observed, not errors to be prevented. A unique constraint would reject a duplicate SEI genuinely sent, hiding a source problem."}, {"t": "p", "x": "**Consequence:** Deduplication is a Stage 2 responsibility, performed before joins."}, {"t": "p", "x": "**D3 · Partitioning.**"}, {"t": "p", "x": "**Decision:** Interval range partitioning by `BUSINESS_DATE`, daily, on every table."}, {"t": "p", "x": "**Rationale:** Gives partition-wise replay, cheap purge by `DROP PARTITION`, and pruning for G2's aggregate profiling."}, {"t": "p", "x": "**Consequence:** Correction feeds partition on the *file* date, not the corrected event's date — the corrected date lives in the payload and is resolved in Stage 2."}, {"t": "p", "x": "**D4 · One table per feed, or per entity?**"}, {"t": "p", "x": "**Decision:** Per feed. Satellites (`Account Optional Fields`, `Account Supplement`, `EOD Positions Supplement`, `Asset Optional Fields`) get their own RAW tables."}, {"t": "p", "x": "**Rationale:** RAW stores as delivered. A satellite arrives as its own file with its own layout and must land as its own table. Attachment to the parent entity happens in Pre-Gold assembly (66)."}, {"t": "p", "x": "**Consequence:** ~30 tables rather than ~20. Justified because merging at ingest would require transformation, which RAW must not do."}, {"t": "p", "x": "**D5 · Redelivery.**"}, {"t": "p", "x": "**Decision:** Supersede via `INGESTION_STATUS`, never delete. Prior rows retained."}, {"t": "p", "x": "**Rationale:** AD-8. Deleting breaks immutability and makes \"what did we hold on Tuesday morning?\" unanswerable."}, {"t": "p", "x": "**Consequence:** Stage 2 filters `INGESTION_STATUS = 'LOADED'`. Storage cost of one extra partition-worth per redelivery."}, {"t": "p", "x": "**D6 · Retention.**"}, {"t": "p", "x": "**Decision:** Driven by required replay depth, not by available disk. Held in config per feed."}, {"t": "p", "x": "**Rationale:** If the business needs to replay 90 days, RAW holds 90 days minimum. Sizing storage first and deriving replay depth from it produces a system that cannot honour its own recovery promise."}, {"t": "p", "x": "**Consequence:** Replay depth is an open business decision that blocks storage sizing."}, {"t": "p", "x": "**D7 · Compression.**"}, {"t": "p", "x": "**Decision:** `ROW STORE COMPRESS ADVANCED` on partitions older than the active window, applied by a scheduled job."}, {"t": "p", "x": "**Rationale:** Repeated daily full snapshots of Account, Client, Taxlot and Asset compress heavily. RAW sits on the Stage 1/2 Oracle instance, so HCC is not assumed available."}, {"t": "p", "x": "**Consequence:** A maintenance job on the ageing boundary, and a note that if RAW shares Exadata storage, HCC should be evaluated as a superior option."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart LR"}, {"t": "p", "x": "subgraph EXT[\"EXTERNAL — SEI / SWP, out of scope\"]"}, {"t": "p", "x": "SEI[\"SWP Platform<br/>~30 feeds\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph CFG[\"Config\"]"}, {"t": "p", "x": "REG[\"33 Feed registry<br/>+ column layouts\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S1[\"Stage 1 (Oracle) — COMPONENT 14\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "D1[\"Account &amp; Client<br/>RAW_ACCOUNT · RAW_ACCOUNT_OPT_FLD<br/>RAW_CLIENT_ACCT_LINK<br/>RAW_ACCOUNT_SUPPL · RAW_CLIENT\"]"}, {"t": "p", "x": "D2[\"Positions<br/>RAW_TAXLOT · RAW_EOD_POSITION<br/>RAW_EOD_POS_SUPPL<br/>RAW_EOD_CHANGED_POS · RAW_FX_FWD_POS\"]"}, {"t": "p", "x": "D3[\"Reference &amp; Asset<br/>RAW_ASSET · RAW_ASSET_OPT_FLD<br/>RAW_ASSET_INV_CLASS\"]"}, {"t": "p", "x": "D4[\"Transactions<br/>RAW_TXN_HEADER · RAW_TXN_DETAIL\"]"}, {"t": "p", "x": "D5[\"Other (7) · Fee &amp; Billing (2)<br/>Portfolio &amp; Model (3)<br/>Reporting (2) · Cash (1)\"]"}, {"t": "p", "x": "AUD[\"8 audit columns on every table<br/>LOAD_ID · BUSINESS_DATE · FILE_DATE<br/>FILE_NAME · ROW_NUM · LOAD_TIMESTAMP<br/>SOURCE_SYSTEM · INGESTION_STATUS\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph DOWN[\"Downstream\"]"}, {"t": "p", "x": "S2[\"15 Stage 2 (Oracle)<br/>only routine reader\"]"}, {"t": "p", "x": "G2[\"24 G2 profiling<br/>aggregate SQL, pruned\"]"}, {"t": "p", "x": "G4[\"26 G4 tie-out<br/>reads captured counts<br/>NOT the tables\"]"}, {"t": "p", "x": "RPL[\"21 Replay\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph EXA[\"Stage 3 (Exadata Pre-Gold)\"]"}, {"t": "p", "x": "PG[\"66 Assembly\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "SEI -.->|\"file contract<br/>AD-10 transport\"| ING[\"13 Ingestion<br/>ONLY writer\"]"}, {"t": "p", "x": "REG -.->|\"generates DDL\"| S1"}, {"t": "p", "x": "ING --> D1 & D2 & D3 & D4 & D5"}, {"t": "p", "x": "AUD -.-> D1 & D2 & D3 & D4 & D5"}, {"t": "p", "x": "D1 & D2 & D3 & D4 & D5 --> S2"}, {"t": "p", "x": "D1 & D2 & D3 & D4 & D5 --> G2"}, {"t": "p", "x": "S2 --> PG --> G4"}, {"t": "p", "x": "RPL -.-> D1"}, {"t": "p", "x": "classDef ext stroke-dasharray:5 5,stroke:#A82316,color:#A82316"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "class SEI,EXT ext"}, {"t": "p", "x": "class D1,D2,D3,D4,D5,AUD focal"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant CFG as 33 Config\n  participant CI as 57 CI/CD\n  participant RAW as 14 Stage 1 RAW\n  participant ING as 13 Ingestion\n  participant S2 as 15 Stage 2\n  participant MNT as Maintenance job\n\n  CFG->>CI: column layout per feed\n  CI->>RAW: generate + apply DDL (no hand-written tables)\n  ING->>RAW: direct-path insert, LOAD_ID + 8 audit columns\n  RAW->>RAW: interval partition auto-created for BUSINESS_DATE\n  opt redelivery\n    ING->>RAW: new LOAD_ID inserted\n    ING->>RAW: prior LOAD_ID → INGESTION_STATUS = 'SUPERSEDED'\n    Note over RAW: rows RETAINED — nothing deleted\n  end\n  S2->>RAW: read WHERE INGESTION_STATUS = 'LOADED'<br/>partition-pruned by BUSINESS_DATE\n  MNT->>RAW: compress partitions past the active window\n  MNT->>RAW: DROP PARTITION past retention (replay depth)"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Config (33)** → supplies the column layout per feed → CI generates DDL"}, {"t": "p", "x": "2. **CI (57)** → applies generated DDL → **no RAW table is hand-written**"}, {"t": "p", "x": "3. **Ingestion (13)** → direct-path insert with `LOAD_ID` and the 8 audit columns → the only write path"}, {"t": "p", "x": "4. **RAW (14)** → interval partitioning auto-creates the `BUSINESS_DATE` partition → no pre-provisioning"}, {"t": "p", "x": "5. **Redelivery** → a new `LOAD_ID` is inserted; the prior is marked `SUPERSEDED` → **rows retained, never deleted**"}, {"t": "p", "x": "6. **Stage 2 (15)** → reads `INGESTION_STATUS = 'LOADED'`, partition-pruned by business date → the only routine reader"}, {"t": "p", "x": "7. **G2 (24)** → aggregate profiling SQL against the target partition → pushed to the database, never row-shipped"}, {"t": "p", "x": "8. **G4 (26)** → reads the **captured** row count per `LOAD_ID` from lineage, not `COUNT(*)` against these tables → this is what makes a blocking tie-out affordable"}, {"t": "p", "x": "9. **Maintenance** → compresses partitions past the active window, drops partitions past retention → retention set by replay depth"}, {"t": "p", "x": "**No cross-database hop in this component.** RAW is read on the Stage 1/2 Oracle instance; the Exadata → Gold hop occurs downstream in 67."}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Table inventory — generated from the registry"}, {"t": "tbl", "rows": [["Domain", "Feeds", "RAW tables", "Type"], ["Account & Client", "5", "`RAW_ACCOUNT`, `RAW_ACCOUNT_OPT_FLD`*, `RAW_CLIENT_ACCT_LINK`, `RAW_ACCOUNT_SUPPL`*, `RAW_CLIENT`", "Snapshot"], ["Positions", "5", "`RAW_TAXLOT`, `RAW_EOD_POSITION`, `RAW_EOD_POS_SUPPL`*, `RAW_EOD_CHANGED_POS`, `RAW_FX_FWD_POSITION`", "Snapshot / delta"], ["Other", "7", "`RAW_CURR_UPCOMING_ACTIVITY`, `RAW_CUSTODY_NOSTRO`, `RAW_ACTIVE_COMMITS`, `RAW_FUND_CUTOFF_TIMES`, `RAW_END_PERIOD_VALUES`, `RAW_PAY_TO_RECIPIENTS`, `RAW_INTEREST_RATES`", "Mixed"], ["Fee & Billing", "2", "`RAW_FEE_COMPUTATION`, `RAW_FEE_PACKAGE_USAGE`", "Delta"], ["Portfolio & Model", "3", "`RAW_PORTFOLIO_GROUPS`, `RAW_PORTFOLIO`, `RAW_MODEL_ALLOCATION`", "Snapshot"], ["Reporting", "2", "`RAW_STATEMENT_EVENT`, `RAW_STATEMENT_EVENT_ITEM`", "Delta"], ["Reference & Asset", "3", "`RAW_ASSET`, `RAW_ASSET_OPT_FLD`*, `RAW_ASSET_INV_CLASS`", "Snapshot"], ["Transactions", "2", "`RAW_TXN_HEADER`, `RAW_TXN_DETAIL`", "Delta"], ["Cash", "1", "`RAW_RECURRING_CASH_ACTIVITY`", "Delta"]]}, {"t": "p", "x": "`*` satellite — attaches to a parent entity during Pre-Gold assembly (66), not here."}, {"t": "h", "x": "DDL pattern"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "-- ONE pattern, ~30 tables, generated from CFG_FEED_COLUMN. Never hand-written."}, {"t": "p", "x": "CREATE TABLE RAW_TXN_HEADER ("}, {"t": "p", "x": "-- audit columns: identical on every RAW table, no exemptions"}, {"t": "p", "x": "LOAD_ID           NUMBER(18)     NOT NULL,"}, {"t": "p", "x": "BUSINESS_DATE     DATE           NOT NULL,"}, {"t": "p", "x": "FILE_DATE         DATE,"}, {"t": "p", "x": "FILE_NAME         VARCHAR2(260)  NOT NULL,"}, {"t": "p", "x": "ROW_NUM           NUMBER(12)     NOT NULL,"}, {"t": "p", "x": "LOAD_TIMESTAMP    TIMESTAMP      DEFAULT SYSTIMESTAMP NOT NULL,"}, {"t": "p", "x": "SOURCE_SYSTEM     VARCHAR2(30)   DEFAULT 'SEI_SWP'    NOT NULL,"}, {"t": "p", "x": "INGESTION_STATUS  VARCHAR2(20)   DEFAULT 'LOADED'     NOT NULL,"}, {"t": "p", "x": "-- business payload: ALL VARCHAR2, lengths from CFG_FEED_COLUMN"}, {"t": "p", "x": "TRANSACTION_ID    VARCHAR2(64),"}, {"t": "p", "x": "ACCOUNT_ID        VARCHAR2(64),"}, {"t": "p", "x": "TRADE_DATE        VARCHAR2(32),"}, {"t": "p", "x": "SETTLE_DATE       VARCHAR2(32),"}, {"t": "p", "x": "TRANSACTION_TYPE  VARCHAR2(64),"}, {"t": "p", "x": "..."}, {"t": "p", "x": ")"}, {"t": "p", "x": "PARTITION BY RANGE (BUSINESS_DATE)"}, {"t": "p", "x": "INTERVAL (NUMTODSINTERVAL(1,'DAY'))"}, {"t": "p", "x": "(PARTITION P_INIT VALUES LESS THAN (DATE '2026-01-01'));"}, {"t": "p", "x": "-- no PK, no unique, no NOT NULL on business columns, no FK."}, {"t": "p", "x": "CREATE INDEX IX_RAW_TXNH_LOAD ON RAW_TXN_HEADER (LOAD_ID) LOCAL;"}]}]}, {"id": "c15", "title": "Stage 2 Enriched (dbt)", "level": "L3", "icon": "🧪", "color": "#0e8f7e", "bg": "#dff2ef", "order": 115, "sub": "#15 · 2. Hub · Processing · dbt · P1 · custom Medium · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["15"], "chip": "#15 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "Medium", "depends_on": ["14", "17", "25", "31", "33", "55"], "decisions": ["AD-2", "AD-9", "AD-1"], "tiers": ["Stage2-Oracle"], "updated": "2026-08-10"}, "src": "15_Stage2_Enriched_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "Stage 2 turns RAW's byte-faithful text into typed, standardised, corrected, business-rule-validated records that any consumer could use. One conformed model per entity across the 9 domains, with satellites resolved onto their parents' grain. Its single deliverable is the **dbt model set plus the shared macro library** that makes ~30 feeds conform without per-feed logic."}, {"t": "p", "x": "Its defining constraint is neutrality: Stage 2 must be reusable, not consumer-shaped. No PBDW column names, no Pivotal filters, no report logic. The test is that a fourth consumer can be added without changing a Stage 2 model."}, {"t": "p", "x": "**Tiers touched:** Stage 2 Oracle only. Reads Stage 1 RAW on the same instance. Hands off to Pre-Gold (66) on Exadata — dimensional modelling happens there, not here."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "tbl", "rows": [["ID", "Component", "Why required"], ["14", "Stage 1 RAW", "Source. Read filtered on `INGESTION_STATUS = 'LOADED'`"], ["17", "Correction handling", "The bitemporal resolution macro, invoked inside the correction-bearing models"], ["25", "G3 dbt tests + business rules", "Executes against these models; blocks Pre-Gold"], ["31", "Audit & lineage", "`SRC_LOAD_ID` / `SRC_ROW_NUM` carried forward"], ["33", "Config store", "Feed-to-model mapping, natural keys, lookback windows, severity parameterisation"], ["55", "Oracle connection pooling", "dbt thread count bounded by the session ceiling"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["**66 Pre-Gold (Exadata)** — the only routine consumer; performs SCD2 and fact assembly", "**25 G3** — test execution", "**21 Replay** — replays a `LOAD_ID` set through these models"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  14 RAW ──▶ ┌─── 15 STAGE 2 ENRICHED (Oracle) ───┐\n   [Oracle]  │  standardise · typecast · dedup ·   │\n             │  corrections (17) · lookups ·       │\n             │  rules · derive · latest-select     │\n             │  CONSUMER-NEUTRAL                   │\n             └──────────────┬──────────────────────┘\n                            ▼\n             66 Pre-Gold [Exadata] ──▶ 67 hop ──▶ Gold ──▶ PBDW · IMDS · Pivotal"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Materialization.**"}, {"t": "p", "x": "**Decision:** Incremental on every model, keyed by `BUSINESS_DATE`. No model is full refresh in normal operation."}, {"t": "p", "x": "**Rationale:** Daily full snapshots of Taxlot, EOD Position, Account, Client and Asset mean full refresh rebuilds all history nightly to add one day. It also forfeits single-day replay."}, {"t": "p", "x": "**Consequence:** Every model needs a deterministic incremental predicate and a documented deliberate-rebuild path."}, {"t": "p", "x": "**D2 · Does Stage 2 build dimensions?**"}, {"t": "p", "x": "**Decision:** No. Stage 2 produces conformed current-state per business date. SCD2 and fact assembly belong to Pre-Gold (66) on Exadata."}, {"t": "p", "x": "**Rationale:** Dimensional modelling is consumer-shaped; Stage 2 must stay neutral. Also, SCD2 over full history is the heaviest operation in the pipeline and belongs where HCC and Smart Scan are available."}, {"t": "p", "x": "**Consequence:** Stage 2 keeps each day's conformed snapshot so Pre-Gold can rebuild SCD2 without re-reading RAW."}, {"t": "p", "x": "**D3 · Processing order.**"}, {"t": "p", "x": "**Decision:** A fixed nine-step CTE order, identical in every model. Dedup before joins; corrections before rules; corrections before latest-record selection."}, {"t": "p", "x": "**Rationale:** Deduplicating a joined set multiplies work. Validating a record you are about to supersede produces false failures. Latest-record selection that cannot see corrections picks wrong."}, {"t": "p", "x": "**Consequence:** The order is enforced by a model template, not by convention."}, {"t": "p", "x": "**D4 · How are satellites handled?**"}, {"t": "p", "x": "**Decision:** Satellites are joined onto their parent's grain inside the parent's Stage 2 model, using the parent relationship from config."}, {"t": "p", "x": "**Rationale:** `Account Optional Fields` and `Account Supplement` are extension attributes of Account, not independent entities. Modelling them as separate outputs pushes the join into Pre-Gold, where it would be repeated per dimension build."}, {"t": "p", "x": "**Consequence:** ~30 feeds reduce to roughly 20 Stage 2 models. The satellite join is a macro so the pattern is uniform."}, {"t": "p", "x": "**D5 · Do business rules filter or flag?**"}, {"t": "p", "x": "**Decision:** Flag. Rule outcomes are written to a `DQ_FLAGS` column; rows are never dropped."}, {"t": "p", "x": "**Rationale:** Dropping rows in Stage 2 makes the G4 tie-out fail for a reason nobody can see."}, {"t": "p", "x": "**Consequence:** G3 asserts against `DQ_FLAGS` with severity parameterised from config, so a gate can branch on severity."}, {"t": "p", "x": "**D6 · Where does bitemporal versioning live?**"}, {"t": "p", "x": "**Decision:** Established here, in the correction-bearing models, and preserved unchanged through Pre-Gold."}, {"t": "p", "x": "**Rationale:** AD-2. Corrections arrive against Stage 2's grain; resolving them later would require Pre-Gold to re-read RAW."}, {"t": "p", "x": "**Consequence:** Every Stage 2 model carries `RECORD_VERSION`, `IS_CURRENT`, `EFFECTIVE_FROM_TS` / `EFFECTIVE_TO_TS`. Pre-Gold consumes rather than re-derives."}, {"t": "p", "x": "**D7 · Reference data.**"}, {"t": "p", "x": "**Decision:** Reference lookups (security master, FX, hierarchy) are `ref()`-ed models with their own freshness tests, not raw joins to external tables."}, {"t": "p", "x": "**Rationale:** A stale FX rate produces silently wrong base-currency amounts that no downstream gate catches."}, {"t": "p", "x": "**Consequence:** **Reference data ownership is an open gap** — named in neither source deck. Freshness tests are the mitigation, not the fix."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart LR"}, {"t": "p", "x": "subgraph S1[\"Stage 1 (Oracle)\"]"}, {"t": "p", "x": "RAW[\"14 RAW · ~30 tables<br/>9 domains, incl. satellites<br/>all VARCHAR2\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S2[\"15 STAGE 2 ENRICHED (Oracle) — dbt\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "SRC[\"1 source<br/>INGESTION_STATUS = LOADED\"]"}, {"t": "p", "x": "STD[\"2 standardise · 3 typecast<br/>safe_date · safe_number\"]"}, {"t": "p", "x": "DED[\"4 deduplicate<br/>BEFORE joins\"]"}, {"t": "p", "x": "COR[\"5 corrections (17)<br/>bitemporal append\"]"}, {"t": "p", "x": "SAT[\"satellite join<br/>Optional Fields · Supplement\"]"}, {"t": "p", "x": "LKP[\"6 reference lookups\"]"}, {"t": "p", "x": "RUL[\"7 rules → DQ_FLAGS<br/>FLAG, never filter\"]"}, {"t": "p", "x": "DRV[\"8 derive · 9 latest-select\"]"}, {"t": "p", "x": "SRC --> STD --> DED --> COR --> SAT --> LKP --> RUL --> DRV"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph MOD[\"Conformed models (consumer-neutral)\"]"}, {"t": "p", "x": "M1[\"STG2_ACCOUNT<br/>+ satellites\"]"}, {"t": "p", "x": "M2[\"STG2_CLIENT\"]"}, {"t": "p", "x": "M3[\"STG2_ASSET<br/>+ satellites\"]"}, {"t": "p", "x": "M4[\"STG2_PORTFOLIO\"]"}, {"t": "p", "x": "M5[\"STG2_POSITION<br/>+ supplement\"]"}, {"t": "p", "x": "M6[\"STG2_TAXLOT\"]"}, {"t": "p", "x": "M7[\"STG2_TRANSACTION<br/>header + detail\"]"}, {"t": "p", "x": "M8[\"STG2_FEE · STG2_CASH<br/>STG2_STATEMENT · STG2_OTHER\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph REF[\"Reference — OWNERSHIP GAP\"]"}, {"t": "p", "x": "R1[\"ref_security_master\"]"}, {"t": "p", "x": "R2[\"ref_fx_rate\"]"}, {"t": "p", "x": "R3[\"ref_account_hierarchy\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph EXA[\"Stage 3 (Exadata Pre-Gold)\"]"}, {"t": "p", "x": "PG[\"66 SCD2 dims · facts<br/>bitemporal history · G4\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FDN[\"Foundation\"]"}, {"t": "p", "x": "CFG[\"33 Config<br/>mappings · keys · lookback\"]"}, {"t": "p", "x": "G3[\"25 G3 · BLOCKING\"]"}, {"t": "p", "x": "LIN[\"31 Lineage<br/>SRC_LOAD_ID carried\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "RAW --> SRC"}, {"t": "p", "x": "DRV --> M1 & M2 & M3 & M4 & M5 & M6 & M7 & M8"}, {"t": "p", "x": "REF -.-> LKP"}, {"t": "p", "x": "CFG -.-> SRC & COR & RUL"}, {"t": "p", "x": "M1 & M2 & M3 & M4 & M5 & M6 & M7 & M8 --> G3"}, {"t": "p", "x": "G3 -->|\"pass\"| PG"}, {"t": "p", "x": "M1 -.-> LIN"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "classDef gap stroke-dasharray:5 5,stroke:#9A5B00,color:#9A5B00"}, {"t": "p", "x": "class SRC,STD,DED,COR,SAT,LKP,RUL,DRV focal"}, {"t": "p", "x": "class REF,R1,R2,R3 gap"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant AF as 18 Airflow\n  participant CFG as 33 Config\n  participant RAW as 14 RAW (Oracle)\n  participant S2 as 15 Stage 2 (Oracle)\n  participant G3 as 25 G3 gate\n  participant PG as 66 Pre-Gold (Exadata)\n\n  AF->>S2: dbt run --selector stage2 (G2 passed)\n  S2->>CFG: read mappings, natural keys, lookback AS OF business_date\n  S2->>RAW: read WHERE INGESTION_STATUS = 'LOADED', partition-pruned\n  S2->>S2: standardise → safe typecast (bad values NULL + flagged, never raised)\n  S2->>S2: deduplicate on natural key + LOAD_ID — BEFORE any join\n  S2->>S2: resolve corrections (17) — bitemporal append, version chain\n  S2->>S2: join satellites onto parent grain\n  S2->>S2: reference lookups — security, FX, hierarchy\n  S2->>S2: business rules → DQ_FLAGS (flag, never filter)\n  S2->>S2: derive attributes → latest-record selection\n  AF->>G3: dbt test --selector stage2\n  alt G3 fails\n    G3-->>AF: BLOCK — Pre-Gold does not run, Gold untouched\n  else G3 passes\n    S2-->>PG: conformed models available on Oracle\n    Note over S2,PG: Pre-Gold reads Stage 2 for SCD2 and fact assembly.<br/>The cross-DB hop to Gold happens later, in 67.\n  end"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Airflow (18)** → G2 passed for all domains → triggers `dbt run --selector stage2`"}, {"t": "p", "x": "2. **Stage 2 (15)** → reads mappings, natural keys and lookback windows from config (33) as of business date"}, {"t": "p", "x": "3. **Stage 2 (15)** → reads RAW filtered `INGESTION_STATUS = 'LOADED'`, partition-pruned by business date → superseded loads excluded"}, {"t": "p", "x": "4. **Standardise, then typecast** → trim, case-fold codes, normalise nulls; safe-cast text to `DATE`/`NUMBER` → **bad values become NULL and are flagged, never raised**"}, {"t": "p", "x": "5. **Deduplicate** on natural key + `LOAD_ID`, keeping the highest `ROW_NUM` → **before any join**"}, {"t": "p", "x": "6. **Resolve corrections (17)** → union delta and correction feeds, rank by correction sequence, build the bitemporal version chain"}, {"t": "p", "x": "7. **Join satellites** onto their parent's grain — Optional Fields, Supplement — using the parent relationship from config"}, {"t": "p", "x": "8. **Reference lookups** → security master, FX rate, account hierarchy → `ref()`-ed models with freshness tests"}, {"t": "p", "x": "9. **Business rules** → outcomes written to `DQ_FLAGS` → **flag, never filter**"}, {"t": "p", "x": "10. **Derive** computed attributes → **latest-record selection**, one row per natural key per business date"}, {"t": "p", "x": "11. **G3 (25)** → `dbt test --selector stage2` → blocking; failure means Pre-Gold does not run and Gold is untouched"}, {"t": "p", "x": "12. **G3 passes** → conformed models available on the Stage 2 Oracle instance → Pre-Gold (66) reads them for assembly on Exadata"}, {"t": "p", "x": "**No cross-database hop in this component.** Stage 2 and RAW share the Oracle instance. The **Stage 2 → Gold (Exadata → standalone)** hop occurs downstream in component 67, after Pre-Gold assembly and G4."}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Model inventory"}, {"t": "tbl", "rows": [["Model", "Source feeds", "Satellites folded in", "Grain", "Corrections"], ["`STG2_ACCOUNT`", "Account, Client Account Link", "Account Optional Fields, Account Supplement", "Account per business date", "No"], ["`STG2_CLIENT`", "Client", "—", "Client per business date", "No"], ["`STG2_ASSET`", "Asset, Asset Investment Class", "Asset Optional Fields", "Asset per business date", "No"], ["`STG2_PORTFOLIO`", "Portfolio, Portfolio Groups, Model Allocation", "—", "Portfolio per business date", "No"], ["`STG2_POSITION`", "End of Day Position, EOD Changed Positions, FX Forward Position", "EOD Positions Supplement", "Account + Asset + date", "Yes"], ["`STG2_TAXLOT`", "Taxlot", "—", "Account + Lot + date", "Yes"], ["`STG2_TRANSACTION`", "Transaction Header, Transaction Detail", "—", "Transaction, versioned", "Yes"], ["`STG2_FEE`", "Fee Computation, Fee Package Usage", "—", "Fee event", "No"], ["`STG2_CASH`", "Recurring Cash Activity, Custody And Nostro", "—", "Cash activity", "No"], ["`STG2_STATEMENT`", "Statement Event, Statement Event Item", "—", "Statement event + item", "No"], ["`STG2_REF_*`", "Interest Rates, Fund Cutoff Times, End of Period Values, Pay To Recipients, Active Commits, Curr Upcoming Activity", "—", "Varies", "No"]]}, {"t": "p", "x": "Model-to-feed mapping is **config-driven**; the table above is the current resolution of the registry, not a hard-coded list."}, {"t": "h", "x": "Fixed processing order"}, {"t": "pre", "x": "  1 source          RAW, INGESTION_STATUS = 'LOADED', partition-pruned\n  2 standardise     trim · case-fold codes · '' / 'NULL' / 'N/A' → NULL\n  3 typecast        safe_date / safe_number — failures NULL + flagged\n  4 deduplicate     natural key + LOAD_ID, keep max ROW_NUM     ← before joins\n  5 corrections     union + rank by correction sequence (17)    ← before rules\n  6 satellite join  Optional Fields / Supplement onto parent\n  7 lookups         reference joins\n  8 rules           → DQ_FLAGS (flag, never filter)\n  9 derive + latest one row per natural key per business date\n\n  non-negotiable: 4 before 7 · 5 before 8 · 5 before 9"}, {"t": "h", "x": "Model template"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "-- models/stage2/stg2_transaction.sql"}, {"t": "p", "x": "{{ config("}, {"t": "p", "x": "materialized='incremental',"}, {"t": "p", "x": "unique_key=['transaction_id','business_date','record_version'],"}, {"t": "p", "x": "incremental_strategy='merge',"}, {"t": "p", "x": "partition_by='business_date',"}, {"t": "p", "x": "on_schema_change='fail'"}, {"t": "p", "x": ") }}"}, {"t": "p", "x": "{% set lookback = config_var('correction_lookback_days', feed='TRANSACTIONS') %}"}, {"t": "p", "x": "WITH src AS ("}, {"t": "p", "x": "SELECT * FROM {{ source('raw_swp','RAW_TXN_HEADER') }}"}, {"t": "p", "x": "WHERE ingestion_status = 'LOADED'"}, {"t": "p", "x": "{% if is_incremental() %}"}, {"t": "p", "x": "AND business_date >= (SELECT MAX(business_date) - {{ lookback }} FROM {{ this }})"}, {"t": "p", "x": "{% endif %}"}, {"t": "p", "x": "),"}, {"t": "p", "x": "typed AS ("}, {"t": "p", "x": "SELECT"}, {"t": "p", "x": "{{ std_code('transaction_id') }}   AS transaction_id,"}, {"t": "p", "x": "{{ safe_date('trade_date') }}      AS trade_date,"}, {"t": "p", "x": "{{ safe_number('amount') }}        AS amount,"}, {"t": "p", "x": "business_date, load_id AS src_load_id, row_num AS src_row_num, load_timestamp"}, {"t": "p", "x": "FROM src"}, {"t": "p", "x": "),"}, {"t": "p", "x": "deduped   AS ( {{ dedup_on(['transaction_id','business_date'], order_by='src_row_num desc') }} ),"}, {"t": "p", "x": "corrected AS ( {{ resolve_corrections('deduped','corr_typed',"}, {"t": "p", "x": "natural_key=['transaction_id','business_date']) }} ),"}, {"t": "p", "x": "enriched  AS ( {{ ref_lookups('corrected') }} ),"}, {"t": "p", "x": "flagged   AS ( {{ apply_rules('enriched', rule_set='stage2.transaction') }} )"}, {"t": "p", "x": "SELECT * FROM flagged"}]}]}, {"id": "c17", "title": "Correction Handling", "level": "L3", "icon": "🧪", "color": "#0e8f7e", "bg": "#dff2ef", "order": 117, "sub": "#17 · 2. Hub · Processing · dbt · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["17"], "chip": "#17 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["14", "15", "21", "31", "33", "66"], "decisions": ["AD-2", "AD-8", "AD-9"], "tiers": ["Stage2-Oracle", "Stage3-Exadata-Gold"], "updated": "2026-08-10"}, "src": "17_Correction_Handling_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "Correction handling is the single mechanism by which restated data — a transaction whose amount changed, a position that was wrong — is integrated without destroying what was previously held. Its single deliverable is **one reusable bitemporal resolution macro**, applied identically wherever corrections occur in Stage 2 and preserved unchanged through Pre-Gold assembly on Exadata."}, {"t": "p", "x": "It is a distinct component rather than a feature of Stage 2 because it must be written once. Correction logic implemented per model drifts, and a pipeline where two entities resolve restatements differently cannot answer an as-of question consistently."}, {"t": "p", "x": "**Tiers touched:** Stage 2 Oracle (where versions are created) and Stage 3 Exadata Pre-Gold (where they are preserved and resolved into dimensional output). Nothing in the consumer tier resolves corrections — Gold receives already-resolved current state plus a bounded as-of window."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "tbl", "rows": [["ID", "Component", "Why required"], ["14", "Stage 1 RAW", "Source of both original and correction records, immutable"], ["15", "Stage 2 Enriched", "Host of the macro; corrections resolve at step 5 of the fixed order"], ["33", "Config store", "Correction lookback per feed, natural keys, correction-feed pairings"], ["31", "Audit & lineage", "Version chain is part of the evidence trail"], ["21", "Replay engine", "Replay depends on append semantics — this component makes replay possible"], ["66", "Pre-Gold", "Consumes the version chain; must not re-derive it"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["**66 Pre-Gold** — builds SCD2 and facts over the resolved chain", "**67 Movement** — ships current state plus the bounded as-of window to Gold", "**25 G3** — asserts bitemporal consistency"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  14 RAW (Oracle)\n    original feeds + correction feeds, both immutable\n        │\n        ▼\n  ┌── 15 STAGE 2 (Oracle) ─────────────────────────┐\n  │   step 5: 17 CORRECTION RESOLUTION             │\n  │   union → rank → version chain                 │\n  │   RECORD_VERSION · IS_CURRENT · EFFECTIVE_*    │\n  └────────────────┬───────────────────────────────┘\n                   ▼\n  ┌── 66 PRE-GOLD (Exadata) ───────────────────────┐\n  │   chain PRESERVED, not re-derived              │\n  │   full history retained under HCC              │\n  └────────────────┬───────────────────────────────┘\n                   │ 67 · current state + 90d as-of window only\n                   ▼\n            Gold (standalone) ──▶ PBDW · IMDS · Pivotal"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Merge or versioned append?**"}, {"t": "p", "x": "**Decision:** Versioned append. A correction inserts a new version; the prior row is closed with `EFFECTIVE_TO_TS` and `IS_CURRENT = 'N'`."}, {"t": "p", "x": "**Rationale:** AD-2, decided. In-place merge destroys prior state, making as-of restatement impossible and replay meaningless — replay can re-run a merge but cannot undo one."}, {"t": "p", "x": "**Consequence:** Larger tables and every consumer query needing `IS_CURRENT = 'Y'`, mitigated by exposing views. One macro to build and maintain."}, {"t": "p", "x": "**D2 · One macro or per-model logic?**"}, {"t": "p", "x": "**Decision:** One macro, parameterised by natural key and correction-feed pairing from config."}, {"t": "p", "x": "**Rationale:** Three Stage 2 models carry corrections (Position, Taxlot, Transaction). Per-model implementations will diverge, and divergence means two entities answer the same as-of question differently."}, {"t": "p", "x": "**Consequence:** The macro must handle every correction shape in the inventory on day one; a feed that \"needs slightly different logic\" is a config gap, not a code exception."}, {"t": "p", "x": "**D3 · Where is the chain created, and where preserved?**"}, {"t": "p", "x": "**Decision:** Created in Stage 2 (Oracle). Preserved unchanged through Pre-Gold (Exadata). Never re-derived."}, {"t": "p", "x": "**Rationale:** Corrections arrive against Stage 2's grain. Re-deriving in Pre-Gold would require reading RAW across the tier boundary and would allow the two layers to disagree."}, {"t": "p", "x": "**Consequence:** Pre-Gold's SCD2 build consumes `IS_CURRENT` and the effective timestamps rather than computing them."}, {"t": "p", "x": "**D4 · Retention of the version chain.**"}, {"t": "p", "x": "**Decision:** Full chain retained in Pre-Gold on Exadata under HCC. Gold receives current state plus a bounded as-of window, default 90 days, configurable per object."}, {"t": "p", "x": "**Rationale:** Full versioned history on the standalone 12 CPU / 64 GB Gold box with only basic compression will outgrow it. Exadata absorbs it at roughly 10× compression."}, {"t": "p", "x": "**Consequence:** As-of queries beyond the window resolve against Pre-Gold, not Gold. This is a **refinement to AD-2** requiring explicit ARB acknowledgement — bitemporal append still holds everywhere, but the retention horizon differs by tier."}, {"t": "p", "x": "**D5 · Ordering determinism.**"}, {"t": "p", "x": "**Decision:** Version order is `correction_seq`, then `LOAD_TIMESTAMP`, then `SRC_LOAD_ID`. All three, always."}, {"t": "p", "x": "**Rationale:** Two corrections to the same record on the same day are indistinguishable on `correction_seq` alone. A non-deterministic order means two replays produce two different answers."}, {"t": "p", "x": "**Consequence:** `SRC_LOAD_ID` must be monotonic per feed — a constraint on the allocation design in component 31."}, {"t": "p", "x": "**D6 · Corrections outside the lookback window.**"}, {"t": "p", "x": "**Decision:** Route to a manual exception queue via component 30. Never silently dropped, never silently applied outside the incremental predicate."}, {"t": "p", "x": "**Rationale:** A correction landing today for a transaction six weeks old falls outside a seven-day lookback. Silence is the wrong answer."}, {"t": "p", "x": "**Consequence:** The lookback is per-feed config; an out-of-window correction raises an E4 exception with the affected `LOAD_ID` and business date."}, {"t": "p", "x": "**D7 · Corrections arriving before their originals.**"}, {"t": "p", "x": "**Decision:** Park with `DQ_FLAGS = 'ORPHAN_CORRECTION'` and retry across the lookback window. G3 asserts the orphan count is zero after the window closes."}, {"t": "p", "x": "**Rationale:** Out-of-order delivery is a real possibility with independent feed arrival."}, {"t": "p", "x": "**Consequence:** An orphan that survives the window becomes an exception, not a silent gap."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart LR"}, {"t": "p", "x": "subgraph EXT[\"EXTERNAL — SEI, out of scope\"]"}, {"t": "p", "x": "SEI[\"SWP correction extracts\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S1[\"Stage 1 RAW (Oracle) — immutable\"]"}, {"t": "p", "x": "O1[\"RAW_TXN_HEADER<br/>RAW_TXN_DETAIL\"]"}, {"t": "p", "x": "O2[\"RAW_EOD_POSITION<br/>RAW_EOD_CHANGED_POS\"]"}, {"t": "p", "x": "O3[\"RAW_TAXLOT\"]"}, {"t": "p", "x": "C1[\"correction feeds<br/>paired in config\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph M17[\"17 CORRECTION RESOLUTION MACRO (dbt)\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "UN[\"union<br/>original + correction\"]"}, {"t": "p", "x": "RK[\"rank<br/>correction_seq → LOAD_TIMESTAMP → SRC_LOAD_ID\"]"}, {"t": "p", "x": "VC[\"version chain<br/>RECORD_VERSION · IS_CURRENT\"]"}, {"t": "p", "x": "EF[\"effective window<br/>EFFECTIVE_FROM_TS / _TO_TS\"]"}, {"t": "p", "x": "OR[\"orphan handling<br/>park + retry across lookback\"]"}, {"t": "p", "x": "OW[\"out-of-window<br/>→ 30 exception queue\"]"}, {"t": "p", "x": "UN --> RK --> VC --> EF"}, {"t": "p", "x": "RK -.-> OR"}, {"t": "p", "x": "RK -.-> OW"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S2[\"Stage 2 (Oracle) — chain CREATED\"]"}, {"t": "p", "x": "T1[\"STG2_TRANSACTION\"]"}, {"t": "p", "x": "T2[\"STG2_POSITION\"]"}, {"t": "p", "x": "T3[\"STG2_TAXLOT\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph PG[\"Stage 3 Pre-Gold (Exadata) — chain PRESERVED\"]"}, {"t": "p", "x": "H[\"full version history<br/>HCC compressed<br/>NOT re-derived\"]"}, {"t": "p", "x": "G4[\"26 G4 tie-out\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph GD[\"Gold (standalone 12/64)\"]"}, {"t": "p", "x": "GV[\"current state<br/>+ 90d as-of window<br/>basic compression only\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph CN[\"Consumers (movement only)\"]"}, {"t": "p", "x": "PB[\"37 PBDW\"]"}, {"t": "p", "x": "IM[\"38 IMDS\"]"}, {"t": "p", "x": "PV[\"39 Pivotal\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FDN[\"Foundation\"]"}, {"t": "p", "x": "CFG[\"33 Config<br/>pairings · lookback · keys\"]"}, {"t": "p", "x": "EXC[\"30 Exception queue\"]"}, {"t": "p", "x": "RPL[\"21 Replay<br/>ENABLED by append\"]"}, {"t": "p", "x": "G3[\"25 G3 assertions\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "SEI -.-> C1"}, {"t": "p", "x": "O1 & O2 & O3 --> UN"}, {"t": "p", "x": "C1 --> UN"}, {"t": "p", "x": "CFG -.-> UN & RK"}, {"t": "p", "x": "EF --> T1 & T2 & T3"}, {"t": "p", "x": "OW --> EXC"}, {"t": "p", "x": "T1 & T2 & T3 --> G3"}, {"t": "p", "x": "T1 & T2 & T3 --> H --> G4"}, {"t": "p", "x": "G4 ==>|\"67 · bounded window crosses\"| GV"}, {"t": "p", "x": "GV --> PB & IM & PV"}, {"t": "p", "x": "H -.->|\"as-of beyond 90d<br/>resolves HERE\"| EXC"}, {"t": "p", "x": "RPL -.-> UN"}, {"t": "p", "x": "classDef ext stroke-dasharray:5 5,stroke:#A82316,color:#A82316"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "class SEI,EXT ext"}, {"t": "p", "x": "class UN,RK,VC,EF,OR,OW focal"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant RAW as 14 RAW (Oracle)\n  participant M as 17 Macro\n  participant S2 as 15 Stage 2 (Oracle)\n  participant EXC as 30 Exception queue\n  participant PG as 66 Pre-Gold (Exadata)\n  participant GD as Gold (standalone)\n\n  S2->>M: invoke with natural_key + correction pairing (33)\n  M->>RAW: read original feed, INGESTION_STATUS = LOADED, within lookback\n  M->>RAW: read paired correction feed, same window\n  M->>M: union with correction_seq (0 = original, 1 = correction)\n  M->>M: rank by correction_seq → LOAD_TIMESTAMP → SRC_LOAD_ID\n  M->>M: assign RECORD_VERSION; close prior with EFFECTIVE_TO_TS\n  alt correction has no matching original\n    M->>M: flag ORPHAN_CORRECTION, park for retry\n    Note over M: G3 asserts orphan count = 0 after window closes\n  end\n  alt correction targets a date outside the lookback\n    M->>EXC: raise E4 with LOAD_ID + business date — never silent\n  end\n  M-->>S2: version chain — RECORD_VERSION, IS_CURRENT, EFFECTIVE_FROM/TO\n  S2->>PG: chain consumed AS IS — not re-derived\n  PG->>PG: full history retained under HCC\n  PG->>GD: CROSS-DB HOP (67) — current state + 90d as-of window ONLY\n  Note over PG,GD: as-of queries beyond 90 days resolve on Exadata,<br/>not on the 12 CPU / 64 GB Gold box"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Stage 2 (15)** → invokes the macro at step 5 of the fixed order, with the natural key and correction-feed pairing from config (33)"}, {"t": "p", "x": "2. **Macro (17)** → reads the original feed from RAW, `INGESTION_STATUS = 'LOADED'`, within the feed's lookback window"}, {"t": "p", "x": "3. **Macro (17)** → reads the paired correction feed over the same window"}, {"t": "p", "x": "4. **Macro (17)** → unions both, stamping `correction_seq` — 0 for original, 1 for correction"}, {"t": "p", "x": "5. **Macro (17)** → ranks by `correction_seq`, then `LOAD_TIMESTAMP`, then `SRC_LOAD_ID` → **all three, for determinism across replays**"}, {"t": "p", "x": "6. **Macro (17)** → assigns `RECORD_VERSION`; closes the prior version with `EFFECTIVE_TO_TS` and `IS_CURRENT = 'N'`"}, {"t": "p", "x": "7. **Orphan branch** → a correction with no matching original is flagged `ORPHAN_CORRECTION` and parked → G3 asserts the count is zero once the window closes"}, {"t": "p", "x": "8. **Out-of-window branch** → a correction targeting a date beyond the lookback raises an E4 exception to the queue (30) with `LOAD_ID` and business date → **never silently dropped or applied**"}, {"t": "p", "x": "9. **Stage 2 (15)** → receives the resolved chain → `RECORD_VERSION`, `IS_CURRENT`, effective timestamps on every row"}, {"t": "p", "x": "10. **Pre-Gold (66)** → consumes the chain **as is** → SCD2 and fact assembly read `IS_CURRENT` rather than recomputing it"}, {"t": "p", "x": "11. **Pre-Gold (66)** → retains the full version history on Exadata under HCC"}, {"t": "p", "x": "12. **Movement (67)** → **CROSS-DATABASE HOP: Exadata → standalone Gold** → ships current state plus the bounded 90-day as-of window only"}, {"t": "p", "x": "13. **Gold** → consumers read current state via `IS_CURRENT = 'Y'` views → as-of queries beyond 90 days resolve on Exadata, not here"}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Correction-bearing entities"}, {"t": "tbl", "rows": [["Stage 2 model", "Original feeds", "Correction source", "Natural key", "Lookback default"], ["`STG2_TRANSACTION`", "Transaction Header, Transaction Detail", "Paired correction feed", "`transaction_id` + `business_date`", "7 days"], ["`STG2_POSITION`", "End of Day Position, EOD Changed Positions", "EOD Changed Positions carries restatements", "`account_id` + `asset_id` + `business_date`", "7 days"], ["`STG2_TAXLOT`", "Taxlot", "Snapshot restatement", "`account_id` + `lot_id` + `business_date`", "7 days"]]}, {"t": "p", "x": "Pairings and lookbacks are **config**, not code. **Open:** the exact correction-feed names in the SEI inventory need confirming — `EOD Changed Positions` is inferred as the position restatement carrier."}, {"t": "h", "x": "The macro"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "{% macro resolve_corrections(base_rel, corr_rel, natural_key, lookback_days) %}"}, {"t": "p", "x": "WITH unioned AS ("}, {"t": "p", "x": "SELECT b.*, 0 AS correction_seq, 'ORIGINAL' AS record_source FROM {{ base_rel }} b"}, {"t": "p", "x": "UNION ALL"}, {"t": "p", "x": "SELECT c.*, 1 AS correction_seq, 'CORRECTION'                FROM {{ corr_rel }} c"}, {"t": "p", "x": "),"}, {"t": "p", "x": "ranked AS ("}, {"t": "p", "x": "SELECT u.*,"}, {"t": "p", "x": "ROW_NUMBER() OVER ("}, {"t": "p", "x": "PARTITION BY {{ natural_key | join(', ') }}"}, {"t": "p", "x": "ORDER BY correction_seq, load_timestamp, src_load_id    -- D5: all three"}, {"t": "p", "x": ") AS record_version,"}, {"t": "p", "x": "LEAD(load_timestamp) OVER ("}, {"t": "p", "x": "PARTITION BY {{ natural_key | join(', ') }}"}, {"t": "p", "x": "ORDER BY correction_seq, load_timestamp, src_load_id"}, {"t": "p", "x": ") AS effective_to_ts"}, {"t": "p", "x": "FROM unioned u"}, {"t": "p", "x": "),"}, {"t": "p", "x": "orphans AS (                                                       -- D7"}, {"t": "p", "x": "SELECT r.* FROM ranked r"}, {"t": "p", "x": "WHERE r.record_source = 'CORRECTION'"}, {"t": "p", "x": "AND NOT EXISTS (SELECT 1 FROM ranked o"}, {"t": "p", "x": "WHERE o.record_source = 'ORIGINAL'"}, {"t": "p", "x": "AND {{ key_match('o','r', natural_key) }})"}, {"t": "p", "x": ")"}, {"t": "p", "x": "SELECT r.*,"}, {"t": "p", "x": "r.load_timestamp AS effective_from_ts,"}, {"t": "p", "x": "CASE WHEN r.effective_to_ts IS NULL THEN 'Y' ELSE 'N' END AS is_current,"}, {"t": "p", "x": "CASE WHEN r.{{ natural_key[0] }} IN (SELECT {{ natural_key[0] }} FROM orphans)"}, {"t": "p", "x": "THEN 'ORPHAN_CORRECTION;' END AS dq_flags"}, {"t": "p", "x": "FROM ranked r"}, {"t": "p", "x": "{% endmacro %}"}, {"t": "pre", "x": "\n### Column contract — added to every correction-bearing model\n\n| Column | Type | Semantics |\n|---|---|---|\n| `RECORD_VERSION` | `NUMBER(6)` | 1 for original, incrementing per correction |\n| `IS_CURRENT` | `CHAR(1)` | `Y` for the version in force |\n| `EFFECTIVE_FROM_TS` | `TIMESTAMP` | Knew-at start — when BBH learned this version |\n| `EFFECTIVE_TO_TS` | `TIMESTAMP` | Knew-at end; NULL for current |\n| `BUSINESS_DATE` | `DATE` | Happened-at — the event's own date, unchanged by correction |\n| `RECORD_SOURCE` | `VARCHAR2(12)` | `ORIGINAL` / `CORRECTION` |\n| `SRC_LOAD_ID` | `NUMBER(18)` | Lineage, and the final ordering tiebreak |\n\n### The two axes\n"}, {"t": "p", "x": "happened-at  →  BUSINESS_DATE       the event's date"}, {"t": "p", "x": "knew-at      →  EFFECTIVE_FROM_TS   when BBH learned it"}, {"t": "p", "x": "Aug 5   T-991 booked, amount 10,000   → BUSINESS_DATE 2026-08-05, v1"}, {"t": "p", "x": "Aug 7   correction: amount 12,000     → BUSINESS_DATE 2026-08-05, v2"}, {"t": "p", "x": "arrived 2026-08-07"}, {"t": "p", "x": "\"what did the books show for Aug 5, as at Aug 6?\""}, {"t": "p", "x": "under merge:            unanswerable — v1 no longer exists"}, {"t": "p", "x": "under versioned append: v1, WHERE EFFECTIVE_FROM_TS <= Aug 6 < EFFECTIVE_TO_TS"}]}]}, {"id": "c18", "title": "Airflow DAG + Per-Domain Fan-out", "level": "L3", "icon": "🛠", "color": "#6d3ac0", "bg": "#efe6fb", "order": 118, "sub": "#18 · 2. Hub · Orchestration · Airflow · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["18"], "chip": "#18 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["9", "13", "15", "19", "21", "22", "23", "24", "25", "26", "33", "51", "52", "55", "66", "67"], "decisions": ["AD-4", "AD-5", "AD-9", "AD-1"], "tiers": ["Stage1-Oracle", "Stage2-Oracle", "Stage3-Exadata-Gold", "Consumer-Movement"], "updated": "2026-08-10"}, "src": "18_Airflow_DAG_Fanout_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "This component is the control plane for the entire batch lane. It decides what runs, in what order, with what concurrency, and what happens when something fails — across ~30 feeds in 9 domains, through four tiers, ending at the consumer publish. Its single deliverable is a **dynamically mapped DAG generated from the feed registry**, not a hand-written task graph."}, {"t": "p", "x": "It holds control flow and nothing else. No transformations, no business rules, no thresholds — those belong to dbt, to the gates, and to configuration. The discipline that keeps this component maintainable is that reading the DAG tells you the *shape* of the pipeline and nothing about the *meaning* of the data."}, {"t": "p", "x": "**Tiers touched:** orchestrates across all four — Stage 1 Oracle ingest, Stage 2 Oracle transformation, Stage 3 Exadata Pre-Gold assembly and tie-out, and the consumer-movement publish. It executes work at none of them."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "h", "x": "Upstream (Depends On)"}, {"t": "tbl", "rows": [["ID", "Component", "Why required"], ["33", "Config store", "Feed registry drives dynamic task mapping; waves, cadence, lookback, partial-batch policy"], ["9", "Arrival sensors", "Per-file triggers that start each domain branch"], ["13", "Ingestion framework", "Invoked per feed in wave 1"], ["15", "Stage 2", "dbt selector invocation"], ["19", "Build order / threads", "Dim-before-fact sequencing and dbt concurrency"], ["21", "Replay engine", "Invoked on failure paths; replay runs re-enter this DAG"], ["22", "Partial-batch policy", "Branching logic on a domain failure"], ["23–26", "Gates G1–G4", "Blocking task placement"], ["51, 52, 55", "Airflow deployment, autoscaling, Oracle pooling", "Executor, worker capacity, and the real concurrency ceiling"], ["66", "Pre-Gold assembly", "Wave 3 task group on Exadata"], ["67", "Gold movement", "Wave 4 publish"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["Every executing component in the batch lane", "**35 Integration360** — run status, exceptions, process tracking", "**34 Observability** — run-level metrics and SLIs"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  ┌─────────────────── 18 AIRFLOW DAG (control plane) ───────────────────┐\n  │  spans all tiers · executes at none                                  │\n  └──┬────────────┬─────────────┬──────────────────┬────────────────────┘\n     ▼            ▼             ▼                  ▼\n  STAGE 1      STAGE 2      STAGE 3            CONSUMER\n  Oracle       Oracle       Exadata Pre-Gold   movement\n  ingest+G1    dbt+G3       assembly+G4        publish+G5\n     └──────────────────────┬───────────────────────┘\n                            │ 67 cross-DB hop: Exadata → Gold\n                            ▼\n                    Gold (standalone) ──▶ PBDW · IMDS · Pivotal"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Static DAG or dynamic task mapping?**"}, {"t": "p", "x": "**Decision:** Dynamic task mapping over the feed registry in config (33). No feed, domain or table name appears in DAG code."}, {"t": "p", "x": "**Rationale:** ~30 feeds across 9 domains, with satellites and a plausible tenth domain. A static graph means every feed change is a code change and a release."}, {"t": "p", "x": "**Consequence:** The DAG is harder to read at a glance and harder to debug — mitigated by a rendered dependency view and consistent task-ID naming derived from `feed_id`."}, {"t": "p", "x": "**D2 · What is the fan-out unit?**"}, {"t": "p", "x": "**Decision:** The **domain**, not the feed. A domain branch fans out internally over its feeds."}, {"t": "p", "x": "**Rationale:** Dependencies and partial-batch decisions are meaningful at domain level — \"Positions failed\" is actionable; \"EOD Positions Supplement failed\" is a detail within it. Satellites must complete with their parent."}, {"t": "p", "x": "**Consequence:** 9 top-level branches, ~30 leaf ingest tasks. Partial-batch policy (22) operates on domains."}, {"t": "p", "x": "**D3 · How are load waves sequenced?**"}, {"t": "p", "x": "**Decision:** Two waves by `LOAD_WAVE` in config. Wave 1 = dimension-bearing domains (Reference & Asset, Account & Client, Portfolio & Model). Wave 2 = fact-bearing domains (Positions, Transactions, Fee & Billing, Reporting, Cash, Other)."}, {"t": "p", "x": "**Rationale:** Dimensional assembly in Pre-Gold (66) resolves fact foreign keys against dimensions. Facts arriving before their dimensions produce orphans or inferred members."}, {"t": "p", "x": "**Consequence:** Wave 2 waits on wave 1 completion at the ingest and Stage 2 level. This is a genuine serialisation cost, accepted because the alternative is late-arriving-dimension handling in every fact model."}, {"t": "p", "x": "**D4 · Does a domain failure halt the batch?**"}, {"t": "p", "x": "**Decision:** Default `HALT_ALL`, configurable per domain to `PROCEED`. Held in `CFG_SCHEDULE.PARTIAL_BATCH_POLICY`."}, {"t": "p", "x": "**Rationale:** Halt-all is the defensible default until measured — a partial business date published to PBDW is a consistency problem for ~1,000 consumers. But the per-domain fan-out makes proceeding *possible*, so the policy should be config, not code."}, {"t": "p", "x": "**Consequence:** **Contingent on AD-5.** If ARB lands on per-domain proceed, a publish-completeness marker per domain must be readable by consumers."}, {"t": "p", "x": "**D5 · Are DQ failures retried?**"}, {"t": "p", "x": "**Decision:** No. `retries=0` on every gate task. Only class E6 (infrastructure) is retryable, and only on non-gate tasks."}, {"t": "p", "x": "**Rationale:** The input is unchanged, so the outcome is unchanged. Retrying a blocking gate burns the EOD window and makes a real data problem look like flakiness in the run history."}, {"t": "p", "x": "**Consequence:** The `GateOperator` enforces `retries=0` regardless of what is passed, so the default cannot be reintroduced by a well-meaning edit."}, {"t": "p", "x": "**D6 · How is the cross-database hop orchestrated?**"}, {"t": "p", "x": "**Decision:** Wave 4 is a distinct task group. G4 completes fully on Exadata before any movement task starts. Movement is per Gold target object, parallel, each with its own verify."}, {"t": "p", "x": "**Rationale:** Only reconciled data crosses the hop. Per-object movement means one target failing does not block the others, and each is independently restartable."}, {"t": "p", "x": "**Consequence:** The DAG must model the Exadata/Gold boundary explicitly — pool separation, distinct connection identities, and a task-level marker so an operator can see where a run stopped relative to the hop."}, {"t": "p", "x": "**D7 · Does this DAG orchestrate the real-time lane?**"}, {"t": "p", "x": "**Decision:** No. The API Gateway / Data Plane lane (12) is independent and has no batch dependency."}, {"t": "p", "x": "**Rationale:** Coupling would make real-time consumers wait on an EOD build."}, {"t": "p", "x": "**Consequence:** **Contingent on AD-4.** If intraday is routed through the batch pipeline rather than the API lane, component 20's cadence design and this DAG's concurrency model both reopen."}, {"t": "p", "x": "**D8 · One DAG or several?**"}, {"t": "p", "x": "**Decision:** One EOD DAG for the batch lane, plus a separate intraday DAG (20) and a separate replay DAG (21)."}, {"t": "p", "x": "**Rationale:** Different schedules, different failure semantics, different concurrency budgets. A single DAG carrying all three becomes an unreadable branch tree."}, {"t": "p", "x": "**Consequence:** A cross-DAG lock is required so intraday and EOD never write the same target concurrently."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart TB"}, {"t": "p", "x": "subgraph EXT[\"EXTERNAL — SEI / SWP, out of scope\"]"}, {"t": "p", "x": "SEI[\"SWP Platform<br/>~30 feeds, EOD\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph CFG[\"Config-driven\"]"}, {"t": "p", "x": "REG[\"33 Feed registry<br/>9 domains · waves<br/>parent/satellite · policy\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph DAG[\"18 AIRFLOW DAG — control plane\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "SENS[\"9 Sensors<br/>per-file, manifest-aware\"]"}, {"t": "p", "x": "MAP[\"Dynamic task mapping<br/>expand over registry\"]"}, {"t": "p", "x": "W1[\"WAVE 1 — dimension domains<br/>Reference &amp; Asset · Account &amp; Client<br/>Portfolio &amp; Model\"]"}, {"t": "p", "x": "W2[\"WAVE 2 — fact domains<br/>Positions · Transactions · Fee &amp; Billing<br/>Reporting · Cash · Other\"]"}, {"t": "p", "x": "PB[\"22 Partial-batch branch<br/>HALT_ALL | PROCEED\"]"}, {"t": "p", "x": "W3[\"WAVE 3 — Stage 2 + Pre-Gold<br/>dbt selector · assembly\"]"}, {"t": "p", "x": "W4[\"WAVE 4 — publish<br/>per Gold target\"]"}, {"t": "p", "x": "SENS --> MAP --> W1 --> W2 --> PB --> W3 --> W4"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph T1[\"Stage 1 (Oracle)\"]"}, {"t": "p", "x": "ING[\"13 Ingest\"]"}, {"t": "p", "x": "G1[\"23 G1 · BLOCKING\"]"}, {"t": "p", "x": "RAW[\"14 RAW\"]"}, {"t": "p", "x": "G2[\"24 G2 · BLOCKING\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph T2[\"Stage 2 (Oracle)\"]"}, {"t": "p", "x": "S2[\"15 dbt models\"]"}, {"t": "p", "x": "G3[\"25 G3 · BLOCKING\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph T3[\"Stage 3 (Exadata Pre-Gold)\"]"}, {"t": "p", "x": "PG[\"66 SCD2 · facts · bitemporal\"]"}, {"t": "p", "x": "G4[\"26 G4 tie-out · BLOCKING<br/>both sides local\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph T4[\"Consumers (movement only)\"]"}, {"t": "p", "x": "MV[\"67 Partition exchange\"]"}, {"t": "p", "x": "GLD[\"16 Gold — standalone<br/>12 CPU / 64 GB\"]"}, {"t": "p", "x": "PBDW[\"37 PBDW<br/>~1,000 consumers\"]"}, {"t": "p", "x": "IMDS[\"38 IMDS\"]"}, {"t": "p", "x": "PIV[\"39 Pivotal\"]"}, {"t": "p", "x": "G5[\"27 G5 · advisory\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph RT[\"Real-time lane — INDEPENDENT, not orchestrated here\"]"}, {"t": "p", "x": "APIGW[\"12 API Gateway / Data Plane\"]"}, {"t": "p", "x": "RTC[\"42 Real-time consumers\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph OPS[\"Runtime\"]"}, {"t": "p", "x": "EXEC[\"51 KubernetesExecutor<br/>52 autoscaling\"]"}, {"t": "p", "x": "POOL[\"55 Oracle pool<br/>REAL concurrency ceiling\"]"}, {"t": "p", "x": "RPL[\"21 Replay DAG\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "SEI -.->|\"file contract\"| SENS"}, {"t": "p", "x": "SEI -.->|\"SWP APIs\"| APIGW"}, {"t": "p", "x": "APIGW ==> RTC"}, {"t": "p", "x": "REG -.-> MAP"}, {"t": "p", "x": "W1 --> ING --> G1 --> RAW --> G2"}, {"t": "p", "x": "W2 --> ING"}, {"t": "p", "x": "W3 --> S2 --> G3 --> PG --> G4"}, {"t": "p", "x": "G4 ==>|\"only reconciled data crosses\"| MV"}, {"t": "p", "x": "W4 --> MV --> GLD --> PBDW & IMDS & PIV"}, {"t": "p", "x": "GLD --> G5"}, {"t": "p", "x": "EXEC -.-> DAG"}, {"t": "p", "x": "POOL -.->|\"bounds fan-out width\"| MAP"}, {"t": "p", "x": "G1 & G2 & G3 & G4 -.->|\"fail\"| RPL"}, {"t": "p", "x": "classDef ext stroke-dasharray:5 5,stroke:#A82316,color:#A82316"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "classDef block stroke:#A82316,stroke-width:2px"}, {"t": "p", "x": "class SEI,EXT ext"}, {"t": "p", "x": "class SENS,MAP,W1,W2,PB,W3,W4 focal"}, {"t": "p", "x": "class G1,G2,G3,G4 block"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant CFG as 33 Config\n  participant AF as 18 DAG\n  participant SEN as 9 Sensors\n  participant ING as 13 Ingest (Stage 1)\n  participant S2 as 15 Stage 2\n  participant PG as 66 Pre-Gold (Exadata)\n  participant MV as 67 Movement\n  participant GD as Gold (standalone)\n\n  AF->>CFG: read feed registry AS OF business_date\n  CFG-->>AF: 9 domains · ~30 feeds · waves · policy\n  AF->>AF: expand — one branch per domain, leaves per feed\n  AF->>SEN: arm per-file sensors\n  SEN-->>AF: file arrived (per feed, independently)\n\n  rect rgb(240,245,250)\n    Note over AF,ING: WAVE 1 — dimension domains\n    AF->>ING: ingest Reference &amp; Asset, Account &amp; Client, Portfolio &amp; Model\n    ING-->>AF: G1 pass → RAW → G2 pass\n  end\n\n  rect rgb(240,245,250)\n    Note over AF,ING: WAVE 2 — fact domains (waits on wave 1)\n    AF->>ING: ingest Positions, Transactions, Fee &amp; Billing, Reporting, Cash, Other\n    ING-->>AF: G1 pass → RAW → G2 pass\n  end\n\n  alt a domain fails a gate\n    AF->>AF: evaluate 22 partial-batch policy\n    alt HALT_ALL (default)\n      AF-->>AF: stop batch · alert · replay candidate\n    else PROCEED\n      AF-->>AF: continue remaining domains · mark domain incomplete\n    end\n  else all domains pass\n    AF->>S2: dbt run --selector stage2 (Oracle)\n    S2-->>AF: G3 pass\n    AF->>PG: assemble dims (wave A) then facts (wave B) — Exadata\n    PG->>PG: G4 tie-out, both sides local\n    alt G4 fails\n      PG-->>AF: BLOCK · nothing crosses · Gold holds prior partition\n    else G4 passes\n      AF->>MV: publish per Gold target, parallel\n      MV->>GD: CROSS-DB HOP — DB-link direct-path APPEND + partition exchange\n      MV-->>AF: post-move row-count verify\n      AF->>GD: release consumer extracts (PBDW, IMDS, Pivotal)\n      AF->>AF: G5 advisory recon\n    end\n  end"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **DAG (18)** → reads the feed registry from config (33) as of the business date → 9 domains, ~30 feeds, waves, partial-batch policy"}, {"t": "p", "x": "2. **DAG (18)** → expands dynamically → one branch per domain, leaf tasks per feed, satellites bound to their parent's branch"}, {"t": "p", "x": "3. **Sensors (9)** → armed per file, manifest-aware → each fires independently on arrival, reclaiming the spread of the delivery window"}, {"t": "p", "x": "4. **Wave 1 — Stage 1 Oracle** → ingest the dimension domains: Reference & Asset, Account & Client, Portfolio & Model → G1 blocking per file"}, {"t": "p", "x": "5. **Wave 1** → RAW load → G2 profiling gate, blocking → wave 1 complete"}, {"t": "p", "x": "6. **Wave 2 — Stage 1 Oracle** → ingest the fact domains: Positions, Transactions, Fee & Billing, Reporting, Cash, Other → G1, RAW, G2 as above"}, {"t": "p", "x": "7. **Partial-batch branch (22)** → on any domain gate failure, evaluate policy → `HALT_ALL` stops the batch; `PROCEED` continues and marks that domain incomplete"}, {"t": "p", "x": "8. **Wave 3 — Stage 2 Oracle** → dbt selector run across all conformed models → G3 blocking on tests and business rules"}, {"t": "p", "x": "9. **Wave 3 — Stage 3 Exadata** → Pre-Gold (66) assembles dimensions first, then facts, then bitemporal history under HCC"}, {"t": "p", "x": "10. **G4 (26)** → tie-out on Exadata, RAW counts by `LOAD_ID` against assembled rows → **both sides local, blocking, not override-eligible**"}, {"t": "p", "x": "11. **G4 fails** → nothing crosses to Gold. Gold retains its prior partition. Error event (29), exception queued (30), replay candidate (21)"}, {"t": "p", "x": "12. **Wave 4 — CROSS-DATABASE HOP** → **Exadata → standalone Gold** via DB-link direct-path `APPEND`, then partition exchange, per target object in parallel"}, {"t": "p", "x": "13. **Movement (67)** → post-move row-count verify against the Pre-Gold source count → lightweight, appropriate for the 12 CPU / 64 GB box"}, {"t": "p", "x": "14. **Consumer movement** → scheduled extracts release to PBDW, IMDS Stage → IMDS, and Pivotal → movement only, no transformation"}, {"t": "p", "x": "15. **G5 (27)** → advisory post-publish reconciliation → alerts and may trigger replay; blocks nothing"}, {"t": "p", "x": "**Failure branch (any gate):** the run stops at that gate. Downstream tiers are untouched, Gold holds its prior state, and remediation is fix-then-replay from `LOAD_ID` — never in-place repair."}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "DAG shape"}, {"t": "p", "x": "```python"}, {"t": "p", "x": "from airflow.decorators import dag, task, task_group"}, {"t": "p", "x": "from hub_framework.config import ConfigStore"}, {"t": "p", "x": "from hub_framework.operators import GateOperator, IngestOperator, DbtOperator"}, {"t": "p", "x": "@dag("}, {"t": "p", "x": "dag_id=\"hub_eod\","}, {"t": "p", "x": "schedule=None,                     # cadence from config, set at deploy"}, {"t": "p", "x": "max_active_runs=1,                 # one EOD run at a time, full stop"}, {"t": "p", "x": "catchup=False,"}, {"t": "p", "x": "default_args={\"retries\": 0},       # E6 tasks opt IN; nothing opts out of blocking"}, {"t": "p", "x": ")"}, {"t": "p", "x": "def hub_eod():"}, {"t": "p", "x": "@task"}, {"t": "p", "x": "def domains(wave: int, ds=None):"}, {"t": "p", "x": "return ConfigStore(ds).domains(load_wave=wave)     # 33 drives the shape"}, {"t": "p", "x": "@task_group"}, {"t": "p", "x": "def ingest_domain(domain: str):"}, {"t": "p", "x": "feeds  = list_feeds(domain)                        # incl. satellites"}, {"t": "p", "x": "loaded = IngestOperator.partial(task_id=\"ingest\").expand(feed=feeds)"}, {"t": "p", "x": "g1     = GateOperator(task_id=\"g1\", gate=\"G1\", scope=loaded)"}, {"t": "p", "x": "g2     = GateOperator(task_id=\"g2\", gate=\"G2\", scope=loaded)"}, {"t": "p", "x": "loaded >> g1 >> g2"}, {"t": "p", "x": "wave1 = ingest_domain.expand(domain=domains(1))        # dimension domains"}, {"t": "p", "x": "wave2 = ingest_domain.expand(domain=domains(2))        # fact domains"}, {"t": "p", "x": "gate_batch = partial_batch_branch()                    # 22 · policy from config"}, {"t": "p", "x": "stage2 = DbtOperator(task_id=\"stage2\", selector=\"stage2\", target=\"oracle\")"}, {"t": "p", "x": "g3     = GateOperator(task_id=\"g3\", gate=\"G3\")"}, {"t": "p", "x": "@task_group"}, {"t": "p", "x": "def pre_gold():                                        # 66 · Exadata"}, {"t": "p", "x": "dims  = DbtOperator.partial(task_id=\"dim\").expand(model=dim_models())"}, {"t": "p", "x": "facts = DbtOperator.partial(task_id=\"fact\").expand(model=fact_models())"}, {"t": "p", "x": "g4    = GateOperator.partial(task_id=\"g4\", gate=\"G4\","}, {"t": "p", "x": "override_eligible=False).expand(target=gold_targets())"}, {"t": "p", "x": "dims >> facts >> g4"}, {"t": "p", "x": "@task_group"}, {"t": "p", "x": "def publish():                                         # 67 · CROSS-DB HOP"}, {"t": "p", "x": "mv  = MovementOperator.partial(task_id=\"exchange\").expand(target=gold_targets())"}, {"t": "p", "x": "vfy = VerifyOperator.partial(task_id=\"verify\").expand(target=gold_targets())"}, {"t": "p", "x": "mv >> vfy"}, {"t": "p", "x": "g5 = GateOperator(task_id=\"g5\", gate=\"G5\", blocking=False)"}, {"t": "p", "x": "wave1 >> wave2 >> gate_batch >> stage2 >> g3 >> pre_gold() >> publish() >> g5"}, {"t": "p", "x": "hub_eod()"}, {"t": "pre", "x": "\n### Wave assignment from the domain inventory\n\n| Wave | Domains | Feeds | Role |\n|---|---|---|---|\n| **1** | Reference & Asset (3), Account & Client (5), Portfolio & Model (3) | 11 | Dimension-bearing; must land before facts resolve FKs |\n| **2** | Positions (5), Transactions (2), Fee & Billing (2), Reporting (2), Cash (1), Other (7) | 19 | Fact-bearing |\n\nSatellites (`Account Optional Fields`, `Account Supplement`, `EOD Positions Supplement`, `Asset Optional Fields`) sit in their parent's wave and must complete with it before the wave closes.\n\n### Concurrency model\n\n| Level | Bound by | Note |\n|---|---|---|\n| `max_active_runs` | 1 | One EOD run; enforced, not advisory |\n| Domain branch parallelism | Config, ≤ Oracle pool ceiling (55) | 9 branches possible; actual width is a measured number |\n| Feed parallelism within a domain | Config per domain | Large snapshots may run alone |\n| dbt threads (Stage 2 / Pre-Gold) | Component 19 | Exadata parallel budget, not cluster capacity |\n| Movement parallelism (wave 4) | Per Gold target | Bounded by the DB-link and the 12 CPU Gold box, **not** by Exadata |\n\n**The governing constraint:** pods are cheap, Oracle sessions are not. Component 55 sets the ceiling and component 52 must not autoscale past it — beyond that point additional workers queue on connections and the window gets longer, not shorter.\n\n### Cross-DAG locking\n\n```python\n# EOD, intraday (20) and replay (21) must never write the same target concurrently.\n# Airflow pools are insufficient — the lock is at target-object level.\nwith target_lock(objects=gold_targets(), holder=\"hub_eod\", ds=ds):\n    ...  # wave 3 and 4 execute inside the lock"}, {"t": "h", "x": "Task naming"}, {"t": "p", "x": "Derived from `feed_id` and `domain` so a task ID is greppable back to config: `ingest_domain[positions].ingest[positions_taxlot]`. No free-text task names."}, {"t": "h", "x": "Config surface (component 33)"}, {"t": "ul", "items": ["Domain and feed registry, with wave and parent/satellite relationships", "`PARTIAL_BATCH_POLICY` per domain", "Branch and feed concurrency limits", "EOD cadence and window budget", "Correction lookback per domain (passed to Stage 2)", "Gold target list and publish order"]}]}, {"h": "5. Data Quality, Reconciliation & Lineage", "blocks": [{"t"
