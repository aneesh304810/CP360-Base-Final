: "p", "x": "This component executes no checks; it **places** them and enforces their blocking semantics."}, {"t": "tbl", "rows": [["Gate", "Placed at", "Blocking", "Enforcement here"], ["G1 (23)", "Inside ingest, per feed", "Yes", "`retries=0`; failure fails the domain branch"], ["G2 (24)", "After RAW, per domain", "Yes", "Blocks the domain from entering wave 3"], ["G3 (25)", "During Stage 2", "Yes", "Blocks Pre-Gold"], ["**G4 (26)**", "**Pre-Gold, Exadata, per target**", "**Yes — not override-eligible**", "Blocks the cross-DB hop. `override_eligible=False` set on the operator."], ["G5 (27)", "After publish", "No", "`blocking=False`; alerts and may trigger replay"]]}, {"t": "p", "x": "**Lineage contribution:** every task records `BATCH_ID`, the `LOAD_ID` set in scope, and the config version in force. This is what lets an operator establish which run produced a given Gold partition, and what lets replay target a `LOAD_ID` set rather than a whole date."}]}, {"h": "6. RECOMMENDATION", "blocks": [{"t": "h", "x": "6.1 Central design choice"}, {"t": "p", "x": "**Is the DAG a static, hand-written task graph over the known feeds, or dynamically generated by task mapping over the feed registry?**"}, {"t": "h", "x": "6.2 Options comparison"}, {"t": "tbl", "rows": [["Option", "Description", "Pros", "Cons", "Fit to Oracle/Stage1-2 → Exadata/Gold → movement stack"], ["**A · Static DAG, one task per feed**", "~30 explicitly written ingest tasks with hand-drawn dependencies", "Immediately readable — the graph in the UI is the graph in the code. Trivial to debug a single feed. Dependencies are explicit and reviewable in a diff.", "Every feed addition, removal or wave change is a code change and a release. ~30 tasks plus gates plus waves is a large hand-maintained file that will drift from the registry. Satellite/parent relationships must be re-encoded by hand in two places.", "Workable but brittle. The tier progression is fine; the maintenance cost scales with the feed count and a tenth domain is a rewrite."], ["**B · Fully dynamic, generated at parse time from the registry** *(recommended)*", "`expand()` over domains and feeds read from config; no names in code", "Adding a feed is a config commit. Registry and DAG cannot drift — there is only one list. Satellite/parent and wave logic lives once, in config. Scales to a tenth domain without touching code.", "Harder to read in the UI; a mapped task index is less obvious than a named task. Debugging requires knowing which index maps to which feed. Parse-time config reads must be fast or the scheduler suffers.", "Strong. Matches the config-driven principle applied across 13, 23 and 28, and keeps the four-tier progression explicit at the wave level where it matters."], ["**C · Generated DAG files**", "A build step renders static DAG Python from the registry, committed and deployed", "Readable static output *and* a single source of truth. Diffable — a registry change shows as a DAG diff in review.", "Adds a generation step to CI and a deploy to every feed change, so it is not a runtime change. Generated code in the repo invites hand-editing, which silently breaks the generator. Two artefacts to keep synchronised.", "Reasonable middle ground, but reintroduces the release cycle that option B removes for a purely cosmetic gain."]]}, {"t": "h", "x": "6.3 Recommendation"}, {"t": "p", "x": "> **Recommended: Option B — fully dynamic task mapping over the feed registry in configuration.**"}, {"t": "p", "x": "Option B wins because the feed inventory is explicitly expected to change: nine domains and roughly thirty feeds today, with satellites, a tenth domain plausible, and outbound scope (AD-11) still unsettled. Option A makes every one of those changes a code release and guarantees drift between the DAG and the registry that components 13, 23 and 28 already read. Option C keeps the single source of truth but reintroduces the release cycle for no runtime benefit, and generated code in a repository is reliably hand-edited eventually."}, {"t": "p", "x": "**What it costs:** readability. A mapped task index is less legible in the Airflow UI than a named task, and debugging \"which feed is index 17?\" is a real cost at 2am. The mitigation is deterministic task-ID naming derived from `feed_id`, so IDs remain greppable back to config, plus a rendered dependency view for operators."}, {"t": "p", "x": "**Tier placement:** the DAG spans all four tiers and executes at none. That boundary is correct because orchestration must see the whole progression — particularly the Exadata → Gold hop, where it enforces that G4 completes fully before any movement task starts. Pushing sequencing down into dbt or into the ingestion framework would hide the cross-database boundary from the layer responsible for stopping at it."}, {"t": "p", "x": "**Must be confirmed for this to hold:**"}, {"t": "p", "x": "1. **Oracle connection-pool ceiling and DBA session grant (55)** — this, not cluster capacity, sets the maximum useful fan-out width. Autoscaling (52) must be capped to it."}, {"t": "p", "x": "2. **AD-5 partial-batch policy** — determines whether the branch in step 7 halts the batch or proceeds per domain, and whether consumers need a publish-completeness marker."}, {"t": "p", "x": "3. **Exadata parallel-degree budget and the EOD window measured end to end**, including the cross-DB hop in wave 4, which is likely bandwidth-bound rather than CPU-bound."}, {"t": "h", "x": "6.4 Rules respected"}, {"t": "ul", "items": ["✅ Tier boundary crisp — Stage 1/2 on Oracle, Pre-Gold assembly on Exadata, Gold publish-only, consumer hop is movement", "✅ Cross-database hop explicit — wave 4 is a distinct task group; G4 completes on Exadata before anything crosses; `LOAD_ID` lineage preserved", "✅ **AD-9** — blocking gates with `retries=0`; G4 before publish and not override-eligible", "✅ **AD-8** — no orchestration path mutates RAW", "✅ **AD-1** — Gold is Hub-owned and published to; consumer extracts are movement only", "⚠️ **AD-5 contingent** — D4 defaults to `HALT_ALL` pending decision", "⚠️ **AD-4 contingent** — D7 assumes the real-time lane stays independent of this DAG"]}]}, {"h": "7. Failure, Replay & Idempotency", "blocks": [{"t": "tbl", "rows": [["Failure", "Behaviour"], ["Sensor timeout (E1)", "Domain branch fails. Distinguishes \"late\" from \"missing\" via the manifest expected-file list."], ["Gate failure (E2–E5)", "Task fails non-retryably. Partial-batch policy decides batch-level behaviour."], ["Infrastructure (E6)", "**Only** retryable class. Bounded backoff on non-gate tasks."], ["Scheduler or worker loss", "KubernetesExecutor (51) reschedules. Idempotent tasks make this safe."], ["Movement fails mid-transfer", "Partition exchange has not occurred — Gold still serves the prior partition. Restart the movement task only."], ["Concurrent run attempt", "`max_active_runs=1` plus target-object locking rejects it."]]}, {"t": "p", "x": "**Replay (21):** replay is a separate DAG that re-enters the same task groups with a `LOAD_ID` set as scope. Because RAW is append-only (AD-8) and Pre-Gold uses bitemporal append (AD-2), replay is forward-only at every tier — a replayed domain rebuilds only its own Gold partitions and re-exchanges them."}, {"t": "p", "x": "**Idempotency:** every task is keyed on `(business_date, domain, LOAD_ID set)`. Re-running produces the same result: ingest supersedes, Stage 2 and Pre-Gold append versions, movement re-exchanges a partition. No task performs an in-place update that a re-run would double-apply."}]}, {"h": "8. Security & Access", "blocks": [{"t": "ul", "items": ["**Service accounts:** the DAG runs under a dedicated OpenShift service account (47). Task pods receive scoped identities — the ingest pod holds `INSERT` on RAW only; the movement pod holds the DB-link and partition-exchange grant only.", "**Credential separation:** Exadata and standalone-Gold credentials are distinct secrets (48). No single pod holds both beyond the movement task.", "**Airflow UI access:** read access for operators, trigger and clear rights restricted. The ability to clear a gate task is effectively an override path and must be controlled as tightly as the override authority in component 28.", "**Connections and variables:** sourced from the secret store, never from the Airflow metadata DB in plain text.", "**Audit:** run-level records — who triggered, who cleared a task, config version in force — to the lineage store (31)."]}]}, {"h": "9. Open Questions & Risks", "blocks": [{"t": "tbl", "rows": [["#", "Question / risk", "Owner", "Blocks"], ["1", "Oracle pool ceiling and DBA max sessions", "DBA (55)", "Fan-out width; autoscaling cap in 52"], ["2", "**AD-5** partial-batch policy", "ARB", "D4; publish-completeness marker for consumers"], ["3", "**AD-4** intraday lane placement", "ARB", "D7; cross-DAG locking scope; component 20"], ["4", "Exadata → Gold bandwidth and nightly delta volume", "BBH infra", "Wave 4 duration; likely the EOD bottleneck"], ["5", "EOD window budget end to end, measured", "BBH ops", "Whether waves 1 and 2 can remain serialised"], ["6", "Who may clear a failed gate task in the Airflow UI?", "BBH ops + risk", "This is an override path in practice; must align with 28"], ["7", "Confirmed wave assignment per domain", "SEI + BBH", "D3; whether Other (7 feeds) splits across waves"], ["8", "Satellite completion semantics — must a parent wait for its satellites?", "SEI + BBH", "Branch closure logic; assembly correctness in 66"]]}]}, {"h": "10. Acceptance Criteria", "blocks": [{"t": "p", "x": "**Design complete when:**"}, {"t": "ul", "items": ["[ ] Wave assignment agreed for all 9 domains, including where the Other domain's 7 feeds sit", "[ ] Satellite-to-parent completion semantics specified", "[ ] Concurrency limits defined per level, with the Oracle pool ceiling as the binding constraint", "[ ] Cross-DAG locking design agreed across EOD, intraday and replay", "[ ] Gate placement confirmed, with `override_eligible=False` on G4", "[ ] Task-ID naming convention agreed and traceable to `feed_id`", "[ ] Partial-batch branch behaviour specified for both AD-5 outcomes"]}, {"t": "p", "x": "**Build complete when:**"}, {"t": "ul", "items": ["[ ] No feed, domain or table name appears anywhere in DAG code — verified by inspection", "[ ] Adding a feed to the registry changes the DAG shape with **no code change**, demonstrated", "[ ] A gate failure demonstrably does not retry, and fails the correct branch only", "[ ] G4 failure leaves Gold on its prior partition, verified by query across the failure", "[ ] Wave 2 provably cannot start before wave 1 completes", "[ ] Concurrent EOD and intraday runs against the same target are rejected by the lock", "[ ] Full EOD run across all 9 domains completes inside the agreed window, measured on production-shaped volume", "[ ] Replay of one domain's `LOAD_ID` set rebuilds only that domain's Gold partitions"]}]}]}, {"id": "c23", "title": "G1 File / Structural Gate", "level": "L3", "icon": "📐", "color": "#0f4775", "bg": "#e6eef5", "order": 123, "sub": "#23 · 2. Hub · Data Quality · Python · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["23"], "chip": "#23 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["8", "9", "13", "28", "29", "33"], "decisions": ["AD-9", "AD-8", "AD-10", "AD-5"], "tiers": ["Stage1-Oracle"], "updated": "2026-08-10"}, "src": "23_G1_File_Structural_Gate_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "G1 is the first and only gate that runs before data enters the platform. It validates that a delivered file is structurally what the feed registry says it should be — encoding, delimiter, column count, header, row count against the manifest, checksum — and blocks the RAW insert if it is not. Its single deliverable is a **rule-driven validation engine embedded in the ingestion framework**, executing during the same streaming pass that loads the file."}, {"t": "p", "x": "It is the only gate whose failure leaves zero rows in the platform. Every gate after it operates on data already stored; G1 decides whether storage happens at all."}, {"t": "p", "x": "**Tiers touched:** Stage 1 Oracle, pre-insert. It has no visibility of Stage 2, Exadata Pre-Gold or the consumer tier."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "tbl", "rows": [["ID", "Component", "Why required"], ["13", "Python ingestion framework", "Host. G1 executes inside the streaming read, not as a separate pass"], ["8", "Landing Zone + transport", "Supplies the file and manifest"], ["9", "File arrival sensors", "Supplies the manifest completeness signal"], ["33", "Config store", "Column layout per feed, expected encoding and delimiter, G1 rule set, per-feed severity"], ["28", "DQ framework", "Rule resolution, severity, results store, override eligibility"], ["29", "Error handling & quarantine", "Error events; quarantine store; resubmission path"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["**14 Stage 1 RAW** — the insert G1 gates", "**22 Partial-batch policy** — decides batch behaviour on a G1 failure", "**21 Replay** — a resubmitted file re-enters through G1"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  8 Landing ──▶ 9 Sensor ──▶ ┌─── 13 Ingestion framework ───┐\n                             │   23 G1 GATE (streaming)      │\n                             │   BLOCKS the insert           │\n                             └──────┬────────────┬───────────┘\n                                    │ fail       │ pass\n                                    ▼            ▼\n                          29 Quarantine     14 Stage 1 RAW (Oracle)\n                          zero rows in RAW        │\n                                                  ▼\n                             15 Stage 2 ──▶ 66 Pre-Gold [Exadata] ──▶ Gold"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Where does G1 execute?**"}, {"t": "p", "x": "**Decision:** Inside the ingestion framework's streaming pass, not as a separate read."}, {"t": "p", "x": "**Rationale:** The largest feeds — Taxlot, EOD Position, Account, Client, Asset — cannot afford a second full read inside the EOD window."}, {"t": "p", "x": "**Consequence:** Per-row checks run during the stream; whole-file checks complete at end of stream, before commit. The insert is committed only after G1 passes in full."}, {"t": "p", "x": "**D2 · What blocks — the file or the row?**"}, {"t": "p", "x": "**Decision:** The file. G1 is a file-level gate."}, {"t": "p", "x": "**Rationale:** A structural failure means the file's shape does not match the contract; individual rows cannot be trusted to have been parsed into the right columns."}, {"t": "p", "x": "**Consequence:** Row-level quarantine applies only to the narrow case where a row cannot be split into columns at all — a ragged delimiter or embedded newline — and does not by itself fail the file unless it breaches a configured tolerance."}, {"t": "p", "x": "**D3 · Are type violations G1's concern?**"}, {"t": "p", "x": "**Decision:** No. G1 checks structure, not content. A non-numeric amount loads to RAW as text."}, {"t": "p", "x": "**Rationale:** RAW columns are all `VARCHAR2` precisely so evidence is preserved. Rejecting on content at G1 destroys it."}, {"t": "p", "x": "**Consequence:** G1 may *report* type violations as `WARN` for early visibility, but never blocks on them. Content is G2's and G3's business."}, {"t": "p", "x": "**D4 · Is G1 override-eligible?**"}, {"t": "p", "x": "**Decision:** Yes, but rarely appropriate."}, {"t": "p", "x": "**Rationale:** A structural failure usually means the file cannot be parsed, so there is nothing to proceed with. Override applies to gates that fail on *content*; a column-count mismatch has no meaningful \"proceed anyway\"."}, {"t": "p", "x": "**Consequence:** The override path exists for the narrow case of a tolerable soft breach — for example, a volume-vs-manifest variance within an agreed margin. It is not the remediation path for a layout change."}, {"t": "p", "x": "**D5 · Manifest-driven or filename-driven?**"}, {"t": "p", "x": "**Decision:** Manifest-driven where a manifest exists; filename pattern as fallback."}, {"t": "p", "x": "**Rationale:** Distinguishing \"late\" from \"missing\" requires an expected-file list. Without it, the sensor and G1 are both guessing on a timeout."}, {"t": "p", "x": "**Consequence:** **Contingent on AD-10** and on the manifest format, which SEI has not specified."}, {"t": "p", "x": "**D6 · Quarantine — move or copy?**"}, {"t": "p", "x": "**Decision:** Copy. The landing zone retains its own copy under its own retention."}, {"t": "p", "x": "**Rationale:** An operator answering \"what did SEI actually send?\" should never depend on the quarantine process having worked correctly."}, {"t": "p", "x": "**Consequence:** Storage duplication for failed files, accepted as cheap insurance."}, {"t": "p", "x": "**D7 · Retry on failure?**"}, {"t": "p", "x": "**Decision:** Never. `retries=0`; the ingest task raises a non-retryable exception type."}, {"t": "p", "x": "**Rationale:** The file is unchanged, so the outcome is unchanged. Retrying burns the window and makes a real structural problem look like flakiness."}, {"t": "p", "x": "**Consequence:** Only class E6 (infrastructure) retries, and that is a different failure path entirely."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart LR"}, {"t": "p", "x": "subgraph EXT[\"EXTERNAL — SEI / SWP, out of scope\"]"}, {"t": "p", "x": "SEI[\"SWP extract job<br/>~30 feeds, 9 domains<br/>file + manifest contract\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph IN[\"Ingress\"]"}, {"t": "p", "x": "LZ[\"8 Landing Zone<br/>sFTP · AD-10\"]"}, {"t": "p", "x": "SEN[\"9 Sensors<br/>manifest-aware\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph GATE[\"23 G1 GATE — inside 13, streaming\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "RS[\"Rule resolver<br/>from 33, as-of date\"]"}, {"t": "p", "x": "PR[\"Per-row checks<br/>column count · delimiter<br/>encoding · ragged line\"]"}, {"t": "p", "x": "EOS[\"End-of-stream checks<br/>row count vs manifest<br/>checksum · header · file date\"]"}, {"t": "p", "x": "VD[\"Verdict<br/>severity from 28\"]"}, {"t": "p", "x": "RS --> PR --> EOS --> VD"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph DOM[\"Feeds gated — all 9 domains\"]"}, {"t": "p", "x": "D[\"Account &amp; Client (5) · Positions (5)<br/>Other (7) · Fee &amp; Billing (2)<br/>Portfolio &amp; Model (3) · Reporting (2)<br/>Reference &amp; Asset (3) · Transactions (2) · Cash (1)\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph PASS[\"Pass path\"]"}, {"t": "p", "x": "STAMP[\"stamp LOAD_ID<br/>+ 8 audit columns\"]"}, {"t": "p", "x": "RAW[\"14 Stage 1 RAW (Oracle)<br/>commit AFTER G1 passes\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FAIL[\"Fail path\"]"}, {"t": "p", "x": "QF[\"29 Quarantine<br/>file COPIED, not moved\"]"}, {"t": "p", "x": "EV[\"29 Error event<br/>E2 · BLOCK_FILE\"]"}, {"t": "p", "x": "PB[\"22 Partial-batch<br/>HALT_ALL | PROCEED\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FDN[\"Foundation\"]"}, {"t": "p", "x": "CFG[\"33 Config<br/>layout · encoding · rules\"]"}, {"t": "p", "x": "DQ[\"28 DQ framework<br/>severity · results\"]"}, {"t": "p", "x": "I360[\"35 Integration360\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph DOWN[\"Downstream tiers — never reached on failure\"]"}, {"t": "p", "x": "S2[\"15 Stage 2 (Oracle)\"]"}, {"t": "p", "x": "PG[\"66 Pre-Gold (Exadata)\"]"}, {"t": "p", "x": "GD[\"Gold → PBDW · IMDS · Pivotal\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "SEI -.->|\"file contract\"| LZ"}, {"t": "p", "x": "LZ --> SEN --> RS"}, {"t": "p", "x": "D -.-> RS"}, {"t": "p", "x": "CFG -.-> RS"}, {"t": "p", "x": "DQ -.-> VD"}, {"t": "p", "x": "VD -->|\"PASS\"| STAMP --> RAW --> S2 --> PG --> GD"}, {"t": "p", "x": "VD -->|\"FAIL\"| QF & EV"}, {"t": "p", "x": "EV --> PB & I360"}, {"t": "p", "x": "classDef ext stroke-dasharray:5 5,stroke:#A82316,color:#A82316"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "classDef block stroke:#A82316,stroke-width:2px"}, {"t": "p", "x": "class SEI,EXT ext"}, {"t": "p", "x": "class RS,PR,EOS,VD focal"}, {"t": "p", "x": "class QF,EV block"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant SEN as 9 Sensor\n  participant FW as 13 Ingestion\n  participant G1 as 23 G1\n  participant CFG as 33 Config\n  participant DQ as 28 DQ framework\n  participant Q as 29 Quarantine\n  participant RAW as 14 RAW\n\n  SEN->>FW: file arrived — feed_id, path, manifest entry\n  FW->>CFG: feed spec AS OF business_date\n  CFG-->>FW: layout · encoding · delimiter · G1 rule set\n  FW->>G1: open gate for this LOAD_ID\n  G1->>G1: header check — column count and names vs layout\n  loop streaming pass (single read)\n    FW->>G1: row\n    G1->>G1: column count · delimiter integrity · encoding\n    G1->>G1: accumulate count, checksum, ragged-line tally\n  end\n  G1->>G1: end of stream — row count vs manifest, checksum, file date\n  G1->>DQ: evaluate results, resolve severity per feed\n  DQ-->>G1: verdict + severity (never passed in)\n  alt any ERROR severity\n    G1->>DQ: valid override for this scope?\n    alt override present\n      DQ-->>G1: consume token, tag OVERRIDDEN\n      G1-->>FW: PASS under override\n    else no override\n      G1->>Q: COPY file to quarantine + failure report\n      G1-->>FW: NonRetryableHubError\n      FW-->>SEN: BLOCK — zero rows in RAW, no retry\n    end\n  else all pass (or WARN only)\n    G1-->>FW: PASS\n    FW->>RAW: stamp audit columns, direct-path load, COMMIT\n  end"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Sensor (9)** → file arrived → invokes the ingestion framework with `feed_id`, path and manifest entry"}, {"t": "p", "x": "2. **Framework (13)** → reads the feed spec from config (33) as of the business date → layout, encoding, delimiter, G1 rule set"}, {"t": "p", "x": "3. **G1 (23)** → opens for this `LOAD_ID` → header check: column count and names against the registered layout"}, {"t": "p", "x": "4. **Streaming pass** → per-row checks during the **single read**: column count, delimiter integrity, encoding validity, ragged-line detection"}, {"t": "p", "x": "5. **G1 (23)** → accumulates in the same pass: row count, file checksum, ragged-line tally → no second read"}, {"t": "p", "x": "6. **End of stream** → whole-file checks: row count against manifest, checksum, `FILE_DATE` against `BUSINESS_DATE`"}, {"t": "p", "x": "7. **DQ framework (28)** → resolves severity per feed from the registry → **never passed by the caller**"}, {"t": "p", "x": "8. **ERROR severity, override present** → token consumed, rows tagged `OVERRIDDEN` → gate passes"}, {"t": "p", "x": "9. **ERROR severity, no override** → file **copied** to quarantine with a failure report → non-retryable exception → **zero rows in RAW**, no retry"}, {"t": "p", "x": "10. **Partial-batch policy (22)** → decides whether the batch halts or the other 8 domains proceed"}, {"t": "p", "x": "11. **Pass, or WARN only** → framework stamps `LOAD_ID` and the 8 audit columns → direct-path load → **commit happens only now**"}, {"t": "p", "x": "12. **RAW committed** → domain branch released → G2, then Stage 2, then Pre-Gold assembly on Exadata"}, {"t": "p", "x": "**No cross-database hop in this component.** A G1 failure means nothing ever reaches the Exadata → Gold hop."}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Rule catalogue"}, {"t": "tbl", "rows": [["Rule ID", "Check", "Scope", "Default severity", "Error code"], ["`G1_ENCODING`", "File decodes in the declared encoding", "Per row + file", "ERROR", "`E2_ENCODING_INVALID`"], ["`G1_DELIMITER`", "Delimiter present and consistent", "Per row", "ERROR", "`E2_DELIMITER_INVALID`"], ["`G1_COLUMN_COUNT`", "Column count matches registered layout", "Per row", "ERROR", "`E2_COLUMN_COUNT_MISMATCH`"], ["`G1_HEADER`", "Header names and order match layout", "Header", "ERROR", "`E2_HEADER_MISMATCH`"], ["`G1_RAGGED_TOLERANCE`", "Unparseable rows within tolerance", "File", "ERROR above threshold", "`E2_RAGGED_ROWS`"], ["`G1_MANIFEST_COUNT`", "Row count matches manifest", "File", "ERROR", "`E2_MANIFEST_COUNT_MISMATCH`"], ["`G1_CHECKSUM`", "File checksum matches manifest", "File", "ERROR", "`E2_CHECKSUM_MISMATCH`"], ["`G1_FILE_DATE`", "`FILE_DATE` consistent with `BUSINESS_DATE`", "File", "ERROR", "`E2_FILE_DATE_MISMATCH`"], ["`G1_EMPTY_FILE`", "File has ≥1 data row", "File", "ERROR (WARN for some feeds)", "`E2_EMPTY_FILE`"], ["`G1_VOLUME_VARIANCE`", "Row count within margin of trailing average", "File", "WARN", "`E2_VOLUME_VARIANCE`"], ["`G1_TYPE_PROBE`", "Sampled type-parse rate", "File", "**WARN only** (D3)", "`E3_TYPE_PROBE`"]]}, {"t": "p", "x": "Severity is per-rule-per-feed. `G1_EMPTY_FILE` is the clearest case: an empty `Recurring Cash Activity` may be normal on a quiet day; an empty `Account` snapshot is not."}, {"t": "h", "x": "Execution model"}, {"t": "p", "x": "```python"}, {"t": "p", "x": "class G1Gate:"}, {"t": "p", "x": "def __init__(self, spec: FeedSpec, load_id: int):"}, {"t": "p", "x": "self.rules = dq.resolve_rules(gate=\"G1\", feed_id=spec.feed_id,"}, {"t": "p", "x": "business_date=spec.business_date)"}, {"t": "p", "x": "self.acc = Accumulator()          # count, checksum, ragged tally"}, {"t": "p", "x": "def check_header(self, header: list[str]) -> None:"}, {"t": "p", "x": "\"\"\"Fails fast — a header mismatch means the whole file is wrong shape.\"\"\""}, {"t": "p", "x": "def check_row(self, raw_line: str, ordinal: int) -> RowVerdict:"}, {"t": "p", "x": "\"\"\"Per-row structural checks. Returns PARSE_OK | RAGGED."}, {"t": "p", "x": "RAGGED rows go to row-level quarantine and increment the tally;"}, {"t": "p", "x": "they do not by themselves fail the file unless tolerance is breached.\"\"\""}, {"t": "p", "x": "def finalise(self, manifest: Manifest) -> GateResult:"}, {"t": "p", "x": "\"\"\"End-of-stream: manifest count, checksum, file date, tolerances."}, {"t": "p", "x": "Delegates severity resolution to 28 — severity is never local.\"\"\""}, {"t": "pre", "x": "\n### Quarantine layout on failure\n"}, {"t": "p", "x": "/quarantine/{domain}/{business_date}/{load_id}/"}, {"t": "p", "x": "original/    taxlot_20260807.csv       ← byte-identical COPY (D6)"}, {"t": "p", "x": "manifest/    taxlot_20260807.manifest"}, {"t": "p", "x": "report/      g1_failures.json          ← rule, expected, actual, sample rows"}, {"t": "p", "x": "meta.json                              ← load_id, batch_id, error_ids, timestamps"}]}]}, {"id": "c26", "title": "G4 Tie-out / Control Totals", "level": "L3", "icon": "📐", "color": "#0f4775", "bg": "#e6eef5", "order": 126, "sub": "#26 · 2. Hub · Data Quality · Airflow + SQL · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["26"], "chip": "#26 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["13", "14", "17", "28", "29", "30", "31", "33", "66", "67"], "decisions": ["AD-9", "AD-1", "AD-2", "AD-8"], "tiers": ["Stage3-Exadata-Gold", "Consumer-Movement"], "updated": "2026-08-10"}, "src": "26_G4_Tieout_Gate_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "G4 is the last check before data leaves Exadata. It reconciles assembled Pre-Gold output back to Stage 1 RAW — row counts, control totals, version counts — per Gold target object, and blocks the cross-database movement into Gold if any target fails. Its single deliverable is a **per-target reconciliation rule set plus the blocking task that gates the publish**."}, {"t": "p", "x": "It is the gate that did not exist in either source deck. SEI v5 placed its only DQ step after the Gold load, where it stops nothing: by the time it fires, data is already in the consumer tier. G4 exists because a check that runs after the damage is a report, not a control."}, {"t": "p", "x": "**Tiers touched:** executes entirely on Stage 3 Exadata Pre-Gold. It gates the Exadata → Gold hop and therefore the consumer-movement tier, but performs no work there."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "tbl", "rows": [["ID", "Component", "Why required"], ["66", "Pre-Gold", "Host. G4 runs after assembly, before staging tables are handed to movement"], ["14", "Stage 1 RAW", "One side of the reconciliation — via captured metadata, not a rescan"], ["13", "Ingestion framework", "Supplies the per-`LOAD_ID` row counts and checksums captured at ingest"], ["17", "Correction handling", "Version counts are part of the tie-out"], ["33", "Config store", "Per-target rule sets, control-total definitions, tolerances"], ["28", "DQ framework", "Severity, results store — and the override exclusion"], ["29, 30", "Error handling, recon", "Error events and exception lifecycle"], ["31", "Audit & lineage", "`LOAD_ID` chain is what makes the comparison possible"], ["67", "Movement", "The component G4 gates"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["**67 Movement** — runs only if G4 passes for that target", "**21 Replay** — a G4 failure raises a replay candidate", "**35 Integration360** — tie-out breaks surface as exceptions"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  14 RAW (Oracle) ──▶ 15 Stage 2 (Oracle) ──▶ 66 Pre-Gold (Exadata)\n     │  captured                                      │\n     │  LOAD_ID counts ─────────────────────────────▶ │\n     │  (lookup, not rescan)                          ▼\n     │                                    ┌── 26 G4 TIE-OUT ──┐\n     │                                    │  both sides LOCAL  │\n     │                                    │  per target object │\n     │                                    │  BLOCKING          │\n     │                                    └────────┬───────────┘\n     │                                       pass  │  fail\n     │                                             ▼      ▼\n     │                              67 CROSS-DB HOP    Gold holds\n     │                              Exadata → Gold     prior partition\n     │                                     ▼\n     │                        Gold (standalone) ──▶ PBDW · IMDS · Pivotal"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Which side of the hop does G4 run on?**"}, {"t": "p", "x": "**Decision:** Exadata, before movement. Both sides of the comparison are local."}, {"t": "p", "x": "**Rationale:** A tie-out spanning two databases over a DB-link, inside the EOD window, is materially slower and introduces a failure mode — link unavailability — unrelated to data quality."}, {"t": "p", "x": "**Consequence:** What crosses to Gold is already reconciled. Component 67's post-move check reduces to a row-count verify, which is the right amount of work for a 12 CPU / 64 GB box."}, {"t": "p", "x": "**D2 · Rescan or captured metadata?**"}, {"t": "p", "x": "**Decision:** Compare against per-`LOAD_ID` counts and checksums captured at ingest (13), not `COUNT(*)` over RAW."}, {"t": "p", "x": "**Rationale:** A rescan of RAW for ~30 feeds inside the EOD window is the difference between an affordable blocking gate and an unaffordable one. The count was already computed during G1's streaming pass."}, {"t": "p", "x": "**Consequence:** Correctness depends on the captured count being accurate — which is itself an acceptance criterion on component 13."}, {"t": "p", "x": "**D3 · Granularity — batch or per target?**"}, {"t": "p", "x": "**Decision:** Per Gold target object, evaluated in parallel."}, {"t": "p", "x": "**Rationale:** A break in `FACT_FEE` should not block the publish of `DIM_ACCOUNT`. Per-target evaluation matches the per-target movement design in 67."}, {"t": "p", "x": "**Consequence:** Partial publish becomes possible, which interacts with **AD-5**. The default remains that a failure blocks only its own target's movement."}, {"t": "p", "x": "**D4 · Is G4 override-eligible?**"}, {"t": "p", "x": "**Decision:** No. Excluded at the DQ framework service and enforced by a schema constraint."}, {"t": "p", "x": "**Rationale:** A tie-out break means Pre-Gold does not reconcile to RAW. Overriding publishes knowingly-unreconciled figures across the hop into Gold and onward to PBDW's ~1,000 consumers. No downstream control catches it."}, {"t": "p", "x": "**Consequence:** Requires explicit ARB ratification. If the business genuinely needs to publish, that is a decision recorded outside the pipeline."}, {"t": "p", "x": "**D5 · What is reconciled?**"}, {"t": "p", "x": "**Decision:** Three classes — row counts, control totals on monetary and quantity measures, and version counts for bitemporal objects."}, {"t": "p", "x": "**Rationale:** Row count alone catches loss but not corruption. A control total catches a mis-scaled amount. Version counts catch a broken correction chain."}, {"t": "p", "x": "**Consequence:** Control totals must be defined per target with agreed tolerances; a floating-point sum needs a tolerance, an integer count does not."}, {"t": "p", "x": "**D6 · Tolerance policy.**"}, {"t": "p", "x": "**Decision:** Zero tolerance on row and version counts. Configurable tolerance on monetary control totals, defaulting to exact."}, {"t": "p", "x": "**Rationale:** A row count is exactly right or wrong. A sum over `NUMBER` in Oracle is exact, but derived measures involving FX conversion may legitimately differ in the last place."}, {"t": "p", "x": "**Consequence:** Any non-zero tolerance must be justified per target and reviewed, not set as a convenience."}, {"t": "p", "x": "**D7 · What about filtered rows?**"}, {"t": "p", "x": "**Decision:** G4 accounts for every RAW row: loaded, superseded, flagged, or legitimately excluded. Excluded rows must be attributable to a named rule."}, {"t": "p", "x": "**Rationale:** This is why Stage 2 flags rather than filters. A row silently dropped in Stage 2 makes G4 fail for a reason nobody can see."}, {"t": "p", "x": "**Consequence:** The reconciliation is a full accounting, not a simple equality — expected = loaded − superseded − rule-excluded."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart TB"}, {"t": "p", "x": "subgraph S1[\"Stage 1 (Oracle)\"]"}, {"t": "p", "x": "RAW[\"14 RAW · ~30 tables\"]"}, {"t": "p", "x": "META[\"captured at ingest (13)<br/>row count + checksum<br/>PER LOAD_ID<br/>lookup, NOT rescan\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S2[\"Stage 2 (Oracle)\"]"}, {"t": "p", "x": "STG[\"15 conformed models<br/>flags, never filters\"]"}, {"t": "p", "x": "COR[\"17 version chain\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S3[\"Stage 3 — PRE-GOLD (Exadata)\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "ASM[\"66 assembled objects<br/>dims · facts · bitemporal\"]"}, {"t": "p", "x": "G4[\"26 G4 TIE-OUT<br/>both sides LOCAL\"]"}, {"t": "p", "x": "RC[\"row count<br/>zero tolerance\"]"}, {"t": "p", "x": "CT[\"control totals<br/>monetary · quantity\"]"}, {"t": "p", "x": "VC[\"version counts<br/>bitemporal chain\"]"}, {"t": "p", "x": "EX[\"excluded-row accounting<br/>every row attributable\"]"}, {"t": "p", "x": "STGT[\"publish staging tables<br/>built ONLY on pass\"]"}, {"t": "p", "x": "ASM --> G4"}, {"t": "p", "x": "G4 --> RC & CT & VC & EX"}, {"t": "p", "x": "RC & CT & VC & EX --> STGT"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph HOP[\"CROSS-DATABASE HOP\"]"}, {"t": "p", "x": "MV[\"67 Movement<br/>DB-link direct-path APPEND<br/>partition exchange\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph GD[\"Gold (standalone 12 CPU / 64 GB)\"]"}, {"t": "p", "x": "GOLD[\"16 Gold<br/>publish-only\"]"}, {"t": "p", "x": "VFY[\"post-move verify<br/>row count ONLY<br/>cheap by design\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph CN[\"Consumers (movement only)\"]"}, {"t": "p", "x": "PB[\"37 PBDW<br/>~1,000 consumers\"]"}, {"t": "p", "x": "IM[\"38 IMDS\"]"}, {"t": "p", "x": "PV[\"39 Pivotal\"]"}, {"t": "p", "x": "G5[\"27 G5 · advisory\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FDN[\"Foundation\"]"}, {"t": "p", "x": "CFG[\"33 Config<br/>per-target rules · tolerances\"]"}, {"t": "p", "x": "DQ[\"28 DQ framework<br/>G4 NOT override-eligible\"]"}, {"t": "p", "x": "RCN[\"30 Recon · exceptions\"]"}, {"t": "p", "x": "RPL[\"21 Replay candidate\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "META -.->|\"lookup\"| G4"}, {"t": "p", "x": "RAW --> STG --> COR --> ASM"}, {"t": "p", "x": "CFG -.-> G4"}, {"t": "p", "x": "DQ -.-> G4"}, {"t": "p", "x": "G4 -->|\"FAIL\"| RCN & RPL"}, {"t": "p", "x": "STGT ==>|\"only reconciled data crosses\"| MV --> GOLD --> VFY"}, {"t": "p", "x": "GOLD --> PB & IM & PV"}, {"t": "p", "x": "PB -.-> G5"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "classDef block stroke:#A82316,stroke-width:3px"}, {"t": "p", "x": "class ASM,RC,CT,VC,EX,STGT focal"}, {"t": "p", "x": "class G4,HOP,MV block"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant AF as 18 Airflow\n  participant PG as 66 Pre-Gold (Exadata)\n  participant G4 as 26 G4\n  participant META as Ingest metadata (13/31)\n  participant DQ as 28 DQ framework\n  participant MV as 67 Movement\n  participant GD as Gold (standalone)\n\n  AF->>PG: assembly complete for target object\n  AF->>G4: evaluate tie-out for this target (parallel per target)\n  G4->>META: fetch captured row counts by LOAD_ID\n  META-->>G4: counts + checksums (lookup, no RAW scan)\n  G4->>PG: aggregate assembled rows — LOCAL to Exadata\n  G4->>G4: row count · control totals · version counts\n  G4->>G4: account for excluded rows — every row attributable to a rule\n  G4->>DQ: persist results, resolve severity\n  alt any target fails\n    DQ-->>G4: no override possible — G4 excluded\n    G4-->>AF: BLOCK this target\n    Note over G4,GD: Gold retains its PRIOR partition.<br/>Nothing crosses the hop for this target.\n    G4->>AF: raise exception (30) + replay candidate (21)\n  else target passes\n    G4->>PG: build publish staging table, partition-ready\n    G4-->>AF: PASS\n    AF->>MV: CROSS-DB HOP — DB-link direct-path APPEND\n    MV->>GD: partition exchange, atomic swap\n    MV->>MV: post-move verify — row count only\n    GD-->>AF: published; release consumer extracts\n  end"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Airflow (18)** → Pre-Gold assembly complete for a target object → invokes G4 for that target, in parallel with other targets"}, {"t": "p", "x": "2. **G4 (26)** → fetches captured row counts and checksums by `LOAD_ID` from ingest metadata (13, 31) → **a lookup, not a RAW scan**"}, {"t": "p", "x": "3. **G4 (26)** → aggregates the assembled Pre-Gold rows → **local to Exadata, using Smart Scan and parallel query**"}, {"t": "p", "x": "4. **Row count check** → expected = loaded − superseded − rule-excluded, per `LOAD_ID` → zero tolerance"}, {"t": "p", "x": "5. **Control totals** → monetary and quantity sums against RAW-derived expectations → tolerance per target from config, defaulting to exact"}, {"t": "p", "x": "6. **Version counts** → bitemporal chain length preserved from Stage 2 → catches a broken correction chain"}, {"t": "p", "x": "7. **Excluded-row accounting** → every RAW row not present must be attributable to a named rule → an unattributable gap is a failure"}, {"t": "p", "x": "8. **DQ framework (28)** → results persisted, severity resolved → **no override is possible; G4 is excluded at the service and by schema constraint**"}, {"t": "p", "x": "9. **Any target fails** → that target is blocked. **Gold retains its prior partition.** Exception raised (30), replay candidate flagged (21)"}, {"t": "p", "x": "10. **Target passes** → Pre-Gold builds the publish staging table, partition-ready, in Gold's exact DDL shape"}, {"t": "p", "x": "11. **Movement (67)** → **CROSS-DATABASE HOP: Exadata → standalone Gold** → DB-link direct-path `APPEND`, then partition exchange"}, {"t": "p", "x": "12. **Post-move verify** → row count only, against the Pre-Gold source count → **cheap by design, because the real reconciliation already happened**"}, {"t": "p", "x": "13. **Consumer extracts** released → PBDW, IMDS Stage → IMDS, Pivotal → movement only"}, {"t": "p", "x": "14. **G5 (27)** → advisory post-publish recon → alerts and may trigger replay; blocks nothing"}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Reconciliation classes"}, {"t": "tbl", "rows": [["Class", "Compares", "Tolerance", "Catches"], ["Row count", "Captured RAW counts by `LOAD_ID` vs assembled rows", "**Zero**", "Loss, duplication, join fan-out"], ["Control total — monetary", "Sum of amount measures", "Per target, default exact", "Mis-scaling, unit errors, FX misapplication"], ["Control total — quantity", "Sum of quantity measures", "Per target, default exact", "Sign errors, aggregation faults"], ["Version count", "Bitemporal chain length", "**Zero**", "Broken correction chain, lost versions"], ["Distinct key count", "Natural keys represented", "**Zero**", "Silent key collapse in dimensional assembly"], ["Excluded-row accounting", "Every RAW row attributable", "**Zero unattributed**", "Silent Stage 2 filtering"]]}, {"t": "h", "x": "The accounting identity"}, {"t": "pre", "x": "  For each target object and business date:\n\n    assembled_rows\n  + superseded_rows          (redelivery, INGESTION_STATUS = 'SUPERSEDED')\n  + rule_excluded_rows       (attributable to a NAMED rule, from DQ results)\n  + orphan_parked_rows       (ORPHAN_CORRECTION, awaiting lookback)\n  ─────────────────────────\n  = captured_raw_rows        (per LOAD_ID, from ingest metadata)\n\n  Any residual is a FAILURE. There is no \"acceptable difference\" bucket —\n  an unexplained row is exactly the condition this gate exists to catch."}, {"t": "h", "x": "Rule definition"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "-- config-driven per target. This is the shape, not a hand-written query."}, {"t": "p", "x": "-- Executes on EXADATA. Both operands local — no DB-link involved."}, {"t": "p", "x": "WITH expected AS (                         -- from captured metadata, NOT a RAW scan"}, {"t": "p", "x": "SELECT load_id, row_count, control_sum_amount"}, {"t": "p", "x": "FROM   HUB_INGEST_PROFILE"}, {"t": "p", "x": "WHERE  business_date = :bd"}, {"t": "p", "x": "AND  feed_id IN ( :feeds_for_target )"}, {"t": "p", "x": "),"}, {"t": "p", "x": "actual AS (                                -- local aggregate on Pre-Gold"}, {"t": "p", "x": "SELECT src_load_id AS load_id,"}, {"t": "p", "x": "COUNT(*)                    AS row_count,"}, {"t": "p", "x": "SUM(amount)                 AS control_sum_amount,"}, {"t": "p", "x": "COUNT(DISTINCT record_version) AS version_count"}, {"t": "p", "x": "FROM   PG_FACT_TRANSACTION"}, {"t": "p", "x": "WHERE  src_business_date = :bd"}, {"t": "p", "x": "GROUP  BY src_load_id"}, {"t": "p", "x": "),"}, {"t": "p", "x": "excluded AS (                              -- attributable exclusions only"}, {"t": "p", "x": "SELECT load_id, SUM(rows_affected) AS excluded_rows, LISTAGG(rule_id, ',') AS rules"}, {"t": "p", "x": "FROM   HUB_DQ_RESULT"}, {"t": "p", "x": "WHERE  business_date = :bd AND route = 'FLAG_ROW' AND outcome = 'FAIL'"}, {"t": "p", "x": "GROUP  BY load_id"}, {"t": "p", "x": ")"}, {"t": "p", "x": "SELECT e.load_id,"}, {"t": "p", "x": "e.row_count                                   AS expected_rows,"}, {"t": "p", "x": "NVL(a.row_count,0) + NVL(x.excluded_rows,0)   AS accounted_rows,"}, {"t": "p", "x": "e.row_count - (NVL(a.row_count,0) + NVL(x.excluded_rows,0)) AS residual,"}, {"t": "p", "x": "x.rules                                       AS exclusion_reasons"}, {"t": "p", "x": "FROM   expected e"}, {"t": "p", "x": "LEFT   JOIN actual   a ON a.load_id = e.load_id"}, {"t": "p", "x": "LEFT   JOIN excluded x ON x.load_id = e.load_id"}, {"t": "p", "x": "WHERE  e.row_count <> NVL(a.row_count,0) + NVL(x.excluded_rows,0);"}, {"t": "p", "x": "-- any row returned = tie-out break"}]}]}, {"id": "c28", "title": "DQ Framework", "level": "L3", "icon": "📐", "color": "#0f4775", "bg": "#e6eef5", "order": 128, "sub": "#28 · 2. Hub · Data Quality · Python · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["28"], "chip": "#28 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["29", "30", "31", "33", "35"], "decisions": ["AD-9", "AD-2", "AD-5", "AD-6"], "tiers": ["Stage1-Oracle", "Stage2-Oracle", "Stage3-Exadata-Gold", "Consumer-Movement"], "updated": "2026-08-10"}, "src": "28_DQ_Framework_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "The DQ framework is the machinery all five gates run on: the rule registry, the severity model, the results store, and the override path. Its single deliverable is **one Python framework plus its Oracle schema** that makes G1 through G5 behave identically regardless of which tier they execute on — Stage 1 Oracle, Stage 2 Oracle, Stage 3 Exadata, or the consumer-movement verify."}, {"t": "p", "x": "It exists as a separate component because gates without a shared framework diverge. Five independently-built checks produce five error formats, five severity conventions and five override behaviours, and the operator cannot reason about any of them."}, {"t": "p", "x": "**Tiers touched:** all four. The framework is tier-agnostic by design — a rule executed against RAW on Oracle and a tie-out executed against Pre-Gold on Exadata produce the same result record with the same severity semantics."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "tbl", "rows": [["ID", "Component", "Why required"], ["33", "Metadata & config store", "Rule definitions, per-feed severities, thresholds, override thresholds"], ["29", "Error handling & quarantine", "Receives error events raised by failing rules; owns quarantine"], ["30", "Reconciliation framework", "Consumes tie-out results; owns exception lifecycle"], ["31", "Audit & lineage", "Override records and rule-version-in-force are part of the evidence trail"], ["35", "Integration360", "Surfaces results and exceptions to operators"]]}, {"t": "h", "x": "Downstream — the five gates"}, {"t": "tbl", "rows": [["ID", "Gate", "Tier"], ["23", "G1 file/structural", "Stage 1 Oracle, pre-insert"], ["24", "G2 RAW profiling", "Stage 1 Oracle"], ["25", "G3 dbt tests + rules", "Stage 2 Oracle"], ["26", "G4 tie-out", "Stage 3 Exadata Pre-Gold"], ["27", "G5 post-publish recon", "Consumer movement, advisory"]]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  ┌──────── 28 DQ FRAMEWORK — tier-agnostic ────────┐\n  │  registry · severity · results · override        │\n  └──┬──────────┬───────────┬───────────┬───────────┘\n     ▼          ▼           ▼           ▼\n  G1 · G2     G3         G4          G5\n  Stage 1     Stage 2    Stage 3     Consumer\n  Oracle      Oracle     Exadata     movement\n  pre-RAW     dbt        Pre-Gold    post-publish\n                         BLOCKS the\n                         cross-DB hop"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Is severity a caller argument?**"}, {"t": "p", "x": "**Decision:** Never. Severity is resolved from the registry at evaluation time. The framework exposes no parameter for it."}, {"t": "p", "x": "**Rationale:** If a developer can pass `severity=\"warn\"` at the call site, severity has left the registry and the config-driven design is decorative."}, {"t": "p", "x": "**Consequence:** Adjusting how hard a rule blocks is a config commit, reviewable and audited — not a code edit."}, {"t": "p", "x": "**D2 · How many severity tiers?**"}, {"t": "p", "x": "**Decision:** Two — `ERROR` blocks, `WARN` logs and proceeds. No third tier."}, {"t": "p", "x": "**Rationale:** Three tiers invite an `INFO` level that nobody acts on and that hides real signal. Two forces a decision per rule per feed."}, {"t": "p", "x": "**Consequence:** Rules that \"sometimes matter\" must be split into two rules with different thresholds rather than given a middle severity."}, {"t": "p", "x": "**D3 · Per-rule or per-rule-per-feed severity?**"}, {"t": "p", "x": "**Decision:** Per-rule-per-feed, with a rule-level default."}, {"t": "p", "x": "**Rationale:** A null tolerance sensible for Transaction Detail is wrong for Account. One severity across ~30 feeds guarantees over-blocking or under-blocking."}, {"t": "p", "x": "**Consequence:** More config rows, mitigated by inheritance from the default."}, {"t": "p", "x": "**D4 · Can Airflow read severity?**"}, {"t": "p", "x": "**Decision:** Yes — severity and result are written to the results store before the task fails, and the `GateOperator` reads them to decide branching."}, {"t": "p", "x": "**Rationale:** A blocking gate must fail; a warning gate must proceed. If severity lives only inside a dbt test, Airflow cannot branch on it."}, {"t": "p", "x": "**Consequence:** Rule execution and task failure are separate steps. The result is always persisted, even when the task then fails."}, {"t": "p", "x": "**D5 · Is G4 override-eligible?**"}, {"t": "p", "x": "**Decision:** No. G4 is excluded from the override path entirely."}, {"t": "p", "x": "**Rationale:** A tie-out break means Pre-Gold does not reconcile to RAW. Overriding it publishes knowingly-wrong data across the cross-database hop into Gold and onward to PBDW's ~1,000 consumers. If the business needs to publish anyway, that is a decision recorded outside the pipeline."}, {"t": "p", "x": "**Consequence:** Requires explicit ARB ratification rather than assumption."}, {"t": "p", "x": "**D6 · Override scope and lifetime.**"}, {"t": "p", "x": "**Decision:** Single-run, scoped to a `LOAD_ID` or `BATCH_ID`, expiring after 60 minutes, consumed once."}, {"t": "p", "x": "**Rationale:** A standing exemption is a rule change and belongs in the registry. An unexpiring token can be replayed into a later run."}, {"t": "p", "x": "**Consequence:** An operator handling a recurring failure must either fix it or change the rule — the override cannot become the workaround."}, {"t": "p", "x": "**D7 · Two-person rule.**"}, {"t": "p", "x": "**Decision:** Required above a configurable impact threshold — row count or value."}, {"t": "p", "x": "**Rationale:** Overriding a check on three rows and on three million are different acts."}, {"t": "p", "x": "**Consequence:** Threshold in config; the second approver must be a distinct identity, enforced by the framework."}, {"t": "p", "x": "**D8 · Rule results retention.**"}, {"t": "p", "x": "**Decision:** Results retained 24 months minimum, independent of RAW retention."}, {"t": "p", "x": "**Rationale:** The operational history evidences control effectiveness to an auditor. It is a small table."}, {"t": "p", "x": "**Consequence:** Partitioned monthly, separate purge policy from RAW."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart TB"}, {"t": "p", "x": "subgraph CFG[\"33 Config store\"]"}, {"t": "p", "x": "REG[\"CFG_DQ_RULE<br/>rule · gate · error code<br/>default severity\"]"}, {"t": "p", "x": "RF[\"CFG_DQ_RULE_FEED<br/>severity + threshold<br/>per feed (~30)\"]"}, {"t": "p", "x": "OVT[\"override thresholds<br/>two-person trigger\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FW[\"28 DQ FRAMEWORK\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "RES[\"Rule resolver<br/>as-of business_date\"]"}, {"t": "p", "x": "EVAL[\"Evaluator<br/>tier-agnostic\"]"}, {"t": "p", "x": "SEV[\"Severity resolver<br/>NEVER a caller argument\"]"}, {"t": "p", "x": "STORE[\"Results store<br/>persisted BEFORE task fails\"]"}, {"t": "p", "x": "OVR[\"Override service<br/>single-run · expiring · consumed once\"]"}, {"t": "p", "x": "RES --> EVAL --> SEV --> STORE"}, {"t": "p", "x": "OVR -.-> SEV"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph GATES[\"The five gates\"]"}, {"t": "p", "x": "G1[\"23 G1 · Stage 1 Oracle<br/>pre-RAW insert\"]"}, {"t": "p", "x": "G2[\"24 G2 · Stage 1 Oracle<br/>RAW profiling\"]"}, {"t": "p", "x": "G3[\"25 G3 · Stage 2 Oracle<br/>dbt tests\"]"}, {"t": "p", "x": "G4[\"26 G4 · Stage 3 EXADATA<br/>tie-out · NOT override-eligible\"]"}, {"t": "p", "x": "G5[\"27 G5 · consumer movement<br/>ADVISORY only\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph TIERS[\"Tiers gated\"]"}, {"t": "p", "x": "T1[\"Stage 1 RAW\"]"}, {"t": "p", "x": "T2[\"Stage 2 Enriched\"]"}, {"t": "p", "x": "T3[\"Pre-Gold assembly\"]"}, {"t": "p", "x": "HOP[\"CROSS-DB HOP<br/>Exadata → Gold\"]"}, {"t": "p", "x": "T4[\"Gold → PBDW · IMDS · Pivotal\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph OUT[\"Consumers of results\"]"}, {"t": "p", "x": "ERR[\"29 Error &amp; quarantine\"]"}, {"t": "p", "x": "RCN[\"30 Recon · exception lifecycle\"]"}, {"t": "p", "x": "I360[\"35 Integration360\"]"}, {"t": "p", "x": "LIN[\"31 Lineage\"]"}, {"t": "p", "x": "AF[\"18 Airflow<br/>branches on severity\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "REG & RF & OVT -.-> RES"}, {"t": "p", "x": "FW --> G1 & G2 & G3 & G4 & G5"}, {"t": "p", "x": "G1 -->|\"blocks\"| T1"}, {"t": "p", "x": "G2 -->|\"blocks\"| T2"}, {"t": "p", "x": "G3 -->|\"blocks\"| T3"}, {"t": "p", "x": "G4 ==>|\"BLOCKS\"| HOP"}, {"t": "p", "x": "HOP --> T4"}, {"t": "p", "x": "G5 -.->|\"advisory\"| T4"}, {"t": "p", "x": "STORE --> ERR & RCN & I360 & LIN"}, {"t": "p", "x": "STORE --> AF"}, {"t": "p", "x": "OVR --> LIN"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "classDef block stroke:#A82316,stroke-width:2px"}, {"t": "p", "x": "class RES,EVAL,SEV,STORE,OVR focal"}, {"t": "p", "x": "class G1,G2,G3,G4,HOP block"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant AF as 18 Airflow\n  participant GT as Gate (23–27)\n  participant FW as 28 Framework\n  participant CFG as 33 Config\n  participant ST as Results store\n  participant OV as Override service\n  participant ERR as 29 Error handling\n\n  AF->>GT: execute gate for scope (LOAD_ID / target)\n  GT->>FW: evaluate(gate, scope, context)\n  FW->>CFG: resolve rule set AS OF business_date\n  CFG-->>FW: rules + per-feed severity + thresholds\n  FW->>FW: execute rules on the local tier\n  FW->>ST: persist EVERY result — pass and fail alike\n  alt all pass\n    FW-->>GT: PASS\n    GT-->>AF: proceed\n  else failure at WARN\n    FW->>ERR: raise event, route FLAG_ROW\n    FW-->>GT: PASS with warnings\n    GT-->>AF: proceed\n  else failure at ERROR\n    FW->>OV: valid override for this error and scope?\n    alt gate is G4\n      OV-->>FW: refused — G4 not override-eligible\n    else valid override found\n      OV->>OV: consume token, stamp CONSUMED_TS\n      OV->>ST: mark OVERRIDDEN, tag affected rows\n      FW-->>GT: PASS under override\n    else no valid override\n      FW->>ERR: raise event, route BLOCK\n      FW-->>GT: FAIL\n      GT-->>AF: task fails NON-RETRYABLY\n    end\n  end"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Airflow (18)** → invokes a gate for a scope — a `LOAD_ID` for G1/G2, a model set for G3, a target object for G4"}, {"t": "p", "x": "2. **Gate (23–27)** → calls the framework's evaluator with gate, scope and context"}, {"t": "p", "x": "3. **Framework (28)** → resolves the rule set from config (33) **as of the business date** → rules, per-feed severities, thresholds"}, {"t": "p", "x": "4. **Framework (28)** → executes rules on whichever tier it is running — Stage 1 Oracle, Stage 2 Oracle, Stage 3 Exadata, or the movement verify → **execution is tier-agnostic; the result record is identical**"}, {"t": "p", "x": "5. **Framework (28)** → persists **every** result, pass and fail alike → this happens *before* any task failure, so Airflow can always read the outcome"}, {"t": "p", "x": "6. **All pass** → gate returns PASS → pipeline proceeds"}, {"t": "p", "x": "7. **Failure at `WARN`** → error event raised with route `FLAG_ROW` → gate returns PASS with warnings → pipeline proceeds"}, {"t": "p", "x": "8. **Failure at `ERROR`** → framework checks the override service for a valid, unconsumed, unexpired token matching this error and scope"}, {"t": "p", "x": "9. **Gate is G4** → override refused unconditionally → **the cross-database hop to Gold is blocked; Gold retains its prior partition**"}, {"t": "p", "x": "10. **Valid override found** → token consumed, `CONSUMED_TS` stamped, affected rows tagged `OVERRIDDEN`, result marked → gate returns PASS under override"}, {"t": "p", "x": "11. **No valid override** → error event raised with a BLOCK route → gate returns FAIL → **task fails non-retryably**, `retries=0`"}, {"t": "p", "x": "12. **Results store** → feeds error handling (29), recon (30), Integration360 (35) and lineage (31) → one result format across all five gates and all four tiers"}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Results store"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "CREATE TABLE HUB_DQ_RESULT ("}, {"t": "p", "x": "RESULT_ID       NUMBER(18) GENERATED ALWAYS AS IDENTITY,"}, {"t": "p", "x": "RUN_ID          VARCHAR2(120) NOT NULL,        -- Airflow dag_run_id"}, {"t": "p", "x": "BATCH_ID        VARCHAR2(40),"}, {"t": "p", "x": "GATE            VARCHAR2(4)   NOT NULL,        -- G1..G5"}, {"t": "p", "x": "TIER            VARCHAR2(24)  NOT NULL,        -- STAGE1 | STAGE2 | PREGOLD_EXADATA | MOVEMENT"}, {"t": "p", "x": "RULE_ID         VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "RULE_VERSION_TS TIMESTAMP     NOT NULL,        -- which rule version was in force"}, {"t": "p", "x": "-- scope"}, {"t": "p", "x": "FEED_ID         VARCHAR2(40),"}, {"t": "p", "x": "DOMAIN          VARCHAR2(40),"}, {"t": "p", "x": "LOAD_ID         NUMBER(18),"}, {"t": "p", "x": "TARGET_OBJECT   VARCHAR2(60),                  -- for G4, per Gold target"}, {"t": "p", "x": "BUSINESS_DATE   DATE          NOT NULL,"}, {"t": "p", "x": "-- outcome"}, {"t": "p", "x": "OUTCOME         VARCHAR2(12)  NOT NULL,        -- PASS | FAIL | OVERRIDDEN"}, {"t": "p", "x": "SEVERITY        VARCHAR2(10)  NOT NULL,        -- ERROR | WARN  (resolved, never passed)"}, {"t": "p", "x": "ROUTE           VARCHAR2(20)  NOT NULL,"}, {"t": "p", "x": "EXPECTED_VALUE  VARCHAR2(200),"}, {"t": "p", "x": "ACTUAL_VALUE    VARCHAR2(200),"}, {"t": "p", "x": "ROWS_AFFECTED   NUMBER(12),"}, {"t": "p", "x": "ERROR_ID        NUMBER(18),                    -- FK HUB_ERROR_EVENT (29)"}, {"t": "p", "x": "OVERRIDE_ID     NUMBER(18),                    -- FK HUB_OVERRIDE"}, {"t": "p", "x": "DURATION_MS     NUMBER(12),"}, {"t": "p", "x": "CREATED_TS      TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,"}, {"t": "p", "x": "CONSTRAINT PK_HUB_DQ_RESULT PRIMARY KEY (RESULT_ID)"}, {"t": "p", "x": ")"}, {"t": "p", "x": "PARTITION BY RANGE (CREATED_TS) INTERVAL (NUMTOYMINTERVAL(1,'MONTH'))"}, {"t": "p", "x": "(PARTITION P_INIT VALUES LESS THAN (TIMESTAMP '2026-01-01 00:00:00'));"}, {"t": "p", "x": "CREATE INDEX IX_DQR_RUN   ON HUB_DQ_RESULT (RUN_ID, GATE);"}, {"t": "p", "x": "CREATE INDEX IX_DQR_FAIL  ON HUB_DQ_RESULT (OUTCOME, SEVERITY, BUSINESS_DATE);"}, {"t": "p", "x": "CREATE INDEX IX_DQR_RULE  ON HUB_DQ_RESULT (RULE_ID, FEED_ID, BUSINESS_DATE);"}, {"t": "pre", "x": "\n`TIER` is recorded so an operator can see immediately whether a failure occurred before or after the cross-database hop — the single most consequential thing to know when triaging.\n\n### Override record\n\n```sql\nCREATE TABLE HUB_OVERRIDE (\n  OVERRIDE_ID   NUMBER(18) GENERATED ALWAYS AS IDENTITY,\n  ERROR_ID      NUMBER(18)    NOT NULL,\n  GATE          VARCHAR2(4)   NOT NULL,\n  SCOPE_TYPE    VARCHAR2(20)  NOT NULL,   -- LOAD | BATCH   (never DOMAIN, never STANDING)\n  SCOPE_ID      VARCHAR2(40)  NOT NULL,\n  BUSINESS_DATE DATE          NOT NULL,\n  JUSTIFICATION VARCHAR2(2000) NOT NULL,  -- mandatory, minimum length enforced\n  APPROVER_1    VARCHAR2(120) NOT NULL,\n  APPROVER_2    VARCHAR2(120),            -- required above threshold, must differ\n  GRANTED_TS    TIMESTAMP DEFAULT SYSTIMESTAMP NOT NULL,\n  EXPIRES_TS    TIMESTAMP     NOT NULL,   -- default +60 minutes\n  CONSUMED_TS   TIMESTAMP,                -- set when a gate actually uses it\n  CONSTRAINT CK_OVR_SCOPE CHECK (SCOPE_TYPE IN ('LOAD','BATCH')),\n  CONSTRAINT CK_OVR_GATE  CHECK (GATE <> 'G4')   -- D5 enforced in the schema\n);"}, {"t": "p", "x": "The `CHECK` on `GATE` puts D5 in the database rather than in application logic — a G4 override cannot be created even by a direct insert."}, {"t": "h", "x": "Framework interface"}, {"t": "p", "x": "```python"}, {"t": "p", "x": "from hub_framework.dq import evaluate, GateContext"}, {"t": "p", "x": "result = evaluate("}, {"t": "p", "x": "gate=\"G4\","}, {"t": "p", "x": "scope=GateContext(load_ids=[...], target_object=\"DIM_ACCOUNT\","}, {"t": "p", "x": "business_date=ds, tier=\"PREGOLD_EXADATA\"),"}, {"t": "p", "x": ")"}, {"t": "p", "x": "if result.blocked:"}, {"t": "p", "x": "raise NonRetryableHubError(result.error_id)"}, {"t": "pre", "x": "\n```python\n# Airflow operator — used identically for all five gates\nGateOperator(\n    task_id=\"g4_tieout_dim_account\",\n    gate=\"G4\",\n    rule_set=\"tieout.dim_account\",\n    scope=\"{{ ti.xcom_pull('pregold_dim_account')['load_ids'] }}\",\n    override_eligible=False,      # ignored for G4 — refused at the service anyway\n    retries=0,                    # enforced by the operator regardless of what is passed\n)"}, {"t": "h", "x": "Rule types by gate"}, {"t": "tbl", "rows": [["Gate", "Tier", "Rule types", "Executes as"], ["G1 (23)", "Stage 1 Oracle", "Column count, delimiter, encoding, header, manifest count, checksum", "Python, streaming"], ["G2 (24)", "Stage 1 Oracle", "Null rate, cardinality, volume vs trailing average, date range", "Aggregate SQL, pushed to DB"], ["G3 (25)", "Stage 2 Oracle", "Uniqueness, referential integrity, accepted values, bitemporal consistency", "dbt tests + singular tests"], ["G4 (26)", "**Stage 3 Exadata**", "Row count vs captured `LOAD_ID` metadata, control totals, version-count preservation", "SQL on Exadata, both sides local"], ["G5 (27)", "Consumer movement", "Cross-system totals, consumer-visible consistency", "SQL, advisory only"]]}, {"t": "h", "x": "Severity resolution"}, {"t": "pre", "x": "  rule default (CFG_DQ_RULE.DEFAULT_SEVERITY)\n        │\n        ▼ overridden by\n  per-feed severity (CFG_DQ_RULE_FEED.SEVERITY)\n        │\n        ▼ resolved AS OF business_date\n  effective severity  →  ERROR blocks · WARN proceeds"}, {"t": "p", "x": "No fourth source. In particular, no code path and no caller may contribute."}, {"t": "h", "x": "Config surface (33)"}, {"t": "p", "x": "Rule definitions per gate · default severity per rule · per-feed severity and threshold overrides · override expiry duration · two-person impact threshold · results retention."}]}, {"h": "5. Data Quality, Reconciliation & Lineage", "blocks": [{"t": "p", "x": "This component *is* the DQ machinery, so its own controls are meta-level:"}, {"t": "tbl", "rows": [["Control", "Behaviour"], ["Rule coverage", "Every active feed must have ≥1 G1 rule; a feed with none is reported by CI (33)"], ["Result completeness", "Every gate invocation must produce ≥1 result row; a gate that runs and writes nothing is itself an error"], ["Rule version recorded", "`RULE_VERSION_TS` on every result — proves which rule version was in force"], ["Override audit", "Every override written to lineage (31), not only to this store"], ["Repeat-offender detection", "Same `RULE_ID` + `FEED_ID` failing across N consecutive business dates → escalated as a design problem, not an incident"]]}, {"t": "p", "x": "**Lineage contribution:** the result set for a run establishes what was checked, under which rule versions, at which tier, with what outcome. Combined with the override records, this is the control-effectiveness evidence an auditor asks for."}]}, {"h": "6. RECOMMENDATION", "blocks": [{"t": "h", "x": "6.1 Central design choice"}, {"t": "p", "x": "**Where does severity live, and can a blocking gate be released at run time — and if so, under what constraints?**"}, {"t": "h", "x": "6.2 Options comparison"}, {"t": "tbl", "rows": [["Option", "Description", "Pros", "Cons", "Fit to Oracle/Stage1-2 → Exadata/Gold → movement stack"], ["**A · Severity in code, no override**", "Each gate hardcodes what blocks; a failure always stops the run until the data is fixed", "Absolutely unambiguous. No override machinery to build, no authority question, no audit surface. The gate cannot be weakened at 2am under pressure.", "A single cosmetic null in a non-critical column halts a batch that ~1,000 PBDW consumers depend on. Tuning requires a code release, so calibration never happens and teams work around the gate instead. Airflow cannot branch, because severity is invisible to it.", "Weak. Uncalibrated blocking on a pipeline this wide will either be disabled informally or cause repeated business-hours outages."], ["**B · Severity in config, override for any gate**", "Two tiers from the registry; any ERROR failure can be released by an authorised operator", "Fully calibrated blocking. Every failure has an operational path, so the EOD window is never hostage to a minor rule. Simple, uniform mental model.", "Makes every gate ultimately advisory, including the tie-out. An override at G4 publishes data known not to reconcile across the cross-DB hop into Gold and onward to PBDW — precisely the outcome AD-9 exists to prevent.", "Weak on control. Undermines the one gate that protects the consumer tier."], ["**C · Severity in config; override for G1–G3 and G5 only, G4 excluded** *(recommended)*", "Two tiers per-rule-per-feed; single-run expiring overrides with two-person rule above a threshold; G4 refused at the service and blocked by a schema constraint", "Calibrated blocking with a real operational release path for the recoverable cases. The one gate protecting the consumer tier cannot be released. Airflow reads severity and branches. Overrides are audited, scoped, expiring and consumed once.", "Most machinery to build — registry, results store, override service, two-person flow. Requires a named override authority, which is an organisational decision, not a technical one. Asymmetry between gates must be documented or it looks arbitrary.", "Strong. Places the hard boundary exactly where the tier boundary is: everything before the Exadata → Gold hop is recoverable; the hop itself is not."]]}, {"t": "h", "x": "6.3 Recommendation"}, {"t": "p", "x": "> **Recommended: Option C — severity resolved from config per-rule-per-feed, with single-run expiring overrides available for G1, G2, G3 and G5, and G4 excluded entirely.**"}, {"t": "p", "x": "Option C wins because the gates are not equivalent and should not be treated as such. G1 through G3 fail *before* anything crosses the Exadata → Gold boundary, so a bad decision there is recoverable by replay and costs a delay. G4 is the last check before data crosses into Gold and flows onward to PBDW's roughly 1,000 consumers — releasing it publishes figures known not to reconcile to RAW, and no downstream control catches that. Option A's uniform no-override stance is unworkable at this width: an uncalibrated blocking gate on ~30 feeds will be worked around informally, which is worse than a governed override. Option B's uniform override stance makes AD-9's central protection optional."}, {"t": "p", "x": "**What it costs:** the largest build in the DQ plane — registry, results store, override service with two-person approval, and the discipline that severity never appears as a caller argument. It also costs an organisational decision the technical design cannot make: someone must be named as override authority, with a threshold above which a second approver is required."}, {"t": "p", "x": "**Tier placement:** the framework is deliberately tier-agnostic and resident in the Stage 1/2 Oracle instance alongside the config store, while executing rules on whichever tier the gate runs — including Exadata for G4. That boundary is correct because the results store must be readable by Airflow, by Integration360 and by an auditor without regard to where a check happened to execute, and because putting it on the 12 CPU / 64 GB Gold box would add load to the tier with the least headroom."}, {"t": "p", "x": "**Must be confirmed for this to hold:**"}, {"t": "p", "x": "1. **ARB ratification that G4 is not override-eligible.** This is the load-bearing decision and must be explicit, not assumed."}, {"t": "p", "x": "2. **Named override authority and the two-person impact threshold.** Without a named role the override is either unusable at 2am or effectively unrestricted — both defeat the gates."}, {"t": "p", "x": "3. **Whether the ability to clear a failed task in the Airflow UI constitutes an override in practice.** If an operator can clear a G4 task, D5 is bypassed outside this framework entirely."}, {"t": "h", "x": "6.4 Rules respected"}, {"t": "ul", "items": ["✅ Tier boundary crisp — framework resident on Stage 1/2 Oracle, executes at all tiers, records `TIER` on every result", "✅ Cross-database hop protected — G4 blocks the Exadata → Gold movement and cannot be released", "✅ **AD-9** — blocking, calibrated, with the tie-out before Gold publish", "✅ **AD-8** — no gate mutates RAW; G1 runs before the insert", "✅ **AD-2** — G3 asserts bitemporal consistency; G4 verifies version counts survive the hop", "⚠️ **AD-5 contingent** — partial-batch behaviour on a gate failure is decided in component 22", "⚠️ **AD-6 contingent** — results surface to Integration360 on the assumption it becomes the recon system of record"]}]}, {"h": "7. Failure, Replay & Idempotency", "blocks": [{"t": "tbl", "rows": [["Failure", "Behaviour"], ["Rule execution error (framework bug)", "Treated as `ERROR` and blocks. A rule that cannot be evaluated is not a pass."], ["Config store unreachable", "Fail fast. **No default severity** — a default could silently disable a blocking gate."], ["Results store write fails", "The gate fails. A result that cannot be persisted means Airflow cannot read the outcome."], ["Override expired mid-run", "Treated as absent. The gate blocks."], ["Override already consumed", "Refused. Single-use is enforced at consumption, not at grant."], ["G4 override attempted", "Refused at the service and rejected by the schema constraint."]]}, {"t": "p", "x": "**Replay (21):** a replay re-evaluates all gates against the replayed scope. Results are written under a new `RUN_ID`, so the original run's results remain — the two can be compared. An override does **not** carry into a replay: the replayed run must pass on its own merits or obtain a fresh override."}, {"t": "p", "x": "**Idempotency:** rule evaluation is pure — same inputs, same rule version, same result. Results are append-only, keyed by `RUN_ID`, so a re-run adds rows rather than mutating them."}]}, {"h": "8. Security & Access", "blocks": [{"t": "ul", "items": ["**Rule authorship:** via the Git config repo (33). No human holds direct write on `CFG_DQ_RULE` or `CFG_DQ_RULE_FEED` in production.", "**Override authority:** a named role, distinct from the engineering team that authors rules. **Segregation matters** — whoever can weaken a rule should not also be able to release a failure of it.", "**Airflow task-clear rights** must be controlled at the same level as override authority, since clearing a failed gate task achieves the same outcome outside this framework.", "**Results store:** write by the framework service account only; read by Integration360, operators and audit.", "**Audit:** overrides written to lineage (31) as well as to `HUB_OVERRIDE`, so the evidence sits alongside the run it affected."]}]}, {"h": "9. Open Questions & Risks", "blocks": [{"t": "tbl", "rows": [["#", "Question / risk", "Owner", "Blocks"], ["1", "**ARB ratification that G4 is not override-eligible**", "ARB", "D5; the load-bearing control decision"], ["2", "Named override authority and two-person threshold", "BBH ops + risk", "D6, D7; usability of the whole blocking design"], ["3", "Airflow task-clear rights — an override path outside this framework", "BBH ops", "Whether D5 can be bypassed in practice"], ["4", "Initial severity calibration across ~30 feeds", "BBH + SEI", "Over-blocking on day one is the likeliest early failure mode"], ["5", "Escalation SLA per severity", "BBH ops", "Aged-exception escalation in 30"], ["6", "**AD-5** partial-batch policy", "ARB", "What a gate failure does at batch level"], ["7", "**AD-6** monitoring system of record", "ARB", "Where results surface authoritatively"], ["8", "Repeat-offender threshold — how many consecutive days is a design problem?", "BBH ops", "Escalation design"]]}]}, {"h": "10. Acceptance Criteria", "blocks": [{"t": "p", "x": "**Design complete when:**"}, {"t": "ul", "items": ["[ ] Rule registry schema agreed, with per-rule-per-feed severity inheritance", "[ ] Results store schema agreed, including `TIER` and `RULE_VERSION_TS`", "[ ] Override record schema agreed, with the G4 exclusion enforced as a schema constraint", "[ ] Framework interface agreed — **no severity parameter exists**", "[ ] `GateOperator` contract agreed, with `retries=0` enforced by the operator", "[ ] Override authority named and two-person threshold set", "[ ] G4 exclusion ratified by ARB"]}, {"t": "p", "x": "**Build complete when:**"}, {"t": "ul", "items": ["[ ] Severity cannot be passed at any call site — verified by inspection and by a failing test", "[ ] A config severity change alters blocking behaviour with **no code release**, demonstrated", "[ ] Airflow demonstrably branches on severity read from the results store", "[ ] Every gate invocation writes a result, including passes — verified across all five gates and all four tiers", "[ ] A G4 override attempt is refused at both the service and the schema", "[ ] An expired or already-consumed override is refused", "[ ] A two-person override cannot be approved twice by the same identity", "[ ] An override tags the affected rows and appears in the lineage record for that business date", "[ ] Repeat-offender query returns correctly across a seeded multi-day failure"]}]}]}, {"id": "c33", "title": "Metadata & Configuration Store", "level": "L3", "icon": "🧱", "color": "#5a6472", "bg": "#eef1f4", "order": 133, "sub": "#33 · 2. Hub · Foundation · Oracle DDL + Python · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["33"], "chip": "#33 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["14", "32"], "decisions": ["AD-6", "AD-9", "AD-2"], "tiers": ["Stage1-Oracle", "Stage2-Oracle", "Stage3-Exadata-Gold", "Consumer-Movement"], "updated": "2026-08-10"}, "src": "33_Metadata_Config_Store_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "The configuration store is the single authoritative source for everything the Hub does per feed, per domain and per rule. It holds the feed registry for all 9 domains and ~30 inbound feeds, the DQ rule definitions and severities, the dimensional and fact model definitions, retention windows, and the schedules that drive orchestration. Its single deliverable is a **versioned, audited configuration schema plus the Python access layer** that every other component reads through."}, {"t": "p", "x": "It is built first because the ingestion framework (13), the DAG fan-out (18), all five gates (23–27) and the DQ framework (28) are specified as config-driven. If this component is late, those four get hardcoded and — in practice — never get un-hardcoded."}, {"t": "p", "x": "**Tiers touched:** physically resident in the Stage 1/2 Oracle instance; read by components operating across all four tiers including Exadata Pre-Gold and the consumer-movement layer. Holds no business data."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "h", "x": "Upstream (Depends On)"}, {"t": "tbl", "rows": [["ID", "Component", "Why required"], ["14", "Stage 1 RAW", "Shares the Oracle instance; RAW DDL is generated from the feed registry held here"], ["32", "Security & access control", "Config is a privileged surface — write access must be tightly held, since a severity row governs whether production data is blocked"]]}, {"t": "h", "x": "Downstream — every config-driven component"}, {"t": "tbl", "rows": [["ID", "Reads"], ["13", "Feed specs, column layouts, load mechanism per feed, parse rules"], ["18", "Domain registry (drives dynamic task mapping), schedules, dependency waves"], ["20", "Intraday cadence definitions"], ["21", "Replay depth, retention windows"], ["22", "Partial-batch policy per domain"], ["23–27", "Rule sets and thresholds per gate"], ["28", "Rule registry, severity tiers, override thresholds"], ["29", "Error code catalogue"], ["66", "Dimension/fact definitions, SCD2 attribute lists, satellite attachments, Gold retention window"], ["67", "Movement targets, publish order, verification rules"]]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  ┌──────────────────── EXADATA (Stage 1 / 2 / Pre-Gold) ────────────────────┐\n  │                                                                          │\n  │   ┌─────────────────────────────────────┐                                │\n  │   │  33 METADATA & CONFIG STORE         │◀── read by every component     │\n  │   │  feed registry · rules · severities │    at every tier               │\n  │   │  models · schedules · retention     │                                │\n  │   └─────────────────────────────────────┘                                │\n  │            ▲                                                             │\n  │            │ generates DDL                                               │\n  │   Stage 1 RAW ──▶ Stage 2 ──▶ Pre-Gold (66)                              │\n  └──────────────────────────────┬───────────────────────────────────────────┘\n                                 │ 67 movement\n                                 ▼\n                        Gold (standalone) ──▶ PBDW · IMDS · Pivotal"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · One store or several?**"}, {"t": "p", "x": "**Decision:** One store, one schema, in the Stage 1/2 Oracle instance. Not a file-based config in Git, not per-component tables."}, {"t": "p", "x": "**Rationale:** Airflow, Python and dbt must all read the same severity value at runtime. A YAML file in a container image cannot be changed without a release, which defeats the stated requirement that severity be changeable without a code release."}, {"t": "p", "x": "**Consequence:** The store is a runtime dependency of the entire pipeline and inherits its availability requirement. Needs the same HA treatment as RAW."}, {"t": "p", "x": "**D2 · How is configuration changed?**"}, {"t": "p", "x": "**Decision:** Git is the source of truth for config *content*; the Oracle schema is the runtime *serving* copy. Changes are made in Git, reviewed, and applied by a CI job that writes to the store with full versioning."}, {"t": "p", "x": "**Rationale:** Direct SQL edits to a table that governs whether production data is blocked are indefensible at audit. Git gives review, history and rollback; the database gives runtime readability."}, {"t": "p", "x": "**Consequence:** No component writes to config at runtime — it is read-only to the pipeline. An emergency change is still a Git commit and a pipeline run, which is a deliberate friction."},
