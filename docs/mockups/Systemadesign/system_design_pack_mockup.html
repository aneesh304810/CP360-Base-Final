 {"t": "p", "x": "**D3 · Versioned or mutable?**"}, {"t": "p", "x": "**Decision:** Versioned. Every config row carries `EFFECTIVE_FROM_TS` / `EFFECTIVE_TO_TS` and `IS_CURRENT`. Nothing is updated in place."}, {"t": "p", "x": "**Rationale:** A replay of last Tuesday must run against the config that was in force last Tuesday, not today's. Under mutable config, replay produces a different answer than the original run and the pipeline stops being reproducible."}, {"t": "p", "x": "**Consequence:** Config reads are as-of by `BUSINESS_DATE`, not \"current\". This is the same bitemporal reasoning as AD-2, applied to configuration."}, {"t": "p", "x": "**D4 · Does SEI's Metadata/Config/Mapping share this store?**"}, {"t": "p", "x": "**Decision:** No. SEI's PS-Orchestration config is external and out of scope. Where a mapping is genuinely shared (field-level source-to-target), the Hub holds the authoritative copy and SEI's is treated as an input to be reconciled, not a live dependency."}, {"t": "p", "x": "**Rationale:** A runtime read across the organisational boundary makes the Hub's pipeline dependent on SEI availability for every run."}, {"t": "p", "x": "**Consequence:** Divergence between the two is possible and must be surfaced — a scheduled comparison report, not a silent assumption. Relates to **risk R1** in the L2 pack."}, {"t": "p", "x": "**D5 · Are rule severities per-rule or per-rule-per-feed?**"}, {"t": "p", "x": "**Decision:** Per-rule-per-feed, with a rule-level default."}, {"t": "p", "x": "**Rationale:** A null tolerance sensible for Transaction Detail is wrong for Account. Forcing one severity across 30 feeds guarantees either over-blocking or under-blocking."}, {"t": "p", "x": "**Consequence:** More rows to maintain; mitigated by inheritance from the rule default. Honours AD-9's requirement that blocking be calibrated rather than uniform."}, {"t": "p", "x": "**D6 · Where does the feed registry get its structure?**"}, {"t": "p", "x": "**Decision:** Modelled on the authoritative 9-domain inventory with explicit parent/satellite relationships. Feeds ending \"Optional Fields\" or \"Supplement\" are registered as satellites of a parent entity, never as standalone."}, {"t": "p", "x": "**Rationale:** Satellite feeds must attach to their parent during dimensional assembly (66). If the registry treats them as peers, the model builds them as separate facts."}, {"t": "p", "x": "**Consequence:** The registry carries a self-referencing `PARENT_FEED_ID`, and the fan-out (18) must map over parents while ensuring satellites land in the same wave."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart LR"}, {"t": "p", "x": "subgraph GIT[\"Source of truth\"]"}, {"t": "p", "x": "REPO[\"Git config repo<br/>YAML/JSON definitions<br/>reviewed · versioned\"]"}, {"t": "p", "x": "CI[\"57 CI/CD<br/>validate → apply\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph CFG[\"33 METADATA &amp; CONFIG STORE (Oracle)\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "FEED[\"CFG_FEED_REGISTRY<br/>9 domains · ~30 feeds<br/>parent/satellite\"]"}, {"t": "p", "x": "COL[\"CFG_FEED_COLUMN<br/>layout · types · parse rules\"]"}, {"t": "p", "x": "RULE[\"CFG_DQ_RULE<br/>+ CFG_DQ_RULE_FEED<br/>severity per feed\"]"}, {"t": "p", "x": "MODEL[\"CFG_MODEL_DEF<br/>dims · facts · SCD2 attrs\"]"}, {"t": "p", "x": "SCHED[\"CFG_SCHEDULE<br/>waves · cadence · lookback\"]"}, {"t": "p", "x": "RET[\"CFG_RETENTION<br/>RAW · Pre-Gold · Gold window\"]"}, {"t": "p", "x": "ERR[\"CFG_ERROR_CODE<br/>E1–E7 catalogue\"]"}, {"t": "p", "x": "API[\"Python config access layer<br/>as-of read · cached\"]"}, {"t": "p", "x": "FEED --> API"}, {"t": "p", "x": "COL --> API"}, {"t": "p", "x": "RULE --> API"}, {"t": "p", "x": "MODEL --> API"}, {"t": "p", "x": "SCHED --> API"}, {"t": "p", "x": "RET --> API"}, {"t": "p", "x": "ERR --> API"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph CONSUME[\"Config-driven components\"]"}, {"t": "p", "x": "ING[\"13 Ingestion framework\"]"}, {"t": "p", "x": "DAG[\"18 DAG fan-out\"]"}, {"t": "p", "x": "GATES[\"23–27 Gates\"]"}, {"t": "p", "x": "DQF[\"28 DQ framework\"]"}, {"t": "p", "x": "ERRH[\"29 Error handling\"]"}, {"t": "p", "x": "PG[\"66 Pre-Gold assembly\"]"}, {"t": "p", "x": "MOVE[\"67 Gold movement\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph EXT[\"EXTERNAL — SEI / PS-Orchestration, out of scope\"]"}, {"t": "p", "x": "SEICFG[\"SEI Metadata/Config/Mapping<br/>reconciled, not read at runtime\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "REPO --> CI --> CFG"}, {"t": "p", "x": "API --> ING & DAG & GATES & DQF & ERRH & PG & MOVE"}, {"t": "p", "x": "FEED -.->|\"generates DDL\"| RAWDDL[\"14 Stage 1 RAW DDL\"]"}, {"t": "p", "x": "SEICFG -.->|\"scheduled comparison<br/>NOT a runtime dependency\"| CFG"}, {"t": "p", "x": "classDef ext stroke-dasharray:5 5,stroke:#A82316,color:#A82316"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "class SEICFG,EXT ext"}, {"t": "p", "x": "class FEED,COL,RULE,MODEL,SCHED,RET,ERR,API focal"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant DEV as Engineer\n  participant GIT as Git config repo\n  participant CI as 57 CI/CD\n  participant CFG as 33 Config store\n  participant COMP as Pipeline component\n  participant AUD as 31 Audit &amp; lineage\n\n  DEV->>GIT: commit config change (e.g. severity, new feed)\n  GIT->>CI: PR triggers validation\n  CI->>CI: schema validate · referential check · error-code check\n  alt validation fails\n    CI-->>DEV: build fails, change rejected\n  else validation passes\n    CI->>CFG: apply as NEW VERSION (close prior, open new)\n    CFG->>AUD: record who, what, when, effective-from\n  end\n  COMP->>CFG: read config AS OF business_date\n  CFG-->>COMP: version in force on that date (not \"latest\")\n  COMP->>COMP: execute using that config\n  Note over COMP,CFG: replay of an old date reads the OLD config —<br/>reproducibility preserved"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Engineer** → commits a config change to the Git repo → PR raised"}, {"t": "p", "x": "2. **CI (57)** → validates schema shape, referential integrity, and that every error code referenced exists in the catalogue → fails the build on any breach"}, {"t": "p", "x": "3. **CI (57)** → applies the change to the Oracle store as a **new version** → prior version closed with `EFFECTIVE_TO_TS`, new version opened"}, {"t": "p", "x": "4. **Config store (33)** → records the change to the audit trail (31) → who, what, when, effective-from"}, {"t": "p", "x": "5. **Pipeline component** → at run time, reads config **as of the run's `BUSINESS_DATE`** → not \"latest\""}, {"t": "p", "x": "6. **Config store (33)** → returns the version in force on that date → cached for the duration of the run"}, {"t": "p", "x": "7. **Component** → executes against that config → behaviour is deterministic for that business date"}, {"t": "p", "x": "8. **Replay (21)** → a replay of an older date reads the *older* config → produces the same result as the original run"}, {"t": "p", "x": "**Failure branch (step 2):** validation failure rejects the change at CI. The runtime store is never left in an invalid state. **Failure branch (step 5):** if the store is unreachable, components fail fast rather than falling back to a default — a silent default is worse than a stopped pipeline, since it may disable a blocking gate."}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Core schema"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "-- ── feed registry: the 9-domain, ~30-feed inventory ────────────────────────"}, {"t": "p", "x": "CREATE TABLE CFG_FEED_REGISTRY ("}, {"t": "p", "x": "FEED_ID           VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "DOMAIN            VARCHAR2(40)  NOT NULL,   -- Account & Client, Positions, ..."}, {"t": "p", "x": "FEED_NAME         VARCHAR2(120) NOT NULL,   -- 'Account Optional Fields'"}, {"t": "p", "x": "FEED_TYPE         VARCHAR2(20)  NOT NULL,   -- SNAPSHOT | DELTA | CORRECTION"}, {"t": "p", "x": "PARENT_FEED_ID    VARCHAR2(40),             -- satellites attach to a parent"}, {"t": "p", "x": "ENTITY_ROLE       VARCHAR2(20)  NOT NULL,   -- DIMENSION | FACT | SATELLITE"}, {"t": "p", "x": "LOAD_WAVE         NUMBER(2)     NOT NULL,   -- 1 = dims, 2 = facts"}, {"t": "p", "x": "RAW_TABLE         VARCHAR2(60)  NOT NULL,"}, {"t": "p", "x": "LOAD_MECHANISM    VARCHAR2(20)  NOT NULL,   -- EXTERNAL_TABLE | SQLLDR | CX_ORACLE"}, {"t": "p", "x": "IS_ACTIVE         CHAR(1)       DEFAULT 'Y' NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_FROM_TS TIMESTAMP     NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_TO_TS   TIMESTAMP,"}, {"t": "p", "x": "IS_CURRENT        CHAR(1)       NOT NULL,"}, {"t": "p", "x": "CHANGED_BY        VARCHAR2(120) NOT NULL,"}, {"t": "p", "x": "GIT_COMMIT        VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "CONSTRAINT CK_FEED_ROLE CHECK (ENTITY_ROLE IN ('DIMENSION','FACT','SATELLITE')),"}, {"t": "p", "x": "CONSTRAINT CK_FEED_SAT  CHECK (ENTITY_ROLE <> 'SATELLITE' OR PARENT_FEED_ID IS NOT NULL)"}, {"t": "p", "x": ");"}, {"t": "p", "x": "-- ── column layout: drives RAW DDL generation and G1 structural checks ──────"}, {"t": "p", "x": "CREATE TABLE CFG_FEED_COLUMN ("}, {"t": "p", "x": "FEED_ID           VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "ORDINAL           NUMBER(4)     NOT NULL,"}, {"t": "p", "x": "COLUMN_NAME       VARCHAR2(60)  NOT NULL,"}, {"t": "p", "x": "RAW_LENGTH        NUMBER(6)     NOT NULL,   -- all RAW columns are VARCHAR2"}, {"t": "p", "x": "TARGET_TYPE       VARCHAR2(20),             -- cast applied in Stage 2"}, {"t": "p", "x": "PARSE_FORMAT      VARCHAR2(60),             -- e.g. 'YYYYMMDD'"}, {"t": "p", "x": "IS_NATURAL_KEY    CHAR(1)       DEFAULT 'N' NOT NULL,"}, {"t": "p", "x": "IS_SCD2_TRACKED   CHAR(1)       DEFAULT 'N' NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_FROM_TS TIMESTAMP     NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_TO_TS   TIMESTAMP,"}, {"t": "p", "x": "IS_CURRENT        CHAR(1)       NOT NULL"}, {"t": "p", "x": ");"}, {"t": "p", "x": "-- ── DQ rules and per-feed severity ────────────────────────────────────────"}, {"t": "p", "x": "CREATE TABLE CFG_DQ_RULE ("}, {"t": "p", "x": "RULE_ID           VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "GATE              VARCHAR2(4)   NOT NULL,   -- G1..G5"}, {"t": "p", "x": "RULE_TYPE         VARCHAR2(30)  NOT NULL,   -- COLUMN_COUNT | NULL_RATE | TIEOUT | ..."}, {"t": "p", "x": "ERROR_CODE        VARCHAR2(40)  NOT NULL,   -- FK CFG_ERROR_CODE"}, {"t": "p", "x": "DEFAULT_SEVERITY  VARCHAR2(10)  NOT NULL,   -- ERROR | WARN"}, {"t": "p", "x": "RULE_EXPRESSION   CLOB,                     -- SQL predicate or parameter JSON"}, {"t": "p", "x": "DESCRIPTION       VARCHAR2(500) NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_FROM_TS TIMESTAMP     NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_TO_TS   TIMESTAMP,"}, {"t": "p", "x": "IS_CURRENT        CHAR(1)       NOT NULL"}, {"t": "p", "x": ");"}, {"t": "p", "x": "CREATE TABLE CFG_DQ_RULE_FEED ("}, {"t": "p", "x": "RULE_ID           VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "FEED_ID           VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "SEVERITY          VARCHAR2(10)  NOT NULL,   -- overrides DEFAULT_SEVERITY"}, {"t": "p", "x": "THRESHOLD_NUM     NUMBER,"}, {"t": "p", "x": "THRESHOLD_PCT     NUMBER(5,2),"}, {"t": "p", "x": "IS_ENABLED        CHAR(1)       DEFAULT 'Y' NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_FROM_TS TIMESTAMP     NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_TO_TS   TIMESTAMP,"}, {"t": "p", "x": "IS_CURRENT        CHAR(1)       NOT NULL"}, {"t": "p", "x": ");"}, {"t": "p", "x": "-- ── dimensional model definitions, consumed by 66 Pre-Gold ────────────────"}, {"t": "p", "x": "CREATE TABLE CFG_MODEL_DEF ("}, {"t": "p", "x": "MODEL_ID          VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "MODEL_TYPE        VARCHAR2(20)  NOT NULL,   -- SCD2_DIM | FACT"}, {"t": "p", "x": "TARGET_OBJECT     VARCHAR2(60)  NOT NULL,   -- PG_DIM_ACCOUNT"}, {"t": "p", "x": "GOLD_OBJECT       VARCHAR2(60)  NOT NULL,   -- DIM_ACCOUNT"}, {"t": "p", "x": "SOURCE_FEEDS      VARCHAR2(500) NOT NULL,   -- comma list incl. satellites"}, {"t": "p", "x": "NATURAL_KEY       VARCHAR2(200) NOT NULL,"}, {"t": "p", "x": "GRAIN             VARCHAR2(200) NOT NULL,"}, {"t": "p", "x": "GOLD_RETENTION_D  NUMBER(5)     DEFAULT 90 NOT NULL,   -- as-of window in Gold"}, {"t": "p", "x": "EFFECTIVE_FROM_TS TIMESTAMP     NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_TO_TS   TIMESTAMP,"}, {"t": "p", "x": "IS_CURRENT        CHAR(1)       NOT NULL"}, {"t": "p", "x": ");"}, {"t": "p", "x": "-- ── schedules, waves, cadence, lookback ───────────────────────────────────"}, {"t": "p", "x": "CREATE TABLE CFG_SCHEDULE ("}, {"t": "p", "x": "SCHEDULE_ID       VARCHAR2(40)  NOT NULL,"}, {"t": "p", "x": "DOMAIN            VARCHAR2(40),"}, {"t": "p", "x": "LANE              VARCHAR2(20)  NOT NULL,   -- EOD | INTRADAY"}, {"t": "p", "x": "CRON_EXPR         VARCHAR2(60),"}, {"t": "p", "x": "WINDOW_MINUTES    NUMBER(5),"}, {"t": "p", "x": "CORRECTION_LOOKBACK_D NUMBER(4) DEFAULT 7 NOT NULL,"}, {"t": "p", "x": "PARTIAL_BATCH_POLICY  VARCHAR2(20) DEFAULT 'HALT_ALL' NOT NULL,  -- AD-5"}, {"t": "p", "x": "EFFECTIVE_FROM_TS TIMESTAMP     NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_TO_TS   TIMESTAMP,"}, {"t": "p", "x": "IS_CURRENT        CHAR(1)       NOT NULL"}, {"t": "p", "x": ");"}, {"t": "p", "x": "-- ── error code catalogue, referenced by 29 ────────────────────────────────"}, {"t": "p", "x": "CREATE TABLE CFG_ERROR_CODE ("}, {"t": "p", "x": "ERROR_CODE        VARCHAR2(40)  NOT NULL PRIMARY KEY,"}, {"t": "p", "x": "ERROR_CLASS       VARCHAR2(4)   NOT NULL,   -- E1..E7"}, {"t": "p", "x": "DEFAULT_ROUTE     VARCHAR2(20)  NOT NULL,   -- BLOCK_FILE | FLAG_ROW | RETRY | PAGE"}, {"t": "p", "x": "IS_RETRYABLE      CHAR(1)       DEFAULT 'N' NOT NULL,  -- only E6 = 'Y'"}, {"t": "p", "x": "DESCRIPTION       VARCHAR2(500) NOT NULL"}, {"t": "p", "x": ");"}, {"t": "pre", "x": "\n### Python access layer\n\n```python\n# hub_framework/config.py — the only sanctioned read path\n\nfrom hub_framework.config import ConfigStore\n\ncfg = ConfigStore(business_date=ctx.business_date)   # as-of, never \"latest\"\n\nfeeds     = cfg.feeds(domain=\"Positions\")            # 5 feeds incl. satellites\nlayout    = cfg.columns(feed_id=\"POSITIONS_TAXLOT\")\nrules     = cfg.dq_rules(gate=\"G1\", feed_id=\"POSITIONS_TAXLOT\")\nseverity  = rules[\"E2_COLUMN_COUNT_MISMATCH\"].severity   # resolved, never passed in\nretention = cfg.retention(object=\"PG_DIM_ACCOUNT\").gold_days\n\n# hard rules enforced by the layer:\n#  - no write methods exist. the store is read-only at runtime.\n#  - as-of resolution is mandatory; there is no \"current\" accessor.\n#  - unreachable store raises, never returns a default.\n#  - results cached per (business_date, run_id) for run-level consistency."}, {"t": "h", "x": "Airflow access"}, {"t": "p", "x": "```python"}, {"t": "p", "x": "from hub_framework.config import ConfigStore"}, {"t": "p", "x": "@task"}, {"t": "p", "x": "def domains_for_wave(wave: int, business_date: str):"}, {"t": "p", "x": "return ConfigStore(business_date).domains(load_wave=wave)"}, {"t": "p", "x": "ingest = ingest_domain.expand(domain=domains_for_wave(1, \"{{ ds }}\"))"}]}]}, {"id": "c66", "title": "Pre-Gold (Exadata) — dimensional assembly & tie-out", "level": "L3", "icon": "🧪", "color": "#0e8f7e", "bg": "#dff2ef", "order": 166, "sub": "#66 · 2. Hub · Processing · dbt + Oracle Exadata · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["66"], "chip": "#66 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["15", "17", "26", "28", "31", "33", "67"], "decisions": ["AD-1", "AD-2", "AD-8", "AD-9", "AD-4"], "tiers": ["Stage2-Oracle", "Stage3-Exadata-Gold"], "updated": "2026-08-10"}, "src": "66_Pre-Gold_Exadata_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "Pre-Gold is the dimensional assembly layer. It takes conformed Stage 2 output and builds the finished SCD2 dimensions, fact tables and bitemporal history that consumers will eventually see — then reconciles them against RAW before anything leaves Exadata. Its single deliverable is a set of **publish-ready staging tables**, one per Gold target object, already tied out and already in the exact shape Gold expects."}, {"t": "p", "x": "It exists because the Gold database is a standalone Oracle instance at 12 CPU / 64 GB with no Exadata features. Every heavy set-based operation — SCD2 merge, window functions over full history, fact assembly, control-total aggregation — must complete on Exadata where Smart Scan, HCC and storage offload are available. Gold receives rows; it does not compute them."}, {"t": "p", "x": "**Tiers touched:** reads Stage 2 (Oracle/Exadata), writes Pre-Gold (Stage 3 Exadata). Hands off to component 67 for movement into Gold. Does not touch Stage 1 and does not touch the consumer tier."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "h", "x": "Upstream (Depends On)"}, {"t": "tbl", "rows": [["ID", "Component", "Why required"], ["15", "Stage 2 Enriched", "Source of conformed, typed, corrected records across all 9 domains"], ["17", "Correction handling", "Supplies the bitemporal version chain (`RECORD_VERSION`, `IS_CURRENT`, effective timestamps) that Pre-Gold preserves rather than re-derives"], ["26", "G4 tie-out", "Executes here, before the Gold hop — Pre-Gold is where the gate physically runs"], ["28", "DQ framework", "Rule registry, severity resolution, blocking semantics"], ["31", "Audit & lineage", "`LOAD_ID` chain must survive dimensional assembly"], ["33", "Metadata & config store", "Domain registry, SCD2 attribute lists, tie-out rule sets, retention windows"], ["67", "Gold publish / movement", "Consumes Pre-Gold's staging tables (design contract, not a runtime dependency)"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["**67 Gold publish** — partition-exchange movement of Pre-Gold output into the standalone Gold database", "**31 Audit & lineage** — receives the assembly-level lineage records", "**35 Integration360** — receives tie-out results and exception events"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  SEI feeds (9 domains, ~30 feeds)\n        │\n        ▼\n  ┌─────────────────────────── EXADATA ───────────────────────────┐\n  │                                                               │\n  │  Stage 1 RAW ──▶ Stage 2 Enriched ──▶ THIS COMPONENT (66)     │\n  │  immutable       conformed,            SCD2 · facts ·          │\n  │  append-only     bitemporal            bitemporal history ·    │\n  │                                        G4 tie-out              │\n  └───────────────────────────────┬───────────────────────────────┘\n                                  │ 67 · partition exchange\n                                  │ current-state + bounded as-of window\n                                  ▼\n                   ┌─── GOLD (standalone Oracle, 12 CPU / 64 GB) ───┐\n                   │        publish-only · no transformation        │\n                   └───────────┬──────────┬──────────┬─────────────┘\n                               ▼          ▼          ▼\n                            PBDW        IMDS      Pivotal\n                               │\n                               ▼\n                       ~1,000 consumers"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · Where does dimensional assembly execute?**"}, {"t": "p", "x": "**Decision:** Entirely on Exadata, in Pre-Gold. Gold performs no joins, no merges, no window functions."}, {"t": "p", "x": "**Rationale:** The Gold box has no HCC, no Smart Scan, no storage indexes. A full-history SCD2 merge on 12 CPU / 64 GB spills to temp and competes with the publish window."}, {"t": "p", "x": "**Consequence:** Gold's CPU and memory are reserved for load and extract. Pre-Gold owns all compute cost. Honours AD-1 (Hub-owned Gold that publishes)."}, {"t": "p", "x": "**D2 · Does Pre-Gold hold full bitemporal history, or does Gold?**"}, {"t": "p", "x": "**Decision:** Pre-Gold holds the complete version chain under HCC. Gold receives current-state plus a bounded as-of window (default 90 days, configurable per object)."}, {"t": "p", "x": "**Rationale:** Full versioned history on 64 GB with only basic compression will outgrow the box. Exadata absorbs it at roughly 10× compression; Gold cannot."}, {"t": "p", "x": "**Consequence:** As-of queries beyond the window resolve against Pre-Gold on Exadata, not Gold. This is a **refinement to AD-2** — bitemporal append still holds everywhere, but the retention horizon differs by tier. Requires explicit ARB acknowledgement rather than silent implementation."}, {"t": "p", "x": "**D3 · Is Pre-Gold rebuilt or incrementally maintained?**"}, {"t": "p", "x": "**Decision:** Incrementally maintained, keyed on `BUSINESS_DATE` with a configurable correction lookback per domain."}, {"t": "p", "x": "**Rationale:** Full rebuild on ~30 feeds nightly is not affordable inside the EOD window regardless of Exadata's throughput, and it forfeits the ability to replay one domain in isolation."}, {"t": "p", "x": "**Consequence:** Every Pre-Gold object needs a deterministic incremental predicate and a documented rebuild path for deliberate full reconstruction."}, {"t": "p", "x": "**D4 · Where does the G4 tie-out run?**"}, {"t": "p", "x": "**Decision:** On Exadata, inside Pre-Gold, before any data crosses to Gold."}, {"t": "p", "x": "**Rationale:** Both sides of the comparison — RAW counts and assembled Gold-shaped rows — are local. A tie-out spanning two databases over a link inside the EOD window is materially harder and slower."}, {"t": "p", "x": "**Consequence:** What crosses to Gold is already reconciled. Component 67's post-move check reduces to a row-count verify, which is the correct amount of work for the small box. Honours AD-9 (blocking, tie-out before publish)."}, {"t": "p", "x": "**D5 · How is `LOAD_ID` lineage preserved through dimensional assembly?**"}, {"t": "p", "x": "**Decision:** Every Pre-Gold row carries `SRC_LOAD_ID` (or a `LOAD_ID` array for aggregated facts) and the originating `BUSINESS_DATE`."}, {"t": "p", "x": "**Rationale:** Replay scope is a `LOAD_ID` set (component 21). If lineage breaks at dimensional assembly, targeted replay becomes date-level replay and the fan-out advantage is lost."}, {"t": "p", "x": "**Consequence:** Aggregating facts must carry a collection, not a scalar. Modest storage cost, absorbed by HCC."}, {"t": "p", "x": "**D6 · What is the handoff unit to Gold?**"}, {"t": "p", "x": "**Decision:** A partition-ready staging table per Gold target object, matching Gold's DDL exactly."}, {"t": "p", "x": "**Rationale:** Enables partition exchange in component 67 — readers see the previous partition until the swap, then the new one. No half-loaded state, no long lock."}, {"t": "p", "x": "**Consequence:** Pre-Gold staging DDL and Gold DDL are a coupled contract generated from one config definition, not maintained separately."}, {"t": "p", "x": "**D7 · Does Pre-Gold serve the real-time lane?**"}, {"t": "p", "x": "**Decision:** No. The real-time lane (API Gateway → real-time consumers) is independent and has no batch dependency."}, {"t": "p", "x": "**Rationale:** Coupling would make the API route wait on an EOD build."}, {"t": "p", "x": "**Consequence:** Contingent on **AD-4** remaining \"independent lanes\". If intraday is later routed through the batch pipeline, this decision reopens."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart LR"}, {"t": "p", "x": "subgraph EXT[\"EXTERNAL — SEI / SWP, out of scope\"]"}, {"t": "p", "x": "SEI[\"SWP Platform<br/>batch extracts EOD\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S1[\"Stage 1 (Oracle / Exadata)\"]"}, {"t": "p", "x": "LZ[\"8 Landing Zone\"]"}, {"t": "p", "x": "RAW[\"14 Stage 1 RAW<br/>immutable · append-only<br/>~30 feeds · 9 domains\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S2[\"Stage 2 (Oracle / Exadata)\"]"}, {"t": "p", "x": "ACCT[\"Account &amp; Client\"]"}, {"t": "p", "x": "POS[\"Positions\"]"}, {"t": "p", "x": "TXN[\"Transactions\"]"}, {"t": "p", "x": "REF[\"Reference &amp; Asset\"]"}, {"t": "p", "x": "OTH[\"Other · Fee &amp; Billing<br/>Portfolio &amp; Model<br/>Reporting · Cash\"]"}, {"t": "p", "x": "CORR[\"17 Corrections<br/>bitemporal append\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S3[\"Stage 3 — PRE-GOLD (Exadata) · COMPONENT 66\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "DIM[\"Dimension assembly<br/>SCD2 · surrogate keys\"]"}, {"t": "p", "x": "FACT[\"Fact assembly<br/>grain conform · FK resolve\"]"}, {"t": "p", "x": "BITE[\"Bitemporal history<br/>full chain · HCC\"]"}, {"t": "p", "x": "G4[\"26 · G4 tie-out<br/>RAW ↔ Pre-Gold<br/>BLOCKING\"]"}, {"t": "p", "x": "STG[\"Publish staging tables<br/>partition-ready, Gold-shaped\"]"}, {"t": "p", "x": "DIM --> FACT --> BITE --> G4 --> STG"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph GOLD[\"Gold (standalone Oracle · 12 CPU / 64 GB)\"]"}, {"t": "p", "x": "GLD[\"16 Gold<br/>publish-only<br/>current + 90d as-of\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph CONS[\"Consumers (movement only)\"]"}, {"t": "p", "x": "PBDW[\"37 PBDW<br/>system of record<br/>~1,000 consumers\"]"}, {"t": "p", "x": "IMDS[\"38 IMDS Stage → IMDS\"]"}, {"t": "p", "x": "PIV[\"39 Pivotal\"]"}, {"t": "p", "x": "CPDW[\"40 CP DW Canonical<br/>FUTURE\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph RT[\"Real-time lane — independent\"]"}, {"t": "p", "x": "APIGW[\"12 API Gateway / Data Plane\"]"}, {"t": "p", "x": "RTC[\"42 Real-time consumers\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FDN[\"Foundation\"]"}, {"t": "p", "x": "CFG[\"33 Config store<br/>domain registry · SCD2 attrs<br/>tie-out rules · retention\"]"}, {"t": "p", "x": "LIN[\"31 Audit &amp; lineage\"]"}, {"t": "p", "x": "DQ[\"28 DQ framework\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "SEI -.->|\"file contract\"| LZ"}, {"t": "p", "x": "SEI -.->|\"SWP APIs\"| APIGW"}, {"t": "p", "x": "APIGW ==> RTC"}, {"t": "p", "x": "LZ --> RAW"}, {"t": "p", "x": "RAW --> ACCT & POS & TXN & REF & OTH"}, {"t": "p", "x": "ACCT & POS & TXN & REF & OTH --> CORR"}, {"t": "p", "x": "CORR --> DIM"}, {"t": "p", "x": "RAW -.->|\"counts by LOAD_ID\"| G4"}, {"t": "p", "x": "STG ==>|\"67 · partition exchange<br/>DB-link direct-path APPEND\"| GLD"}, {"t": "p", "x": "GLD --> PBDW & IMDS & PIV"}, {"t": "p", "x": "GLD -.-> CPDW"}, {"t": "p", "x": "CFG -.-> DIM & FACT & G4"}, {"t": "p", "x": "DIM & FACT --> LIN"}, {"t": "p", "x": "G4 --> DQ"}, {"t": "p", "x": "classDef ext stroke-dasharray:5 5,stroke:#A82316,color:#A82316"}, {"t": "p", "x": "classDef future stroke-dasharray:5 5,stroke:#9A5B00,color:#9A5B00"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "class SEI,EXT ext"}, {"t": "p", "x": "class CPDW future"}, {"t": "p", "x": "class DIM,FACT,BITE,G4,STG focal"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant AF as 18 Airflow\n  participant S2 as Stage 2 (Exadata)\n  participant PG as 66 Pre-Gold (Exadata)\n  participant G4 as 26 G4 tie-out\n  participant MV as 67 Movement\n  participant GD as Gold (standalone)\n  participant CN as PBDW / IMDS / Pivotal\n\n  AF->>S2: Stage 2 complete for all 9 domains (G3 passed)\n  AF->>PG: trigger assembly, mapped over domain registry (33)\n  PG->>PG: build dimensions — SCD2 close/open, surrogate keys\n  PG->>PG: build facts — grain conform, dimension FK resolve\n  PG->>PG: append bitemporal versions, full chain retained (HCC)\n  PG->>G4: submit assembled objects for tie-out\n  G4->>G4: compare RAW counts by LOAD_ID vs Pre-Gold rows\n  alt tie-out fails\n    G4-->>AF: BLOCK — no publish, error event raised (29)\n    AF-->>AF: alert · exception queue · replay candidate (21)\n  else tie-out passes\n    G4->>PG: build publish staging tables, partition-ready\n    PG->>MV: staging ready, current-state + 90d as-of window\n    MV->>GD: direct-path APPEND over DB-link into staging partition\n    MV->>GD: partition exchange — atomic swap, readers unaffected\n    MV->>MV: post-move row-count verify (lightweight)\n    GD->>CN: scheduled extracts — movement only, no transformation\n    CN-->>AF: publish confirmed · G5 advisory recon (27)\n  end"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Airflow (18)** → confirms Stage 2 complete and G3 passed for all 9 domains → releases the Pre-Gold task group"}, {"t": "p", "x": "2. **Airflow (18)** → dynamic task mapping over the domain registry in config (33) → one assembly branch per domain, not 30 static tasks"}, {"t": "p", "x": "3. **Pre-Gold (66)** → builds dimensions from Account & Client and Reference & Asset first → SCD2 close/open, surrogate key assignment"}, {"t": "p", "x": "4. **Pre-Gold (66)** → builds facts from Positions, Transactions, Fee & Billing, Reporting, Cash → resolves dimension foreign keys against step 3 output"}, {"t": "p", "x": "5. **Pre-Gold (66)** → appends bitemporal versions, retaining the full chain under HCC → `IS_CURRENT` maintained, prior versions closed"}, {"t": "p", "x": "6. **Pre-Gold (66)** → attaches satellite feeds (Optional Fields, Supplement) to their parent entities → never modelled as standalone facts"}, {"t": "p", "x": "7. **G4 tie-out (26)** → compares RAW row counts by `LOAD_ID` against assembled Pre-Gold rows, per target object → **both sides local to Exadata**"}, {"t": "p", "x": "8. **G4 fails** → BLOCK. Nothing crosses to Gold. Error event raised (29), exception queued (30), replay candidate flagged (21). Gold retains yesterday's state."}, {"t": "p", "x": "9. **G4 passes** → Pre-Gold builds publish staging tables in Gold's exact DDL shape → current-state plus the bounded as-of window"}, {"t": "p", "x": "10. **Movement (67)** → **CROSS-DATABASE HOP: Exadata → standalone Gold** → direct-path `APPEND` over DB-link into a staging partition"}, {"t": "p", "x": "11. **Movement (67)** → partition exchange, atomic swap → readers see the prior partition until the swap completes"}, {"t": "p", "x": "12. **Movement (67)** → post-move row-count verify against the Pre-Gold source count → lightweight, appropriate for the 12-CPU box"}, {"t": "p", "x": "13. **Gold (16)** → three scheduled extracts → PBDW, IMDS Stage → IMDS, Pivotal → movement only, no transformation in flight"}, {"t": "p", "x": "14. **G5 (27)** → advisory post-publish reconciliation → alert and replay trigger only; blocks nothing"}, {"t": "p", "x": "**Failure branch (steps 8, 10, 12):** any failure leaves Gold on the prior partition. Remediation is fix-then-replay from `LOAD_ID` (21), never in-place repair of Gold."}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Data model — Pre-Gold objects"}, {"t": "tbl", "rows": [["Object", "Type", "Grain", "Source domains", "Gold retention"], ["`PG_DIM_ACCOUNT`", "SCD2 dim", "Account, versioned", "Account & Client (+ Optional Fields, Supplement satellites)", "Current + 90d"], ["`PG_DIM_CLIENT`", "SCD2 dim", "Client, versioned", "Account & Client", "Current + 90d"], ["`PG_DIM_ASSET`", "SCD2 dim", "Asset, versioned", "Reference & Asset (+ Optional Fields, Investment Class)", "Current + 90d"], ["`PG_DIM_PORTFOLIO`", "SCD2 dim", "Portfolio, versioned", "Portfolio & Model", "Current + 90d"], ["`PG_FACT_POSITION`", "Fact", "Account + Asset + business date", "Positions (5 feeds)", "Current + 90d"], ["`PG_FACT_TAXLOT`", "Fact", "Account + Lot + business date", "Positions (Taxlot)", "Current + 90d"], ["`PG_FACT_TRANSACTION`", "Fact", "Transaction, versioned", "Transactions (Header + Detail)", "Current + 90d"], ["`PG_FACT_FEE`", "Fact", "Fee computation event", "Fee & Billing", "Current + 90d"], ["`PG_FACT_CASH`", "Fact", "Cash activity", "Cash, Other (Custody & Nostro)", "Current + 90d"], ["`PG_FACT_STATEMENT`", "Fact", "Statement event + item", "Reporting", "Current + 90d"]]}, {"t": "p", "x": "Object list is **generated from the domain registry in config (33)**, not hand-maintained. Adding a tenth domain is a config change."}, {"t": "h", "x": "DDL pattern — dimension"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "CREATE TABLE PG_DIM_ACCOUNT ("}, {"t": "p", "x": "ACCOUNT_SK        NUMBER(18) GENERATED ALWAYS AS IDENTITY,"}, {"t": "p", "x": "ACCOUNT_ID        VARCHAR2(64)  NOT NULL,     -- natural key"}, {"t": "p", "x": "-- SCD2 axis (happened-at)"}, {"t": "p", "x": "VALID_FROM_DATE   DATE          NOT NULL,"}, {"t": "p", "x": "VALID_TO_DATE     DATE          NOT NULL,     -- 9999-12-31 for current"}, {"t": "p", "x": "IS_CURRENT        CHAR(1)       NOT NULL,"}, {"t": "p", "x": "-- bitemporal axis (knew-at)"}, {"t": "p", "x": "EFFECTIVE_FROM_TS TIMESTAMP     NOT NULL,"}, {"t": "p", "x": "EFFECTIVE_TO_TS   TIMESTAMP,"}, {"t": "p", "x": "RECORD_VERSION    NUMBER(6)     NOT NULL,"}, {"t": "p", "x": "-- lineage"}, {"t": "p", "x": "SRC_LOAD_ID       NUMBER(18)    NOT NULL,"}, {"t": "p", "x": "SRC_BUSINESS_DATE DATE          NOT NULL,"}, {"t": "p", "x": "-- attributes (from Account + Account Optional Fields + Account Supplement)"}, {"t": "p", "x": "ACCOUNT_NAME      VARCHAR2(240),"}, {"t": "p", "x": "ACCOUNT_TYPE      VARCHAR2(64),"}, {"t": "p", "x": "BASE_CURRENCY     VARCHAR2(3),"}, {"t": "p", "x": "..."}, {"t": "p", "x": "CONSTRAINT PK_PG_DIM_ACCOUNT PRIMARY KEY (ACCOUNT_SK)"}, {"t": "p", "x": ")"}, {"t": "p", "x": "PARTITION BY RANGE (SRC_BUSINESS_DATE)"}, {"t": "p", "x": "INTERVAL (NUMTODSINTERVAL(1,'DAY'))"}, {"t": "p", "x": "(PARTITION P_INIT VALUES LESS THAN (DATE '2026-01-01'))"}, {"t": "p", "x": "COMPRESS FOR QUERY HIGH;          -- HCC: Exadata only, not available in Gold"}, {"t": "p", "x": "CREATE INDEX IX_PGDA_NK ON PG_DIM_ACCOUNT (ACCOUNT_ID, IS_CURRENT) LOCAL;"}, {"t": "p", "x": "CREATE INDEX IX_PGDA_LOAD ON PG_DIM_ACCOUNT (SRC_LOAD_ID) LOCAL;"}, {"t": "pre", "x": "\n### DDL pattern — publish staging (Gold-shaped)\n\n```sql\n-- generated from the SAME config definition as the Gold target DDL.\n-- no HCC: must match the standalone Gold box, which lacks it.\nCREATE TABLE PGS_DIM_ACCOUNT (\n  ... identical column list to GOLD.DIM_ACCOUNT ...\n)\nPARTITION BY RANGE (SRC_BUSINESS_DATE)\n  INTERVAL (NUMTODSINTERVAL(1,'DAY'))\n  (PARTITION P_INIT VALUES LESS THAN (DATE '2026-01-01'))\nROW STORE COMPRESS BASIC;         -- direct-path only; the compression Gold can actually use"}, {"t": "h", "x": "Transformation logic — SCD2 with bitemporal preservation"}, {"t": "p", "x": "```sql"}, {"t": "p", "x": "-- macro: build_scd2_dim(entity, natural_key, tracked_attrs, satellites)"}, {"t": "p", "x": "-- invoked per dimension from the config registry. NOT dbt snapshot —"}, {"t": "p", "x": "-- snapshot cannot carry the bitemporal chain from component 17."}, {"t": "p", "x": "WITH incoming AS ("}, {"t": "p", "x": "SELECT s.*, {{ satellite_join(satellites) }}    -- Optional Fields / Supplement attach here"}, {"t": "p", "x": "FROM   {{ ref('stg2_' ~ entity) }} s"}, {"t": "p", "x": "WHERE  s.is_current = 'Y'"}, {"t": "p", "x": "AND    s.business_date >= (SELECT MAX(src_business_date) FROM {{ this }})"}, {"t": "p", "x": "),"}, {"t": "p", "x": "changed AS ("}, {"t": "p", "x": "SELECT i.*"}, {"t": "p", "x": "FROM   incoming i"}, {"t": "p", "x": "LEFT JOIN {{ this }} c"}, {"t": "p", "x": "ON  c.{{ natural_key }} = i.{{ natural_key }}"}, {"t": "p", "x": "AND c.is_current = 'Y'"}, {"t": "p", "x": "WHERE c.{{ natural_key }} IS NULL                          -- new member"}, {"t": "p", "x": "OR ora_hash({{ tracked_attrs }}) <> c.attr_hash          -- tracked change"}, {"t": "p", "x": "),"}, {"t": "p", "x": "closed AS (                                                   -- close the prior version"}, {"t": "p", "x": "UPDATE {{ this }} SET valid_to_date = :business_date - 1,"}, {"t": "p", "x": "is_current    = 'N',"}, {"t": "p", "x": "effective_to_ts = :run_ts"}, {"t": "p", "x": "WHERE  is_current = 'Y'"}, {"t": "p", "x": "AND    {{ natural_key }} IN (SELECT {{ natural_key }} FROM changed)"}, {"t": "p", "x": ")"}, {"t": "p", "x": "SELECT ... FROM changed;                                      -- open the new version"}, {"t": "pre", "x": "\n### Exadata-specific design\n\n| Lever | Use |\n|---|---|\n| **HCC `QUERY HIGH`** | All Pre-Gold history tables. ~10× on repeated daily snapshots (Account, Client, Taxlot). Not available downstream — this is why history stays here. |\n| **Smart Scan** | Full-table predicates during fact assembly and tie-out aggregation. Requires direct-path reads — avoid index-driven plans on the large fact builds. |\n| **Storage indexes** | Automatic on `SRC_BUSINESS_DATE`. Reinforced by matching the partition key. |\n| **Parallel DML** | `PARALLEL` on the fact assembly and the tie-out aggregation. Degree bounded by the Exadata session budget, not the Gold box. |\n| **Direct-path insert** | `APPEND` hint on all Pre-Gold and staging writes — required for both HCC and BASIC compression to engage. |\n\n### Orchestration\n"}, {"t": "p", "x": "Airflow (18) · dynamic task mapping over domain registry (33)"}, {"t": "p", "x": "├─ wave 1  dimensions   Reference & Asset · Account & Client · Portfolio & Model"}, {"t": "p", "x": "│            └─ must complete before wave 2 (FK resolution)"}, {"t": "p", "x": "├─ wave 2  facts        Positions · Transactions · Fee & Billing · Reporting · Cash · Other"}, {"t": "p", "x": "├─ wave 3  G4 tie-out   per target object, parallel, BLOCKING"}, {"t": "p", "x": "└─ wave 4  staging      publish-table build, then hand to 67"}, {"t": "p", "x": "retries = 0 on all gate tasks (only E6 infrastructure is retryable)"}]}]}]}</script>
<script>
var DATA = JSON.parse(document.getElementById('data').textContent);
var DOCS = {}; DATA.docs.forEach(function(d){ DOCS[d.id] = d; });
var DEFAULT_DOC = (DATA.docs.filter(function(d){return d["default"];})[0] || DATA.docs[0]).id;
var ZC = {"1. SEI":"#6d3ac0","2. Hub":"#0f4775","3. Consumers":"#0b7d7d","4. OpenShift":"#b5651d"};
var ZONES = ["1. SEI","2. Hub","3. Consumers","4. OpenShift"];
var st = { view:"landing", doc:null, from:null, zone:null, high:false, q:"", openRow:null, dec:false };

function esc(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function inline(x){
 var e = esc(x);
 e = e.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
 e = e.replace(/`([^`]+)`/g, "<code>$1</code>");
 return e;
}
function docFor(c){
 var hay = (c.component+" "+c.plane+" "+c.deliverable+" "+c.scope).toLowerCase();
 var i, d;
 for (i=0;i<DATA.docs.length;i++){ d=DATA.docs[i];
  if (d.component_ids && d.component_ids.indexOf(c.id)>=0) return d.id; }
 for (i=0;i<DATA.docs.length;i++){ d=DATA.docs[i];
  if (d.match && new RegExp(d.match).test(hay)) return d.id; }
 for (i=0;i<DATA.docs.length;i++){ d=DATA.docs[i];
  if (d.zone_default && c.zone===d.zone_default) return d.id; }
 return DEFAULT_DOC;
}
function openDoc(key, fromId){
 st.view="doc"; st.doc=key;
 st.from = fromId ? DATA.comps.filter(function(c){return c.id===fromId;})[0] : null;
 render(); window.scrollTo(0,0);
}
function back(){ st.view="landing"; st.doc=null; st.from=null; render(); }
function setZone(z){ st.zone = (st.zone===z? null : z); render(); }
function setHigh(v){ st.high=v; render(); }
function setQ(v){ st.q=v; render(); }
function toggleDec(){ st.dec=!st.dec; render(); }
function toggleRow(id){ st.openRow = (st.openRow===id? null : id); render(); }

function chip(bg,fg,txt){ return '<span class="chip" style="background:'+bg+';color:'+fg+'">'+esc(txt)+'</span>'; }
function prio(p){ return p==="P1"?chip("#fde8e8","#c0392b","P1"):p==="P2"?chip("#fae5d3","#a8560f","P2"):chip("#eef1f4","#8a97a3",p||"—"); }
function cust(c){ return c==="High"?chip("#efe6fb","#6d3ac0","HIGH"):c==="Medium"?chip("#e0f5fd","#0b5e83","MED"):c==="Low"?chip("#eef6fb","#7d97ab","LOW"):""; }

function renderBlock(b, color){
 if (b.t==="h") return '<div class="sh4" style="color:'+color+'">'+inline(b.x)+'</div>';
 if (b.t==="p") return '<p>'+inline(b.x)+'</p>';
 if (b.t==="ul") return '<ul>'+b.items.map(function(i){return '<li>'+inline(i)+'</li>';}).join("")+'</ul>';
 if (b.t==="pre") return '<pre>'+esc(b.x)+'</pre>';
 if (b.t==="tbl"){
  var out='<table><tbody>';
  b.rows.forEach(function(row,i){
   out+='<tr>'+row.map(function(c){return (i===0?'<th>':'<td>')+inline(c)+(i===0?'</th>':'</td>');}).join("")+'</tr>';
  });
  return out+'</tbody></table>';
 }
 return "";
}
function renderDoc(){
 var d = DOCS[st.doc];
 var h = '<div class="bkbar"><span class="bk" onclick="back()">← back to tracker</span>'
  + '<span style="font-size:18px">'+d.icon+'</span>'
  + '<b style="font-size:14.5px;color:var(--navy)">'+esc(d.title)+'</b>'
  + chip(d.bg, d.color, d.level);
 if (st.from) h += '<span class="ctx">design context: <b style="color:'+(ZC[st.from.zone]||"#333")+'">#'
  + esc(st.from.id)+' '+esc(st.from.component)+'</b> · '+esc(st.from.plane)+'</span>';
 h += '<span class="src">source: designs-md/'+esc(d.src)+'</span></div>';
 h += '<div class="dsub2">'+esc(d.sub)+'</div>';
 if (d.meta && d.meta.status){
  h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:9.5px">'
   + chip("#e8ecf9","#4a5fc0","status · "+d.meta.status)
   + chip("#eef1f4","#5c6b7a","owner · "+(d.meta.owner||"TBD"))
   + (d.meta.depends_on.length? chip("#e0f5fd","#0b5e83","depends on · "+d.meta.depends_on.join(", ")):"")
   + (d.meta.decisions.length? chip("#fde8e8","#c0392b","decisions · "+d.meta.decisions.join(", ")):"")
   + (d.meta.updated? chip("#eef1f4","#8a97a3","updated "+d.meta.updated):"") + '</div>';
 }
 d.sections.forEach(function(sec){
  h += '<div class="scard" style="border-left-color:'+d.color+'">';
  if (sec.h) h += '<div class="sh">'+inline(sec.h)+'</div>';
  sec.blocks.forEach(function(b){ h += renderBlock(b, d.color); });
  h += '</div>';
 });
 return h;
}
function renderLanding(){
 var S = { comps:65, p1:36, high:13 };
 var arch = DOCS[DEFAULT_DOC];
 var h = '<div class="hero" onclick="openDoc(\''+DEFAULT_DOC+'\')">'
  + '<span class="hi">'+arch.icon+'</span><div style="flex:1;min-width:0">'
  + '<b>Component Architecture — SEI ↔ BBH Integration</b>'
  + '<div class="hl">65 components across 4 zones. Python + dbt + Airflow on OpenShift/Oracle. '
  + 'One design document per component; High custom = design doc mandatory before code.</div></div>'
  + '<div class="hs"><span><b>'+S.comps+'</b>components</span><span><b>'+S.p1+'</b>P1</span>'
  + '<span><b>'+S.high+'</b>high custom</span><span class="go">open the architecture →</span></div></div>';
 h += '<div class="thstrip"><b style="font-size:13.5px;color:var(--navy)">Component Design Tracker</b>'
  + '<span style="font-size:10.5px;color:var(--sub)">the <b>Design</b> column maps each component to its '
  + 'governing document — click it to drill in</span>'
  + '<span class="decbtn'+(st.dec?" on":"")+'" onclick="toggleDec()">⚖ '+DATA.decs.length+' open decisions '
  + (st.dec?"▾":"▸")+'</span></div>';
 if (st.dec){
  h += '<div class="decs">'+DATA.decs.map(function(d){
   var r = d.recommendation ? '<div class="rec">→ <b>'+esc(d.recommendation)+'</b></div>' : '';
   return '<div class="dec"><b class="did">'+esc(d.id)+'</b> — <b>'+esc(d.decision)+'</b>'
    + '<div class="dsub">SEI v5: '+esc(d.sei||"—")+' · BBH v4.2: '+esc(d.bbh||"—")
    + (d.blocks? ' · blocks components '+esc(d.blocks):'')+'</div>'+r+'</div>';
  }).join("")+'</div>';
 }
 h += '<div class="filters"><span class="pill" style="background:'
  + (!st.zone? 'var(--navy)':'#eef1f4')+';color:'+(!st.zone?'#fff':'var(--sub)')
  + '" onclick="setZone(null)">all zones</span>';
 ZONES.forEach(function(z){
  var on = st.zone===z;
  h += '<span class="pill" style="border-color:'+ZC[z]+';background:'+(on?ZC[z]:'#fff')
   + ';color:'+(on?'#fff':ZC[z])+'" onclick="setZone(\''+z+'\')">'+z+'</span>';
 });
 h += '<label style="display:flex;gap:5px;align-items:center;color:var(--sub);cursor:pointer">'
  + '<input type="checkbox" '+(st.high?"checked":"")+' onchange="setHigh(this.checked)">high custom only</label>'
  + '<input class="search" placeholder="Search component / tech…" value="'+esc(st.q)
  + '" oninput="setQ(this.value)">';
 h += '</div>';
 var rows = DATA.comps.filter(function(c){
  if (st.zone && c.zone!==st.zone) return false;
  if (st.high && c.custom!=="High") return false;
  if (st.q && (c.component+" "+c.plane+" "+c.technology+" "+c.deliverable).toLowerCase()
      .indexOf(st.q.toLowerCase())<0) return false;
  return true;
 });
 h += '<div class="tbl"><div class="thead"><span>ID</span><span>Plane</span><span>Component</span>'
  + '<span>Deliverable</span><span>Tech</span><span>Prio</span><span>Custom</span><span>Status</span>'
  + '<span>Design</span></div>';
 rows.forEach(function(c){
  var dk = docFor(c), d = DOCS[dk], open = st.openRow===c.id;
  var lab = d.chip || (dk===DEFAULT_DOC ? "Arch" : (d.level==="L2" ? "Planes"
   : d.id==="l3-stages" ? "Stage 1/2" : d.id==="l3-errors" ? "Errors" : d.title));
  h += '<div class="trow'+(open?" open":"")+'" onclick="toggleRow(\''+c.id+'\')">'
   + '<span class="cid" style="color:'+(ZC[c.zone]||"#888")+'">'+esc(c.id)+'</span>'
   + '<span class="pl" title="'+esc(c.plane)+'">'+esc(c.plane)+'</span>'
   + '<b class="cn" title="'+esc(c.component)+'">'+esc(c.component)+'</b>'
   + '<span class="dl" title="'+esc(c.deliverable)+'">'+esc(c.deliverable)+'</span>'
   + '<span class="tech">'+esc(c.technology)+'</span>'
   + '<span>'+prio(c.priority)+'</span><span>'+cust(c.custom)+'</span>'
   + '<span>'+chip(c.status==="Not Started"?"#eef1f4":"#d0ebd9",
       c.status==="Not Started"?"#8a97a3":"#159943",(c.status||"—").toUpperCase())+'</span>'
   + '<span class="dsg" style="background:'+d.bg+';color:'+d.color+';border-color:'+d.color
   + '" onclick="event.stopPropagation();openDoc(\''+dk+'\',\''+c.id+'\')">'
   + d.icon+' '+d.level+' · '+esc(lab)+' →</span></div>';
  if (open){
   h += '<div class="drill"><b>Key design questions:</b> '+esc(c.questions||"—");
   if (c.scope) h += '<br><b>Custom scope:</b> '+esc(c.scope);
   if (c.depends && c.depends!=="-") h += '<br><b>Depends on:</b> '+esc(c.depends);
   if (c.notes) h += '<br><b>Notes:</b> '+esc(c.notes);
   h += ' '+chip("#eef6fb","#7d97ab",c.source||"—")+'</div>';
  }
 });
 if (!rows.length) h += '<div style="padding:18px;font-size:11.5px;color:#93a1ad;text-align:center">'
  + 'No components match the current filter.</div>';
 h += '</div><div class="foot">Design mapping (from MD front-matter): pins → regex → zone default → '
  + 'default doc. Row click = design questions inline; Design chip = the full document, rendered natively.</div>';
 return h;
}
function render(){
 var el = document.getElementById("app");
 el.innerHTML = st.view==="doc" ? renderDoc() : renderLanding();
 var s = document.querySelector(".search");
 if (s){ s.focus && st.q && s.setSelectionRange && s.setSelectionRange(s.value.length, s.value.length); }
}
render();
</script>
</body></html>
