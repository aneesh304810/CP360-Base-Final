ons": "Restore tested how often?", "depends": "33, 50", "source": "NEW", "priority": "P2", "technology": "Infra", "custom": "None", "scope": "Backup tooling config.", "owner": "", "status": "Not Started", "target": "", "notes": ""}, {"id": "64", "zone": "4. OpenShift", "plane": "Operations", "component": "Monitoring Stack", "deliverable": "Prometheus/Grafana/log aggregation wired into item 34", "questions": "One stack, not a parallel one - confirm", "depends": "34", "source": "NEW", "priority": "P2", "technology": "Infra", "custom": "Low", "scope": "Dashboards + alert rules.", "owner": "", "status": "Not Started", "target": "", "notes": ""}, {"id": "65", "zone": "4. OpenShift", "plane": "Operations", "component": "Cost & Capacity Monitoring", "deliverable": "Capacity model for a sharply peaked EOD burst", "questions": "Peak-to-average ratio acceptable?", "depends": "52, 53", "source": "NEW", "priority": "P3", "technology": "Infra", "custom": "None", "scope": "Tooling config.", "owner": "", "status": "Not Started", "target": "", "notes": ""}], "decs": [{"id": "AD-1", "decision": "Gold write target: Hub-owned schema vs PBDW/IMDS direct", "sei": "Gold materialised into existing Oracle DW tables", "bbh": "No Gold layer; Stage 2 feeds consumers", "consequence": "dbt writes production schemas; blast radius and change control shift", "blocks": "16, 37, 60", "recommendation": "Hub-owned Gold schema that publishes"}, {"id": "AD-2", "decision": "Corrections: in-place merge vs bitemporal append", "sei": "Merge (update existing) on facts", "bbh": "Bitemporal handling held in Stage 2", "consequence": "Merge destroys history; breaks as-of restatement and replay", "blocks": "17, 21, 31, 59", "recommendation": "Bitemporal append with as-of resolution"}, {"id": "AD-3", "decision": "Apigee: firm decision or placeholder", "sei": "BBH runs an Apigee proxy (two nodes)", "bbh": "Vendor-neutral 'API Gateway / Data Plane'", "consequence": "SEI presumes a BBH decision", "blocks": "11, 12", "recommendation": "Pin explicitly or correct SEI diagram"}, {"id": "AD-4", "decision": "Intraday: batch pipeline or real-time lane", "sei": "In scope, identical flow to EOD", "bbh": "Batch lane annotated EOD only", "consequence": "Window sizing and cadence undefined", "blocks": "12, 20", "recommendation": "Decide one lane; not both"}, {"id": "AD-5", "decision": "Partial batch: halt-all vs per-domain proceed", "sei": "Not addressed", "bbh": "Not addressed", "consequence": "Undefined behaviour on single-file failure", "blocks": "18, 22", "recommendation": "Halt-all until measured, then relax"}, {"id": "AD-6", "decision": "Monitoring system of record", "sei": "SEI Status Dashboard AND Integration360", "bbh": "Integration360 as cross-cutting capability", "consequence": "Two dashboards, no single truth", "blocks": "7, 30, 35", "recommendation": "Integration360 as recon system of record"}, {"id": "AD-7", "decision": "Stage 1 ingestion technology", "sei": "Python (cx_Oracle / SQL*Loader / External Tables)", "bbh": "Arrow labelled dbt", "consequence": "BBH slide is wrong; fix before it is quoted", "blocks": "13", "recommendation": "DECIDED: Python. Correct BBH slide"}, {"id": "AD-8", "decision": "RAW immutability", "sei": "Immutable, append only", "bbh": "Source as delivered", "consequence": "-", "blocks": "14, 21", "recommendation": "DECIDED: immutable append-only"}, {"id": "AD-9", "decision": "DQ gates blocking vs advisory", "sei": "DQ check drawn after Gold", "bbh": "Recon & error handling, unspecified", "consequence": "Post-Gold check blocks nothing; bad data already published", "blocks": "23-28", "recommendation": "DECIDED: blocking, with G4 before publish"}, {"id": "AD-10", "decision": "Transport protocol", "sei": "Unspecified", "bbh": "sFTP reception at Landing Zone", "consequence": "BBH has committed further than SEI", "blocks": "8, 49", "recommendation": "Confirm sFTP or agree alternative"}, {"id": "AD-11", "decision": "Outbound scope this phase", "sei": "Fully diagrammed", "bbh": "Absent entirely", "consequence": "Build expectation mismatch", "blocks": "6, 10, 11", "recommendation": "State in or explicitly out of scope"}, {"id": "AD-12", "decision": "Pivotal in scope", "sei": "Not in the 8-component inbound list", "bbh": "Named consumer of Stage 2", "consequence": "Scope gap on the SEI side", "blocks": "39", "recommendation": "Add to SEI scope or drop"}], "docs": [{"id": "architecture", "title": "Component Architecture", "level": "L1", "icon": "🏛", "color": "#4a5fc0", "bg": "#e8ecf9", "order": 1, "sub": "the full SEI-BBH integration picture - both source decks reconciled", "match": "", "zone_default": "", "default": false, "component_ids": [], "chip": "", "meta": {}, "src": "architecture.md", "sections": [{"h": "", "blocks": [{"t": "p", "x": "Sixty-five components across four zones. Python ingests, dbt transforms, Airflow orchestrates, OpenShift runs it. Numbers match the engineering design tracker."}]}, {"h": "SEI", "blocks": [{"t": "p", "x": "Source of record and outbound orchestration. SEI-owned; BBH consumes to contract."}, {"t": "h", "x": "Source"}, {"t": "h", "x": "PS-Orchestration"}]}, {"h": "BBH PS-Integration Hub", "blocks": [{"t": "p", "x": "Every cross-party flow passes through here, both directions, batch and real-time. Twenty-nine components, twelve of them high-custom."}, {"t": "h", "x": "Ingress / Egress"}, {"t": "h", "x": "Processing"}, {"t": "h", "x": "Orchestration"}, {"t": "h", "x": "Data quality · blocking"}, {"t": "h", "x": "Foundation"}]}, {"h": "BBH Consumers", "blocks": [{"t": "p", "x": "Where the Hub publishes. Roughly a thousand downstream consumers, unallocated."}, {"t": "h", "x": "Data stores"}, {"t": "h", "x": "Consumption"}, {"t": "h", "x": "Gate interlock — where a failure stops the line"}, {"t": "p", "x": "Blocking, not advisory. G4 is the addition: it sits before the Gold publish, so a tie-out failure leaves production on yesterday's state instead of reconciling damage after the fact."}]}, {"h": "OpenShift infrastructure & deployment", "blocks": [{"t": "p", "x": "Twenty-two components, none of them in either source deck. Pod parallelism is cheap; Oracle sessions are not — item 55 sets the real ceiling on the fan-out in item 18."}, {"t": "h", "x": "Platform"}, {"t": "h", "x": "Runtime"}, {"t": "h", "x": "Deployment"}, {"t": "h", "x": "Operations"}, {"t": "h", "x": "Reading the diagram"}, {"t": "p", "x": "Numbers are the component IDs in the design tracker. The eight Python items carrying a high-custom mark are the real build: validation, DQ, replay, recon, config. dbt is comparatively thin — five Stage 2 models, five Gold, two hard macros."}, {"t": "h", "x": "Blocked on a decision"}, {"t": "ul", "items": ["**AD-1** Gold writes a Hub schema or PBDW/IMDS direct — blocks 16, 37, 60", "**AD-2** Corrections bitemporal or in-place merge — blocks 17, 21, 31, 59", "**AD-3** Apigee: decision or placeholder — blocks 11, 12", "**AD-4** Intraday on batch or API lane — blocks 12, 20", "**AD-5** Partial batch: halt-all or per-domain — blocks 18, 22", "**AD-6** Reconciliation system of record — blocks 7, 30, 35"]}, {"t": "p", "x": "Build order follows from this: item 33, the config store, comes first — items 13, 18, 23 and 28 are all meant to be config-driven and will be hardcoded if it isn't there."}]}]}, {"id": "l2-planes", "title": "L2 Plane Drill-downs", "level": "L2", "icon": "🔍", "color": "#0b5e83", "bg": "#e0f5fd", "order": 2, "sub": "how each plane is built - ingress, transform, egress, control", "match": "", "zone_default": "2. Hub", "default": false, "component_ids": [], "chip": "", "meta": {}, "src": "l2-plane-drilldowns.md", "sections": [{"h": "", "blocks": [{"t": "p", "x": "One level below the zone map. Each plane gets its internal flow, a component contract table, the failure modes it owns, and the decisions holding it up. Component IDs match the design tracker throughout."}, {"t": "ul", "items": ["1 · Ingress / Egress", "2 · Processing", "3 · Orchestration", "4 · Data Quality", "5 · Foundation", "6 · OpenShift", "L3 scope"]}]}, {"h": "Ingress / Egress", "blocks": [{"t": "p", "x": "The contract boundary. Nothing here knows what an account is — this plane moves bytes, authenticates, and decides only whether a delivery is complete. Business meaning starts in Processing."}, {"t": "h", "x": "Internal flow"}, {"t": "h", "x": "Component contracts"}, {"t": "tbl", "rows": [["ID", "Component", "Responsibility", "Interface out", "Build"], ["8", "Landing Zone + transport", "Receive, authenticate, retain. Write-once directory per business date. No parsing.", "File on volume + manifest", "INF"], ["9", "Arrival sensors", "Detect per-file arrival and manifest completeness. Trigger the domain branch, not the whole batch.", "Airflow trigger event", "AIR"], ["10", "Outbound producers", "Build extracts, JSON payloads and loader files to SEI's spec from Zone 3 sources.", "File / JSON to Apigee", "PY"], ["11", "Apigee proxy", "Submit path and status-return path. Auth, throttling, payload size limits.", "HTTPS to SEI · status to 35", "VEN"], ["12", "API Gateway / Data Plane", "Real-time route to SWP APIs. Independent lifecycle from batch.", "HTTPS to SEI APIs", "VEN"]]}, {"t": "h", "x": "Failure modes this plane owns"}, {"t": "ul", "items": ["**Partial delivery.** Six of seven files land. The sensor must distinguish \"late\" from \"missing\" — that needs a manifest with an expected-file list, or you are guessing on a timeout.", "**Silent truncation.** A file that lands mid-write looks complete. Requires a done-marker or size-stable check, not just existence.", "**Redelivery.** SEI resends a file for a date already loaded. The plane must not decide — it stamps and passes through; idempotency belongs to Processing."]}, {"t": "h", "x": "Blocked on"}, {"t": "p", "x": "AD-10 transport protocol — SEI unspecified, BBH says sFTP. AD-3 Apigee firm or placeholder. AD-11 is outbound in scope at all."}]}, {"h": "Processing", "blocks": [{"t": "p", "x": "The only plane allowed to hold business logic. Python owns everything up to and including the RAW insert; dbt owns everything after. That line is not negotiable — it is what keeps lineage traceable."}, {"t": "h", "x": "Internal flow"}, {"t": "h", "x": "Component contracts"}, {"t": "tbl", "rows": [["ID", "Component", "Responsibility", "Key design point", "Build"], ["13", "Python ingestion framework", "Validate, profile, stamp, load. One framework driven by config — not seven scripts.", "Loader abstraction so cx_Oracle / SQL*Loader / external tables are swappable per domain by size.", "PY"], ["14", "Stage 1 RAW", "Store as received. Immutable, append only.", "Partition by BUSINESS_DATE. Retention drives replay depth — set it from the replay requirement, not from disk.", "DDL"], ["15", "Stage 2 Enriched", "Standardise, integrate corrections, apply rules, select latest.", "Dedup and latest-record are macros, written once. Snapshot domains want incremental with a change hash, not full refresh.", "DBT"], ["16", "Gold", "Kimball dims and facts, business-ready.", "`dbt snapshot` will not cover this. Custom incremental SCD2 macro; merge strategy differs per fact.", "DBT"], ["17", "Correction handling", "Apply corrected transactions and positions consistently in Stage 2 and Gold.", "No dbt idiom for bitemporal. One custom strategy, reused — not per-model logic.", "DBT"]]}, {"t": "h", "x": "Failure modes this plane owns"}, {"t": "ul", "items": ["**Correction arrives before the record it corrects.** Out-of-order delivery. Needs a park-and-retry position, or corrections silently no-op.", "**Full-snapshot volume.** Account, Client and Tax Lot arrive complete every day. Full refresh on a full snapshot is the worst combination available; ask SEI for a change hash before optimising anything else.", "**Late-arriving dimension.** A fact references an account not yet in the dim. Decide: reject, or inferred-member row. Rejecting mid-window is expensive.", "**Merge destroys history.** Under in-place merge, an as-of question from last Tuesday is unanswerable. This is AD-2, and it is the single most consequential open item."]}, {"t": "h", "x": "Blocked on"}, {"t": "p", "x": "AD-1 Gold write target — decides whether dbt touches production schemas. AD-2 correction semantics — one answer must hold across 15, 16 and 21."}]}, {"h": "Orchestration", "blocks": [{"t": "p", "x": "Airflow holds control flow and nothing else. No transformations, no business rules, no thresholds — those live in dbt and in config. The plane's job is deciding what runs, in what order, and what happens when something does not."}, {"t": "h", "x": "Internal flow"}, {"t": "h", "x": "Component contracts"}, {"t": "tbl", "rows": [["ID", "Component", "Responsibility", "Key design point", "Build"], ["18", "DAG + per-domain fan-out", "Seven independent branches to G2; join only where Stage 2 genuinely needs it.", "Dynamic task mapping over domain config. A hand-written static DAG will not survive the eighth feed.", "AIR"], ["19", "Build order / threads", "Dims before facts; dbt thread count tuned to the Oracle ceiling.", "Ceiling comes from component 55, not from cluster capacity.", "AIR"], ["20", "Intraday cadence", "Schedule and overlap prevention against the EOD run.", "Must not allow an intraday run and EOD run to write the same target concurrently.", "AIR"], ["21", "Replay engine", "Re-run a business date end to end from RAW.", "Airflow `clear` reruns tasks; it does not undo a merge into a Gold fact. This is a bespoke component.", "PY"], ["22", "Partial-batch policy", "Decide halt-all vs per-domain proceed on a branch failure.", "Needs a per-domain publish-completeness marker consumers can read.", "AIR"]]}, {"t": "h", "x": "Failure modes this plane owns"}, {"t": "ul", "items": ["**Replay is not backfill.** Backfill assumes the target was empty. Replay must reverse or supersede an existing Gold state — which only works if AD-2 lands on append.", "**Overlapping runs.** Intraday firing while EOD is mid-Gold. Needs a run-level lock per target, not just DAG-level concurrency.", "**Parallelism inversion.** Past the Oracle session ceiling, more pods make the window longer. Measure before setting the fan-out width.", "**Retry masking a data problem.** Airflow retries are for transient infrastructure faults. A DQ failure must never be retried — it must block."]}, {"t": "h", "x": "Blocked on"}, {"t": "p", "x": "AD-4 intraday lane. AD-5 partial-batch policy. AD-2 determines whether replay is even implementable."}]}, {"h": "Data Quality — blocking", "blocks": [{"t": "p", "x": "Five gates, four of them blocking. The design principle: a gate that fires after the damage is a report, not a control. G4 exists because SEI v5 placed its only DQ step after the Gold load, where it stops nothing."}, {"t": "h", "x": "Gate interlock"}, {"t": "h", "x": "Component contracts"}, {"t": "tbl", "rows": [["ID", "Gate", "Checks", "Key design point", "Build"], ["23", "G1 file / structural", "Encoding, delimiter, column count, header, row count vs manifest, checksum.", "Rule-driven from the registry, not hardcoded per feed.", "PY"], ["24", "G2 RAW profiling", "Null rates, cardinality, volume vs trailing average, date range sanity.", "Aggregate SQL pushed to Oracle. Never pull rows into Python to profile.", "AIR"], ["25", "G3 dbt tests + rules", "Uniqueness, referential integrity, accepted values, business rule assertions.", "Generic tests for structure; singular tests for business rules.", "DBT"], ["26", "G4 tie-out", "RAW → Gold row and control-total reconciliation, per target.", "Compare against captured ingest metadata rather than rescanning — turns a table scan into a lookup.", "AIR"], ["27", "G5 post-publish recon", "Cross-system totals, consumer-visible consistency.", "Define what auto-triggers a replay versus what pages a human.", "AIR"], ["28", "DQ framework", "Registry, severity tiers, results store, override path.", "Severity must be changeable without a code release, and readable by Airflow so the gate can branch on it.", "PY"]]}, {"t": "h", "x": "Failure modes this plane owns"}, {"t": "ul", "items": ["**Everything fatal.** Without severity tiers you block on a null in a cosmetic column at 2am. Two tiers minimum, held in config.", "**No override.** Blocking with no release path means a failure waits for the morning. Needs an audited approve-and-proceed, logged to the same lineage store.", "**Thresholds drifting into dbt.** A threshold buried in a dbt test cannot be read by Airflow, so the gate cannot branch on severity. Keep thresholds in config.", "**G4 against the window.** The tie-out is the expensive gate and the only one protecting production. If it does not fit the window, the honest answer is to widen the window — not to demote the gate."]}]}, {"h": "Foundation", "blocks": [{"t": "p", "x": "Cross-cutting services every other plane calls. No domain knowledge lives here — a foundation component that knows what a tax lot is has been built wrong."}, {"t": "h", "x": "Dependency shape"}, {"t": "h", "x": "Component contracts"}, {"t": "tbl", "rows": [["ID", "Component", "Responsibility", "Key design point", "Build"], ["29", "Error & quarantine", "Error taxonomy, quarantine store, resubmission path.", "Quarantine is a first-class store with retention and a route back in — not a reject folder.", "PY"], ["30", "Reconciliation framework", "Control totals, exception lifecycle, publication to Integration360.", "An exception has states and an owner. Model the lifecycle, not just the alert.", "PY"], ["31", "Audit & lineage", "Row-level lineage via the LOAD_ID chain; evidence retention.", "dbt docs gives model-level lineage only. Row-level is yours to build.", "PY"], ["32", "Security & access", "AuthN/AuthZ, classification, masking if PII is present.", "Classify the SWP extracts before designing — masking changes the RAW model.", "INF"], ["33", "Metadata & config store", "Single source for specs, rules, thresholds, mappings, schedules.", "Everything config-driven depends on this. If it is late, 13/18/23/28 get hardcoded and never get un-hardcoded.", "DDL"], ["34", "Observability", "Logs, metrics, traces, SLIs.", "Emit run-level metrics from Python and Airflow deliberately; do not rely on container logs.", "INF"], ["35", "Integration360", "Monitoring, exceptions, process tracking, recon surface.", "Existing BBH platform; the Hub builds the adapter.", "VEN"], ["36", "SSO", "Federated access to SWP UI.", "Configuration only.", "INF"]]}, {"t": "h", "x": "Failure modes this plane owns"}, {"t": "ul", "items": ["**Two config stores.** SEI keeps its own Metadata/Config/Mapping (component 5b) and the Hub keeps 33. They will diverge. Decide which is authoritative for shared mappings.", "**Two monitoring surfaces.** SEI's dashboard and Integration360 both claim status. AD-6 resolves the recon record, but not the operator's question of which screen to trust.", "**Lineage that cannot answer the audit question.** Under in-place merge, lineage records that a row changed but not what it was. That is not audit-defensible."]}]}, {"h": "OpenShift — infrastructure & deployment", "blocks": [{"t": "p", "x": "Twenty-two components, none of them in either source deck. This plane does not appear in the architecture conversation until it is late, which is exactly why it is drawn here."}, {"t": "h", "x": "Runtime shape"}, {"t": "h", "x": "The two constraints this plane imposes upward"}, {"t": "ul", "items": ["**Pods are cheap, Oracle sessions are not.** Component 55 sets the ceiling on the fan-out designed in component 18. That is an empirical number from the DBA plus a load test — get it before committing to a window.", "**Deployment velocity is an AD-1 consequence.** If dbt writes PBDW and IMDS directly, your dbt release pipeline sits inside BBH production change control with whatever approval cycle that carries. A Hub-owned schema keeps the Hub's own cadence. ARB should see that this decision lands on release speed, not only on data ownership.", "**Long lead items.** Network egress to SEI (49) and Oracle session grants (55) are approval-bound, not build-bound. Start both now regardless of where the rest of the design sits."]}, {"t": "h", "x": "What gets an L3 document, and what does not"}, {"t": "h", "x": "L3 required — 13 components"}, {"t": "p", "x": "Behaviour is not derivable from the L2 flow. Each needs a design doc reviewed before code: interface, data model, state transitions, failure and recovery, test strategy."}, {"t": "tbl", "rows": [["ID", "Component", "Why L3"], ["13", "Ingestion framework", "Config-driven abstraction across three load mechanisms"], ["16", "Gold", "Custom SCD2 macro; no dbt default"], ["17", "Corrections", "Bitemporal strategy, reused everywhere"], ["18", "DAG fan-out", "Dynamic mapping over config"], ["21", "Replay engine", "State reversal; no framework support"], ["23", "G1 validation", "Rule engine + blocking semantics"], ["26", "G4 tie-out", "Crosses the model graph; gates publish"], ["28", "DQ framework", "Registry, severity, override, audit"], ["29", "Error & quarantine", "Lifecycle and resubmission"], ["30", "Recon framework", "Exception state model"], ["33", "Config store", "Schema everything else depends on"], ["10", "Outbound producers", "Three output formats to SEI spec"], ["59", "dbt release & rollback", "Restore path for a merged dim"]]}, {"t": "h", "x": "L3 not required — 52 components"}, {"t": "p", "x": "A diagram would restate the L2 flow. These need a one-page spec instead:"}, {"t": "ul", "items": ["**Config and platform (24 items).** Namespaces, RBAC, secrets, storage, quotas, GitOps, backup. Deliverable is a values file and a runbook, not a diagram.", "**DDL (4 items).** RAW, IMDS Stage, PBDW publication, config schema. Deliverable is the DDL plus a partitioning note.", "**Contract-only (10 items).** All of Zone 1 plus real-time consumers. Deliverable is an agreed interface spec, owned jointly with SEI.", "**Standard dbt (5 items).** Stage 2 models, Pivotal feed, IMDS load, tests. Deliverable is the model plus its schema.yml.", "**Vendor config (5 items).** Apigee, API Gateway, Integration360 adapter, SSO, BI."]}, {"t": "p", "x": "**Sequence.** Component 33 first — it is the schema four other high-custom components read. Then 13 and 28 together, since G1 lives inside the framework. Then 17, because 16, 21 and 59 all inherit its answer. Nothing in that chain moves until AD-2 closes."}]}]}, {"id": "l3-stages", "title": "Stage 1 RAW & Stage 2 Enriched", "level": "L3", "icon": "🧱", "color": "#0e8f7e", "bg": "#dff2ef", "order": 3, "sub": "detailed design - landing to tested dbt models", "match": "stage ?1|stage ?2|raw|enrich|dbt|landing|staging|transform", "zone_default": "", "default": false, "component_ids": [], "chip": "", "meta": {}, "src": "l3-stage1-stage2.md", "sections": [{"h": "", "blocks": [{"t": "p", "x": "The two layers where the pipeline either stays auditable or quietly stops being auditable. Stage 1 is the evidence record; Stage 2 is the only place business meaning is allowed to enter. Everything below is design intent for engineering review, not yet approved."}, {"t": "ul", "items": ["Layer contract", "Stage 1 · RAW", "LOAD_ID & idempotency", "Stage 2 · Enriched", "Corrections", "Worked model", "Open items"]}]}, {"h": "What each layer is, and what it must never become", "blocks": [{"t": "p", "x": "Most medallion failures come from a layer taking on a job that belongs to its neighbour. These rules are the ones worth defending in review."}, {"t": "tbl", "rows": [["Layer", "Is", "Is not", "Test of the rule"], ["**Stage 1 RAW** · 7 tables", "A byte-faithful record of what SEI sent, stamped with when and in what file. Append only.", "Typed, cleaned, deduplicated, or joined. No rejects removed, no defaults applied.", "You can reconstruct the original file from the table. If you can't, RAW is doing too much."], ["**Stage 2 Enriched** · 5 models", "Typed, standardised, corrected, business-rule-validated, reusable across all consumers.", "Consumer-shaped. No PBDW-specific column names, no Pivotal-specific filters, no report logic.", "A second consumer can be added without changing a Stage 2 model."], ["**Gold** · 5 objects", "Kimball dims and facts. Surrogate keys, SCD2 history, conformed grain.", "Where corrections get resolved. That must already have happened.", "Gold logic is dimensional mechanics only — no source-system knowledge."]]}, {"t": "h", "x": "Lineage map — 7 → 5 → 5"}, {"t": "p", "x": "Note the naming break: RAW_CLIENT → STG2_INTERESTED_PARTY. The rename happens once, in Stage 2, and the mapping belongs in the config store (33) — not in a model comment."}]}, {"h": "Stage 1 — RAW (SWP)", "blocks": [{"t": "p", "x": "Python-managed, immutable, append only. Seven tables, one per source file. Its single obligation is that a replay from RAW produces the same result as the original run — which drives every decision below."}, {"t": "h", "x": "Table specification"}, {"t": "tbl", "rows": [["Table", "Feed type", "Natural key (in Stage 2)", "Volume shape", "Partition"], ["RAW_ACCOUNT", "Full snapshot", "ACCOUNT_ID", "Flat, full daily", "BUSINESS_DATE"], ["RAW_CLIENT", "Full snapshot", "CLIENT_ID", "Flat, full daily", "BUSINESS_DATE"], ["RAW_TAXLOT", "Full snapshot", "ACCOUNT_ID + LOT_ID", "Largest feed", "BUSINESS_DATE"], ["RAW_TRANSACTION", "Delta", "TRANSACTION_ID", "Spiky, event-driven", "BUSINESS_DATE"], ["RAW_POSITION", "Delta", "ACCOUNT_ID + SECURITY_ID", "Moderate", "BUSINESS_DATE"], ["RAW_CORRECTED_TRANSACTION", "Correction", "TRANSACTION_ID + effective date", "Small, irregular", "BUSINESS_DATE (file date)"], ["RAW_CORRECTED_POSITION", "Correction", "ACCOUNT_ID + SECURITY_ID + eff. date", "Small, irregular", "BUSINESS_DATE (file date)"]]}, {"t": "p", "x": "Natural keys are listed for Stage 2's benefit. RAW itself carries no key constraint — see below."}, {"t": "h", "x": "Audit columns — all seven tables"}, {"t": "tbl", "rows": [["Column", "Type", "Semantics and why it exists"], ["LOAD_ID", "NUMBER(18)", "Unique per file-load attempt. The replay handle and the join key for lineage. See next section."], ["BUSINESS_DATE", "DATE", "The date the data is about. Partition key. For corrections this is the file date, not the corrected event's date."], ["FILE_DATE", "DATE", "Date asserted by SEI in the filename or manifest. Divergence from BUSINESS_DATE is itself a G1 check."], ["FILE_NAME", "VARCHAR2(260)", "Exact delivered filename. Evidence, and the tie back to the landing zone."], ["ROW_NUM", "NUMBER(12)", "Ordinal position in the file. Makes a RAW row addressable to a physical line — essential for an audit query."], ["LOAD_TIMESTAMP", "TIMESTAMP", "When BBH loaded it. The \"knew-at\" axis. Do not use for ordering business events."], ["SOURCE_SYSTEM", "VARCHAR2(30)", "Constant 'SEI_SWP' today. Present so the second source doesn't require a schema change."], ["INGESTION_STATUS", "VARCHAR2(20)", "LOADED / QUARANTINED / SUPERSEDED. Not a DQ verdict — that lives in the DQ results store (28)."]]}, {"t": "h", "x": "DDL pattern"}, {"t": "pre", "x": "-- one pattern, seven tables. Generated from the config store (33), not hand-written.\nCREATE TABLE RAW_TRANSACTION (\n  LOAD_ID           NUMBER(18)     NOT NULL,\n  BUSINESS_DATE     DATE           NOT NULL,\n  FILE_DATE         DATE,\n  FILE_NAME         VARCHAR2(260)  NOT NULL,\n  ROW_NUM           NUMBER(12)     NOT NULL,\n  LOAD_TIMESTAMP    TIMESTAMP      DEFAULT SYSTIMESTAMP NOT NULL,\n  SOURCE_SYSTEM     VARCHAR2(30)   DEFAULT 'SEI_SWP'   NOT NULL,\n  INGESTION_STATUS  VARCHAR2(20)   DEFAULT 'LOADED'    NOT NULL,\n  -- business payload: all VARCHAR2, cast downstream\n  TRANSACTION_ID    VARCHAR2(64),\n  ACCOUNT_ID        VARCHAR2(64),\n  TRADE_DATE        VARCHAR2(32),\n  SETTLE_DATE       VARCHAR2(32),\n  TRANSACTION_TYPE  VARCHAR2(64),\n  QUANTITY          VARCHAR2(48),\n  AMOUNT            VARCHAR2(48)\n)\nPARTITION BY RANGE (BUSINESS_DATE)\n  INTERVAL (NUMTODSINTERVAL(1,'DAY'))\n  (PARTITION P_INIT VALUES LESS THAN (DATE '2026-01-01'));\n\n-- no primary key, no unique constraint, no NOT NULL on business columns.\n-- duplicates are data to be observed, not errors to be prevented.\nCREATE INDEX IX_RAW_TXN_LOAD ON RAW_TRANSACTION (LOAD_ID) LOCAL;"}, {"t": "h", "x": "Load mechanism — choose per feed, not once"}, {"t": "tbl", "rows": [["Mechanism", "Use for", "Strength", "Cost"], ["External table", "Tax Lot, Account, Client — the large snapshots", "One pass; G1 checks run as SQL over the file; no row shipping", "File must be on a DB-visible mount; brittle on malformed rows"], ["SQL*Loader direct path", "Large deltas where the file can't be DB-mounted", "Fast bulk insert, bad-file capture built in", "External process to orchestrate and parse the log"], ["cx_Oracle executemany", "Corrections, small feeds", "Full control, easy quarantine routing", "Slowest per row; fine at correction volumes"]]}, {"t": "p", "x": "Component 13 exposes these behind one loader interface, selected by config per domain. Hardcoding one mechanism is the single most likely way this framework becomes seven scripts."}, {"t": "h", "x": "Retention and partitioning"}, {"t": "ul", "items": ["**Interval partitioning by BUSINESS_DATE**, daily. Gives partition-wise replay, cheap purge by DROP PARTITION, and partition pruning for G2 profiling.", "**Retention is set by replay depth, not by disk.** If the business needs to replay 90 days, RAW holds 90 days minimum. Decide the replay window first, then size storage — the reverse produces a system that cannot honour its own recovery promise.", "**Compress partitions older than the active window** — ROW STORE COMPRESS ADVANCED on the snapshot tables, where repeated daily snapshots compress heavily."]}]}, {"h": "LOAD_ID and redelivery", "blocks": [{"t": "p", "x": "The one identifier the whole recovery story hangs on. Get it wrong and replay, lineage and G4 all become approximations."}, {"t": "h", "x": "Definition"}, {"t": "p", "x": "One LOAD_ID per **file-load attempt** — not per batch, not per business date. A batch of seven files produces seven LOAD_IDs bound by a BATCH_ID in the config store. This is what lets one domain be replayed without touching the other six, which is the whole point of the per-domain fan-out in component 18."}, {"t": "h", "x": "What LOAD_ID enables downstream"}, {"t": "tbl", "rows": [["Consumer", "Use"], ["Replay engine (21)", "Replay scope is a LOAD_ID set, not a date. Re-run one domain, or one corrected file, without disturbing the rest of the batch."], ["G4 tie-out (26)", "Compare Gold output against the row counts captured at ingest per LOAD_ID — a lookup, not a table rescan. This is what makes G4 affordable inside the window."], ["Audit & lineage (31)", "Row-level lineage is the LOAD_ID + ROW_NUM pair carried forward into Stage 2. A Gold value traces to a physical line in a named file."], ["Quarantine (29)", "Quarantined rows keep the LOAD_ID of the attempt that rejected them, so resubmission is traceable to the original."]]}]}, {"h": "Stage 2 — Enriched (dbt)", "blocks": [{"t": "p", "x": "Five models, eight processing steps, one fixed order. The order is not stylistic: applying business rules before corrections validates data you're about to replace, and deduplicating after joins multiplies the work."}, {"t": "h", "x": "The eight steps as a fixed CTE order"}, {"t": "h", "x": "Model specification"}, {"t": "tbl", "rows": [["Model", "Sources", "Grain", "Materialization", "Rationale"], ["STG2_ACCOUNT", "RAW_ACCOUNT", "ACCOUNT_ID per business date", "**Incremental**, insert by business date", "Full snapshot in, current-state out. Gold builds SCD2 — Stage 2 must not. Keep the day's snapshot so SCD2 can be rebuilt without re-reading RAW."], ["STG2_INTERESTED_PARTY", "RAW_CLIENT", "CLIENT_ID per business date", "**Incremental**, insert by business date", "Same shape as account. Note the rename — mapping lives in config (33)."], ["STG2_TAX_LOT", "RAW_TAXLOT", "ACCOUNT_ID + LOT_ID per business date", "**Incremental**, insert by business date", "Largest feed. Full refresh on a full snapshot is the worst combination available and should not ship."], ["STG2_TRANSACTIONS", "RAW_TRANSACTION + RAW_CORRECTED_TRANSACTION", "TRANSACTION_ID, versioned", "**Incremental**, merge on key + version", "Corrections reach back into prior dates. Needs a lookback window, not a single-date filter."], ["STG2_CP_HOLDINGS", "RAW_POSITION + RAW_CORRECTED_POSITION", "ACCOUNT_ID + SECURITY_ID + date, versioned", "**Incremental**, merge on key + version", "Same pattern as transactions."]]}, {"t": "h", "x": "Standard column set added by Stage 2"}, {"t": "tbl", "rows": [["Column", "Purpose"], ["SRC_LOAD_ID, SRC_ROW_NUM", "Carried from RAW. Row-level lineage back to a physical line in a named file."], ["RECORD_VERSION", "1 for the original, incrementing per correction applied to the same natural key."], ["IS_CURRENT", "Y for the version in force now. Gold consumes only current rows; audit reads all of them."], ["EFFECTIVE_FROM_TS / EFFECTIVE_TO_TS", "The knew-at axis. With BUSINESS_DATE as the happened-at axis, this is what makes as-of restatement possible."], ["DQ_FLAGS", "Business rule outcomes as a structured column. G3 tests assert against it; nothing is silently dropped."], ["DBT_UPDATED_AT", "Model run timestamp. Operational, not business."]]}]}, {"h": "Correction integration — the hard part", "blocks": [{"t": "p", "x": "SEI v5 says corrections are \"Merge (Update Existing)\". That works until someone asks what the position was on Tuesday morning. This section sets out both options honestly and states a recommendation."}, {"t": "h", "x": "The two axes"}, {"t": "tbl", "rows": [["Option", "Mechanism", "Gains", "Costs"], ["**A · In-place merge** · SEI v5 position", "Correction updates the Stage 2 row; Gold merges through.", "Smallest tables. Simplest queries. Least build.", "Prior state destroyed. No as-of restatement. Replay cannot restore what it overwrote. Lineage records that a value changed, not what it was."], ["**B · Versioned append** · recommended", "Correction inserts a new version; prior row closed with EFFECTIVE_TO_TS and IS_CURRENT = N.", "As-of restatement works. Replay is meaningful. Audit answerable. Corrections become observable — you can report on their volume and lag.", "Larger tables. Every consumer query needs IS_CURRENT = 'Y' — mitigated by exposing a view. One custom dbt macro to write and maintain."]]}, {"t": "h", "x": "Correction resolution logic"}, {"t": "pre", "x": "-- macro: resolve_corrections(base_rel, corr_rel, natural_key, business_date_col)\n-- used identically by STG2_TRANSACTIONS and STG2_CP_HOLDINGS\n\nWITH unioned AS (\n  SELECT t.*, 0 AS correction_seq, 'ORIGINAL' AS record_source FROM base t\n  UNION ALL\n  SELECT c.*, 1 AS correction_seq, 'CORRECTION'                  FROM corr c\n),\nversioned AS (\n  SELECT u.*,\n         ROW_NUMBER() OVER (\n           PARTITION BY transaction_id, business_date\n           ORDER BY correction_seq, load_timestamp, src_load_id\n         ) AS record_version,\n         LEAD(load_timestamp) OVER (\n           PARTITION BY transaction_id, business_date\n           ORDER BY correction_seq, load_timestamp, src_load_id\n         ) AS effective_to_ts\n  FROM unioned u\n)\nSELECT v.*,\n       v.load_timestamp AS effective_from_ts,\n       CASE WHEN v.effective_to_ts IS NULL THEN 'Y' ELSE 'N' END AS is_current\nFROM versioned v"}, {"t": "h", "x": "Three cases this must handle"}, {"t": "ul", "items": ["**Correction arrives before its original.** Out-of-order delivery. The macro produces a correction with no base — the row must park with DQ_FLAGS = 'ORPHAN_CORRECTION' and be retried on a lookback window, not silently dropped. G3 asserts the orphan count is zero after the window.", "**Two corrections to the same record on the same day.** Ordering by correction_seq alone is insufficient — the tiebreak must be LOAD_TIMESTAMP then SRC_LOAD_ID, and it must be deterministic, or two replays produce two different answers.", "**Correction to a record outside the incremental window.** A correction landing today for a transaction from six weeks ago falls outside a seven-day lookback. Either the window is configurable per feed from the config store (33), or corrections beyond it route to a manual queue. Silence is the wrong answer."]}]}, {"h": "Worked model — STG2_TRANSACTIONS", "blocks": [{"t": "p", "x": "The hardest of the five, because it carries corrections. The other four are simplifications of this shape."}, {"t": "pre", "x": "-- models/stage2/stg2_transactions.sql\n{{ config(\n    materialized = 'incremental',\n    unique_key   = ['transaction_id', 'business_date', 'record_version'],\n    incremental_strategy = 'merge',\n    partition_by = 'business_date',\n    on_schema_change = 'fail'\n) }}\n\n{% set lookback = var('correction_lookback_days', 7) %}   -- sourced from config store 33\n\nWITH src_txn AS (\n    SELECT * FROM {{ source('raw_swp', 'RAW_TRANSACTION') }}\n    WHERE ingestion_status IN ('LOADED')          -- SUPERSEDED loads excluded\n    {% if is_incremental() %}\n      AND business_date >= (SELECT MAX(business_date) - {{ lookback }} FROM {{ this }})\n    {% endif %}\n),\nsrc_corr AS (\n    SELECT * FROM {{ source('raw_swp', 'RAW_CORRECTED_TRANSACTION') }}\n    WHERE ingestion_status IN ('LOADED')\n    {% if is_incremental() %}\n      AND business_date >= (SELECT MAX(business_date) - {{ lookback }} FROM {{ this }})\n    {% endif %}\n),\n\n-- step 2 + 3: standardise then typecast. safe cast: bad values become NULL and are flagged,\n-- never raised — a single malformed amount must not fail the whole model.\ntyped AS (\n    SELECT\n        {{ std_code('transaction_id') }}      AS transaction_id,\n        {{ std_code('account_id') }}          AS account_id,\n        {{ safe_date('trade_date') }}         AS trade_date,\n        {{ safe_date('settle_date') }}        AS settle_date,\n        {{ std_code('transaction_type') }}    AS transaction_type,\n        {{ safe_number('quantity') }}         AS quantity,\n        {{ safe_number('amount') }}           AS amount,\n        business_date, load_id AS src_load_id, row_num AS src_row_num, load_timestamp\n    FROM src_txn\n),\n\n-- step 4: deduplicate within a load, BEFORE any join\ndeduped AS (\n    SELECT * FROM (\n        SELECT t.*, ROW_NUMBER() OVER (\n                 PARTITION BY transaction_id, business_date, src_load_id\n                 ORDER BY src_row_num DESC) AS rn\n        FROM typed t\n    ) WHERE rn = 1\n),\n\n-- step 5: corrections. shared macro — identical logic in STG2_CP_HOLDINGS.\ncorrected AS (\n    {{ resolve_corrections('deduped', 'corr_typed',\n                           natural_key=['transaction_id','business_date']) }}\n),\n\n-- step 6: reference joins, after dedup and corrections\nenriched AS (\n    SELECT c.*, a.account_type, a.base_currency, s.asset_class\n    FROM corrected c\n    LEFT JOIN {{ ref('ref_account') }}  a ON c.account_id = a.account_id\n    LEFT JOIN {{ ref('ref_security') }} s ON c.security_id = s.security_id\n),\n\n-- step 7 + 8: business rules as flags, then derived attributes.\n-- rules FLAG, they do not FILTER. G3 asserts on the flags; dropping rows here\n-- would make the G4 tie-out fail for a reason nobody can see.\nflagged AS (\n    SELECT e.*,\n      CASE WHEN account_type IS NULL         THEN 'UNKNOWN_ACCOUNT;' END ||\n      CASE WHEN settle_date < trade_date    THEN 'SETTLE_BEFORE_TRADE;' END ||\n      CASE WHEN amount IS NULL               THEN 'AMOUNT_UNPARSEABLE;' END AS dq_flags,\n      amount * NVL(fx.rate, 1)               AS amount_base_ccy\n    FROM enriched e\n    LEFT JOIN {{ ref('ref_fx_rate') }} fx\n      ON e.currency = fx.currency AND e.business_date = fx.rate_date\n)\n\nSELECT * FROM flagged"}, {"t": "h", "x": "Accompanying schema.yml — G3 assertions"}, {"t": "pre", "x": "models:\n  - name: stg2_transactions\n    tests:\n      - dbt_utils.unique_combination_of_columns:\n          combination_of_columns: [transaction_id, business_date, record_version]\n      - dbt_utils.expression_is_true:\n          expression: \"NOT (is_current = 'Y' AND effective_to_ts IS NOT NULL)\"\n    columns:\n      - name: transaction_id\n        tests: [not_null]\n      - name: account_id\n        tests:\n          - not_null\n          - relationships: { to: ref('stg2_account'), field: account_id }\n      - name: amount\n        tests:\n          - not_null:\n              config: { severity: \"{{ var('sev_amount_null','error') }}\" }   # from config 33\n      - name: dq_flags\n        tests:\n          - accepted_values:\n              values: ['ORPHAN_CORRECTION']\n              config: { severity: warn }"}, {"t": "p", "x": "Severity is parameterised, not literal. A threshold hardcoded in a dbt test cannot be read by Airflow, so the gate cannot branch on it — see plane 4."}]}, {"h": "Open items on these two layers", "blocks": [{"t": "p", "x": "Ordered by how much rework each one causes if it is answered late."}, {"t": "tbl", "rows": [["#", "Question", "Owner", "Consequence of deciding late"], ["1", "AD-2 Corrections: merge or versioned append", "ARB", "Rewrites both correction-carrying models, the Gold merge, replay, and the lineage claim. Decide first."], ["2", "Replay depth — how many days must be replayable", "Business + BBH ops", "Sets RAW retention and partition compression. Cheap now, a storage migration later."], ["3", "Correction lookback window per feed", "SEI + BBH", "Too short and corrections silently miss; too long and every incremental run scans weeks."], ["4", "Does SEI emit a change indicator or row hash on snapshots", "SEI", "The single largest performance lever available. Without it, Tax Lot is processed in full every night."], ["5", "Natural keys confirmed per domain", "SEI", "Dedup, corrections and SCD2 all key off these. Assumed above; must be confirmed, not inferred."], ["6", "Late-arriving dimension policy — reject or inferred member", "ARB", "Changes the join behaviour in all fact-feeding models."], ["7", "PII classification of Client and Account attributes", "BBH security", "Masking changes the RAW model. Retrofitting masking into an immutable layer is unpleasant."], ["8", "Reference data ownership — security master, FX, hierarchy", "BBH", "Stage 2 lookups assume these exist and are current. None appear in either source deck."]]}]}]}, {"id": "l3-errors", "title": "Error Handling, Quarantine & Override", "level": "L3", "icon": "🚑", "color": "#c0392b", "bg": "#fde8e8", "order": 4, "sub": "detailed design - reject lanes, quarantine, override workflow", "match": "error|quarantine|override|reject|dlq|dead.?letter|replay|exception|recon", "zone_default": "", "default": false, "component_ids": [], "chip": "", "meta": {}, "src": "l3-error-handling.md", "sections": [{"h": "", "blocks": [{"t": "p", "x": "What happens when something fails, and who is allowed to decide it should proceed anyway. Both source decks name this capability in a single line; nothing below it exists yet."}, {"t": "ul", "items": ["Scope", "Taxonomy", "Data model", "Quarantine", "Lifecycle", "Override", "Worked failure", "Interface", "Open items"]}]}, {"h": "What component 29 owns", "blocks": [{"t": "p", "x": "Error handling sits between four neighbours and is easy to over-scope. These lines keep it coherent."}, {"t": "tbl", "rows": [["Component", "Owns", "Does not own"], ["**29 Error handling**", "Taxonomy, error record, quarantine store, resubmission path, routing to alerts.", "Deciding whether a rule failure is fatal — that is severity, owned by 28."], ["28 DQ framework", "Rule registry, severity tiers, thresholds, DQ results store, override authorisation.", "Physical handling of the failed file or row."], ["30 Reconciliation", "Exception lifecycle for reconciliation breaks, control totals, the operator's queue.", "Ingest-time failures. Those are 29's."], ["21 Replay", "Re-running a business date once the underlying problem is fixed.", "Deciding that a replay is warranted."]]}]}, {"h": "Error taxonomy", "blocks": [{"t": "p", "x": "Errors are classified on capture, and the class determines the route. Without this, everything becomes a generic pipeline failure and the operator has to read logs to find out what happened."}, {"t": "tbl", "rows": [["Class", "Name", "Examples", "Default route", "Detected at"], ["E1", "Transport", "File missing, late beyond window, truncated, unreadable, auth failure", "BLOCK FILE", "Sensors (9), landing zone (8)"], ["E2", "Structural", "Encoding, delimiter, column count, header mismatch, manifest count mismatch, checksum", "BLOCK FILE", "G1 (23)"], ["E3", "Type / parse", "Unparseable date, non-numeric amount, oversized value", "FLAG ROW", "Stage 2 safe-cast (15)"], ["E4", "Business rule", "Unknown account, settle before trade, negative quantity where disallowed", "FLAG ROW then G3 asserts", "Stage 2 (15) / G3 (25)"], ["E5", "Reconciliation", "RAW→Gold count mismatch, control total break, orphan correction past window", "BLOCK PUBLISH", "G4 (26) / G5 (27)"], ["E6", "Infrastructure", "DB unavailable, session limit, pod evicted, timeout, disk full", "RETRY", "Any task"], ["E7", "Orchestration", "Upstream dependency failed, window breach, concurrent-run conflict", "PAGE", "Airflow (18, 20)"]]}, {"t": "p", "x": "Default route is what the class does absent a config override. Severity from the registry (28) can escalate FLAG to BLOCK, but never de-escalates E1, E2 or E5."}, {"t": "h", "x": "Retry versus recover"}, {"t": "tbl", "rows": [["Class", "Airflow retry", "Why"], ["E6 only", "Yes, bounded exponential backoff", "Transient infrastructure. The same input will succeed on the next attempt."], ["E1–E5, E7", "**Never**", "The input is unchanged, so the outcome is unchanged. Retrying a DQ failure burns the window and produces a misleading run history where a real data problem looks like flakiness."]]}]}, {"h": "Error record data model", "blocks": [{"t": "p", "x": "One error event table for the whole Hub, written by Python and by Airflow. Integration360 (35) reads it; nothing else writes it."}, {"t": "pre", "x": "CREATE TABLE HUB_ERROR_EVENT (\n  ERROR_ID          NUMBER(18)    GENERATED ALWAYS AS IDENTITY,\n  ERROR_CLASS       VARCHAR2(4)   NOT NULL,   -- E1..E7\n  ERROR_CODE        VARCHAR2(40)  NOT NULL,   -- E2_COLUMN_COUNT_MISMATCH\n  SEVERITY          VARCHAR2(10)  NOT NULL,   -- ERROR | WARN  (resolved from registry 28)\n  ROUTE             VARCHAR2(20)  NOT NULL,   -- BLOCK_FILE | BLOCK_PUBLISH | FLAG_ROW | RETRY | PAGE\n\n  -- context: what was being processed\n  BATCH_ID          VARCHAR2(40),\n  LOAD_ID           NUMBER(18),               -- null for pre-load failures (E1)\n  DOMAIN            VARCHAR2(30),             -- ACCOUNT | TRANSACTION | ...\n  BUSINESS_DATE     DATE,\n  FILE_NAME         VARCHAR2(260),\n  ROW_NUM           NUMBER(12),               -- null for file-level errors\n  GATE              VARCHAR2(4),              -- G1..G5, null if not gate-raised\n  RULE_ID           VARCHAR2(40),             -- FK to the rule registry (28)\n  DAG_RUN_ID        VARCHAR2(120),\n  TASK_ID           VARCHAR2(120),\n\n  -- payload\n  MESSAGE           VARCHAR2(2000) NOT NULL,\n  DETAIL            CLOB,                     -- JSON: expected vs actual, sample values\n\n  -- lifecycle\n  STATUS            VARCHAR2(20)  DEFAULT 'NEW' NOT NULL,\n  ASSIGNED_TO       VARCHAR2(120),\n  RESOLUTION        VARCHAR2(30),             -- RESUBMITTED | OVERRIDDEN | WAIVED | FIXED_UPSTREAM\n  RESOLVED_BY       VARCHAR2(120),\n  RESOLVED_TS       TIMESTAMP,\n  RESOLUTION_NOTE   VARCHAR2(2000),\n\n  CREATED_TS        TIMESTAMP     DEFAULT SYSTIMESTAMP NOT NULL,\n  CONSTRAINT PK_HUB_ERROR_EVENT PRIMARY KEY (ERROR_ID)\n)\nPARTITION BY RANGE (CREATED_TS) INTERVAL (NUMTOYMINTERVAL(1,'MONTH'))\n  (PARTITION P_INIT VALUES LESS THAN (TIMESTAMP '2026-01-01 00:00:00'));\n\nCREATE INDEX IX_ERR_OPEN   ON HUB_ERROR_EVENT (STATUS, SEVERITY, CREATED_TS);\nCREATE INDEX IX_ERR_LOAD   ON HUB_ERROR_EVENT (LOAD_ID);\nCREATE INDEX IX_ERR_BATCH  ON HUB_ERROR_EVENT (BATCH_ID, DOMAIN);"}, {"t": "h", "x": "Error code convention"}, {"t": "p", "x": "{CLASS}_{SUBJECT}_{CONDITION} — for example E2_MANIFEST_COUNT_MISMATCH, E4_ACCOUNT_UNKNOWN, E5_TIEOUT_ROWCOUNT. Codes are registered in the config store (33), not invented at the call site. An unregistered code is itself an error — it fails CI, so the catalogue cannot silently drift."}]}, {"h": "Quarantine store", "blocks": [{"t": "p", "x": "Two levels — whole files that failed G1, and individual rows that could not be parsed into columns at all. Both retain the original bytes."}, {"t": "h", "x": "File-level quarantine"}, {"t": "p", "x": "The file is **copied**, not moved. The landing zone retains its own copy under its own retention — an operator answering \"what did SEI actually send\" should never depend on the quarantine process having worked correctly."}, {"t": "h", "x": "Row-level quarantine"}, {"t": "p", "x": "Applies only where a row cannot be split into columns — ragged delimiter, embedded newline, encoding break. A row that parses but holds a bad value is not quarantined; it loads into RAW as text and is flagged in Stage 2. That distinction keeps RAW faithful."}, {"t": "pre", "x": "CREATE TABLE HUB_QUARANTINE_ROW (\n  QUARANTINE_ID   NUMBER(18)    GENERATED ALWAYS AS IDENTITY,\n  LOAD_ID         NUMBER(18)    NOT NULL,\n  DOMAIN          VARCHAR2(30)  NOT NULL,\n  BUSINESS_DATE   DATE          NOT NULL,\n  FILE_NAME       VARCHAR2(260) NOT NULL,\n  ROW_NUM         NUMBER(12)    NOT NULL,\n  RAW_LINE        CLOB          NOT NULL,   -- the original line, unmodified\n  ERROR_ID        NUMBER(18)    NOT NULL,   -- FK HUB_ERROR_EVENT\n  STATUS          VARCHAR2(20)  DEFAULT 'QUARANTINED',\n  RESUBMIT_LOAD_ID NUMBER(18),               -- the load that later accepted it\n  CREATED_TS      TIMESTAMP     DEFAULT SYSTIMESTAMP\n);"}, {"t": "h", "x": "Retention"}, {"t": "tbl", "rows": [["Store", "Retention", "Driver"], ["Quarantined files", "Match RAW retention", "A replay of day N must be able to see what was rejected on day N. Shorter retention creates a gap in the audit story."], ["Quarantined rows", "Match RAW retention", "Same reasoning."], ["Error events", "Longer — 24 months minimum", "Small table, and the operational history is what evidences control effectiveness to an auditor."]]}, {"t": "p", "x": "RAW retention is itself unset — it depends on the replay-depth decision, still open."}]}, {"h": "Exception lifecycle", "blocks": [{"t": "p", "x": "An error is not an alert. It has states, an owner and a resolution — otherwise the same failure recurs nightly and nobody can say whether it was ever addressed."}, {"t": "tbl", "rows": [["Resolution", "Means", "Triggers"], ["RESUBMITTED", "SEI sent a replacement file; it loaded under a new LOAD_ID.", "Normal ingest. Prior load marked SUPERSEDED."], ["OVERRIDDEN", "A human authorised the blocked run to proceed with the data as-is.", "Override record written; run resumes. See next section."], ["WAIVED", "The condition is known and acceptable; the rule needs adjusting.", "No pipeline action. Raises a change to the rule registry."], ["FIXED_UPSTREAM", "SEI corrected the source; a correction file follows.", "May trigger a replay of affected dates."]]}]}, {"h": "Override path", "blocks": [{"t": "p", "x": "Blocking gates without an override mean a 2am failure waits until morning. An override that is not tightly constrained means the gates are decorative. Both failure modes are real; the design below is the narrow path between them."}, {"t": "h", "x": "Constraints"}, {"t": "ul", "items": ["**Single-run scope, always.** An override authorises one gate, on one LOAD_ID or batch, for one run. It never persists, never applies to a future date, and cannot be set as a standing exemption. A standing exemption is a rule change and goes through the registry.", "**Never available for E5 at G4.** A tie-out break means Gold does not reconcile to RAW. Overriding it publishes knowingly-wrong data to PBDW and IMDS. If the business genuinely needs to publish, that is a business decision recorded outside the pipeline — not a button in it.", "**Two-person rule above a threshold.** Overrides on ERROR-severity failures affecting more than a configured row count or value require a second authoriser. Threshold in the config store.", "**Expires.** An override token is valid for a bounded window — 60 minutes by default. A stale approval cannot be replayed into a later run.", "**Written to lineage, not just to a log.** The override is part of the audit trail for the affected business date. An auditor asking why day N published despite a failure must find the answer in the same place as the rest of the evidence."]}, {"t": "h", "x": "Override record"}, {"t": "pre", "x": "CREATE TABLE HUB_OVERRIDE (\n  OVERRIDE_ID     NUMBER(18)    GENERATED ALWAYS AS IDENTITY,\n  ERROR_ID        NUMBER(18)    NOT NULL,   -- what is being overridden\n  GATE            VARCHAR2(4)   NOT NULL,\n  SCOPE_TYPE      VARCHAR2(20)  NOT NULL,   -- LOAD | BATCH   (never DOMAIN, never STANDING)\n  SCOPE_ID        VARCHAR2(40)  NOT NULL,\n  BUSINESS_DATE   DATE          NOT NULL,\n  JUSTIFICATION   VARCHAR2(2000) NOT NULL,  -- free text, mandatory, min length enforced\n  APPROVER_1      VARCHAR2(120) NOT NULL,\n  APPROVER_2      VARCHAR2(120),               -- required above threshold\n  GRANTED_TS      TIMESTAMP     DEFAULT SYSTIMESTAMP NOT NULL,\n  EXPIRES_TS      TIMESTAMP     NOT NULL,\n  CONSUMED_TS     TIMESTAMP,                   -- set when the gate actually uses it\n  CONSTRAINT CK_OVR_SCOPE CHECK (SCOPE_TYPE IN ('LOAD','BATCH'))\n);"}, {"t": "h", "x": "Gate behaviour with an override present"}, {"t": "p", "x": "The row-level tag matters: downstream consumers and any later investigation can identify exactly which records were published under an override, without reading the override table."}]}, {"h": "Worked failure — G1 column-count mismatch", "blocks": [{"t": "p", "x": "One concrete path through every component above, at 01:14 on a business date."}]}, {"h": "Framework surface", "blocks": [{"t": "p", "x": "One import for Python components, one operator for Airflow. Both write to the same store — an error raised in dbt-land and an error raised in ingest must be indistinguishable to Integration360."}, {"t": "pre", "x": "# hub_framework/errors.py — used by 13, 23, 26, 29, 30\n\nfrom hub_framework.errors import HubError, ErrorClass, raise_blocking\n\nraise_blocking(\n    code       = \"E2_COLUMN_COUNT_MISMATCH\",     # must exist in registry (33)\n    context    = ctx,                              # batch, load, domain, file, date\n    message    = \"header column count 25, expected 24\",\n    detail     = {\"expected\": 24, \"actual\": 25, \"header\": header_line},\n    quarantine = QuarantineFile(path=src_path),    # optional\n)\n# → writes HUB_ERROR_EVENT, copies to quarantine, checks for a valid override,\n#   raises NonRetryableHubError if none. severity resolved from the registry,\n#   never passed by the caller.\n\n# flagging, not blocking — used inside Stage 2 post-processing and G2\nflag_row(code=\"E4_ACCOUNT_UNKNOWN\", context=ctx, row_num=n)\n\n# Airflow side\nfrom hub_framework.operators import GateOperator\n\nGateOperator(\n    task_id   = \"g4_tieout_fact_transactions\",\n    gate      = \"G4\",\n    rule_set  = \"tieout.fact_transactions\",   # resolved from registry\n    scope     = \"{{ ti.xcom_pull('ingest_transaction')['load_id'] }}\",\n    retries   = 0,                            # enforced by the operator regardless\n)"}, {"t": "ul", "items": ["**Severity is never a caller argument.** If a developer can pass severity=\"warn\" at the call site, severity has left the registry and the config-driven design is decorative.", "**Codes are validated at import time** against the registry snapshot, and in CI against the live registry. An unregistered code fails the build.", "**The same context object** flows from the ingest framework through every gate, so LOAD_ID, batch and domain are never reconstructed or guessed."]}]}, {"h": "Open items", "blocks": [{"t": "p", "x": "None of these are technical unknowns. They are decisions about who is accountable when the pipeline stops."}, {"t": "tbl", "rows": [["#", "Question", "Owner", "Why it matters"], ["1", "Who holds override authority, and what is the two-person threshold", "BBH ops + risk", "Without a named role, the override is either unusable at 2am or effectively unrestricted. Both defeat the gates."], ["2", "Is G4 override-eligible at all", "ARB", "Recommendation above is no. If the business disagrees, that needs stating explicitly, not discovering during an incident."], ["3", "Escalation SLA per severity", "BBH ops", "Drives the aged-NEW escalation path and the on-call rota."], ["4", "Quarantine retention — inherits RAW retention, which is unset", "Business + ops", "Depends on the replay-depth decision. Blocked on the same answer."], ["5", "Does SEI receive error notifications automatically", "SEI + BBH", "Most E1/E2 failures are SEI-side. A manual email loop adds hours to every recurrence."], ["6", "Error queue ownership: Integration360 or SEI dashboard AD-6", "ARB", "Two queues means two owners and neither closing the exception."], ["7", "Partial-batch interaction AD-5", "ARB", "Determines whether one domain's E2 failure stops the other six. The taxonomy is ready for either answer."]]}]}]}, {"id": "c13", "title": "Python Ingestion Framework", "level": "L3", "icon": "🧪", "color": "#0e8f7e", "bg": "#dff2ef", "order": 113, "sub": "#13 · 2. Hub · Processing · Python · P1 · custom High · status In Design", "match": "", "zone_default": "", "default": false, "component_ids": ["13"], "chip": "#13 design", "meta": {"status": "In Design", "owner": "TBD", "priority": "P1", "custom": "High", "depends_on": ["8", "9", "14", "23", "28", "29", "31", "33", "55"], "decisions": ["AD-7", "AD-8", "AD-9", "AD-10"], "tiers": ["Stage1-Oracle"], "updated": "2026-08-10"}, "src": "13_Python_Ingestion_Framework_Design.md", "sections": [{"h": "1. Purpose & Scope", "blocks": [{"t": "p", "x": "The ingestion framework moves ~30 inbound feeds across 9 domains from the landing zone into Stage 1 RAW: validating structure, capturing profile metadata, stamping audit columns, and loading. Its single deliverable is **one config-driven framework** — not thirty scripts — that reads its behaviour per feed from the configuration store and exposes a uniform interface regardless of which underlying Oracle load mechanism a given feed uses."}, {"t": "p", "x": "It is the component that makes or breaks the \"config-driven, not hand-written per source\" principle. Every feed that gets its own bespoke script is a feed that must be separately maintained when SEI changes a layout."}, {"t": "p", "x": "**Tiers touched:** Stage 1 Oracle only. It does not read Stage 2, does not touch Exadata Pre-Gold, and has no involvement in the consumer-movement tier."}, {"t": "p", "x": "**AD-7 note:** the program slide labels dbt on the Landing→RAW arrow. That is the known-wrong item. RAW ingestion is Python."}]}, {"h": "2. Context & Dependencies", "blocks": [{"t": "h", "x": "Upstream (Depends On)"}, {"t": "tbl", "rows": [["ID", "Component", "Why required"], ["8", "Landing Zone + transport", "Supplies the file and manifest on a readable volume"], ["9", "File arrival sensors", "Triggers ingestion per file; supplies the manifest completeness signal"], ["33", "Metadata & config store", "Feed spec, column layout, parse rules, load mechanism, G1 rule set"], ["23", "G1 file/structural gate", "Executes inside the framework; blocks the RAW insert"], ["28", "DQ framework", "Resolves severity; results store"], ["29", "Error handling & quarantine", "Error events, quarantine store, resubmission path"], ["31", "Audit & lineage", "`LOAD_ID` allocation and lineage records"], ["14", "Stage 1 RAW", "The load target"], ["55", "Oracle connection pooling", "Bounds concurrency; the real ceiling on fan-out width"]]}, {"t": "h", "x": "Downstream"}, {"t": "ul", "items": ["**14 Stage 1 RAW** — receives loaded rows", "**24 G2 profiling gate** — consumes the profile metadata captured here", "**26 G4 tie-out** — consumes the per-`LOAD_ID` row counts captured here; this is what makes G4 affordable", "**21 Replay engine** — replays a `LOAD_ID` set through this framework"]}, {"t": "h", "x": "Tier placement"}, {"t": "pre", "x": "  Landing Zone (8) ──▶ sensors (9)\n        │\n        ▼\n  ┌───────────────── STAGE 1 (Oracle) ─────────────────┐\n  │                                                    │\n  │   ┌──────────────────────────────────────────┐     │\n  │   │  13 PYTHON INGESTION FRAMEWORK           │     │\n  │   │  spec → validate (G1) → profile →        │     │\n  │   │  stamp → load                            │     │\n  │   └──────────────┬───────────────────────────┘     │\n  │                  ▼                                 │\n  │            14 Stage 1 RAW (immutable)              │\n  └──────────────────┬─────────────────────────────────┘\n                     ▼\n              Stage 2 ──▶ Pre-Gold (66) ──▶ Gold ──▶ consumers\n                          [Exadata]        [standalone]"}]}, {"h": "3. Design Decisions", "blocks": [{"t": "p", "x": "**D1 · One framework or per-feed scripts?**"}, {"t": "p", "x": "**Decision:** One framework. Feed behaviour is entirely config-resolved from component 33; there is no per-feed code path."}, {"t": "p", "x": "**Rationale:** ~30 feeds across 9 domains, with satellites, and a tenth domain plausible. Per-feed scripts multiply maintenance by the feed count and guarantee drift in audit-column handling."}, {"t": "p", "x": "**Consequence:** The framework must be genuinely general on day one. A feed that \"just needs a small tweak\" is a config gap, not a code exception."}, {"t": "p", "x": "**D2 · Which Oracle load mechanism?**"}, {"t": "p", "x": "**Decision:** All three — External Tables, SQL\\*Loader direct path, and `cx_Oracle executemany` — behind one loader interface, selected per feed by config."}, {"t": "p", "x": "**Rationale:** The feeds differ by orders of magnitude. Taxlot and EOD Position are large snapshots suited to External Tables; correction feeds are small and suited to `cx_Oracle` with easy quarantine routing. Committing to one mechanism penalises one end of the range."}, {"t": "p", "x": "**Consequence:** Three implementations to build and test rather than one. Justified because the alternative is either slow small-feed handling or brittle large-feed handling."}, {"t": "p", "x": "**D3 · Are business columns typed at load?**"}, {"t": "p", "x": "**Decision:** No. Every RAW business column is `VARCHAR2`. Casting happens in Stage 2."}, {"t": "p", "x": "**Rationale:** Typing at the RAW boundary means a malformed date rejects the row and destroys the evidence of what SEI actually sent. Honours AD-8's intent, not just its letter."}, {"t": "p", "x": "**Consequence:** G1 reports type violations without blocking their storage. Stage 2 owns safe-cast and flagging."}, {"t": "p", "x": "**D4 · What is the unit of work?**"}, {"t": "p", "x": "**Decision:** One file-load attempt, one `LOAD_ID`. A batch of ~30 files produces ~30 `LOAD_ID`s bound by a `BATCH_ID`."}, {"t": "p", "x": "**Rationale:** Per-domain replay and per-domain fan-out both require file-level granularity. A batch-level identifier cannot express \"replay Positions only\"."}, {"t": "p", "x": "**Consequence:** `LOAD_ID` allocation must be transactional and gap-tolerant."}, {"t": "p", "x": "**D5 · How is redelivery handled?**"}, {"t": "p", "x": "**Decision:** Supersede, never delete. A redelivered file loads under a new `LOAD_ID`; the prior load is flagged `SUPERSEDED`. Rows are retained."}, {"t": "p", "x": "**Rationale:** Deleting and reloading breaks immutability and makes \"what did we hold on Tuesday morning?\" unanswerable. AD-8."}, {"t": "p", "x": "**Consequence:** One partition's additional storage per redelivery. Stage 2 filters on `INGESTION_STATUS = 'LOADED'`."}, {"t": "p", "x": "**D6 · Streaming or full-file read?**"}, {"t": "p", "x": "**Decision:** Streaming, with structural validation performed during the pass rather than as a separate read."}, {"t": "p", "x": "**Rationale:** The largest snapshots cannot be materialised in a pod's memory, and a second pass for validation doubles I/O inside the EOD window."}, {"t": "p", "x": "**Consequence:** G1 checks that require whole-file state — row count against manifest, checksum — complete at end of stream, before commit. The insert is committed only after G1 passes in full."}, {"t": "p", "x": "**D7 · How are satellite feeds handled?**"}, {"t": "p", "x": "**Decision:** Satellites (Optional Fields, Supplement) load to their own RAW tables, in the same wave as their parent, with the parent relationship held in config."}, {"t": "p", "x": "**Rationale:** RAW stores as delivered — a satellite arrives as its own file and must land as its own table. Attachment to the parent entity happens during dimensional assembly (66), not at ingest."}, {"t": "p", "x": "**Consequence:** The fan-out must ensure a parent and its satellites complete together before the wave advances."}]}, {"h": "4a. Diagrams", "blocks": [{"t": "h", "x": "(1) Component / architecture"}, {"t": "p", "x": "```mermaid"}, {"t": "p", "x": "flowchart LR"}, {"t": "p", "x": "subgraph EXT[\"EXTERNAL — SEI / SWP, out of scope\"]"}, {"t": "p", "x": "SEI[\"SWP Platform<br/>~30 feeds, 9 domains\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph ING[\"Ingress\"]"}, {"t": "p", "x": "LZ[\"8 Landing Zone<br/>sFTP · manifest\"]"}, {"t": "p", "x": "SEN[\"9 Arrival sensors<br/>per-file, manifest-aware\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FW[\"13 PYTHON INGESTION FRAMEWORK\"]"}, {"t": "p", "x": "direction TB"}, {"t": "p", "x": "SPEC[\"Spec resolver<br/>reads config by feed_id\"]"}, {"t": "p", "x": "VAL[\"G1 validator (23)<br/>structural · BLOCKING\"]"}, {"t": "p", "x": "PROF[\"Profiler<br/>counts · checksums · nulls\"]"}, {"t": "p", "x": "STAMP[\"Audit stamper<br/>LOAD_ID + 8 columns\"]"}, {"t": "p", "x": "LOAD[\"Loader interface\"]"}, {"t": "p", "x": "L1[\"External Table<br/>large snapshots\"]"}, {"t": "p", "x": "L2[\"SQL*Loader<br/>large deltas\"]"}, {"t": "p", "x": "L3[\"cx_Oracle<br/>corrections, small feeds\"]"}, {"t": "p", "x": "SPEC --> VAL --> PROF --> STAMP --> LOAD"}, {"t": "p", "x": "LOAD --> L1 & L2 & L3"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph S1[\"Stage 1 (Oracle)\"]"}, {"t": "p", "x": "RAW[\"14 RAW_* tables<br/>one per feed<br/>immutable · append-only\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph DOM[\"Domains loaded (config-driven fan-out)\"]"}, {"t": "p", "x": "D1[\"Account &amp; Client (5)\"]"}, {"t": "p", "x": "D2[\"Positions (5)\"]"}, {"t": "p", "x": "D3[\"Other (7)\"]"}, {"t": "p", "x": "D4[\"Fee &amp; Billing (2)\"]"}, {"t": "p", "x": "D5[\"Portfolio &amp; Model (3)\"]"}, {"t": "p", "x": "D6[\"Reporting (2)\"]"}, {"t": "p", "x": "D7[\"Reference &amp; Asset (3)\"]"}, {"t": "p", "x": "D8[\"Transactions (2)\"]"}, {"t": "p", "x": "D9[\"Cash (1)\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph FDN[\"Foundation\"]"}, {"t": "p", "x": "CFG[\"33 Config store<br/>feed spec · layout · rules\"]"}, {"t": "p", "x": "ERR[\"29 Error &amp; quarantine\"]"}, {"t": "p", "x": "DQ[\"28 DQ framework\"]"}, {"t": "p", "x": "LIN[\"31 Audit &amp; lineage\"]"}, {"t": "p", "x": "POOL[\"55 Oracle pooling\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "subgraph DOWN[\"Downstream\"]"}, {"t": "p", "x": "S2[\"15 Stage 2 (Exadata)\"]"}, {"t": "p", "x": "G2[\"24 G2 profiling\"]"}, {"t": "p", "x": "G4[\"26 G4 tie-out\"]"}, {"t": "p", "x": "RPL[\"21 Replay\"]"}, {"t": "p", "x": "end"}, {"t": "p", "x": "SEI -.->|\"file contract\"| LZ"}, {"t": "p", "x": "LZ --> SEN --> SPEC"}, {"t": "p", "x": "DOM -.-> SPEC"}, {"t": "p", "x": "CFG -.-> SPEC & VAL"}, {"t": "p", "x": "VAL -->|\"fail\"| ERR"}, {"t": "p", "x": "DQ -.->|\"severity\"| VAL"}, {"t": "p", "x": "LOAD --> RAW"}, {"t": "p", "x": "POOL -.-> LOAD"}, {"t": "p", "x": "STAMP --> LIN"}, {"t": "p", "x": "PROF -->|\"row counts by LOAD_ID\"| G4"}, {"t": "p", "x": "PROF --> G2"}, {"t": "p", "x": "RAW --> S2"}, {"t": "p", "x": "RPL -.->|\"replay LOAD_ID set\"| SPEC"}, {"t": "p", "x": "classDef ext stroke-dasharray:5 5,stroke:#A82316,color:#A82316"}, {"t": "p", "x": "classDef focal stroke-width:3px,stroke:#16305B"}, {"t": "p", "x": "class SEI,EXT ext"}, {"t": "p", "x": "class SPEC,VAL,PROF,STAMP,LOAD,L1,L2,L3 focal"}, {"t": "pre", "x": "\n### (2) Data flow / sequence\n\n```mermaid\nsequenceDiagram\n  autonumber\n  participant SEN as 9 Sensor\n  participant FW as 13 Framework\n  participant CFG as 33 Config\n  participant G1 as 23 G1 gate\n  participant Q as 29 Quarantine\n  participant RAW as 14 Stage 1 RAW\n  participant LIN as 31 Lineage\n\n  SEN->>FW: file arrived — feed_id, path, manifest\n  FW->>CFG: read spec AS OF business_date\n  CFG-->>FW: layout · parse rules · load mechanism · G1 rule set\n  FW->>LIN: allocate LOAD_ID, bind to BATCH_ID\n  FW->>FW: open stream, select loader per config\n  loop per row (streaming)\n    FW->>G1: structural checks\n    FW->>FW: accumulate profile — counts, checksum, null rates\n  end\n  FW->>G1: end-of-stream checks — row count vs manifest, checksum\n  alt G1 fails\n    G1-->>Q: copy file to quarantine, raise error event\n    Q-->>FW: NonRetryableHubError\n    FW-->>SEN: BLOCK — zero rows in RAW, no retry\n  else G1 passes\n    FW->>FW: stamp LOAD_ID + 8 audit columns\n    FW->>RAW: direct-path load, commit\n    FW->>LIN: record profile — row count, checksum, timings\n    opt redelivery of an already-loaded file\n      FW->>RAW: mark prior LOAD_ID INGESTION_STATUS = 'SUPERSEDED'\n    end\n    FW-->>SEN: LOADED — release downstream (G2, Stage 2)\n  end"}]}, {"h": "4b. Flow Walkthrough", "blocks": [{"t": "p", "x": "1. **Sensor (9)** → detects a file and its manifest entry → invokes the framework with `feed_id`, path, business date"}, {"t": "p", "x": "2. **Framework (13)** → reads the feed spec from config (33) **as of the business date** → layout, parse rules, load mechanism, G1 rule set"}, {"t": "p", "x": "3. **Framework (13)** → allocates a `LOAD_ID` and binds it to the run's `BATCH_ID` → recorded to lineage (31)"}, {"t": "p", "x": "4. **Framework (13)** → selects the loader implementation per config → External Table, SQL\\*Loader, or `cx_Oracle`"}, {"t": "p", "x": "5. **Framework (13)** → opens a streaming read → single pass over the file"}, {"t": "p", "x": "6. **G1 (23)** → per-row structural checks during the pass → column count, delimiter integrity, encoding"}, {"t": "p", "x": "7. **Framework (13)** → accumulates profile metadata in the same pass → row count, checksum, per-column null counts"}, {"t": "p", "x": "8. **G1 (23)** → end-of-stream checks → row count against manifest, file checksum"}, {"t": "p", "x": "9. **G1 fails** → file copied to quarantine (29), error event raised, non-retryable exception → **zero rows enter RAW**, no retry, branch fails"}, {"t": "p", "x": "10. **G1 passes** → framework stamps `LOAD_ID` plus the 8 audit columns onto every row"}, {"t": "p", "x": "11. **Framework (13)** → direct-path load into the feed's RAW table → commit"}, {"t": "p", "x": "12. **Redelivery case** → if a prior `LOAD_ID` exists for the same feed and business date, mark it `SUPERSEDED` → **rows are retained, never deleted**"}, {"t": "p", "x": "13. **Framework (13)** → writes the captured profile — row count by `LOAD_ID`, checksum, timings — to lineage → **this is what G4 later reads instead of rescanning**"}, {"t": "p", "x": "14. **Framework (13)** → returns `LOADED` → sensor releases downstream tasks (G2, then Stage 2)"}, {"t": "p", "x": "**No cross-database hop occurs in this component.** The Stage 2 (Oracle) → Gold (Exadata) hop happens downstream in component 67."}]}, {"h": "4c. Detailed Design", "blocks": [{"t": "h", "x": "Module structure"}, {"t": "pre", "x": "hub_framework/ingestion/\n  __init__.py\n  runner.py            # orchestration entry point, one call per file\n  spec.py              # config resolution → FeedSpec dataclass\n  stream.py            # streaming reader, encoding handling\n  validate.py          # G1 checks (delegates rule set to 23/28)\n  profile.py           # metadata capture during the single pass\n  stamp.py             # audit column injection\n  loaders/\n    base.py            # Loader ABC — the abstraction that keeps D2 honest\n    external_table.py\n    sqlldr.py\n    cx_bulk.py\n  registry.py          # loader selection by config"}, {"t": "h", "x": "Loader interface"}, {"t": "p", "x": "```python"}, {"t": "p", "x": "from abc import ABC, abstractmethod"}, {"t": "p", "x": "class Loader(ABC):"}, {"t": "p", "x": "\"\"\"All loaders present the same contract. The caller never knows which"}, {"t": "p", "x": "mechanism is in use — that is resolved from config per feed.\"\"\""}, {"t": "p", "x": "@abstractmethod"}, {"t": "p", "x": "def prepare(self, spec: FeedSpec, load_id: int) -> None:"}, {"t": "p", "x": "\"\"\"Set up whatever the mechanism needs — external table DDL,"}, {"t": "p", "x": "control file, or bind array.\"\"\""}, {"t": "p", "x": "@abstractmethod"}, {"t": "p", "x": "def load(self, stream: RowStream, spec: FeedSpec, load_id: int) -> LoadResult:"}, {"t": "p", "x": "\"\"\"Consume the validated stream and write to RAW."}, {"t": "p", "x": "MUST use direct path where the mechanism supports it.\"\"\""}, {"t": "p", "x": "@abstractmethod"}, {"t": "p", "x": "def rollback(self, load_id: int) -> None:"}, {"t": "p", "x": "\"\"\"Remove rows for this LOAD_ID if the load fails after partial write."}, {"t": "p", "x": "This is the ONLY sanctioned delete against RAW, and only for an"}, {"t": "p", "x": "uncommitted failed attempt — never for a completed load.\"\"\""}, {"t": "p", "x": "@property"}, {"t": "p", "x": "@abstractmethod"}, {"t": "p", "x": "def supports_streaming(self) -> bool: ..."}, {"t": "pre", "x": "\n### Loader selection matrix\n\n| Mechanism | Config value | Use for | Why |\n|---|---|---|---|\n| External Table | `EXTERNAL_TABLE` | Taxlot, EOD Position, Account, Client, Asset — the large snapshots | One pass; G1 aggregate checks run as SQL over the file; no row shipping to the pod |\n| SQL\\*Loader direct | `SQLLDR` | Large deltas where the file cannot be DB-mounted | Fast bulk insert, bad-file capture built in |\n| `cx_Oracle executemany` | `CX_ORACLE` | Correction feeds, Fund Cutoff Times, small reference feeds | Full control, straightforward row-level quarantine routing |\n\nDefault per feed is set in `CFG_FEED_REGISTRY.LOAD_MECHANISM` and is changeable without code.\n\n### Audit column stamping\n\n```python\n# stamp.py — the 8 columns, applied uniformly. No feed exempts itself.\nAUDIT_COLUMNS = {\n    \"LOAD_ID\":          lambda ctx: ctx.load_id,\n    \"BUSINESS_DATE\":    lambda ctx: ctx.business_date,\n    \"FILE_DATE\":        lambda ctx: ctx.file_date,       # asserted by SEI\n    \"FILE_NAME\":        lambda ctx: ctx.file_name,\n    \"ROW_NUM\":          lambda ctx: ctx.row_ordinal,     # position in file\n    \"LOAD_TIMESTAMP\":   lambda ctx: ctx.run_ts,\n    \"SOURCE_SYSTEM\":    lambda ctx: \"SEI_SWP\",\n    \"INGESTION_STATUS\": lambda ctx: \"LOADED\",\n}\n# ROW_NUM makes a RAW row addressable to a physical line — essential for audit\n# and for the quarantine resubmission path."}, {"t": "h", "x": "Profile capture — sized for G4"}, {"t": "p", "x": "```python"}, {"t": "p", "x": "@dataclass"}, {"t": "p", "x": "class LoadProfile:"}, {"t": "p", "x": "load_id: int"}, {"t": "p", "x": "row_count: int                    # ← G4 compares against this, not COUNT(*)"}, {"t": "p", "x": "file_checksum: str"}, {"t": "p", "x": "bytes_read: int"}, {"t": "p", "x": "null_counts: dict[str, int]       # per column, for G2 thresholds"}, {"t": "p", "x": "distinct_counts: dict[str, int]   # sampled, for G2 cardinality checks"}, {"t": "p", "x": "min_max: dict[str, tuple]         # date range sanity for G2"}, {"t": "p", "x": "duration_ms: int"}, {"t": "pre", "x": "\nThe `row_count` captured here is the single most important artefact this component produces for downstream performance: it converts G4's tie-out from a table scan into a lookup, which is what makes a blocking gate affordable inside the EOD window.\n\n### Concurrency and pooling\n\n```python\n# the framework does not open connections directly — it borrows from the\n# shared pool (55). Pool size, not pod count, is the real fan-out ceiling.\nfrom hub_framework.db import pool\n\nwith pool.acquire(purpose=\"ingest\", feed_id=spec.feed_id) as conn:\n    result = loader.load(stream, spec, load_id)"}, {"t": "tbl", "rows": [["Setting", "Source", "Note"], ["Max concurrent ingest sessions", "Config, bounded by DBA grant (55)", "Exceeding it makes the window longer, not shorter"], ["Per-feed parallel degree", "`CFG_FEED_REGISTRY`", "External Table loads can use PDML; `cx_Oracle` cannot"], ["Pod concurrency", "Airflow (18, 52)", "Must be ≤ pool ceiling or pods queue on connections"]]}, {"t": "h", "x": "Interfaces / contracts"}, {"t": "tbl", "rows": [["Contract", "Owner", "Note"], ["File layout, naming, manifest", "**EXTERNAL — SEI**", "Named boundary; not designed here. Depends on **AD-10** (transport protocol)."], ["Landing zone path convention", "8", "Hub-owned"], ["`LOAD_ID` allocation", "31", "Transactional, gap-tolerant"], ["G1 rule set", "23 / 28", "Resolved from config, not embedded"], ["RAW DDL", "14, generated from 33", "Framework never creates tables at runtime"]]}, {"t": "h", "x": "Config surface (component 33)"}, {"t": "ul", "items": ["Feed registry: `feed_id`, domain, type, wave, parent/satellite, RAW table, load mechanism", "Column layout: ordinal, name, RAW length, target type, parse format, natural key flags", "G1 rule set per feed with severity overrides", "Encoding and delimiter per feed", "Manifest format per feed"]}]}, {"h": "5. Data Quality, Reconciliation & Lineage", "blocks": [{"t": "tbl", "rows": [["Gate", "Position", "Blocking", "Behaviour in this component"], ["**G1 (23)**", "**Inside the framework, before the RAW insert**", "**Yes**", "Structural checks per row and at end of stream. Failure → file quarantined, zero rows loaded, no retry."], ["G2 (24)", "After RAW, before Stage 2", "Yes", "Consumes the profile captured here; not executed here"], ["G4 (26)", "Pre-Gold on Exadata, before publish", "Yes", "Consumes the per-`LOAD_ID` row count captured here"]]}, {"t": "p", "x": "**Quarantine behaviour:**"}, {"t": "ul", "items": ["**File-level** — G1 failure copies (never moves) the file to `/quarantine/{domain}/{business_date}/{load_id}/` with the original bytes, manifest, failure report and metadata.", "**Row-level** — applies only where a row cannot be split into columns at all. A row that parses but holds a bad value loads to RAW as text and is flagged in Stage 2.", "Quarantine is **pre-RAW only**. Nothing is ever removed from RAW."]}, {"t": "p", "x": "**Lineage contribution:** `LOAD_ID` + `ROW_NUM` on every RAW row, carried forward through Stage 2 and Pre-Gold. A Gold value traces to a physical line in a named file. The profile record additionally establishes what the file contained at the moment of load, independent of the table."}]}, {"h": "6. RECOMMENDATION", "blocks": [{"t": "h", "x": "6.1 Central design choice"}, {"t": "p", "x": "**Does the framework commit to a single Oracle load mechanism, or abstract several behind one interface selected per feed?**"}, {"t": "h", "x": "6.2 Options comparison"}, {"t": "tbl", "rows": [["Option", "Description", "Pros", "Cons", "Fit to Oracle/Stage1-2 → Exadata/Gold → movement stack"], ["**A · `cx_Oracle` only**", "One mechanism, `executemany` with bind arrays, for every feed", "Simplest build and test surface. Uniform error handling and row-level quarantine routing. Pure
