<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Integration Hub — Flow</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
/* MOCKUP — not wired to anything. Every number and name on this page comes
   from the SEI pack, the Event 360 workbook, the Stage 2 canonical model or
   the architect review. Nothing here is live.

   The organising rule: the FLOW views carry no provenance, no verdicts and
   no counts of what is missing. One box style. A reader who has never seen
   the programme should follow it cold. The review material lives behind the
   "Open questions" tab, reached deliberately. */
:root{
  --bg:#f5f8f8; --panel:#fff; --panel2:#dfe6e9; --line:#c9d4dc; --sunk:#eef3f5;
  --ink:#10193b; --sub:#4a5a68; --muted:#7b8894;
  --accent:#0f4775; --ok:#159943; --warn:#e67e22; --bad:#c1113a; --info:#0091bf;
  --sei:#0091bf; --bbh:#0f4775;
  /* event kinds — the Event 360 categorical ramp, never reused elsewhere */
  --ev-data:#2a78d6; --ev-marker:#1baf7a; --ev-system:#eb6834;
  /* edge state in the ERD — ordered by how much you can rely on it */
  --e-declared:#1a8f4c; --e-tested:#3a6f9e; --e-inferred:#b0772a;
  --f-ui:"Roboto","Helvetica Neue",Arial,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --panel:#161e26; --panel2:#24303a; --line:#2e3b47; --sunk:#111922;
  --ink:#e8eef4; --sub:#a9b8c6; --muted:#7d8d9c;
  --accent:#5aa8e0; --ok:#3ec27a; --warn:#f0993f; --bad:#ef6b7f; --info:#4fb8e8;
  --sei:#4fb8e8; --bbh:#5aa8e0;
  --ev-data:#5fa0e8; --ev-marker:#3ecf96; --ev-system:#f5885a;
  --e-declared:#2ba05f; --e-tested:#6fa6d4; --e-inferred:#d39a46;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --panel:#161e26; --panel2:#24303a; --line:#2e3b47; --sunk:#111922;
  --ink:#e8eef4; --sub:#a9b8c6; --muted:#7d8d9c;
  --accent:#5aa8e0; --ok:#3ec27a; --warn:#f0993f; --bad:#ef6b7f; --info:#4fb8e8;
  --sei:#4fb8e8; --bbh:#5aa8e0;
  --ev-data:#5fa0e8; --ev-marker:#3ecf96; --ev-system:#f5885a;
  --e-declared:#2ba05f; --e-tested:#6fa6d4; --e-inferred:#d39a46;
  color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);
  font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{padding:18px 16px 60px;max-width:1260px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin:0;letter-spacing:-.01em}
h2{font-size:16px;font-weight:500;margin:0 0 8px}
h3{font-size:13.5px;font-weight:500;margin:0 0 6px}
p{margin:6px 0}
.eyebrow{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted)}
.mono{font-family:var(--f-mono)}
.sub{color:var(--sub)} .mut{color:var(--muted)}
.sm{font-size:12px} .xs{font-size:11px}
.max{max-width:78ch}

header.top{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--warn);color:var(--warn);border-radius:3px;padding:2px 7px}
.spacer{flex:1}
.ghost{font:inherit;font-size:11px;padding:4px 11px;border-radius:3px;cursor:pointer;
  border:1px solid var(--panel2);background:var(--panel);color:var(--accent)}
.ghost:hover{border-color:var(--accent)}

nav.views{display:flex;flex-wrap:wrap;gap:3px;background:var(--sunk);border-radius:999px;
  padding:3px;margin-bottom:6px;width:fit-content;max-width:100%}
nav.views button{font:inherit;font-size:12px;padding:5px 15px;border-radius:999px;
  border:0;background:none;color:var(--sub);cursor:pointer;white-space:nowrap}
nav.views button[aria-pressed="true"]{background:var(--bbh);color:#fff;font-weight:500}

.crumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;
  color:var(--muted);margin:12px 0 14px;min-height:19px}
.crumb button{font:inherit;font-size:12px;background:none;border:0;padding:0;
  color:var(--accent);cursor:pointer}
.crumb button:hover{text-decoration:underline}
.crumb .here{color:var(--ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:15px 17px;margin-bottom:13px}
.card.flush{padding:0;overflow:hidden}
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(205px,1fr));align-items:start}

figure{margin:0}
svg{display:block;width:100%;height:auto}
svg text{font-family:var(--f-ui)}
svg .mono{font-family:var(--f-mono)}
.hit{cursor:pointer}
.hit:hover rect.bx,.hit:hover path.bx{stroke-width:2.2}
.hit:focus{outline:none}
.hit:focus-visible rect.bx,.hit:focus-visible path.bx{stroke:var(--accent);stroke-width:2.6}
figcaption{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:9px;max-width:92ch}

.chip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;border-radius:3px;padding:2px 7px;white-space:nowrap}
.chip.pri{background:var(--bbh);color:#fff}
.chip.std{border:1px solid var(--line);color:var(--muted)}
.chip.ok{background:var(--ok);color:#fff}
.chip.warn{background:var(--warn);color:#fff}
.chip.bad{background:var(--bad);color:#fff}
.chip.data{background:var(--ev-data);color:#fff}
.chip.marker{background:var(--ev-marker);color:#fff}
.chip.system{background:var(--ev-system);color:#fff}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;padding:7px 10px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--sunk);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.pick{cursor:pointer}
tbody tr.pick:hover{background:var(--sunk)}

.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  padding-top:2px}
.kv dd{margin:0}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  border-radius:999px;padding:3px 11px;font-size:11.5px;background:var(--panel)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}

.leglist{list-style:none;margin:0;padding:0;counter-reset:leg}
.leglist li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--sunk)}
.leglist li:first-child{border-top:0}
.legno{flex:0 0 24px;height:24px;border-radius:50%;background:var(--bbh);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center}
.legno.sei{background:var(--sei)}

.ent{border:1px solid var(--line);border-radius:6px;background:var(--panel);
  padding:9px 11px;cursor:pointer}
.ent:hover{border-color:var(--accent)}
.ent.anchor{border-left:3px solid var(--bbh)}
.ent h4{margin:0;font-size:12px;font-weight:500;font-family:var(--f-mono);
  overflow-wrap:anywhere}
.ent .pk{font-size:10.5px;color:var(--muted);font-family:var(--f-mono);
  margin-top:3px;word-break:break-word}
.gapdot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--warn);margin-left:5px;vertical-align:middle}
.gapdot.block{background:var(--bad)}

.note{border-left:3px solid var(--accent);background:var(--sunk);padding:9px 13px;
  border-radius:0 5px 5px 0;font-size:12.5px;margin:10px 0}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.note b{font-weight:500}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);
  margin-top:10px;align-items:center}
.scroll{overflow-x:auto}
@media (max-width:720px){.kv{grid-template-columns:1fr}}
</style>
<body>
<div class="wrap">
<header class="top">
  <h1>CP360 — Integration Hub</h1>
  <span class="tag">Mockup</span>
  <span class="spacer"></span>
  <button class="ghost" id="theme">Theme</button>
</header>

<nav class="views" id="views"></nav>
<div class="crumb" id="crumb"></div>
<main id="main"></main>
</div>
<script>
/* =========================================================================
   DATA — every row traceable to one of four inputs:
     PACK   SEI File Ingestion Framework TDD v2.0 / dbt Transformation Design
            Document v2 / SEI-BBH Integration Architecture v5
     E360   SEI event specification workbook (105 events, 575 fields,
            2 micro-batch markers)
     MODEL  SWP_BBH Normalized Canonical Data Model v1 + ERD draft
     REVIEW the architect review of the event substitution
   ========================================================================= */

/* ---- 1. The four channels across the boundary ------------------------- */
const CHANNELS = [
  { id:"C1", no:1, name:"Change events", dir:"in", transport:"SDC topics",
    role:"primary", y:130, port:"A",
    one:"SEI tells BBH that a row changed. The event carries no data.",
    detail:"Four envelope fields — eventid (a type code, not a message id), key, op (I/U/D) and view. The event names what changed and where to read it; it never carries the change itself. Published on domain topics, at-least-once, ordered within topic and partition only.",
    legs:[
      ["SEI","SWP writes to the Snowflake intake; SDC publishes on the domain topic"],
      ["BBH","Event listener consumes; markers 1000/1001 bracket each commit"],
      ["BBH","Key-set collapser folds repeat keys over the micro-batch window"]],
    src:"E360 · Payload_Structure, Consumption_Guidance" },
  { id:"C2", no:2, name:"Data fetch API", dir:"out", transport:"Apigee + API Gateway",
    role:"primary", y:215, port:"B",
    one:"BBH reads the current state of the keys the events named.",
    detail:"One bound, set-based retrieval per view per micro-batch — not per event. The same gateway and the same contract also serve an on-demand real-time read for consumers that cannot wait for the pipeline: one API, two callers.",
    legs:[
      ["BBH","Set-based puller builds the key set for the view"],
      ["BBH","Call leaves through Apigee and the API Gateway"],
      ["SEI","SEI view API returns current state for the set"]],
    src:"REVIEW · M5 Set-Based Puller" },
  { id:"C3", no:3, name:"File delivery", dir:"in", transport:"SFTP / Momentum",
    role:"standby", y:360, port:"C",
    one:"The daily file set. Generated and held as a recovery route.",
    detail:"SWP writes to SFTP, Momentum copies complete files to the Landing Zone, discovery runs every five minutes and maps one task per file. Validate, load RAW in one transaction, three counts must agree, archive. Under the event-primary posture this is produced each day but not loaded in the ordinary course.",
    legs:[
      ["SEI","SWP extract to SFTP"],
      ["SEI","Momentum copies complete files to the Landing Zone"],
      ["BBH","Scheduled discovery, one mapped task per file, validate, load, archive"]],
    src:"PACK · File Ingestion Framework" },
  { id:"C4", no:4, name:"Loader round trip", dir:"loop", transport:"Gateway + file",
    role:"primary", y:285, port:"B",
    one:"BBH data to SEI, and the outcome back — status by API, detail by file.",
    detail:"Four legs and two transports. The status API carries the verdict and the counts; the error file carries the per-record detail. The response to the originating consumer cannot be sent until both are in and agree.",
    legs:[
      ["BBH","Consumer calls the Hub API with loader details and data"],
      ["BBH","Validate, map to SWP loader format, call the loader API out through the gateway"],
      ["SEI","SEI PS processes; calls Integration 360 with status and counts"],
      ["SEI","Status and error detail arrive as a file on the file transport"]],
    src:"PACK v5 + BBH decision" },
];

/* ---- 2. Inside the Hub — the two clocks ------------------------------- */
const INTRADAY = [
  { id:"H1", n:"Event listener",        t:"Consumes the domain topics; tracks offsets per partition." },
  { id:"H2", n:"Marker tracker",        t:"Watches 1000/1001 on every partition. A commit is whole only when the last topic closes." },
  { id:"H3", n:"Key-set collapser",     t:"Many events on one key inside a window become one key to fetch." },
  { id:"H4", n:"Set-based puller",      t:"One bound retrieval per view per micro-batch, out through the gateway." },
  { id:"H5", n:"Idempotency service",   t:"Same key at the same version lands once. The stream is at-least-once." },
  { id:"H6", n:"Stage-1 loader",        t:"Array insert, one commit per micro-batch. A failed micro-batch rolls back whole." },
  { id:"H7", n:"Micro-batch registry",  t:"One row per micro-batch with a state. The event path's FILE_REGISTRY." },
];
const STANDBY = [
  { id:"F1", n:"Discovery",  t:"Scheduled scan of the Landing Zone, one mapped task per file." },
  { id:"F2", n:"Validation", t:"Readable, header, trailer, zero-row, business date." },
  { id:"F3", n:"RAW load",   t:"One Oracle transaction per file." },
  { id:"F4", n:"Count check",t:"FILE_ROW_COUNT = TRAILER_ROW_COUNT = RAW_ROW_COUNT." },
  { id:"F5", n:"Archive",    t:"Move on success. Commit succeeded but move failed is ARCHIVE_FAILED, never a reload." },
];
const XFORM = [
  { id:"T1", n:"defensive_recheck", t:"Re-asserts the gate inside the run." },
  { id:"T2", n:"STG",  t:"A view, not a table. Computes DQ_STATUS_CD and DQ_FAIL_REASON_CDS." },
  { id:"T3", n:"INT",  t:"PASS rows only. Natural key plus BUSINESS_DATE, partitioned, 7 days." },
  { id:"T4", n:"DIM",  t:"Built first. SCD2 direct-compare MERGE on ACCOUNT_KEY, never the natural key." },
  { id:"T5", n:"FACT", t:"Built second. Dimension-resolved only, never a placeholder key." },
  { id:"T6", n:"DQ + recon", t:"Marks replayed rows resolved, persists DQ and RECON_RESULT." },
  { id:"T7", n:"advance_date_control", t:"The business date moves. Last task in the chain." },
];

/* ---- 3. The gate ------------------------------------------------------ */
const GATE = {
  what:"One guarded UPDATE on DATE_CONTROL takes the business date from PENDING to TRIGGER. Only the run whose UPDATE changes exactly one row may invoke the transformation.",
  arms:[
    { id:"A", live:true, name:"Event arm", sub:"both conditions, not either",
      cond:["Every micro-batch up to the boundary is LOADED",
            "The EOD system event has been received"],
      why:"The system event says SEI finished producing. It says nothing about whether BBH finished consuming. Gating on the event alone lets the transformation run on short Stage 1 — and STG to INT still reconciles, because it ties against a Stage 1 that is itself short.",
      src:"REVIEW · M8 Event Gate Evaluator" },
    { id:"B", live:false, name:"File arm", sub:"recovery route",
      cond:["Expected active DAILY interfaces in FILE_SCHEMA_CONFIG",
            "MINUS distinct ARCHIVED interfaces in FILE_REGISTRY = empty"],
      why:"Runs after every ingestion run including zero-file runs, with trigger_rule all_done. Under the event-primary posture this arm is the recovery path rather than the daily one.",
      src:"PACK · File Ingestion Framework E.2" },
  ],
  sla:"If the cutoff passes and neither arm is satisfied: the date stays PENDING, nothing is triggered, a correlated breach alert is published. On later completion a recovery alert is published and the trigger fires. One SLA model, two triggers.",
  nonGating:"The loader error-detail file must not join the expected set. A clean outbound day produces no file; if that file is an expected daily interface, the set never empties and the inbound day never transforms. Outbound status and inbound completeness are two different clocks.",
};

/* ---- 4. Event 360 — three kinds --------------------------------------- */
const EVKINDS = [
  { k:"Data", cls:"data", var:"--ev-data", cadence:"continuous",
    tells:"A row changed on a named SDC view.",
    carries:"eventid, key, op (I/U/D), view. No payload.",
    note:"The event is a notification. Nothing moves until the puller re-reads current state from the view the event names." },
  { k:"Marker", cls:"marker", var:"--ev-marker", cadence:"~288 / day",
    tells:"A commit boundary on a topic — you have the whole commit, not part of one.",
    carries:"eventId, batchDt, onlineDt. Three fields, no counts.",
    note:"1000 opens and 1001 closes, on every partition of every subscribed topic. The batch is consistent only when the LAST topic closes. A consumer that declares itself done at its own end marker has read part of a transaction. Ids 1000/1001 sit clear of the catalogue's 1–105 and are not catalogue events." },
  { k:"System", cls:"system", var:"--ev-system", cadence:"~once / day",
    tells:"A business process in SWP has finished.",
    carries:"eventId, batchDt, onlineDt.",
    note:"Event 2 — batch date flip, EDB: end-of-day position and accrual processing has completed, and this is the gate for retrieving EOD data. Event 5 — pricing complete, price date flip. A missing system event raises the System Event SLA alert." },
];
const EVRULES = [
  "Marker events carry no record counts, so they cannot be used for record-count completeness.",
  "There is no required processing order between event types. If ordering matters downstream, the listener imposes it.",
  "The stream is at-least-once. Consumers must handle duplicates; the key field is the deduplication identifier.",
  "Events stay on the topic 7 days by default, 90 days maximum by configuration. Recovery is by moving the consumer group offset back.",
  "Published events are immutable. An event at an offset cannot be updated, replaced, corrected or removed.",
  "An MB Start on one domain topic guarantees the same MB Start on every other domain topic.",
];

/* ---- 5. Outbound submission ------------------------------------------- */
const SUBSTATES = [
  ["SUBMITTED","Loader API accepted the push. Nothing known about the outcome."],
  ["ACCEPTED","SEI acknowledged the batch for processing."],
  ["PROCESSED","All records landed. No error file expected."],
  ["PARTIALLY_PROCESSED","Some rejected. The response to the consumer waits on the detail file."],
  ["REJECTED","Batch refused whole."],
  ["STATUS_UNRESOLVED","Past max age with no terminal status. Not left sitting at SUBMITTED for ever."],
  ["RESPONDED","The originating consumer has been called back. Terminal."],
];
const OUTRULES = [
  ["Correlation","One submission id threads all four legs, so a batch has one timeline rather than four logs."],
  ["Reconciliation","The reject count SEI reported by API must equal the row count in the detail file. Disagreement means the picture is incomplete and the consumer is not told it is done."],
  ["Idempotency","SEI will resend status. The same status twice lands once."],
  ["Push and poll","A poller covers non-terminal submissions on a tiered cadence. When push and poll disagree, the poll wins and terminal never regresses."],
  ["Asynchronous by necessity","The API status can say 60 rejected; only the file says which 60. So the consumer contract is acknowledge on submission, respond on completion — never request/response."],
  ["Error file handling","Registry row, header and trailer counts, quarantine on malformed, archive on success — the existing file framework, with the gating flag off."],
];

/* ---- 6. The layers ----------------------------------------------------- */
const LAYERS = [
  { id:"L_RAW", stage:"Stage 1", name:"RAW", shape:"Landing tables, one per feed",
    desc:"What arrived, as it arrived. No keys, no types asserted beyond the landing shape, no rejection.",
    model:null },
  { id:"L_STG", stage:"Stage 2", name:"STG", shape:"A view per source, not a table",
    desc:"Held in memory. Its whole job is the source DQ check: it computes DQ_STATUS_CD and DQ_FAIL_REASON_CDS and persists nothing.",
    model:null },
  { id:"L_INT", stage:"Stage 2", name:"INT — normalised", shape:"52 canonical tables, 10 domains, 3NF",
    desc:"The normalised SWP data model with reference mapping and translation. Fed only by STG PASS rows. Partitioned by BUSINESS_DATE, 7-day retention.",
    model:"stage2" },
  { id:"L_GOLD", stage:"Stage 2", name:"DIM and FACT", shape:"SCD2 dimensions, dimension-resolved facts",
    desc:"DIM is built first and merged by surrogate key. FACT is built second and never carries a placeholder key.",
    model:null },
  { id:"L_PRE", stage:"Pre-Gold", name:"IMDS / PBDW mirror", shape:"Mirror of the warehouse models",
    desc:"Shaped to match what the warehouse already expects, so the final step is movement rather than transformation.",
    model:null },
  { id:"L_WH", stage:"Stage 3", name:"Warehouse", shape:"The actual warehouse",
    desc:"Simple movement from Pre-Gold. No reshaping at this boundary.",
    model:null },
];

/* ---- 7. Stage 2 canonical model --------------------------------------- */
const DOMAINS = [
  { k:"PM", n:"Party Management",            c:11 },
  { k:"AP", n:"Account & Portfolio",         c:10 },
  { k:"AS", n:"Asset & Security Master",     c:3  },
  { k:"PH", n:"Positions & Holdings",        c:6  },
  { k:"TX", n:"Transactions & Cash Activity",c:7  },
  { k:"FB", n:"Fees & Billing",              c:4  },
  { k:"SC", n:"Statements & Communications", c:3  },
  { k:"IP", n:"Investment Product",          c:2  },
  { k:"OS", n:"Organization & Security",     c:3  },
  { k:"RC", n:"Reference & Configuration",   c:3  },
];
const ANCHORS = ["ACCOUNT","PORTFOLIO","ASSET","CLIENT"];

/* [domain, table, pk, [[col,parent],...], source sheet] — model §15 */
const T = [
["PM","CLIENT","CLIENT_ID",[],"Client"],
["PM","CLIENT_ACCOUNT_LINKAGE","CLIENT_ID, ACCOUNT_ID, RELATIONSHIP",[["CLIENT_ID","CLIENT"],["ACCOUNT_ID","ACCOUNT"]],"Client Account Linkage"],
["PM","CLIENT_INVESTMENT_MANAGER",null,[["CLIENT_ID","CLIENT"]],"Client"],
["PM","CLIENT_RELATED_THIRD_PARTY",null,[["CLIENT_ID","CLIENT"]],"Client"],
["PM","CLIENT_SOLUTION",null,[["CLIENT_ID","CLIENT"]],"Client"],
["PM","CLIENT_TAX_PROFILE",null,[["CLIENT_ID","CLIENT"]],"Client"],
["PM","CLIENT_W8_PROFILE",null,[["CLIENT_ID","CLIENT"]],"Client"],
["PM","PARTY_CONTACT","CONTACT_IDENTIFIER, CONTACT_TYPE, ENTITY_IDENTIFIER",[["ENTITY_IDENTIFIER","CLIENT"]],"Contact Details"],
["PM","PARTY_OPTIONAL_FIELDS","PARTY_ID",[["PARTY_ID","CLIENT"]],"Party Optional Fields"],
["PM","PARTY_RELATIONSHIPS","RELATIONSHIP_IDENTIFIER, RELATIONSHIP_ROLE",[],"Relationships"],
["PM","PAY_TO_RECIPIENTS","ACCOUNT_NUMBER, ENTITY_ID, PAY_TO_METHOD, PROFILE_ID",[["ACCOUNT_NUMBER","ACCOUNT"]],"Pay To Recipients"],
["AP","ACCOUNT","ACCOUNT_ID",[],"Account"],
["AP","ACCOUNT_FEE_PACKAGE_ASSOCIATION","ACCOUNT_ID, FEE_PACKAGE_ID",[["ACCOUNT_ID","ACCOUNT"],["FEE_PACKAGE_ID","FEE_PACKAGE"]],"Account"],
["AP","ACCOUNT_INVESTMENT_GUIDELINES","ACCOUNT_ID, INVESTMENT_GUIDELINE_ID",[["ACCOUNT_ID","ACCOUNT"]],"Account"],
["AP","ACCOUNT_INVESTMENT_MANAGER","ACCOUNT_ID, INVESTMENT_MANAGER",[["ACCOUNT_ID","ACCOUNT"]],"Account"],
["AP","ACCOUNT_INVESTMENT_RESTRICTIONS","ACCOUNT_ID, INVESTMENT_RESTRICTIONS",[["ACCOUNT_ID","ACCOUNT"]],"Account"],
["AP","ACCOUNT_OPTIONAL_FIELDS","ACCOUNT_ID, ACCOUNT_NUMBER, ACCOUNT_OPTIONAL_FIELD_ID, ACCOUNT_OPTIONAL_FIELD_VALUE",[["ACCOUNT_ID","ACCOUNT"]],"Account Optional Fields"],

/* ---------- small svg helpers ---------- */
function box(x, y, w, h, label, sub, opt) {
  const o = opt || {};
  const fill = o.fill || "var(--panel)";
  const stroke = o.stroke || "var(--line)";
  const dash = o.dash ? ' stroke-dasharray="5 4"' : "";
  const op = o.dim ? ' opacity="0.62"' : "";
  const pick = o.pick ? ` class="hit" tabindex="0" role="button" data-pick="${o.pick}"` : "";
  const ty = sub ? y + h / 2 - 4 : y + h / 2 + 4;
  return `<g${pick}${op}>
    <rect class="bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"
      fill="${fill}" stroke="${stroke}" stroke-width="1.4"${dash}/>
    <text x="${x + w / 2}" y="${ty}" text-anchor="middle" font-size="${o.fs || 12.5}"
      font-weight="${o.fw || 500}" fill="${o.ink || "var(--ink)"}">${esc(label)}</text>
    ${sub ? `<text x="${x + w / 2}" y="${y + h / 2 + 12}" text-anchor="middle"
      font-size="10.5" fill="var(--muted)">${esc(sub)}</text>` : ""}
  </g>`;
}
function arrow(x1, y1, x2, y2, opt) {
  const o = opt || {};
  const c = o.color || "var(--sub)";
  const dash = o.dash ? ' stroke-dasharray="6 4"' : "";
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}"
    stroke-width="${o.w || 1.6}"${dash} marker-end="url(#ar)"/>`;
}
function poly(pts, opt) {
  const o = opt || {};
  return `<polyline points="${pts}" fill="none" stroke="${o.color || "var(--sub)"}"
    stroke-width="${o.w || 1.6}"${o.dash ? ' stroke-dasharray="6 4"' : ""}
    marker-end="url(#ar)"/>`;
}
function tx(x, y, s, opt) {
  const o = opt || {};
  return `<text x="${x}" y="${y}" text-anchor="${o.a || "start"}" font-size="${o.fs || 11}"
    font-weight="${o.fw || 400}" fill="${o.c || "var(--sub)"}"
    ${o.mono ? 'class="mono"' : ""}>${esc(s)}</text>`;
}

/* ---------- a reusable chain strip ---------- */
function strip(list, opt) {
  const o = opt || {};
  const w = o.w || 150, pitch = w + 14;
  const width = 24 + list.length * pitch;
  let s = `<svg viewBox="0 0 ${width} 96" role="img" aria-label="${esc(o.alt || "")}">${DEFS}`;
  s += `<rect x="4" y="6" width="${width - 8}" height="84" rx="8" fill="var(--sunk)"
    stroke="var(--panel2)"${o.dash ? ' stroke-dasharray="6 4"' : ""}/>`;
  list.forEach((c, i) => {
    const x = 16 + i * pitch;
    s += box(x, 26, w, 48, c.n, "", { pick:o.pick ? o.pick + c.id : null, fs:11.5,
      dim:o.dim, dash:o.dash });
    if (i < list.length - 1) {
      s += arrow(x + w + 1, 50, x + w + 12, 50, { dash:o.dash,
        color:o.dim ? "var(--muted)" : "var(--sub)" });
    }
  });
  return s + `</svg>`;
}

/* Which lane owns which detailed view. A lane that owns one shows it in
   place rather than sending the reader to a separate tab. */
const LANE_VIEW = {
  "ingress/loader":        "loader",
  "ingestion/eventbased":  "intraday",
  "ingestion/filebased":   "standby",
  "orchestration/ingdag":  "gate",
  "orchestration/datectl": "gate",
  "processing/dbt":        "stages",
  "events/listen":         "evkinds",
  "events/pull":           "intraday",
  "events/land":           "intraday",
};
const contById = (id) => CONTAINERS.find((c) => c.id === id) || null;
const laneById = (c, lid) => (c ? c.lanes.find((l) => l.id === lid) : null) || null;

const ST_LABEL = {
  specified: ["ok",   "Specified by SEI"],
  differs:   ["warn", "SEI differs"],
  absent:    ["std",  "Not in SEI's documents"],
};
function stChip(st) {
  const s = ST_LABEL[st] || ST_LABEL.absent;
  return `<span class="chip ${s[0]}">${esc(s[1])}</span>`;
}
/* Membership is by exception, exactly as hubGroups.js has it: a component
   names its lane or falls into the container's last one. Deriving it here
   rather than listing 65 rows keeps the two from drifting — and it is the
   only way OpenShift's 22 components land anywhere at all. */
const BY_PLANE = {
  "Source":"ingress", "Ingress/Egress":"ingress", "Processing":"processing",
  "Orchestration":"orchestration", "Data Quality":"processing",
  "Foundation":"foundation", "Consumers":"processing", "Platform":"openshift",
  "Runtime":"openshift", "Deployment":"openshift", "Operations":"openshift",
  "Event Ingestion":"events", "PS-Orchestration":"ingress",
};
/* The handful where the plane misleads: both gates are filed under Data
   Quality but run inside ingestion, before anything is loaded. */
const OVERRIDE = { "23":"ingestion", "24":"ingestion", "9":"ingestion", "13":"ingestion" };
const OCP_PLANE = { Platform:"platform", Runtime:"runtime",
  Deployment:"deployment", Operations:"operations" };

function groupOf(id) {
  if (OVERRIDE[id]) return OVERRIDE[id];
  const t = TRK[id];
  return t ? (BY_PLANE[t.plane] || "foundation") : null;
}
function laneOf(id, gid) {
  const c = contById(gid);
  if (!c) return null;
  if (gid === "openshift") return OCP_PLANE[(TRK[id] || {}).plane] || "platform";
  const hit = c.lanes.find((l) => (l.reg || []).indexOf(id) >= 0);
  return hit ? hit.id : (c.lanes.length ? c.lanes[c.lanes.length - 1].id : null);
}
function membersOf(c, l) {
  const sei = (l.sei || []).map((id) =>
    ({ k:"S", id, n:SEIN[id] || id, st:"specified" }));
  const reg = Object.keys(TRK)
    .filter((id) => groupOf(id) === c.id && laneOf(id, c.id) === l.id)
    .sort((a, b) => Number(a) - Number(b))
    .map((id) => ({ k:"R", id, n:TRK[id].n, st:TRK[id].st }));
  return sei.concat(reg);
}

function c4Lane(c, l) {
  const m = membersOf(c, l);

function viewC4() {

function viewOpen() {
  const row = (q) => `<div class="card"
    style="border-left:3px solid ${q.sev === "block" ? "var(--bad)" : "var(--warn)"}">
    <div class="eyebrow">${q.sev === "block" ? "Blocks a build" : "Open"}
      · ${esc(q.who)}</div>
    <h3 style="margin-top:6px">${esc(q.t)}</h3>
    <p class="sm sub max">${esc(q.b)}</p></div>`;
  return `<div class="card"><h2>What is not settled</h2>
    <p class="max sub sm">Deliberately behind its own tab. None of this belongs
    on the flow views — a reader learning how the Hub works should not have to
    step over it.</p></div>
    ${OPEN.filter((q) => q.sev === "block").map(row).join("")}
    ${OPEN.filter((q) => q.sev !== "block").map(row).join("")}`;
}

/* ---------- the Stage 2 model ---------- */
function declaredRels() {
  const out = [];
  T.forEach((r) => r[3].forEach((f) => out.push({
    child:r[1], col:f[0], parent:f[1], label:"declared FK",
    kind:"fk", tested:TESTED.has(r[1] + "|" + f[0]) })));
  return out;
}
const DECL = declaredRels();
const INF = INFERRED.map((i) => ({ child:i[0], parent:i[1], col:null,
  label:i[2], kind:"inf", tested:false }));
const ALLREL = DECL.concat(INF);

function domainOf(t) { const r = byName[t]; return r ? r[0] : null; }
/* A relationship belongs to the domain that OWNS the child — the side that
   carries the column. Counting both sides made every domain look busy and
   double-counted every cross-domain join. */
function relsOwned(k) { return ALLREL.filter((r) => domainOf(r.child) === k); }
function relsInto(k) {
  return ALLREL.filter((r) => domainOf(r.parent) === k && domainOf(r.child) !== k);
}
function gapsOn(t) { return GAPS.filter((g) => g.on.indexOf(t) >= 0); }
function intKey(r) {
  return r[2] ? r[2] + ", BUSINESS_DATE"
              : "BUSINESS_DATE only — no dictionary key defined";
}
/* An eight-column key makes one card four times the height of its
   neighbours and the row stops being scannable. Full key on the record. */
function shortKey(r) {
  const parts = intKey(r).split(", ");
  return parts.length <= 4 ? parts.join(", ")
    : parts.slice(0, 3).join(", ") + " +" + (parts.length - 3) + " more";
}
const EDGE = {
  fk:   { c:"var(--e-declared)", t:"Declared FK" },
  inf:  { c:"var(--e-inferred)", t:"Inferred — enforced nowhere" },
};
function edgeRow(r) {
  const e = EDGE[r.kind];
  const test = r.tested
    ? ' <span class="chip std" style="border-color:var(--e-tested);color:var(--e-tested)">dbt test</span>'
    : "";
  return `<tr class="pick" data-tbl="${esc(r.child)}">
    <td><span class="dot" style="background:${e.c}"></span></td>
    <td class="mono" style="font-size:11.5px">${esc(r.child)}${
      r.col ? `<span class="mut"> . ${esc(r.col)}</span>` : ""}</td>
    <td class="mut">to</td>
    <td class="mono" style="font-size:11.5px">${esc(r.parent)}</td>
    <td class="sub xs">${esc(e.t)}${
      r.kind === "inf" ? ` <span class="mut">&mdash; ${esc(r.label)}</span>` : ""}${test}</td></tr>`;
}

function viewLayers() {
  if (S.tbl) return tablePanel(S.tbl);
  if (S.dom) return domainPanel(S.dom);
  if (S.layer === "L_INT") return stage2Panel();
  if (S.layer) {
    const l = LAYERS.find((x) => x.id === S.layer);
    return `<div class="card"><div class="eyebrow">${esc(l.stage)}</div>
      <h2>${esc(l.name)}</h2>
      <p class="sm"><b>${esc(l.shape)}</b></p>
      <p class="max sub">${esc(l.desc)}</p>
      <p class="xs mut" style="margin-top:12px">No table-level model has been
      supplied for this layer yet — which is not the same as there being
      none.</p></div>`;
  }
  const cards = LAYERS.map((l) => `<div class="card" style="cursor:pointer"
    data-layer="${l.id}">
    <div class="eyebrow">${esc(l.stage)}</div>
    <h3 style="margin:4px 0 2px">${esc(l.name)}</h3>
    <p class="sm" style="margin:0"><b>${esc(l.shape)}</b></p>
    <p class="sm sub" style="margin:6px 0 0">${esc(l.desc)}</p>
    ${l.model ? '<p class="xs" style="color:var(--accent);margin:8px 0 0">Open the data model &rarr;</p>' : ""}
    </div>`).join("");
  return `<div class="card"><h2>What the data looks like at each layer</h2>
    <p class="max sub sm">The same slot on every layer, so it is learned once.
    Stage 2 INT is the one with a full table-level model behind it.</p></div>
    <div class="grid g2">${cards}</div>`;
}

function stage2Panel() {
  const cards = DOMAINS.map((d) => {
    const rels = relsOwned(d.k);
    const inf = rels.filter((r) => r.kind === "inf").length;
    const into = relsInto(d.k).length;
    const nokey = T.filter((t) => t[0] === d.k)
      .filter((t) => gapsOn(t[1]).some((g) => g.block)).length;
    return `<div class="card" style="cursor:pointer" data-dom="${d.k}">
      <h3 style="margin:0">${esc(d.n)}</h3>
      <p class="sm mut" style="margin:3px 0 8px">${d.c} tables ·
        ${rels.length} out${into ? ` · ${into} in` : ""}</p>
      <div style="display:flex;gap:7px;flex-wrap:wrap">
        <span class="chip std">${rels.length - inf} declared</span>
        <span class="chip std" style="border-color:var(--e-inferred);color:var(--e-inferred)">${inf} inferred</span>
        ${nokey ? `<span class="chip bad">${nokey} key${nokey > 1 ? "s" : ""} undecided</span>` : ""}
      </div></div>`;
  }).join("");
  const infTotal = ALLREL.filter((r) => r.kind === "inf").length;
  return `<div class="card">
    <div class="eyebrow">Stage 2 · INT · normalised SWP model</div>
    <h2>52 canonical tables, 10 domains</h2>
    <p class="max sub sm">38 SWP feeds, 1,452 business attributes, 3NF. Fed only
    by STG PASS rows, partitioned by BUSINESS_DATE, 7-day retention. Pick a
    domain.</p>
    <div class="legend">
      <span class="pill"><span class="dot" style="background:var(--e-declared)"></span>
        declared foreign key</span>
      <span class="pill"><span class="dot" style="background:var(--e-inferred)"></span>
        inferred — enforced nowhere</span>
      <span class="pill" style="border-color:var(--e-tested)">dbt relationships test</span>
    </div></div>
    <div class="grid g3">${cards}</div>
    <div class="note warn"><b>${infTotal} of ${ALLREL.length} relationships are not
      declared foreign keys</b>, and ${TESTED.size} relationships are proposed as dbt
      tests. Every edge is either declared, tested, or enforced nowhere — and
      the third group is where the build risk sits.</div>
    <div class="card"><div class="eyebrow">The INT contract</div>
      <table><tbody>${INTCONTRACT.map((c) => `<tr>
        <td style="white-space:nowrap">${esc(c[0])}</td>
        <td class="sub">${esc(c[1])}</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><div class="eyebrow">Standard INT columns — on all 52</div>
      <p class="sm sub">Not in the canonical dictionary. Required by the
      contract, so every dictionary key is short by at least one column.</p>
      <table><tbody>${INTSTD.map((c) => `<tr>
        <td class="mono" style="white-space:nowrap">${esc(c[0])}</td>
        <td class="mut xs">${esc(c[1])}</td>
        <td class="sub">${esc(c[2])}</td></tr>`).join("")}</tbody></table></div>`;
}

function domainPanel(k) {
  const tabs = T.filter((t) => t[0] === k);
  const rels = relsOwned(k);
  const into = relsInto(k);
  const ents = tabs.map((t) => {
    const g = gapsOn(t[1]);
    const dot = g.length
      ? `<span class="gapdot ${g.some((x) => x.block) ? "block" : ""}"
         title="${esc(g.map((x) => "Gap " + x.n).join(", "))}"></span>` : "";
    return `<div class="ent ${ANCHORS.indexOf(t[1]) >= 0 ? "anchor" : ""}"
      data-tbl="${esc(t[1])}">
      <h4>${esc(t[1])}${dot}</h4>
      <div class="pk" title="${esc(intKey(t))}">${esc(shortKey(t))}</div></div>`;
  }).join("");
  const outside = [...new Set(rels.concat(into).map((r) => [r.child, r.parent])
    .flat().filter((n) => byName[n] && byName[n][0] !== k))];
  return `<div class="card">
    <h2>${esc(dName[k])}</h2>
    <p class="sm mut">${tabs.length} tables · ${rels.length} relationships out ·
      ${into.length} in · anchors shown with a left rule · a dot marks an
      unresolved model gap</p></div>
    <div class="grid g4">${ents}</div>
    ${outside.length ? `<div class="card"><div class="eyebrow">Also referenced,
      from other domains</div><div class="grid g4" style="margin-top:9px">
      ${outside.map((n) => `<div class="ent ${ANCHORS.indexOf(n) >= 0 ? "anchor" : ""}"
        data-tbl="${esc(n)}"><h4>${esc(n)}</h4>
        <div class="pk">${esc(dName[byName[n][0]])}</div></div>`).join("")}
      </div></div>` : ""}
    <div class="card flush"><div style="padding:14px 17px 0"><div class="eyebrow">
      Relationships from this domain — ${rels.length}</div></div>
      <div class="scroll"><table><tbody>${rels.map(edgeRow).join("")}</tbody></table></div></div>
    ${into.length ? `<div class="card flush"><div style="padding:14px 17px 0">
      <div class="eyebrow">Referenced from other domains — ${into.length}</div></div>
      <div class="scroll"><table><tbody>${into.map(edgeRow).join("")}</tbody></table></div></div>` : ""}`;
}

function tablePanel(n) {
  const r = byName[n];
  if (!r) return `<div class="card">Not in the model.</div>`;
  const kids = ALLREL.filter((x) => x.parent === n);
  const pars = ALLREL.filter((x) => x.child === n);
  const g = gapsOn(n);
  const anchor = ANCHORS.indexOf(n) >= 0;
  const inDomains = anchor
    ? [...new Set(ALLREL.filter((x) => x.parent === n || x.child === n)
        .map((x) => domainOf(x.child === n ? x.parent : x.child)).filter(Boolean))]
    : [];
  return `<div class="card">
    <div class="eyebrow">${esc(dName[r[0]])}${anchor ? " · anchor entity" : ""}</div>
    <h2 class="mono">${esc(n)}</h2>
    ${anchor && inDomains.length ? `<p class="sm sub">Referenced from
      ${inDomains.length} domains — ${esc(inDomains.map((d) => dName[d]).join(", "))}.</p>` : ""}
    <dl class="kv" style="margin-top:12px">
      <dt>INT key</dt><dd class="mono">${esc(intKey(r))}</dd>
      <dt>Dictionary key</dt><dd class="mono ${r[2] ? "" : "mut"}">${
        esc(r[2] || "not defined")}</dd>
      <dt>Source sheet</dt><dd>${esc(r[4])}</dd>
      <dt>Feeds from</dt><dd class="sub">SWP feed &rarr; FILE_SCHEMA_CONFIG interface
        &rarr; Stage 1 RAW &rarr; STG view &rarr; this table</dd>
      <dt>Reconciliation</dt><dd class="sub">STG PASS count = INT count,
        per BUSINESS_DATE &mdash; boundary <span class="mono">STG_TO_INT</span></dd>
      <dt>Retention</dt><dd class="sub">7 days, partition drop on BUSINESS_DATE</dd>
    </dl></div>
    ${g.length ? `<div class="card" style="border-left:3px solid ${
      g.some((x) => x.block) ? "var(--bad)" : "var(--warn)"}">
      <div class="eyebrow">Unresolved on this table</div>
      ${g.map((x) => `<p class="sm" style="margin:8px 0 0">
        <span class="chip ${x.block ? "bad" : "warn"}">Gap ${x.n}${
          x.block ? " · blocks a build" : ""}</span><br>
        ${esc(x.g)}<br><span class="sub">${esc(x.r)}</span></p>`).join("")}</div>` : ""}
    <div class="grid g2">
      <div class="card flush"><div style="padding:14px 17px 0">
        <div class="eyebrow">Points at — ${pars.length}</div></div>
        <div class="scroll"><table><tbody>${
          pars.length ? pars.map(edgeRow).join("")
            : '<tr><td class="mut sm">Nothing.</td></tr>'}</tbody></table></div></div>
      <div class="card flush"><div style="padding:14px 17px 0">
        <div class="eyebrow">Pointed at by — ${kids.length}</div></div>
        <div class="scroll"><table><tbody>${
          kids.length ? kids.map(edgeRow).join("")
            : '<tr><td class="mut sm">Nothing.</td></tr>'}</tbody></table></div></div>
    </div>`;
}


/* ---------- breadcrumb, router, wiring ---------- */
function crumb() {
  const parts = [];
  const label = (ALLVIEWS.find((v) => v[0] === S.view) || ["", ""])[1];
  const root = () => {
    S.chan = S.comp = S.cont = S.lane = S.layer = S.dom = S.tbl = null; draw();
  };
  parts.push({ t:label, go:root });

  if (S.view === "c4") {
    const c = contById(S.cont);
    if (c) parts.push({ t:c.n, go:() => { S.lane = S.comp = null; draw(); } });
    const l = laneById(c, S.lane);
    if (l) parts.push({ t:l.n, go:() => { S.comp = null; draw(); } });
    if (S.comp) {
      const k = S.comp[0], id = S.comp.slice(1);
      parts.push({ t:k === "S" ? (SEIN[id] || id) : ((TRK[id] || {}).n || id) });
    }
  }
  if (S.view === "hubchain" && S.comp) {
    const [k, id] = S.comp.split(":");
    const l = (k === "H" ? INTRADAY : k === "F" ? STANDBY : XFORM).find((x) => x.id === id);
    if (l) parts.push({ t:l.n });
  }
  if (S.view === "layers" && S.layer) {
    const l = LAYERS.find((x) => x.id === S.layer);
    parts.push({ t:l.stage + " " + l.name, go:() => { S.dom = S.tbl = null; draw(); } });
    if (S.dom) parts.push({ t:dName[S.dom], go:() => { S.tbl = null; draw(); } });
    if (S.tbl) parts.push({ t:S.tbl });
  }
  const host = document.getElementById("crumb");
  host.innerHTML = parts.map((p, i) => {
    const sep = i ? '<span class="mut">&rsaquo;</span>' : "";
    return sep + (p.go && i < parts.length - 1
      ? `<button data-crumb="${i}">${esc(p.t)}</button>`
      : `<span class="here">${esc(p.t)}</span>`);
  }).join("");
  host.querySelectorAll("[data-crumb]").forEach((b) => {
    b.onclick = () => parts[+b.dataset.crumb].go();
  });
}

/* A component picked from a chain strip has no C4 home of its own, so it
   renders on its own screen rather than pretending to be a lane member. */
function viewHubChain() {
  if (S.comp) return compPanel(S.comp);
  return `<div class="card"><h2>Pick a step</h2></div>`;
}

function draw() {
  document.getElementById("views").innerHTML = VIEWS.map((v) =>
    `<button data-view="${v[0]}" aria-pressed="${S.view === v[0]}">${esc(v[1])}</button>`
  ).join("");
  const m = document.getElementById("main");
  m.innerHTML = S.view === "c4" ? viewC4()
    : S.view === "gate" ? viewGate()
    : S.view === "layers" ? viewLayers()
    : S.view === "outbound" ? viewOut()
    : S.view === "hubchain" ? viewHubChain()
    : viewOpen();
  crumb();
  wire();
  toHash();
}

function go(view) {
  S.view = view; S.chan = S.comp = null;
  if (view !== "c4") { S.cont = S.lane = null; }
  if (view !== "layers") { S.layer = S.dom = S.tbl = null; }
  draw();
}

/* Deep links, so a screen can be sent to someone rather than described.
   #c4/ingress/loader, #c4//-/R10, #layers/L_INT/PH/TAXLOT, #gate */
function fromHash() {
  const raw = location.hash.replace(/^#/, "");
  if (!raw) return false;
  const p = raw.split("/").map(decodeURIComponent);
  if (!ALLVIEWS.some((x) => x[0] === p[0])) return false;
  S.view = p[0]; S.chan = null;
  S.cont = S.lane = S.comp = S.layer = S.dom = S.tbl = null;
  if (S.view === "c4") { S.cont = p[1] || null; S.lane = p[2] || null; S.comp = p[3] || null; }
  else if (S.view === "layers") { S.layer = p[1] || null; S.dom = p[2] || null; S.tbl = p[3] || null; }
  else if (S.view === "hubchain") { S.comp = p[1] || null; }
  return true;
}
function toHash() {
  const p = [S.view];
  if (S.view === "c4" && S.cont) {
    p.push(S.cont);
    if (S.lane) p.push(S.lane);
    if (S.comp) { if (!S.lane) p.push("-"); p.push(S.comp); }
  }
  if (S.view === "layers" && S.layer) {
    p.push(S.layer);
    if (S.dom) p.push(S.dom);
    if (S.tbl) p.push(S.tbl);
  }
  if (S.view === "hubchain" && S.comp) p.push(S.comp);
  const h = "#" + p.map(encodeURIComponent).join("/");
  if (location.hash !== h) history.replaceState(null, "", h);
}

function wire() {
  document.querySelectorAll("[data-view]").forEach((b) => {
    b.onclick = () => go(b.dataset.view);
  });
  document.querySelectorAll("[data-cont]").forEach((d) => {
    d.onclick = () => { S.view = "c4"; S.cont = d.dataset.cont;
      S.lane = S.comp = null; draw(); };
  });
  document.querySelectorAll("[data-lane]").forEach((d) => {
    d.onclick = () => { S.lane = d.dataset.lane; S.comp = null; draw(); };
  });
  document.querySelectorAll("[data-comp]").forEach((d) => {
    d.onclick = (e) => { e.stopPropagation(); S.view = "c4";
      S.comp = d.dataset.comp; draw(); };
  });
  document.querySelectorAll("[data-stage]").forEach((d) => {
    d.onclick = () => {
      if (d.dataset.stage === "stage2int") {
        S.view = "layers"; S.layer = "L_INT"; S.dom = S.tbl = null;
      } else {
        S.view = "layers"; S.layer = null;
      }
      draw();
    };
  });
  document.querySelectorAll("[data-pick]").forEach((g) => {
    const act = () => {
      const p = g.dataset.pick;
      if (p === "HUB") { S.view = "c4"; S.cont = "events"; S.lane = null; return draw(); }
      if (p === "OUT") return go("outbound");
      if (p === "GATE") { S.view = "c4"; S.cont = "orchestration"; S.lane = null; return draw(); }
      if (p.slice(0, 3) === "LAY") {
        S.view = "layers"; S.layer = null; S.dom = S.tbl = null; return draw();
      }
      if (p.indexOf(":") > 0) { S.view = "hubchain"; S.comp = p; return draw(); }
      S.view = "c4"; S.cont = S.lane = null; S.chan = p; draw();
    };
    g.onclick = act;
    g.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); }
    };
  });
  document.querySelectorAll("[data-layer]").forEach((d) => {
    d.onclick = () => { S.layer = d.dataset.layer; S.dom = S.tbl = null; draw(); };
  });
  document.querySelectorAll("[data-dom]").forEach((d) => {
    d.onclick = () => { S.dom = d.dataset.dom; S.tbl = null; draw(); };
  });
  document.querySelectorAll("[data-tbl]").forEach((d) => {
    d.onclick = () => {
      S.view = "layers"; S.layer = "L_INT";
      S.tbl = d.dataset.tbl;
      if (!S.dom) S.dom = domainOf(S.tbl);
      draw();
    };
  });
}

document.getElementById("theme").onclick = () => {
  const r = document.documentElement;
  const now = r.getAttribute("data-theme");
  const dark = now ? now === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
};

fromHash();
addEventListener("hashchange", () => { if (fromHash()) draw(); });
draw();
</script>
</body>
</html>
