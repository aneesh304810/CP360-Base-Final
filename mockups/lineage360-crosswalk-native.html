<title>Lineage 360 Crosswalk</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  /* Tokens lifted from ui/src/bbhTheme.js — tLight, then tDark. */
  :root{
    color-scheme: light;
    --bg:#f5f8f8; --panel:#ffffff; --panel2:#dfe6e9; --border:#b5b6b6;
    --text:#333333; --sub:#666666; --muted:#999999;
    --navy:#10193b; --accent:#0f4775; --mutedBlue:#5f87a7; --tint:#cae3ee;
    --pop:#31bced; --hover:#0091bf; --hoverBg:#eeeeee;
    --success:#159943; --successBg:#d0ebd9;
    --danger:#c1113a;  --dangerBg:#f3d2d7;
    --warning:#e67e22; --warningBg:#fae5d3;
    --info:#0091bf;    --infoBg:#e0f5fd;
    --bronze:#b45309;  --bronzeBg:#f7e9d6;
    --purple:#7c3aed;  --purpleBg:#efe6fb;
    --star:#b5651d; --starBg:#f6ecdf;
    --uaf:#0b7d7d;  --uafBg:#e6f6f6;
    --sei:#0091bf;  --seiBg:#e0f5fd;
    --srcC:#7c3aed; --stg1C:#00a3a3; --stg2C:#0091bf; --dwhC:#0f4775;
    --groupGrad: linear-gradient(to right,#eef3f8,#f7fafc);
    --trk:#e8edf2; --bizInk:#7b8894; --bizRule:#c9d4dc;
    --popShadow:0 12px 34px rgba(16,25,59,.16);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#0b1220; --panel:#0f172a; --panel2:#111c34; --border:#1e293b;
      --text:#e2e8f0; --sub:#94a3b8; --muted:#64748b;
      --navy:#0a0f24; --accent:#5aa0dc; --mutedBlue:#7f9dba; --hoverBg:#111c34;
      --success:#4ecb7c; --successBg:#12301f;
      --danger:#ff7f8f;  --dangerBg:#3a1119;
      --warning:#f0a05a; --warningBg:#33230f;
      --info:#4cc0ec;    --infoBg:#0d2a38;
      --bronze:#d9944a;  --bronzeBg:#2e2110;
      --purple:#b295f0;  --purpleBg:#231a3b;
      --star:#dda061; --starBg:#2f2313;
      --uaf:#4fc4c4;  --uafBg:#0d2b2b;
      --sei:#4cc0ec;  --seiBg:#0d2a38;
      --srcC:#a98cf5; --stg1C:#3fc7c7; --stg2C:#4cc0ec; --dwhC:#6aa9dd;
      --groupGrad: linear-gradient(to right,#16223c,#111a30);
      --trk:#1b2740; --bizInk:#8fa3b5; --bizRule:#243049;
      --popShadow:0 12px 34px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#0b1220; --panel:#0f172a; --panel2:#111c34; --border:#1e293b;
    --text:#e2e8f0; --sub:#94a3b8; --muted:#64748b;
    --navy:#0a0f24; --accent:#5aa0dc; --mutedBlue:#7f9dba; --hoverBg:#111c34;
    --success:#4ecb7c; --successBg:#12301f;
    --danger:#ff7f8f;  --dangerBg:#3a1119;
    --warning:#f0a05a; --warningBg:#33230f;
    --info:#4cc0ec;    --infoBg:#0d2a38;
    --bronze:#d9944a;  --bronzeBg:#2e2110;
    --purple:#b295f0;  --purpleBg:#231a3b;
    --star:#dda061; --starBg:#2f2313;
    --uaf:#4fc4c4;  --uafBg:#0d2b2b;
    --sei:#4cc0ec;  --seiBg:#0d2a38;
    --srcC:#a98cf5; --stg1C:#3fc7c7; --stg2C:#4cc0ec; --dwhC:#6aa9dd;
    --groupGrad: linear-gradient(to right,#16223c,#111a30);
    --trk:#1b2740; --bizInk:#8fa3b5; --bizRule:#243049;
    --popShadow:0 12px 34px rgba(0,0,0,.5);
  }

  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:Roboto,"Helvetica Neue",Arial,sans-serif; font-size:14px; line-height:1.45 }
  *{box-sizing:border-box}
  .mono{font-family:"Roboto Mono",ui-monospace,Menlo,monospace}
  .num{font-variant-numeric:tabular-nums}
  button,input{font-family:inherit}
  :focus-visible{outline:2px solid var(--pop); outline-offset:1px}
  .page{ padding:26px 24px 60px; max-width:1560px; margin:0 auto }
  @media (max-width:640px){ .page{padding:18px 16px 48px} }

  h1.sh{ font-size:24px; font-weight:500; color:var(--accent);
    border-bottom:2px solid var(--accent); padding-bottom:15px; margin:0 0 18px }
  .strap{ font-size:12px; color:var(--sub); margin:-8px 0 16px }

  /* door pill + scope chip — LineageHome */
  .doorbar{ display:flex; align-items:center; gap:12px; margin:10px 0 16px; flex-wrap:wrap }
  .doors{ display:inline-flex; background:var(--navy); border-radius:999px; padding:2px }
  .doors button{ font-size:11px; padding:4px 14px; border-radius:999px; border:none;
    background:transparent; color:#8fb4dd; cursor:pointer }
  .doors button[aria-pressed="true"]{ background:var(--pop); color:var(--navy); font-weight:700 }
  .scopeWrap{ position:relative }
  .scopeChip{ display:inline-flex; align-items:center; gap:7px; font-size:11px; font-weight:700;
    border-radius:999px; padding:5px 13px; cursor:pointer; background:var(--panel);
    border:1.5px solid var(--panel2); color:var(--navy) }
  :root[data-theme="dark"] .scopeChip{ color:var(--text) }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .scopeChip{ color:var(--text) } }
  .scopeChip[aria-expanded="true"]{ border-color:var(--accent) }
  .scopeChip .d{ width:7px; height:7px; border-radius:50%; background:#0b7d9e }
  .scopeChip .inb{ font-size:8px; font-weight:700; border-radius:999px; padding:1px 6px;
    background:var(--warning); color:#fff }
  .scopeChip .car{ font-size:9px; color:var(--muted) }
  .catch{ position:fixed; inset:0; z-index:30 }
  .pop{ position:absolute; top:calc(100% + 7px); left:0; z-index:31; min-width:390px;
    background:var(--panel); border:1px solid var(--panel2); border-radius:8px;
    box-shadow:var(--popShadow); overflow:hidden }
  .popRow{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; padding:9px 13px }
  .popRow + .popRow{ border-top:1px solid var(--panel2) }
  .popLbl{ font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.5px;
    color:var(--muted); width:76px; flex:0 0 auto }
  .popBtn{ font-size:11px; font-weight:700; padding:4px 11px; border-radius:999px; cursor:pointer;
    border:1.5px solid var(--panel2); background:var(--panel); color:var(--sub) }
  .popBtn[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff }
  .laneBtn{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    padding:4px 11px; border-radius:999px; cursor:pointer; background:var(--panel);
    border:1.5px solid var(--panel2); color:var(--sub) }
  .laneBtn i{ width:7px; height:7px; border-radius:50%; background:var(--lc); display:inline-block }
  .laneBtn[aria-pressed="true"]{ background:var(--lc); border-color:var(--lc); color:#fff }
  .laneBtn[aria-pressed="true"] i{ background:#fff }
  .popBack{ padding:9px 13px; cursor:pointer; font-size:11px; font-weight:600; color:var(--accent);
    background:var(--bg); border-top:1px solid var(--panel2) }

  /* tabs + segmented — LegacyLineage */
  .tabrow{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:0 0 14px;
    border-bottom:1px solid var(--panel2) }
  .tab{ font-size:12.5px; font-weight:600; padding:9px 16px; cursor:pointer; color:var(--sub);
    margin-bottom:-1px; border:none; background:none; border-bottom:2px solid transparent }
  .tab[aria-selected="true"]{ color:var(--accent); border-bottom-color:var(--accent) }
  .tabright{ margin-left:auto; display:flex; align-items:center; gap:8px; padding-bottom:6px; flex-wrap:wrap }
  .seg{ display:inline-flex }
  .seg button{ font-size:11.5px; font-weight:700; padding:7px 16px; cursor:pointer;
    border-style:solid; border-color:var(--panel2); border-width:1px 1px 1px 0;
    background:var(--panel); color:var(--sub) }
  .seg button:first-child{ border-left-width:1px; border-radius:3px 0 0 3px }
  .seg button:last-child{ border-radius:0 3px 3px 0 }
  .seg button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#fff }
  .srch{ height:30px; border:1px solid var(--panel2); border-radius:3px; padding:0 10px; font-size:12px;
    width:190px; background:var(--panel); color:var(--text) }

  /* fgShell */
  .grp{ background:var(--panel); border:1px solid var(--panel2); border-radius:8px;
    margin-bottom:12px; overflow:hidden }
  .grpH{ display:flex; align-items:center; gap:11px; padding:12px 17px; cursor:pointer;
    background:var(--groupGrad); flex-wrap:wrap }
  .grpH .car{ font-size:10px; color:var(--muted) }
  .grpH .nm{ font-size:14.5px; font-weight:700; color:var(--navy) }
  :root[data-theme="dark"] .grpH .nm{ color:var(--text) }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .grpH .nm{ color:var(--text) } }
  .grpH .gsrc{ font-size:8.5px; font-weight:700; letter-spacing:.4px; padding:2px 7px; border-radius:2px;
    background:var(--infoBg); color:var(--info) }
  .grpH .stat{ margin-left:auto; font-size:10.5px; color:var(--muted) }
  .grpH .trk{ height:5px; width:100px; background:var(--trk); border-radius:3px; overflow:hidden; display:flex; flex-shrink:0 }
  .grpB{ padding:14px 17px }
  .bar{ display:flex; height:100%; width:100% }
  .bar i{ display:block; height:100% }

  /* tables */
  .tw{ overflow-x:auto; border:1px solid var(--panel2); border-radius:3px; background:var(--panel) }
  table{ border-collapse:collapse; width:100%; font-size:12px; min-width:680px }
  thead th{ background:var(--bg); text-align:left; padding:8px 12px; font-size:9.5px; font-weight:700;
    letter-spacing:.5px; color:var(--muted); text-transform:uppercase; white-space:nowrap;
    border-bottom:1px solid var(--panel2) }
  tbody td{ padding:8px 12px; border-top:1px solid var(--panel2); vertical-align:top }
  tbody tr.click{ cursor:pointer } tbody tr.click:hover{ background:var(--hoverBg) }
  tbody tr.on{ background:var(--infoBg) }
  td .sub{ display:block; font-size:10px; color:var(--muted); margin-top:2px }

  .pill{ display:inline-block; font-size:9px; font-weight:700; letter-spacing:.4px;
    padding:2px 8px; border-radius:999px; white-space:nowrap }
  .flag{ display:inline-block; font-size:8.5px; font-weight:500; padding:1px 6px; border-radius:2px;
    border:1px solid currentColor; margin:2px 3px 0 0; white-space:nowrap }
  .sysTag{ display:inline-block; font-size:9px; font-weight:700; letter-spacing:.4px;
    padding:2px 7px; border-radius:2px; white-space:nowrap }

  /* chain nodes */
  .chain{ display:flex; align-items:stretch; flex-wrap:wrap }
  .node{ flex:1 1 105px; min-width:0; border:1px solid var(--panel2); border-left:3px solid var(--nc);
    border-radius:3px; padding:7px 9px; background:var(--panel) }
  .node b{ display:block; font-size:8.5px; font-weight:700; letter-spacing:.4px; color:var(--nc) }
  .node span{ display:block; font-size:11px; color:var(--text); margin-top:3px; word-break:break-word }
  .node em{ display:block; font-size:9.5px; color:var(--muted); font-style:normal; margin-top:2px }
  .arw{ width:18px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; flex-shrink:0 }

  /* business / source grammar — copied from BizLineage via SourceLineage */
  .bizH{ font-size:19px; font-weight:500; color:var(--text); margin:0 0 4px }
  .bizSub{ font-size:12.5px; color:var(--bizInk); margin:0 0 16px }
  .bizGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px }
  .bizCard{ border:1px solid var(--bizRule); border-radius:3px; padding:15px 16px; background:var(--panel); cursor:pointer }
  .bizCard:hover{ border-color:var(--accent) }
  .ring{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; flex-shrink:0 }
  .ring .inner{ width:44px; height:44px; border-radius:50%; background:var(--panel);
    display:grid; place-items:center; font-size:20px }
  .circ{ width:54px; height:54px; border-radius:50%; background:var(--panel); display:grid;
    place-items:center; font-size:22px; flex-shrink:0; border:2.5px solid var(--cc) }
  .circSm{ width:32px; height:32px; border-radius:50%; background:var(--panel); display:grid;
    place-items:center; font-size:13px; flex-shrink:0; border:2.5px solid var(--cc) }
  .stgRow{ display:flex; align-items:center; gap:0; flex-wrap:wrap; margin-top:12px }
  .stgRow .lnk{ flex:1 1 20px; height:2px; background:var(--bizRule); min-width:14px }
  .stgLbl{ font-size:11px; color:var(--bizInk); text-align:center; margin-top:5px }
  .crumbs{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--bizInk); margin-bottom:12px; flex-wrap:wrap }
  .crumbs button{ border:none; background:none; color:var(--accent); font-size:11.5px; cursor:pointer; padding:0; font-weight:600 }

  .clsRow{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--bizRule); cursor:pointer }
  .clsRow:hover{ background:var(--hoverBg) }
  .clsDot{ width:10px; height:10px; border-radius:50%; flex-shrink:0 }

  .legend{ display:flex; flex-wrap:wrap; gap:13px; margin-top:10px }
  .legend span{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--sub) }
  .legend i{ width:12px; height:3px; border-radius:2px; display:inline-block }
  .legend i.sq{ width:11px; height:11px; border-radius:2px }

  .note{ background:var(--warningBg); border:1px solid var(--panel2); border-left:3px solid var(--warning);
    border-radius:3px; padding:11px 14px; margin-top:16px; font-size:11.5px; color:var(--sub); line-height:1.55 }
  .note b{ color:var(--text) }
  .callout{ border:1px solid var(--panel2); border-left:3px solid var(--cc); border-radius:3px;
    padding:11px 14px; margin-top:11px; background:var(--panel) }
  .callout h4{ margin:0 0 5px; font-size:12.5px; font-weight:700; color:var(--navy) }
  :root[data-theme="dark"] .callout h4{ color:var(--text) }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .callout h4{ color:var(--text) } }
  .callout p{ margin:0; font-size:11.5px; color:var(--sub); line-height:1.6 }
  .meta{ display:flex; flex-wrap:wrap; gap:10px; margin-top:8px; font-size:10px; color:var(--muted) }
  .meta b{ color:var(--sub); font-weight:700 }

  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:14px }
  .kpi{ background:var(--panel); border:1px solid var(--panel2); border-top:3px solid var(--kc);
    border-radius:3px; padding:11px 13px }
  .kpi .v{ font-size:24px; font-weight:500; line-height:1; color:var(--kc) }
  .kpi .k{ font-size:11px; margin-top:6px; color:var(--text) }
  .kpi .s{ font-size:10px; color:var(--muted); margin-top:2px; line-height:1.4 }
  .empty{ padding:36px 20px; text-align:center; color:var(--muted); font-size:12.5px;
    background:var(--panel); border:1px solid var(--panel2); border-radius:8px }
  .mapWrap{ overflow-x:auto }
  .mapHd{ font-size:9px; font-weight:700; letter-spacing:.5px; color:var(--muted); text-transform:uppercase }
  .mcard{ position:absolute; box-sizing:border-box; border:1px solid var(--panel2);
    border-left:3px solid var(--mc); border-radius:3px; background:var(--panel);
    padding:5px 8px; display:flex; flex-direction:column; justify-content:center; overflow:hidden }
  .mcard .t{ font-size:10.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .mcard .s{ font-size:9px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px }
</style>

<div class="page">
  <h1 class="sh">Lineage</h1>
  <div class="strap">End-to-end lineage — source → contract → warehouse, with the SEI crosswalk layered on the lanes it replaces</div>

  <div class="doorbar">
    <span class="doors" id="doors"></span>
    <span class="scopeWrap">
      <button class="scopeChip" id="scopeChip" aria-expanded="false"></button>
      <span id="popHost"></span>
    </span>
  </div>

  <div id="body"></div>
</div>
<script>
(function(){
  "use strict";

  var LANE = {
    STAR:{label:"STAR", full:"STAR → IMDS", state:"REPLACED", contract:"STAR-compatible",
      c:"var(--star)", bg:"var(--starBg)", icon:"📄", feedWord:"nightly extract"},
    UAF: {label:"UAF", full:"UAF → IMDS", state:"NOT_REPLACED", contract:null,
      c:"var(--uaf)", bg:"var(--uafBg)", icon:"📨", feedWord:"MQ message"},
    SEI: {label:"SEI", full:"SEI → IMDS", state:"PROPOSED", contract:"via STAR-compatible",
      c:"var(--sei)", bg:"var(--seiBg)", icon:"☁️", feedWord:"EOD file"}
  };
  var V = {
    PROVEN_MATCH:  {t:"PROVEN",       c:"var(--success)", b:"var(--successBg)", bar:"#159943"},
    UNKNOWN:       {t:"UNKNOWN",      c:"var(--muted)",   b:"var(--hoverBg)",   bar:"#b8c3cc"},
    DECODE_NEEDED: {t:"DECODE",       c:"var(--purple)",  b:"var(--purpleBg)",  bar:"#7c3aed"},
    NOT_COMPARABLE:{t:"COMPOSITE",    c:"var(--warning)", b:"var(--warningBg)", bar:"#e67e22"},
    NO_SOURCE:     {t:"NO SOURCE",    c:"var(--danger)",  b:"var(--dangerBg)",  bar:"#c1113a"},
    NO_BASELINE:   {t:"NO BASELINE",  c:"var(--bronze)",  b:"var(--bronzeBg)",  bar:"#b45309"},
    OUT_OF_SCOPE:  {t:"OUT OF SCOPE", c:"var(--mutedBlue)",b:"var(--tint)",     bar:"#9dbdd0"}
  };
  var VORDER=["PROVEN_MATCH","UNKNOWN","DECODE_NEEDED","NOT_COMPARABLE","NO_SOURCE","NO_BASELINE","OUT_OF_SCOPE"];
  var FLAG={
    COLLAPSE_RISK:{t:"collapse risk",c:"var(--danger)",d:"One SEI datapoint proposed for contract fields the incumbent kept distinct."},
    DUAL_SOURCE:{t:"dual source",c:"var(--purple)",d:"More than one lane writes this column. No precedence rule is stated."},
    BYPASSES_CONTRACT:{t:"bypasses contract",c:"var(--bronze)",d:"SEI proposed directly with no incumbent field behind it."},
    NO_TYPES_SUPPLIED:{t:"no types",c:"var(--muted)",d:"SEI publishes the datapoint name but not its type."},
    CODE_SET:{t:"code set",c:"var(--purple)",d:"A decode is required and the crosswalk is absent."},
    FEED_DEPENDENCY:{t:"feed dependency",c:"var(--warning)",d:"Assembled from feeds that can arrive separately."},
    GL_BLOCK:{t:"GL block",c:"var(--danger)",d:"Part of the general-ledger group that has no SEI datapoints at all."}
  };
  // functional_group — the app resolves this through a chain and records which
  // resolver answered (api/app/_legacy_groups.py). The workbook is the first
  // chance to populate resolver 1 directly.
  var GROUPS={
    nav:   {name:"Fund Accounting & NAV",       src:"FUNCTIONAL_GROUP"},
    entity:{name:"Entity & SMA Account Master", src:"FUNCTIONAL_GROUP"},
    pos:   {name:"Positions & Holdings",        src:"FUNCTIONAL_GROUP"},
    party: {name:"Party & Relationships",       src:"MASTER_NAME"}
  };
  function R(lane,tbl,feed,subj,a){
    return {lane:lane,tbl:tbl,feed:feed,subj:subj,col:a[0],type:a[1],field:a[2],
            seiFeed:a[3],seiDp:a[4],kind:a[5],verdict:a[6],flags:a[7]||[]};
  }
  var NAV="BBHRPTDBO.BBH_STAR_NAV_TB", ENT="RULESDBO.ENTITY", EH="RULESDBO.ENTITY_HIST",
      POS="HOLDINGDBO.POSITION", IP="RULESDBO.BBH_INTERESTED_PARTIES",
      UAFM="UAF account message", UAFA="UAF address message";  var ROWS=[];
  [ ["acctg_bas_des","VARCHAR2(255)","Accounting_Basis",null,null,"UNAVAILABLE","NO_SOURCE"],
    ["acctg_dte","DATE","Accounting_Date","End of Day Positions","AS_OF_DATE","DIRECT","UNKNOWN",["NO_TYPES_SUPPLIED"]],
    ["bse_crncy_cde","VARCHAR2(255)","Base_Currency_Code","Account","ACCOUNT_BASE_CURRENCY","LOOKUP","DECODE_NEEDED",["CODE_SET"]],
    ["clas_id","VARCHAR2(255)","Class_Identifier",null,null,"UNAVAILABLE","NO_SOURCE"],
    ["cls_evnt_id","VARCHAR2(255)","Close_Event_ID",null,null,"UNAVAILABLE","NO_SOURCE"],
    ["cr_amt","NUMBER","Credit_Amount",null,null,"UNAVAILABLE","NO_SOURCE"],
    ["cstdy_hd_acct_num","VARCHAR2(255)","Custody_Head_Account_Number","Account","ACCOUNT_NUMBER","DIRECT","UNKNOWN",["NO_TYPES_SUPPLIED","COLLAPSE_RISK"]],
    ["db_amt","NUMBER","Debit_Amount",null,null,"UNAVAILABLE","NO_SOURCE"],
    ["drvd_cost_amt","NUMBER","Derived_Cost","End of Day Positions","VALUATION_COST","DIRECT","UNKNOWN",["NO_TYPES_SUPPLIED"]],
    ["drvd_mval_amt","NUMBER","Derived_Market_Value","Taxlot","MARKET_VALUE","DIRECT","UNKNOWN",["NO_TYPES_SUPPLIED","COLLAPSE_RISK"]],
    ["enty_nam","VARCHAR2(255)","Entity_Name","Account","ACCOUNT_DISPLAY_NAME","DIRECT","UNKNOWN",["NO_TYPES_SUPPLIED"]],

  function drill(r){
    var peers=ROWS.filter(function(x){return x.tbl===r.tbl&&x.col===r.col&&inLane(x);});
    var h="";
    peers.forEach(function(p){
      var parts=[];

        parts.push(node("MQ FIELD",p.field||"—",p.feed,"var(--srcC)"));
        parts.push(node("JOB","PDPA009_IntraDay_UAFtoPACE_CMD","command job","var(--stg1C)"));
      } else {
        if(seiOn()&&p.seiDp){
          parts.push(node("SEI DATAPOINT",p.seiDp,p.seiFeed,"var(--sei)"));
          parts.push(node("SEI CANONICAL","SEI_"+(p.subj==="pos"?"POSITION":"ACCOUNT"),"conformed keys","var(--sei)"));
        }
        parts.push(node("SRC · CONTRACT",p.field||"none",p.feed,"var(--srcC)"));
        parts.push(node("STG1","N/A","no persisted staging","var(--stg1C)"));
        parts.push(node("STG2","N/A","no persisted staging","var(--stg2C)"));

        LANE[p.lane].c+';margin-bottom:6px">'+esc(LANE[p.lane].full)+'</div><div class="chain">'+
        parts.map(function(n,i){ return n+(i<parts.length-1?'<div class="arw">›</div>':""); }).join("")+'</div></div>';
    });
    return h+analysis(r,peers);
  }
  function analysis(r,peers){
    var h="", fan=r.seiDp?ROWS.filter(function(x){return x.seiDp===r.seiDp&&x.seiFeed===r.seiFeed;}):[];
    var fields=Array.from(new Set(fan.map(function(x){return x.feed+" · "+x.field;})));
    if(peers.length>1) h+='<div class="callout" style="--cc:var(--purple)"><h4>Two lanes write this column, and nothing says which wins</h4>'+
      '<p>'+peers.map(function(p){return LANE[p.lane].full;}).join(" and ")+' both populate it. There is no error when they '+
      'disagree — the value simply depends on load order. A precedence rule is needed before cutover.</p>'+
      '<div class="meta"><span><b>Owner</b> IMDS data owner</span></div></div>';
    if(r.seiDp&&fields.length>1) h+='<div class="callout" style="--cc:var(--danger)"><h4>One SEI datapoint, '+fields.length+' contract fields</h4>'+
      '<p><span class="mono">'+esc(r.seiFeed)+'.'+esc(r.seiDp)+'</span> is proposed for '+
      fields.map(function(f){return '<span class="mono">'+esc(f)+'</span>';}).join(", ")+'. The incumbent kept these apart on the '+
      'same record. If they ever hold different values, collapsing them loses that difference silently — the load succeeds and '+
      'the number is wrong.</p><div class="meta"><span><b>Owner</b> SEI design team + BBH mapping</span>'+
      '<span><b>Clears when</b> SEI names which datapoint is the derived one</span></div></div>';
    if(r.verdict==="NO_SOURCE") h+='<div class="callout" style="--cc:var(--danger)"><h4>No SEI datapoint behind it</h4>'+
      '<p>Contract field <span class="mono">'+esc(r.field||"—")+'</span> is delivered today and has nothing behind it after '+
      'cutover. Needs one of four dispositions — default, derive, drop or block — approved by the IMDS data owner.</p>'+
      '<div class="meta"><span><b>Disposition</b> UNDECIDED</span></div></div>';
    if(r.verdict==="NO_BASELINE") h+='<div class="callout" style="--cc:var(--bronze)"><h4>No contract field to join on</h4>'+
      '<p>No incumbent field feeds this column today, so nothing exists for a SEI mapping to attach to.'+
      (r.seiDp?' SEI datapoints are nonetheless proposed, which means a direct route around the contract — possibly right for an '+
               'operational column, but an architecture decision rather than a join result.':'')+'</p>'+

      '<p>This column sits on the UAF lane, which SEI does not replace. Having no SEI datapoint is the correct state — counted '+

      '<p>Nothing stops the position feed loading without its rates. The result is a wrong value, not a missing one — the harder '+
      'failure to detect, and the reason a composite cannot clear on types.</p></div>';
    return h;
  }

  /* ---------- TECHNICAL · mode map ---------- */
  function modeMap(rows){
    var sei=seiOn(), W=sei?4:3, CW=195, GAP=74, PITCH=42, CH=34;
    var width=W*CW+(W-1)*GAP;
    var colDwh=rows.slice(0,12), colField=[], seenF={}, colSei=[], seenS={};
    colDwh.forEach(function(r){
      var f=r.field?(r.feed+"|"+r.field):null;
      if(f&&seenF[f]==null){ seenF[f]=colField.length; colField.push({t:r.field,s:r.feed}); }
      if(sei&&r.seiDp){ var k=r.seiFeed+"|"+r.seiDp;
        if(seenS[k]==null){ seenS[k]=colSei.length; colSei.push({t:r.seiDp,s:r.seiFeed}); } }
    });
    var colLin=colDwh.map(function(r){ return {t:r.field?"maps":"unmapped",s:r.tbl.split(".")[1]}; });
    var cols=[colDwh.map(function(r){return {t:r.col,s:r.tbl};}),colLin,colField];
    if(sei) cols.push(colSei);
    var H=Math.max.apply(null,cols.map(function(c){return c.length;}))*PITCH+8;
    function top(n,i){ return ((H-((n-1)*PITCH+CH))/2)+i*PITCH; }
    function x(i){ return i*(CW+GAP); }
    function mid(ci,i){ return top(cols[ci].length,i)+CH/2; }
    function path(x1,y1,x2,y2){ var d=Math.max(30,(x2-x1)*.45);
      return "M "+x1+" "+y1+" C "+(x1+d)+" "+y1+", "+(x2-d)+" "+y2+", "+x2+" "+y2; }

    var wires="",stubs="";
    colDwh.forEach(function(r,i){
      wires+='<path d="'+path(x(1),mid(1,i),x(0)+CW,mid(0,i))+'" stroke="#9fb2c0" stroke-width="1.4" fill="none"/>';
      var f=r.field?(r.feed+"|"+r.field):null;
      if(f!=null&&seenF[f]!=null)
        wires+='<path d="'+path(x(2),mid(2,seenF[f]),x(1)+CW,mid(1,i))+'" stroke="#9fb2c0" stroke-width="1.4" fill="none"/>';
    });
    if(sei) colDwh.forEach(function(r){
      var f=r.field?(r.feed+"|"+r.field):null; if(f==null||seenF[f]==null) return;
      if(r.seiDp){ var k=r.seiFeed+"|"+r.seiDp;
        wires+='<path d="'+path(x(3),mid(3,seenS[k]),x(2)+CW,mid(2,seenF[f]))+'" stroke="'+V[r.verdict].bar+'" stroke-width="2.2" fill="none"/>';
      } else { var y=mid(2,seenF[f]);
        stubs+='<path d="M '+(x(2)+CW)+' '+y+' L '+(x(2)+CW+58)+' '+y+'" stroke="#c1113a" stroke-width="2.2" stroke-dasharray="5 4" fill="none"/>'+
               '<circle cx="'+(x(2)+CW+58)+'" cy="'+y+'" r="3.5" fill="#c1113a"/>'; }
    });
    var accents=["var(--dwhC)","var(--stg2C)","var(--srcC)","var(--sei)"], cards="";
    cols.forEach(function(c,ci){ c.forEach(function(o,i){
      cards+='<div class="mcard" style="--mc:'+accents[ci]+';left:'+x(ci)+'px;top:'+top(c.length,i)+'px;width:'+CW+'px;height:'+CH+'px">'+

  function story(r){

    if(r.verdict==="NO_SOURCE") return "Comes from "+r.feed+" today as "+r.field+". After cutover there is nothing behind it — SEI publishes no equivalent, so someone has to decide whether to default it, derive it, drop it, or stop the cutover.";
    if(r.verdict==="NO_BASELINE") return "Nothing feeds this column in the recorded lineage today. It looks pipeline-managed, which would make it fine — but that has never been written down.";
    if(r.verdict==="NOT_COMPARABLE") return "Built from three SEI fields across two feeds. There is no single source field to compare against, so this one can only be proven by running it and reconciling the output.";
    if(r.verdict==="DECODE_NEEDED") return "SEI sends a code and the target expects the code STAR used. The domain is named on the SEI side, the values are not published, and no STAR code set was supplied — so the translation cannot be written yet.";

  function business(){
    var v=visible();
    if(!v.length) return '<div class="empty">No columns in view.</div>';
    var g=byGroup(v);
    var h='<div class="bizH">What happens to each field after cutover</div>'+
      '<p class="bizSub">Plain language, one card per field, grouped the way the warehouse groups them.</p>';
    ["nav","entity","pos","party"].forEach(function(k){ if(g[k]) h+=grp(k,g[k],modeBiz); });
    return h;
  }

  function draw(){
    drawChrome();
    var out=$("#body"), h="";
    if(!anyLane()) h='<div class="empty">No lanes selected. Open the scope chip above and pick STAR, UAF or SEI.</div>';
    else if(S.door==="source") h=sourceView();
    else if(S.door==="business") h=business();
    else h=technical();
    h+='<div class="note"><b>Example data.</b> These rows are the shape the ingested workbook produces, drawn from the columns '+
      'and mappings it actually returned. No verdict has been earned: target types came from a data dictionary and SEI publishes '+
      'datapoint names without types, so every match stays unproven until both sides are read from live metadata.</div>';
    out.innerHTML=h;
    wire(out);
  }
  function wire(out){
    Array.prototype.forEach.call(out.querySelectorAll(".tab"),function(b){
      b.onclick=function(){ S.tab=b.getAttribute("data-t"); S.col=null; draw(); };});
    var ms=out.querySelector("#modeSeg");
    if(ms) Array.prototype.forEach.call(ms.children,function(b){
      b.onclick=function(){ S.mode=b.getAttribute("data-m"); draw(); };});
    var si=out.querySelector("#srch");
    if(si) si.oninput=function(){ S.q=si.value; draw();
      var n=document.getElementById("srch"); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
    Array.prototype.forEach.call(out.querySelectorAll(".grpH[data-g]"),function(e){
      e.onclick=function(){ var k=e.getAttribute("data-g"); S.open[k]=!S.open[k]; draw(); };});
    Array.prototype.forEach.call(out.querySelectorAll("tr[data-c]"),function(tr){
      tr.onclick=function(){ var id=+tr.getAttribute("data-c"); S.col=(S.col===id?null:id); draw(); };});
    Array.prototype.forEach.call(out.querySelectorAll(".bizCard[data-c]"),function(e){
      e.onclick=function(){ S.col=+e.getAttribute("data-c");
        if(S.door==="source"){ S.lvl=3; } else { S.door="technical"; S.tab="fg"; S.mode="table"; }
        draw(); window.scrollTo({top:0,behavior:"smooth"}); };});
    Array.prototype.forEach.call(out.querySelectorAll(".bizCard[data-f]"),function(e){
      e.onclick=function(){ S.feed=e.getAttribute("data-f"); S.lvl=1; draw(); };});
    Array.prototype.forEach.call(out.querySelectorAll("[data-lvl]"),function(e){
      e.onclick=function(){ S.lvl=+e.getAttribute("data-lvl"); S.cls=null; S.col=null; draw(); };});
    Array.prototype.forEach.call(out.querySelectorAll("[data-cls]"),function(e){
      e.onclick=function(){ S.cls=e.getAttribute("data-cls"); S.lvl=2; draw(); };});
  }
  draw();
})();
</script>
