[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scd2lens"
version = "0.1.0"
description = "Reverse-engineer SCD2 business rules of an Oracle warehouse from an ODI export and read-only profiling"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "oracledb>=2.0", "typer>=0.12", "pydantic>=2.0", "jinja2>=3.1", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ldap = ["ldap3>=2.9"]

[project.scripts]
scd2lens = "scd2lens.cli:app"

[tool.setuptools.packages.find]
include = ["scd2lens*"]

[tool.setuptools.package-data]
scd2lens = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
